[package]
name = "mango-protocol"
version.workspace = true
authors.workspace = true
categories = ["network-programming", "encoding"]
edition.workspace = true
keywords = ["mangostudio", "protocol", "rpc", "json-schema", "ndjson"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
description = "Mango Protocol wire types and codec: one JSON-Schema contract for MangoStudio hubs, runtimes and tools"

[lints]
workspace = true

[features]
default = []
# JSON Schema emission used by the repo's equality check; not needed to speak the protocol.
schema = ["dep:schemars"]
# The Port trait, the session, and the contract builder (schema-validated params/results).
tokio = [
  "dep:tokio",
  "dep:tokio-util",
  "dep:jsonschema",
  "tokio/fs",
  "tokio/io-std",
  "tokio/io-util",
  "tokio/net",
]
# The reusable conformance suite, exercised through a Fixture, not this crate's own MemoryPort.
testing = ["tokio"]
# The spawn launcher and the ssh argv preset it is usually given.
spawn = ["tokio", "tokio/process", "dep:nix"]
# The WebSocket dialler and acceptor, with client-side TLS for wss://.
websocket = ["tokio", "dep:futures-util", "dep:tokio-tungstenite", "dep:rustls", "dep:webpki-roots"]

[dependencies]
futures-util = { workspace = true, optional = true, features = ["sink"] }
jsonschema = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
schemars = { version = "1.2", optional = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53", optional = true, default-features = false, features = [
  "rt",
  "sync",
  "time",
  "macros",
] }
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = [
  "connect",
  "handshake",
  # Every wss:// dial supplies our ring ClientConfig and webpki-roots 1.x
  # through Connector::Rustls. Enable TLS without the unused default root
  # loader, which still pulls in the vulnerable webpki-roots 0.26 line.
  "__rustls-tls",
] }
tokio-util = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# `SIGTERM`: step 2 of the termination sequence, which `std` and `tokio` can
# only spell as `SIGKILL`.
nix = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# The named pipe's security descriptor and the client's process id; nothing
# else in the crate needs a platform binding.
windows-sys.workspace = true

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
tokio = { version = "1.53", features = ["macros", "rt", "rt-multi-thread", "test-util"] }

[[example]]
name = "emit_schema"
required-features = ["schema"]

[[example]]
name = "emit_catalog_schema"
required-features = ["schema"]

[[example]]
name = "roundtrip"

[[example]]
name = "session_pair"
required-features = ["tokio"]

[[example]]
name = "conformance_peer"
required-features = ["testing", "websocket", "spawn"]

[package.metadata.docs.rs]
all-features = true
