  { selector = "CallExpression[callee.name='require'][arguments.0.quasis.0.value.cooked='@mangostudio/shared'][arguments.0.expressions.length=0]", message = "Use a bounded-context entrypoint such as @mangostudio/shared/agents. The private shared root export was removed; type-only imports must also use a subpath." },
  { selector = "CallExpression[callee.object.name='module']:is([callee.property.name='require'], [callee.property.value='require'], [callee.property.quasis.0.value.cooked='require'][callee.property.expressions.length=0])[arguments.0.value='@mangostudio/shared']", message = "Use a bounded-context entrypoint such as @mangostudio/shared/agents. The private shared root export was removed; type-only imports must also use a subpath." },
  { selector = "CallExpression[callee.object.name='module']:is([callee.property.name='require'], [callee.property.value='require'], [callee.property.quasis.0.value.cooked='require'][callee.property.expressions.length=0])[arguments.0.quasis.0.value.cooked='@mangostudio/shared'][arguments.0.expressions.length=0]", message = "Use a bounded-context entrypoint such as @mangostudio/shared/agents. The private shared root export was removed; type-only imports must also use a subpath." },
