# Repository-wide Bun configuration. Workspace bunfig.toml files hold only
# their own `[test]` settings; `bun install`/`bun add` read this file from any
# workspace directory.

[install]
# Refuse to resolve a registry version published less than 3 days ago
# (259200 s). New releases are the supply-chain malware window: a compromised
# publish is usually caught and yanked upstream within that time. This mirrors
# the 3-day Dependabot `cooldown` in .github/dependabot.yml, so a local
# `bun add`/`bun update` is held to the same bar as a bot bump.
#
# Versions already pinned in bun.lock still install, so `--frozen-lockfile`
# (CI, fresh clones) is unaffected. Dependabot does not read this file; its
# own cooldown applies. To take an urgent fix younger than 3 days, pass
# `--minimum-release-age=0` for that one command.
minimumReleaseAge = 259200

[lint]
ignorePatterns = [
  "apps/frontend/src/routeTree.gen.ts",
  "apps/shared/src/runtime-contract/generated/",
  ".mango/artifacts/",
  ".mango/out/",
]

[lint.rules]
# Bun enables this additional policy by default; error wrapping is owned by callers.
"preserve-caught-error" = "off"
"import/no-self-import" = "error"
"no-restricted-imports" = [
  "error",
  { paths = [
    { name = "@mangostudio/shared", message = "Use a bounded-context entrypoint such as @mangostudio/shared/agents. The private shared root export was removed; type-only imports must also use a subpath." },
  ] },
]
"no-console" = ["warn", { allow = ["warn", "error"] }]
"no-else-return" = "error"
"no-array-constructor" = "error"
"prefer-const" = "error"
"prefer-exponentiation-operator" = "error"
"prefer-spread" = "error"
"prefer-template" = "error"
"no-empty" = "error"
"no-template-curly-in-string" = "error"
"no-var" = "error"
"no-restricted-syntax" = [
  "error",
  { selector = "ForInStatement", message = "Use an explicit iterable instead of for-in." },
