[fmt]
printWidth = 100
tabWidth = 2
useTabs = false
singleQuote = true
trailingComma = "es5"
proseWrap = "preserve"
embeddedLanguageFormatting = "off"
sortImports = true
ignorePatterns = [
  ".mango/artifacts/",
  ".mango/out/",
  "**/dist/",
  "**/coverage/",
  "**/build/",
  "**/test-results/",
  "**/playwright-report/",
  ".jscpd-out/",
  ".qa-gate/",
  "apps/frontend/src/routeTree.gen.ts",
  "apps/shared/src/runtime-contract/generated/",
  "**/CHANGELOG.md",
  "bun.lock",
  "spec/fixtures/",
  "crates/mangostudio-runtime/tests/fixtures/",
  "**/Dockerfile",
  "**/Dockerfile.*",
]

[[fmt.overrides]]
files = ["**/*.mdc"]
options = { parser = "markdown" }

# CSS selectors and design-token fixtures use double quotes.
[[fmt.overrides]]
files = ["**/*.css"]
options = { singleQuote = false }

[[fmt.overrides]]
files = ["**/*.yml", "**/*.yaml"]
options = { singleQuote = false }

# The published launcher is deliberately CommonJS; the prior TS-only rule did
# not apply to JavaScript entrypoints.
[[lint.overrides]]
files = ["**/*.{js,jsx,mjs,cjs}"]
rules = { "@typescript-eslint/no-require-imports" = "off" }
