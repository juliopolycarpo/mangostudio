  { selector = "ImportExpression[source.quasis.0.value.cooked='@mangostudio/shared'][source.expressions.length=0]", message = "Use a bounded-context entrypoint such as @mangostudio/shared/agents. The private shared root export was removed; type-only imports must also use a subpath." },
