# cargo-deny configuration for mango-protocol's Rust crate.
#
# Run with `cargo deny check`; CI runs each check separately in the `deny` job. Evaluated
# with `--all-features`, so a duplicate or license only reachable behind a feature (e.g.
# `websocket`'s rustls chain) still shows up here even though the default feature set is empty.

[graph]
all-features = true

[output]
feature-depth = 1

# advisories: RUSTSEC vulnerabilities and unmaintained/yanked crates.
[advisories]
ignore = []

# licenses: every license in the dependency graph must be explicitly allowed. Nothing here is
# copyleft; everything is permissive.
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception", # winx (cap-primitives' Windows handle utilities)
  "ISC",
  "BSD-3-Clause",
  "Unicode-3.0", # unicode-ident (proc-macro2's tokenizer)
  "Unlicense", # memchr / aho-corasick dual-license under Unlicense OR MIT
  "Zlib", # foldhash (ahash's replacement hasher, via jsonschema)
  "CDLA-Permissive-2.0", # webpki-roots' bundled Mozilla root store
  "MIT-0", # borrow-or-share (referencing's dependency, via jsonschema)
]
confidence-threshold = 0.8

# No [[licenses.clarify]] for ring: the classic clarify pinning it to "MIT AND ISC AND OpenSSL"
# (cargo-deny's own template still carries it) is left over from before ring 0.17 started
# declaring a proper SPDX expression in Cargo.toml. ring 0.17.14 declares `Apache-2.0 AND ISC`
# directly, which the allow list above already covers - verified by running this check with
# ring's LICENSE untouched and no clarify present. Adding the stale clarify back would either be
# a no-op (its license-files hash doesn't match this LICENSE, so cargo-deny silently ignores it
# and falls through to the Cargo.toml field anyway) or, if the hash were fixed to match, break
# the check outright ("OpenSSL" isn't on the allow list). Confirmed empirically: swapping the
# clarify's `expression` for an unrelated, disallowed license and re-running still reports
# `licenses ok` - proof the block isn't consulted.

[licenses.private]
ignore = false

# bans: no wildcard version requirements, no banned crates, and duplicate versions are a hard
# deny with named exceptions rather than a blanket "warn" — a new, unnamed duplicate should fail
# the check and force a look, not scroll past in a log nobody reads.
[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

skip = [
  # cap-primitives uses fs-set-times for portable handle-relative timestamp updates;
  # fs-set-times still pins io-lifetimes 2 while cap-std and io-extras use 3. Both
  # versions come from the same capability-filesystem stack and are not selectable
  # by this workspace.
  { crate = "io-lifetimes@2.0.4", reason = "fs-set-times 0.20 (via cap-primitives 4) has not moved to io-lifetimes 3" },

  # Our own Windows bindings and tokio's mio/socket2 use 0.61. ring 0.17's RNG
  # shim remains on 0.52; the shipping lock also resolves the capability-filesystem
  # stack's wider ranges to 0.52. A fresh graph selects 0.59 for fs-set-times/winx
  # and 0.60 for io-extras instead. Their latest releases still cap those ranges:
  # fs-set-times 0.20.3 uses >=0.52,<0.60; winx 0.36.4 uses >=0.52,<=0.59;
  # io-extras 0.19.0 uses >=0.52,<=0.60, all through cap-primitives/cap-std 4.0.3.
  # Exact package specs admit only these observed versions, never a future family.
  { crate = "windows-sys@0.52.0", reason = "ring 0.17 RNG shim and the shipping fs-set-times/io-extras/winx resolution; the workspace uses 0.61" },
  { crate = "windows-sys@0.59.0", reason = "fresh fs-set-times 0.20.3 and winx 0.36.4 through cap-primitives 4.0.3 cannot select windows-sys 0.61" },
  { crate = "windows-sys@0.60.2", reason = "fresh io-extras 0.19.0 through cap-primitives/cap-std 4.0.3 cannot select windows-sys 0.61" },

  # windows-sys 0.52/0.59 require windows-targets 0.52.6 and its architecture
  # import libraries. Fresh io-extras' windows-sys 0.60 selects windows-targets
  # 0.53.5 and import libraries 0.53.1, so the old 0.52 family also duplicates.
  # Enumerate each exact old package instead of exempting either dependency tree;
  # other versions and unrelated transitive duplicates still fail the bans gate.
  { crate = "windows-targets@0.52.6", reason = "windows-sys 0.52/0.59 require this old target family alongside io-extras' windows-targets 0.53.5" },
  { crate = "windows_aarch64_gnullvm@0.52.6", reason = "exact architecture import library of windows-targets 0.52.6; the fresh graph also needs 0.53.1" },
  { crate = "windows_aarch64_msvc@0.52.6", reason = "exact architecture import library of windows-targets 0.52.6; the fresh graph also needs 0.53.1" },
  { crate = "windows_i686_gnu@0.52.6", reason = "exact architecture import library of windows-targets 0.52.6; the fresh graph also needs 0.53.1" },
  { crate = "windows_i686_gnullvm@0.52.6", reason = "exact architecture import library of windows-targets 0.52.6; the fresh graph also needs 0.53.1" },
  { crate = "windows_i686_msvc@0.52.6", reason = "exact architecture import library of windows-targets 0.52.6; the fresh graph also needs 0.53.1" },
  { crate = "windows_x86_64_gnu@0.52.6", reason = "exact architecture import library of windows-targets 0.52.6; the fresh graph also needs 0.53.1" },
  { crate = "windows_x86_64_gnullvm@0.52.6", reason = "exact architecture import library of windows-targets 0.52.6; the fresh graph also needs 0.53.1" },
  { crate = "windows_x86_64_msvc@0.52.6", reason = "exact architecture import library of windows-targets 0.52.6; the fresh graph also needs 0.53.1" },

  # getrandom has three majors in the graph because three unrelated dependency chains each pin
  # their own: ring 0.17 wants 0.2; rand 0.10 (tungstenite's frame-masking key), uuid, and
  # mangostudio-runtime's own CSPRNG use 0.4. We keep 0.3 uncontested — it is now only ahash's
  # (via jsonschema), the chain most likely to move next; when it moves to 0.4, drop the 0.4 skip.
  { crate = "getrandom@0.2.17", reason = "ring 0.17's RNG shim; ring does not track getrandom's latest major" },
  { crate = "getrandom@0.4.3", reason = "shared by rand 0.10 (tungstenite frame masking), uuid, and mangostudio-runtime's CSPRNG" },

  # r-efi is a UEFI target binding, unreachable on every platform this crate builds for. It is
  # duplicated only because it rides along as getrandom 0.3's and 0.4's own UEFI shim; skipping
  # it here is downstream of the getrandom decision above, not an independent call.
  { crate = "r-efi@6.0.0", reason = "getrandom 0.4's UEFI shim; unreachable, see the getrandom@0.4.3 skip above" },

  # strum 0.28 (an enum-name dependency of jsonschema, for its keyword tables) has not moved off
  # syn 2 yet; every other proc-macro in the graph (schemars, serde, thiserror, tokio-macros) is
  # already on syn 3. Not ours to fix — strum's move, not a dependency we control.
  { crate = "syn@2.0.119", reason = "strum_macros 0.28 (via jsonschema) hasn't moved to syn 3 yet" },

  # reqwest (the runtime's MCP HTTP client) always enables hyper-util's `client-proxy`, which
  # still pins base64 0.22 for proxy basic-auth; everything else in the graph is on 0.23.
  { crate = "base64@0.22.1", reason = "hyper-util 0.1's client-proxy (always enabled by reqwest 0.13) has not moved to base64 0.23" },
]

# sources: only crates.io. No git dependencies anywhere in this graph, and none are expected —
# a git dependency here would mean a fork nobody can audit landed in a published crate.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
