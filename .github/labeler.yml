# Path-based PR labeling. Mirrors the Repo Map / Task Routing in AGENTS.md.
# Globs are matched against the PR's changed file paths only — actions/labeler
# never checks out or executes PR code. Keep these maps in sync with AGENTS.md.

"area: frontend":
  - changed-files:
      - any-glob-to-any-file: "apps/frontend/**"

"area: api":
  - changed-files:
      - any-glob-to-any-file: "apps/api/**"

"area: shared":
  - changed-files:
      - any-glob-to-any-file: "apps/shared/**"

"area: git":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/modules/git/**"
          - "apps/api/src/modules/github/**"
          - "apps/frontend/src/features/workspace/**"
          - "apps/shared/src/git/**"
          - "apps/shared/src/github/**"

"area: auth":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/auth.ts"
          - "apps/api/src/plugins/auth-middleware.ts"
          - "apps/frontend/src/lib/auth-client.ts"
          - "apps/frontend/src/routes/login.tsx"
          - "apps/frontend/src/routes/signup.tsx"
          - "apps/shared/src/auth/**"
          - "tests/browser-smoke/auth-flow.spec.ts"

"area: chat":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/modules/chats/**"
          - "apps/api/src/modules/messages/**"
          - "apps/frontend/src/features/chat/**"
          - "apps/shared/src/chat/**"

"area: generation":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/modules/generation/**"
          - "apps/frontend/src/features/generation/**"
          - "apps/frontend/src/services/generation-service.ts"
          - "apps/shared/src/generation/**"

"area: gallery":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/modules/generated-images/**"
          - "apps/api/src/services/generated-images/**"
          - "apps/frontend/src/features/gallery/**"

"area: providers":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/services/providers/**"
          - "apps/api/src/services/gemini/**"
          - "apps/frontend/src/hooks/use-model-catalog.ts"
          - "apps/shared/src/catalog/**"

"area: connectors":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/modules/connectors/**"
          - "apps/api/src/services/secret-store/**"
          - "apps/shared/src/connectors/**"

"area: settings":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/modules/app-settings/**"
          - "apps/api/src/modules/provider-settings/**"
          - "apps/api/src/modules/tool-settings/**"
          - "apps/frontend/src/features/settings/**"
          - "apps/shared/src/app-settings/**"
          - "apps/shared/src/provider-settings/**"

"area: tools":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/services/tools/**"
          - "apps/api/src/modules/tool-settings/**"
          - "apps/shared/src/tool-settings/**"

"area: skills":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/modules/skills/**"
          - "apps/frontend/src/features/settings/skills/**"
          - "apps/shared/src/skills/**"

"area: mcp":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/services/mcp/**"
          - "apps/api/src/modules/mcp-servers/**"
          - "apps/frontend/src/features/settings/mcp/**"
          - "apps/shared/src/mcp/**"

"area: tooling":
  - changed-files:
      - any-glob-to-any-file:
          # Lint, format, git-hook, editor, and repo-meta configuration.
          # Split from "area: build" so DevX tooling is not conflated with
          # product/binary build work; see issue #381.
          - "biome.json"
          - "dprint.json"
          - "lefthook.yml"
          - "opencode.json"
          - ".editorconfig"
          - ".gitattributes"
          - ".gitmessage"
          - ".gitignore"
          # Repo-shipped coding-agent configuration (skills, hooks, settings).
          - ".claude/**"
          - ".agents/skills/**"

"area: db":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/db/**"

"area: cli":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/api/src/cli/**"
          - "apps/api/src/index.ts"
          - "apps/api/src/server/**"
          - "apps/api/src/lib/server-state.ts"
          - "apps/api/src/lib/mango-paths.ts"

"area: i18n":
  - changed-files:
      - any-glob-to-any-file: "apps/shared/src/i18n/**"

"area: components":
  - changed-files:
      - any-glob-to-any-file: "apps/frontend/src/components/**"

"area: build":
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**"
          - ".mango/**"
          - "apps/api/src/lib/config.ts"
          - "apps/api/src/lib/runtime-paths.ts"
          # Root build manifests only. Dependency and DevX tooling globs were
          # split out into "type: dependencies" and "area: tooling" so the
          # label matches the change kind; see issue #381.
          - "tsconfig*.json"
          - "turbo.jsonc"
          - "cliff.toml"
          - "Dockerfile*"
          - ".dockerignore"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"
          - "apps/**/*.md"
          - "packages/**/*.md"
          - "scripts/**/*.md"
          - "LICENSE"
          - ".github/**/*.md"
          - ".github/ISSUE_TEMPLATE/**"
          - ".github/pull_request_template.md"

"type: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/actions/**"
          - ".github/labeler.yml"
          - ".github/dependabot.yml"

"type: dependencies":
  - changed-files:
      - any-glob-to-any-file:
          # Routine dependency bumps. Dependabot bun PRs touch only these two
          # files and now classify distinctly from product build work; also
          # applied as an auto-label by .github/dependabot.yml. See issue #381.
          - "package.json"
          - "bun.lock"

"type: test":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.test.ts"
          - "**/*.test.tsx"
          - "**/*.spec.ts"
          - "**/*.spec.tsx"
          - "scripts/tests/**"
          - "tests/**"
          - "playwright.config.ts"
