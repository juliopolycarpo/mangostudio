# CodeQL advanced-setup configuration for .github/workflows/codeql.yml.
#
# Query selection stays in the workflow's matrix (`queries: security-extended`);
# this file exists only to bound what gets extracted.
name: mangostudio

# Generated from the Mango Protocol spec by `bun run contracts:emit`, and
# checked byte for byte by `bun run contracts:check`. Scanning emitted code
# reports findings no edit here can fix.
paths-ignore:
  - apps/shared/src/runtime-contract/generated
