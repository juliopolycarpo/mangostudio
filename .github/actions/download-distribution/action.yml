name: Download distribution
description: Download, extract, and verify one immutable distribution artifact. Call setup-bun or setup-mango before this action when scripts need dependencies.

inputs:
  artifact-name:
    description: Content-addressed Actions artifact name.
    required: true
  run-id:
    description: Approved successful main CI run ID; cross-run inputs must be supplied together.
    required: false
    default: ""
  run-attempt:
    description: Frozen successful CI run attempt.
    required: false
    default: ""
  producer-attempt:
    description: Successful distribution upload attempt, which may precede the selected partial rerun.
    required: false
    default: ""
  artifact-id:
    description: Immutable Actions artifact ID from the approved run.
    required: false
    default: ""
  artifact-digest:
    description: Expected sha256 digest of the immutable Actions ZIP archive.
    required: false
    default: ""
  source-sha:
    description: Expected source commit SHA.
    required: true
  version:
    description: Expected package version.
    required: true
  channel:
    description: Expected distribution channel.
    required: true
  target:
    description: Optional target to verify instead of the packaged distribution.
    required: false
    default: ""
  scope:
    description: >
      Manifest scope when no target is selected (all, checksums, assets, npm, or
      packaged — packaged is a transitional alias of assets).
    required: false
    default: assets
  runtime-profile:
    description: >
      Runtime profile the manifest must record (shipping or light). Consumers
      that publish or promote a bundle must pass shipping; leave it empty only
      for PR smoke consumers, which accept whichever profile the bundle records.
    required: false
    default: ""
  verify-attestation:
    description: >
      Verify the bundle's build provenance before extracting. Only valid for
      bundles built outside a pull request: distribution-build.yml skips
      attestation on PRs, so PR consumers must leave this off.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate cross-run input completeness
      shell: bash
      env:
        RUN_ID: ${{ inputs.run-id }}
        RUN_ATTEMPT: ${{ inputs.run-attempt }}
        PRODUCER_ATTEMPT: ${{ inputs.producer-attempt }}
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
      run: |
        if [ -n "$RUN_ID$RUN_ATTEMPT$PRODUCER_ATTEMPT$ARTIFACT_ID$ARTIFACT_DIGEST" ]; then
          if [ -z "$RUN_ID" ] || [ -z "$RUN_ATTEMPT" ] || [ -z "$PRODUCER_ATTEMPT" ] || [ -z "$ARTIFACT_ID" ] || [ -z "$ARTIFACT_DIGEST" ]; then
            echo 'Cross-run distribution: expected run-id, run-attempt, producer-attempt, artifact-id and artifact-digest together.' >&2
            exit 1
          fi
        fi

    - name: Download approved cross-run distribution
      if: inputs.run-id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        APPROVED_RUN_ID: ${{ inputs.run-id }}
        APPROVED_RUN_ATTEMPT: ${{ inputs.run-attempt }}
        PRODUCER_ATTEMPT: ${{ inputs.producer-attempt }}
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ARTIFACT_DIGEST: ${{ inputs.artifact-digest }}
        RUNTIME_PROFILE: ${{ inputs.runtime-profile }}
        VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        DOWNLOAD_DIR: ${{ runner.temp }}/mango-distribution
      # Requires actions: read in the calling job. No write permission is needed.
      run: bun --no-install ./scripts/ci/download-approved-distribution.ts

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.run-id == ''
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/mango-distribution

    - name: Resolve distribution bundle
      shell: bash
      env:
        DOWNLOAD_DIR: ${{ runner.temp }}/mango-distribution
      run: |
        # No `-u`: bash 3.2 (the macOS runners' /bin/bash) treats "${arr[@]}" on
        # an empty array as an unbound variable. The count form ${#arr[@]} used
        # below is safe there; `-u` stays off so a later full expansion of a
        # possibly-empty array cannot abort before the "found 0" diagnostic.
        set -eo pipefail
        shopt -s nullglob
        # Both shapes: target bundles are stored tars, scoped bundles are
        # gzipped. `*.tar` does not match `*.tar.gz`, so neither is counted twice.
        bundles=("$DOWNLOAD_DIR"/*.tar "$DOWNLOAD_DIR"/*.tar.gz)
        if [ "${#bundles[@]}" -ne 1 ]; then
          echo "Expected exactly one distribution bundle, found ${#bundles[@]}." >&2
          exit 1
        fi
        echo "DISTRIBUTION_BUNDLE=${bundles[0]}" >> "$GITHUB_ENV"

    - name: Verify distribution provenance
      if: inputs.verify-attestation == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        APPROVED_RUN_ID: ${{ inputs.run-id }}
      run: |
        set -euo pipefail
        source_args=()
        if [ -n "$APPROVED_RUN_ID" ]; then
          source_args+=(--source-digest "$SOURCE_SHA")
        fi
        gh attestation verify "$DISTRIBUTION_BUNDLE" --repo "$REPO" \
          --signer-workflow "$REPO/.github/workflows/distribution-build.yml" \
          "${source_args[@]}"

    - name: Extract distribution bundle safely
      shell: bash
      run: |
        set -euo pipefail
        bun --no-install ./scripts/release/extract-distribution.ts "$DISTRIBUTION_BUNDLE" "$GITHUB_WORKSPACE"

    - name: Verify distribution identity and checksums
      shell: bash
      env:
        DISTRIBUTION_CHANNEL: ${{ inputs.channel }}
        EXPECTED_RUNTIME_PROFILE: ${{ inputs.runtime-profile }}
        SCOPE: ${{ inputs.scope }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
      run: |
        args=(--validate distribution-manifest.json --scope "$SCOPE" --expect downloaded)
        if [ -n "$TARGET" ]; then
          args+=(--target "$TARGET")
        fi
        if [ -n "$EXPECTED_RUNTIME_PROFILE" ]; then
          args+=(--runtime-profile "$EXPECTED_RUNTIME_PROFILE")
        fi
        bun --no-install ./scripts/release/distribution-manifest.ts "${args[@]}"

    - name: Materialize target directory
      if: inputs.target != ''
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: bun --no-install ./scripts/release/extract-target.ts --target "$TARGET"
