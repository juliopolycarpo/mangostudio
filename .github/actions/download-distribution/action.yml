name: Download distribution
description: Download, extract, and verify one immutable distribution artifact after setup-mango.

inputs:
  artifact-name:
    description: Content-addressed Actions artifact name.
    required: true
  source-sha:
    description: Expected source commit SHA.
    required: true
  version:
    description: Expected package version.
    required: true
  channel:
    description: Expected distribution channel.
    required: true
  target:
    description: Optional target to verify instead of the packaged distribution.
    required: false
    default: ""
  scope:
    description: Manifest scope when no target is selected.
    required: false
    default: packaged
  verify-attestation:
    description: >
      Verify the bundle's build provenance before extracting. Only valid for
      bundles built outside a pull request: distribution-build.yml skips
      attestation on PRs, so PR consumers must leave this off.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/mango-distribution

    - name: Resolve distribution bundle
      shell: bash
      env:
        DOWNLOAD_DIR: ${{ runner.temp }}/mango-distribution
      run: |
        # No `-u`: bash 3.2 (the macOS runners' /bin/bash) treats ${#arr[@]} on
        # an empty array as an unbound variable, which would abort before the
        # "found 0" diagnostic below ever prints.
        set -eo pipefail
        shopt -s nullglob
        bundles=("$DOWNLOAD_DIR"/*.tar.gz)
        if [ "${#bundles[@]}" -ne 1 ]; then
          echo "Expected exactly one distribution bundle, found ${#bundles[@]}." >&2
          exit 1
        fi
        echo "DISTRIBUTION_BUNDLE=${bundles[0]}" >> "$GITHUB_ENV"

    - name: Verify distribution provenance
      if: inputs.verify-attestation == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        gh attestation verify "$DISTRIBUTION_BUNDLE" --repo "$REPO" \
          --signer-workflow "$REPO/.github/workflows/distribution-build.yml"

    - name: Extract distribution bundle safely
      shell: bash
      run: |
        set -euo pipefail
        bun ./scripts/release/extract-distribution.ts "$DISTRIBUTION_BUNDLE" "$GITHUB_WORKSPACE"

    - name: Verify distribution identity and checksums
      shell: bash
      env:
        DISTRIBUTION_CHANNEL: ${{ inputs.channel }}
        SCOPE: ${{ inputs.scope }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
      run: |
        args=(--validate distribution-manifest.json --scope "$SCOPE")
        if [ -n "$TARGET" ]; then
          args+=(--target "$TARGET")
        fi
        bun ./scripts/release/distribution-manifest.ts "${args[@]}"
