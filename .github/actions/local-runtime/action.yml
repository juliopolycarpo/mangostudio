name: Local runtime binary
description: >
  Put the cargo-built mangostudio-runtime the hub launches for Local on this
  runner, and export MANGOSTUDIO_RUNTIME_BINARY so every test lane and the dev
  server use it. With `artifact`, the binary another job of this run built is
  downloaded; without it, it is built here. The binary is asked for its
  version before anything relies on it, so a missing or broken one fails this
  step by name instead of surfacing as scattered Local connect failures.
  Callers must run actions/checkout first.

inputs:
  artifact:
    description: Name of the artifact holding the binary; empty builds it here instead.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download the Local runtime
      if: inputs.artifact != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/local-runtime

    # Installs the toolchain rust-toolchain.toml pins.
    - name: Resolve the Rust toolchain
      if: inputs.artifact == ''
      shell: bash
      run: rustup show active-toolchain

    - name: Restore the cargo cache
      if: inputs.artifact == ''
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: local-runtime

    - name: Build the Local runtime
      if: inputs.artifact == ''
      shell: bash
      run: |
        set -euo pipefail
        cargo build -p mangostudio-runtime --locked
        mkdir -p "${RUNNER_TEMP}/local-runtime"
        cp target/debug/mangostudio-runtime "${RUNNER_TEMP}/local-runtime/"

    - name: Verify and export the Local runtime
      shell: bash
      run: |
        set -euo pipefail
        binary="${RUNNER_TEMP}/local-runtime/mangostudio-runtime"
        if [ ! -f "$binary" ]; then
          echo "::error::No Local runtime binary at ${binary}; the hub cannot start Local without it."
          exit 1
        fi
        # upload-artifact does not keep the executable bit.
        chmod +x "$binary"
        version="$("$binary" --version)"
        echo "Local runtime ${version} at ${binary}"
        echo "MANGOSTUDIO_RUNTIME_BINARY=${binary}" >> "$GITHUB_ENV"
