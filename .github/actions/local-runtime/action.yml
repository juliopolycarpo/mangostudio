name: Local runtime binary
description: >
  Put the cargo-built mangostudio-runtime the hub launches for Local on this
  runner, and export MANGOSTUDIO_RUNTIME_BINARY so every test lane and the dev
  server use it. The fake_cursor_agent example comes with it and is exported
  as MANGOSTUDIO_FAKE_CURSOR_AGENT, so the external-agent qualification suites
  run in the ordinary lanes instead of skipping. With `artifact`, the binary another job of this run built is
  downloaded; without it, it is built here. The binary is asked for its
  version before anything relies on it, so a missing or broken one fails this
  step by name instead of surfacing as scattered Local connect failures.
  Callers must run actions/checkout first.

inputs:
  artifact:
    description: Name of the artifact holding the binary; empty builds it here instead.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download the Local runtime
      if: inputs.artifact != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/local-runtime

    # Installs the toolchain rust-toolchain.toml pins.
    - name: Resolve the Rust toolchain
      if: inputs.artifact == ''
      shell: bash
      run: rustup show active-toolchain

    # The action keys the generation on the root `[profile.*]` tables and saves
    # only from main; see scripts/tests/cache-policy.unit.test.ts.
    - name: Restore the cargo cache
      if: inputs.artifact == ''
      uses: ./.github/actions/rust-cache # zizmor: ignore[self-repository] use the action from the selected source checkout
      with:
        shared-key: local-runtime

    # Incremental state is dead weight in a single cold build, and this
    # composite also runs in jobs whose rust-cache step is skipped (see
    # docs/reference/testing.md, "Cargo incremental compilation").
    - name: Build the Local runtime
      if: inputs.artifact == ''
      shell: bash
      env:
        CARGO_INCREMENTAL: "0"
      run: |
        set -euo pipefail
        cargo build -p mangostudio-runtime --locked
        # Its own invocation, so the runtime binary never gains the SDK's
        # `testing` feature the stand-in vendor is built with.
        cargo build -p mangostudio-runtime --example fake_cursor_agent --locked
        mkdir -p "${RUNNER_TEMP}/local-runtime"
        cp target/debug/mangostudio-runtime target/debug/examples/fake_cursor_agent \
          "${RUNNER_TEMP}/local-runtime/"

    - name: Verify and export the Local runtime
      shell: bash
      run: |
        set -euo pipefail
        # On Windows, MSYS bash lets `-f` and `cp` find `name` for `name.exe`,
        # but the exported path is read by Bun, which needs the real file name.
        suffix=""
        if [ "${RUNNER_OS}" = "Windows" ]; then suffix=".exe"; fi
        binary="${RUNNER_TEMP}/local-runtime/mangostudio-runtime${suffix}"
        fake="${RUNNER_TEMP}/local-runtime/fake_cursor_agent${suffix}"
        if [ ! -f "$binary" ]; then
          echo "::error::No Local runtime binary at ${binary}; the hub cannot start Local without it."
          exit 1
        fi
        if [ ! -f "$fake" ]; then
          echo "::error::No fake_cursor_agent at ${fake}; the external-agent qualification suites need it."
          exit 1
        fi
        # upload-artifact does not keep the executable bit.
        chmod +x "$binary" "$fake"
        version="$("$binary" --version)"
        echo "Local runtime ${version} at ${binary}"
        {
          echo "MANGOSTUDIO_RUNTIME_BINARY=${binary}"
          echo "MANGOSTUDIO_FAKE_CURSOR_AGENT=${fake}"
        } >> "$GITHUB_ENV"
