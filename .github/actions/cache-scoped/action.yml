name: Scoped cache
description: >
  Restore and/or save one CI cache family behind a shared key policy. Callers
  supply the family name, path, and validity string; this action owns the
  write-scope, trusted-main restore keys, and step-summary diagnostics.
inputs:
  family:
    description: Cache family key segment, e.g. bun, turbo, playwright.
    required: true
  path:
    description: Newline-separated paths to cache.
    required: true
  validity:
    description: >
      Family-specific invalidator (toolchain versions and content hashes).
      Must not contain empty segments.
    required: true
  restore-prefix:
    description: >
      Leading slice of validity eligible for a loose trusted-main restore.
      Empty means the bare family main prefix. Ignored when exact-restore is true.
    required: false
    default: ""
  exact-restore:
    description: >
      When 'true', omit the loose main prefix from restore-keys so only a
      version-exact primary or trusted-main key can match. Required for
      families where a partial restore would skip a necessary install step
      (Playwright browsers, checksum-pinned lint tools).
    required: false
    default: "false"
  mode:
    description: restore-save (default), restore, restore-exact, or save.
    required: false
    default: restore-save
  rotate:
    description: >
      When 'true', persist what a run computed on top of what it restored
      instead of freezing the first entry a key ever saved. actions/cache never
      overwrites a key, so a family whose entry is keyed by validity alone keeps
      its first contents until the validity changes, and a restore that hits it
      exactly never saves again. Rotation gives each save a unique suffix
      (`<run id>-<attempt>`) after the write scope and validity, restores the
      newest entry under that stable prefix, and saves only when the run wrote
      files the restored snapshot did not hold. Pair `mode: restore` before the
      work with `mode: save` after it; the restore records the baseline the
      save compares against. Not available for restore-save or restore-exact,
      whose entry cannot be conditional.
    required: false
    default: "false"
  exact-key:
    description: >
      Required when `mode: restore-exact`: the literal cache key to restore,
      with no restore-keys fallback. For pinning several jobs to the exact
      bytes a single earlier `mode: restore` resolved, rather than each job
      resolving "most recent matching prefix" independently and risking a
      save from a concurrent run landing mid-fan-out and changing what
      "most recent" means between them.
    required: false
    default: ""
  payload-glob:
    description: >
      `rotate: true` with `mode: save` only: the `find -name` pattern of the files
      whose appearance counts as new content, matched on the file name. Defaults
      to every file. Turbo rewrites an entry's `<hash>-manifest.json` on every
      hit and writes its `<hash>.tar.zst` once, on a miss, so the Turbo lanes pass
      `*.tar.zst`; counting the manifests would save after a run that only hit.
    required: false
    default: "*"
  lookup-only:
    description: >
      When 'true' with `mode: restore`, check whether a cache exists without
      downloading it. For resolving which exact key a later, separate restore
      should ask for — a set of fan-out jobs that all restore independently by
      prefix can each match a different "most recent" entry if a save lands
      mid-fan-out; resolving the key once up front and having every job
      restore that literal key removes the ambiguity.
    required: false
    default: "false"
  cache-epoch:
    description: Repository-wide cache epoch used for emergency invalidation.
    required: true
outputs:
  cache-hit:
    description: "'true' when the primary cache key matched"
    value: ${{ steps.outcome.outputs.cache-hit }}
  cache-restored:
    description: >
      'true' when a usable cache was restored. Only `mode: restore` can observe
      a trusted-main match, so only that mode reports 'true' for a version-exact
      trusted-main restore; `restore-save` tracks the primary-key hit alone and
      must not be used to gate an install step.
    value: ${{ steps.outcome.outputs.cache-restored }}
  primary-key:
    description: Primary cache key used by this run.
    value: ${{ steps.keys.outputs.primary-key }}
  validity:
    description: >
      The validity string this call keyed on, so a later `mode: save` step can
      reuse exactly the value the restore resolved instead of restating it.
    value: ${{ steps.keys.outputs.validity }}
  new-files:
    description: >
      `mode: save` with `rotate: true` only: how many files under the cache
      paths the run wrote after the restore. '0' means the save was skipped.
    value: ${{ steps.delta.outputs.new-files }}
  restored-prefix:
    description: >
      Trusted main-cache key considered during restore: the loose main prefix
      for normal families, or the version-exact main key for exact-restore
      families (which never consider the loose prefix).
    value: ${{ steps.keys.outputs.restore-prefix }}
  matched-key:
    description: >
      The literal key that satisfied a `mode: restore` restore (primary, exact
      main, or whichever loose-prefix entry was most recent) or a `mode:
      restore-exact` hit (the given exact-key) — empty on a miss, and empty
      for restore-save/save. Feed this back into a later exact-key restore to
      pin every reader of it to the same bytes.
    value: ${{ steps.outcome.outputs.matched-key }}
runs:
  using: composite
  steps:
    - id: keys
      name: Resolve scoped cache keys
      shell: bash
      env:
        CACHE_EPOCH: ${{ inputs.cache-epoch }}
        EXACT_KEY: ${{ inputs.exact-key }}
        EXACT_RESTORE: ${{ inputs.exact-restore }}
        FAMILY: ${{ inputs.family }}
        MODE: ${{ inputs.mode }}
        PATH_INPUT: ${{ inputs.path }}
        RESTORE_PREFIX: ${{ inputs.restore-prefix }}
        ROTATE: ${{ inputs.rotate }}
        ROTATION: ${{ github.run_id }}-${{ github.run_attempt }}
        VALIDITY: ${{ inputs.validity }}
        WRITE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}
      run: |
        set -euo pipefail

        if [ -z "${FAMILY}" ] || [ -z "${PATH_INPUT}" ] || [ -z "${VALIDITY}" ] || [ -z "${CACHE_EPOCH}" ]; then
          echo "::error::cache-scoped requires non-empty family, path, validity, and cache-epoch"
          exit 1
        fi

        case "${MODE}" in
          restore-save|restore|save) ;;
          restore-exact)
            if [ -z "${EXACT_KEY}" ]; then
              echo "::error::cache-scoped mode restore-exact requires a non-empty exact-key"
              exit 1
            fi
            ;;
          *)
            echo "::error::cache-scoped mode must be restore-save, restore, restore-exact, or save (got '${MODE}')"
            exit 1
            ;;
        esac

        case "${EXACT_RESTORE}" in
          true|false) ;;
          *)
            echo "::error::cache-scoped exact-restore must be 'true' or 'false' (got '${EXACT_RESTORE}')"
            exit 1
            ;;
        esac

        case "${ROTATE}" in
          true|false) ;;
          *)
            echo "::error::cache-scoped rotate must be 'true' or 'false' (got '${ROTATE}')"
            exit 1
            ;;
        esac

        if [ "${ROTATE}" = "true" ] && [ "${MODE}" != "restore" ] && [ "${MODE}" != "save" ]; then
          echo "::error::cache-scoped rotate requires mode restore or save (got '${MODE}')"
          exit 1
        fi

        if [[ "${VALIDITY}" == -* || "${VALIDITY}" == *- || "${VALIDITY}" == *--* ]]; then
          echo "::error::cache-scoped validity must not contain empty segments: '${VALIDITY}'"
          exit 1
        fi

        if [ -n "${RESTORE_PREFIX}" ] && [[ "${VALIDITY}" != "${RESTORE_PREFIX}"* ]]; then
          echo "::error::cache-scoped restore-prefix '${RESTORE_PREFIX}' is not a prefix of validity '${VALIDITY}'"
          exit 1
        fi

        prefix="${RUNNER_OS}-${RUNNER_ARCH}-${CACHE_EPOCH}-${FAMILY}"
        primary_key="${prefix}-${WRITE_SCOPE}-${VALIDITY}"
        restore_key="${prefix}-main-${VALIDITY}"
        loose_prefix="${prefix}-main-${RESTORE_PREFIX}"

        # A rotated save extends the write-scope key with a per-attempt suffix,
        # so it can never collide with an entry that already exists and never
        # leaves its own scope. The scope's own chain is restored first: the
        # newest snapshot this pull request saved holds everything it computed
        # so far. Main's chain has the same prefix as `restore_key`, which
        # already matches its rotated entries, so main adds nothing here.
        own_prefix=""
        if [ "${ROTATE}" = "true" ]; then
          if [ "${WRITE_SCOPE}" != "main" ]; then
            own_prefix="${primary_key}-"
          fi
          primary_key="${primary_key}-${ROTATION}"
        fi

        # Report what restore actually considers: exact-restore families never
        # see the loose prefix, so advertising it would misdirect cache-miss
        # debugging.
        if [ "${EXACT_RESTORE}" = "true" ]; then
          restore_prefix="${restore_key}"
        else
          restore_prefix="${loose_prefix}"
        fi

        {
          echo "primary-key=${primary_key}"
          echo "restore-key=${restore_key}"
          echo "restore-prefix=${restore_prefix}"
          echo "validity=${VALIDITY}"
          echo "restore-keys<<EOF"
          if [ -n "${own_prefix}" ]; then
            echo "${own_prefix}"
          fi
          echo "${restore_key}"
          if [ "${EXACT_RESTORE}" != "true" ]; then
            echo "${loose_prefix}"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - id: cache
      name: Restore and save scoped cache
      if: inputs.mode == 'restore-save'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.keys.outputs.primary-key }}
        restore-keys: ${{ steps.keys.outputs.restore-keys }}

    - id: restore
      name: Restore scoped cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.keys.outputs.primary-key }}
        # Version-exact restore only when exact-restore is true. A cache for a
        # different toolchain version is unusable, and treating a loose prefix
        # hit as restored would skip the install that populates the right
        # binary (Playwright browsers, checksum-pinned lint tools).
        restore-keys: ${{ steps.keys.outputs.restore-keys }}
        lookup-only: ${{ inputs.lookup-only }}

    - id: restore-exact
      name: Restore exact-key cache
      if: inputs.mode == 'restore-exact'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.exact-key }}

    # Taken right after the restore and before any work, so every file the
    # restore wrote is older than this marker and every file the job writes
    # afterwards is newer. tar keeps the mtimes it archived.
    - id: baseline
      name: Record restored cache baseline
      if: inputs.mode == 'restore' && inputs.rotate == 'true' && inputs.lookup-only != 'true'
      shell: bash
      env:
        FAMILY: ${{ inputs.family }}
        PATH_INPUT: ${{ inputs.path }}
      run: |
        set -euo pipefail

        : > "${RUNNER_TEMP}/cache-scoped-${FAMILY}.baseline"

        listing="$(mktemp)"
        while IFS= read -r path; do
          path="${path/#\~/${HOME}}"
          { [ -n "${path}" ] && [ -e "${path}" ]; } || continue
          find "${path}" -type f -printf '%s %T@\n' >> "${listing}"
        done <<< "${PATH_INPUT}"
        read -r files bytes oldest newest < <(awk '
          { n += 1; b += $1; if (lo == "" || $2 < lo) lo = $2; if ($2 > hi) hi = $2 }
          END { printf "%d %d %d %d\n", n, b, lo, hi }' "${listing}")

        detail="files=\`${files}\`, bytes=\`${bytes}\`"
        if [ "${files}" -gt 0 ]; then
          detail="${detail}, oldest=\`$(date -u -d "@${oldest}" +%Y-%m-%dT%H:%M:%SZ)\`, newest=\`$(date -u -d "@${newest}" +%Y-%m-%dT%H:%M:%SZ)\`"
        fi
        echo "- ${FAMILY}: restored baseline ${detail}, taken \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`" | tee -a "$GITHUB_STEP_SUMMARY"

    # Decides whether this run computed anything the restored snapshot lacked.
    # An unconditional save would re-upload an identical snapshot after every
    # run that only hit.
    - id: delta
      name: Detect cache files written since the restore
      if: inputs.mode == 'save' && inputs.rotate == 'true'
      shell: bash
      env:
        FAMILY: ${{ inputs.family }}
        PATH_INPUT: ${{ inputs.path }}
        PAYLOAD_GLOB: ${{ inputs.payload-glob }}
        PRIMARY_KEY: ${{ steps.keys.outputs.primary-key }}
      run: |
        set -euo pipefail

        marker="${RUNNER_TEMP}/cache-scoped-${FAMILY}.baseline"
        if [ ! -e "${marker}" ]; then
          echo "::error::cache-scoped rotate save found no restore baseline for family ${FAMILY} (expected an earlier mode: restore step with rotate: true in this job)"
          exit 1
        fi

        newer="$(mktemp)"
        while IFS= read -r path; do
          path="${path/#\~/${HOME}}"
          { [ -n "${path}" ] && [ -e "${path}" ]; } || continue
          find "${path}" -type f -name "${PAYLOAD_GLOB}" -newer "${marker}" -printf '%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' >> "${newer}"
        done <<< "${PATH_INPUT}"
        read -r files bytes < <(awk '{ n += 1; b += $1 } END { printf "%d %d\n", n, b }' "${newer}")

        {
          echo "new-files=${files}"
          echo "new-bytes=${bytes}"
        } >> "$GITHUB_OUTPUT"

        if [ "${files}" -gt 0 ]; then
          # Names the files that made the save necessary, newest last, so a
          # save that should have been skipped can be traced to its cause.
          echo "::group::${FAMILY}: files newer than the restore baseline ($(date -u -r "${marker}" +%Y-%m-%dT%H:%M:%S))"
          sort -k2 "${newer}" | tail -n 10
          echo "::endgroup::"
          echo "- ${FAMILY}: ${files} new files (${bytes} bytes) since restore, saving \`${PRIMARY_KEY}\`" \
            | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "- ${FAMILY}: no new files since restore, save skipped" | tee -a "$GITHUB_STEP_SUMMARY"
        fi

    - name: Save scoped cache
      if: inputs.mode == 'save' && (inputs.rotate != 'true' || steps.delta.outputs.new-files != '0')
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.keys.outputs.primary-key }}

    - id: outcome
      name: Summarize scoped cache
      if: inputs.mode != 'save'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        EXACT_KEY: ${{ inputs.exact-key }}
        EXACT_RESTORE: ${{ inputs.exact-restore }}
        FAMILY: ${{ inputs.family }}
        LOOKUP_ONLY: ${{ inputs.lookup-only }}
        MODE: ${{ inputs.mode }}
        PRIMARY_KEY: ${{ steps.keys.outputs.primary-key }}
        RESTORE_EXACT_HIT: ${{ steps.restore-exact.outputs.cache-hit }}
        RESTORE_HIT: ${{ steps.restore.outputs.cache-hit }}
        RESTORE_MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        RESTORE_PREFIX: ${{ steps.keys.outputs.restore-prefix }}
      run: |
        set -euo pipefail

        # A lookup-only restore never downloads the cache, so a hit here must
        # not report as restored — only as a key to feed a later exact restore.
        downloaded=true
        if [ "${MODE}" = "restore" ]; then
          hit="${RESTORE_HIT:-false}"
          matched="${RESTORE_MATCHED:-}"
          [ "${LOOKUP_ONLY}" = "true" ] && downloaded=false
        elif [ "${MODE}" = "restore-exact" ]; then
          hit="${RESTORE_EXACT_HIT:-false}"
          matched=""
          [ "${hit}" = "true" ] && matched="${EXACT_KEY}"
        else
          hit="${CACHE_HIT:-false}"
          matched=""
        fi

        restored=false
        if [ "${downloaded}" = "true" ] \
          && { [ "${hit}" = "true" ] || { [ "${EXACT_RESTORE}" = "true" ] && [ -n "${matched}" ]; }; }; then
          restored=true
        fi

        {
          echo "cache-hit=${hit}"
          echo "cache-restored=${restored}"
          echo "matched-key=${matched}"
        } >> "$GITHUB_OUTPUT"

        summary_key="${PRIMARY_KEY}"
        [ "${MODE}" = "restore-exact" ] && summary_key="${EXACT_KEY}"
        line="- ${FAMILY}: hit=\`${hit}\`, key=\`${summary_key}\`, restore-prefix=\`${RESTORE_PREFIX}\`"
        # A rotated key never hits exactly; the newest entry under the prefix is
        # what it restored, and `hit=false` alone would read as a cold start.
        [ "${MODE}" = "restore" ] && [ -n "${matched}" ] && line="${line}, matched=\`${matched}\`"
        echo "${line}" >> "$GITHUB_STEP_SUMMARY"
