name: Cache Playwright browser
description: Restore or save the browser matching the pinned Playwright version.
inputs:
  mode:
    description: Run the restore phase before install or the save phase after it.
    required: true
  cache-epoch:
    description: Repository-wide cache epoch used for emergency invalidation.
    required: true
outputs:
  cache-hit:
    description: "'true' when the primary Playwright cache key matched"
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-restored:
    description: "'true' when an exact or trusted-prefix Playwright cache matched"
    value: ${{ steps.restore.outputs.cache-matched-key != '' }}
  primary-key:
    description: Primary cache key used by this run.
    value: ${{ steps.keys.outputs.primary-key }}
  restored-prefix:
    description: Trusted main-cache prefix considered during restore.
    value: ${{ steps.keys.outputs.restore-prefix }}
runs:
  using: composite
  steps:
    - id: toolchain
      name: Resolve Playwright version
      shell: bash
      run: echo "playwright=$(bunx --bun playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - id: keys
      name: Resolve Playwright cache keys
      shell: bash
      env:
        CACHE_EPOCH: ${{ inputs.cache-epoch }}
        PLAYWRIGHT_VERSION: ${{ steps.toolchain.outputs.playwright }}
        WRITE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}
      run: |
        prefix="${RUNNER_OS}-${RUNNER_ARCH}-${CACHE_EPOCH}-playwright"
        echo "primary-key=${prefix}-${WRITE_SCOPE}-${PLAYWRIGHT_VERSION}" >> "$GITHUB_OUTPUT"
        echo "restore-key=${prefix}-main-${PLAYWRIGHT_VERSION}" >> "$GITHUB_OUTPUT"
        echo "restore-prefix=${prefix}-main-" >> "$GITHUB_OUTPUT"

    - id: restore
      name: Restore Playwright browser cache
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.keys.outputs.primary-key }}
        # Version-exact restore only. A browser cache for a different Playwright
        # version is unusable (the pinned version's binary would be absent), and
        # restoring it here would make cache-restored true and skip the install
        # step below, so the version-agnostic main prefix is deliberately omitted.
        restore-keys: |
          ${{ steps.keys.outputs.restore-key }}

    - name: Save Playwright browser cache
      if: inputs.mode == 'save'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.keys.outputs.primary-key }}

    - name: Summarize Playwright cache
      if: inputs.mode == 'restore'
      shell: bash
      run: >
        echo "- Playwright: hit=\`${{ steps.restore.outputs.cache-hit }}\`, key=\`${{ steps.keys.outputs.primary-key }}\`, restore-prefix=\`${{ steps.keys.outputs.restore-prefix }}\`"
        >> "$GITHUB_STEP_SUMMARY"
