name: Cache TypeScript build info
description: Restore incremental TypeScript build metadata for the repository graph.
inputs:
  cache-epoch:
    description: Repository-wide cache epoch used for emergency invalidation.
    required: true
outputs:
  cache-hit:
    description: "'true' when the primary TypeScript cache key matched"
    value: ${{ steps.cache.outputs.cache-hit }}
  primary-key:
    description: Primary cache key used by this run.
    value: ${{ steps.keys.outputs.primary-key }}
  restored-prefix:
    description: Trusted main-cache prefix considered during restore.
    value: ${{ steps.keys.outputs.restore-prefix }}
runs:
  using: composite
  steps:
    - id: toolchain
      name: Resolve TypeScript version
      shell: bash
      run: echo "typescript=$(bunx --bun tsc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - id: keys
      name: Resolve TypeScript cache keys
      shell: bash
      env:
        CACHE_EPOCH: ${{ inputs.cache-epoch }}
        CONFIG_HASH: ${{ hashFiles('tsconfig*.json', 'apps/**/tsconfig*.json', 'packages/**/tsconfig*.json') }}
        SOURCE_HASH: ${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'packages/**/*.ts', 'scripts/**/*.ts') }}
        TYPESCRIPT_VERSION: ${{ steps.toolchain.outputs.typescript }}
        WRITE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}
      run: |
        prefix="${RUNNER_OS}-${RUNNER_ARCH}-${CACHE_EPOCH}-tsbuildinfo"
        validity="typescript-${TYPESCRIPT_VERSION}-${CONFIG_HASH}-${SOURCE_HASH}"
        echo "primary-key=${prefix}-${WRITE_SCOPE}-${validity}" >> "$GITHUB_OUTPUT"
        echo "restore-key=${prefix}-main-${validity}" >> "$GITHUB_OUTPUT"
        echo "restore-prefix=${prefix}-main-typescript-${TYPESCRIPT_VERSION}-" >> "$GITHUB_OUTPUT"

    - id: cache
      name: Restore TypeScript build info
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .mango/artifacts/tsbuildinfo/
        key: ${{ steps.keys.outputs.primary-key }}
        restore-keys: |
          ${{ steps.keys.outputs.restore-key }}
          ${{ steps.keys.outputs.restore-prefix }}

    - name: Summarize TypeScript cache
      shell: bash
      run: >
        echo "- TypeScript: hit=\`${{ steps.cache.outputs.cache-hit }}\`, key=\`${{ steps.keys.outputs.primary-key }}\`, restore-prefix=\`${{ steps.keys.outputs.restore-prefix }}\`"
        >> "$GITHUB_STEP_SUMMARY"
