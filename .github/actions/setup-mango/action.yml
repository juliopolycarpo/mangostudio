name: Setup Mango (Bun + cache + install)
description: >
  Install Bun pinned to package.json, restore Bun install cache, and run
  frozen install. Caller must run actions/checkout before this action because
  GitHub cannot resolve a local action path until the workspace is present.
  Bump cache-version to roll all Bun caches immediately (cache-poisoning rollback).
inputs:
  cache-key-suffix:
    description: Optional extra suffix appended to the cache key for partitioning.
    required: false
    default: ""
  cache-version:
    description: >
      Cache version string. Increment to immediately invalidate all Bun install
      caches across every job (use as a cache-poisoning rollback lever).
    required: false
    default: "v1"
  frozen-lockfile:
    description: >
      Whether to install with --frozen-lockfile. Keep "true" everywhere a job
      checks out a single consistent ref. Set "false" only for jobs that build a
      mixed tree on purpose (e.g. the PR QA gate base overlays head's bun.lock
      onto base source, so the lock legitimately references workspaces the base
      tree lacks). Frozen install is the default so lockfile drift still fails
      real CI.
    required: false
    default: "true"
outputs:
  cache-hit:
    description: "'true' if the Bun install cache was a full hit"
    value: ${{ steps.bun-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - id: bun-cache
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        # Key includes cache-version so a single input bump rolls all caches.
        key: ${{ runner.os }}-${{ inputs.cache-version }}-bun-${{ hashFiles('bun.lock') }}${{ inputs.cache-key-suffix }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-version }}-bun-

    - name: Disable Turbo telemetry
      shell: bash
      run: echo "TURBO_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      env:
        FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
      run: |
        echo "::group::bun install"
        if [ "$FROZEN_LOCKFILE" = "true" ]; then
          bun install --frozen-lockfile
        else
          # Mixed-tree job: let Bun reconcile the lockfile against whatever
          # manifests are present instead of failing on intentional drift.
          bun install
        fi
        echo "::endgroup::"
        {
          echo '### Setup'
          echo "- Bun cache hit: \`${{ steps.bun-cache.outputs.cache-hit }}\`"
          echo "- Frozen lockfile: \`${FROZEN_LOCKFILE}\`"
        } >> "$GITHUB_STEP_SUMMARY"
