name: Setup Mango (Bun + install)
description: >
  Install the Bun build named by .bun-version and run a frozen install without a package-cache
  transfer. Callers must run actions/checkout first.
outputs:
  bun-version:
    description: Resolved Bun revision used by downstream cache keys.
    value: ${{ steps.toolchain.outputs.bun }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - id: toolchain
      name: Resolve Bun revision
      shell: bash
      # `--revision`, not `--version`: `--revision` appends the commit that
      # built this Bun (`1.4.3+c6da4a4d3`), so it stays a correct key even when
      # `.bun-version` names something whose `--version` is not unique — a
      # channel, or a rebuilt tag. Downstream cache keys (Turbo) read this
      # through the `bun-version` output.
      run: echo "bun=$(bun --revision)" >> "$GITHUB_OUTPUT"

    - name: Start cache policy summary
      shell: bash
      run: echo '### Cache policy' >> "$GITHUB_STEP_SUMMARY"

    - name: Disable Turbo telemetry
      shell: bash
      run: echo "TURBO_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"

    # No Bun package-cache transfer: a frozen install from an empty cache beat
    # restore-then-install on every runner class this repository uses
    # (#2025, #2057).
    - name: Install dependencies
      shell: bash
      run: |
        echo "::group::bun install"
        bun install --frozen-lockfile
        echo "::endgroup::"
