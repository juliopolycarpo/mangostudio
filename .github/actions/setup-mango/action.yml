name: Setup Mango (Bun + cache + install)
description: >
  Install the repository-pinned Bun version, restore its install cache, and run
  a frozen install. Callers must run actions/checkout first.
inputs:
  cache-epoch:
    description: Repository-wide cache epoch used for emergency invalidation.
    required: true
outputs:
  cache-hit:
    description: "'true' when the primary Bun install cache key matched"
    value: ${{ steps.cache.outputs.cache-hit }}
  primary-key:
    description: Primary cache key used by this run.
    value: ${{ steps.keys.outputs.primary-key }}
  restored-prefix:
    description: Trusted main-cache prefix considered during restore.
    value: ${{ steps.keys.outputs.restore-prefix }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - id: toolchain
      name: Resolve Bun version
      shell: bash
      run: echo "bun=$(bun --version)" >> "$GITHUB_OUTPUT"

    - id: keys
      name: Resolve Bun cache keys
      shell: bash
      env:
        BUN_VERSION: ${{ steps.toolchain.outputs.bun }}
        CACHE_EPOCH: ${{ inputs.cache-epoch }}
        LOCK_HASH: ${{ hashFiles('bun.lock') }}
        WRITE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}
      run: |
        prefix="${RUNNER_OS}-${RUNNER_ARCH}-${CACHE_EPOCH}-bun"
        echo "primary-key=${prefix}-${WRITE_SCOPE}-${BUN_VERSION}-${LOCK_HASH}" >> "$GITHUB_OUTPUT"
        echo "restore-key=${prefix}-main-${BUN_VERSION}-${LOCK_HASH}" >> "$GITHUB_OUTPUT"
        echo "restore-prefix=${prefix}-main-" >> "$GITHUB_OUTPUT"

    - id: cache
      name: Restore Bun install cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.keys.outputs.primary-key }}
        restore-keys: |
          ${{ steps.keys.outputs.restore-key }}
          ${{ steps.keys.outputs.restore-prefix }}

    - name: Disable Turbo telemetry
      shell: bash
      run: echo "TURBO_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: |
        echo "::group::bun install"
        bun install --frozen-lockfile
        echo "::endgroup::"
        {
          echo '### Cache policy'
          echo "- Bun: hit=\`${{ steps.cache.outputs.cache-hit }}\`, key=\`${{ steps.keys.outputs.primary-key }}\`, restore-prefix=\`${{ steps.keys.outputs.restore-prefix }}\`"
        } >> "$GITHUB_STEP_SUMMARY"
