name: Setup Mango (Bun + cache + install)
description: >
  Install the Bun build named by .bun-version, restore its install cache, and
  run a frozen install. Callers must run actions/checkout first.
inputs:
  cache-epoch:
    description: Repository-wide cache epoch used for emergency invalidation.
    required: true
outputs:
  cache-hit:
    description: "'true' when the primary Bun install cache key matched"
    value: ${{ steps.cache.outputs.cache-hit }}
  primary-key:
    description: Primary cache key used by this run.
    value: ${{ steps.cache.outputs.primary-key }}
  restored-prefix:
    description: Trusted main-cache prefix considered during restore.
    value: ${{ steps.cache.outputs.restored-prefix }}
  bun-version:
    description: Resolved Bun revision used for cache keys and downstream families.
    value: ${{ steps.toolchain.outputs.bun }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - id: toolchain
      name: Resolve Bun revision
      shell: bash
      # `--revision`, not `--version`: `--revision` appends the commit that
      # built this Bun (`1.4.3+c6da4a4d3`), so it stays a correct key even when
      # `.bun-version` names something whose `--version` is not unique — a
      # channel, or a rebuilt tag. Keying on `--version` was what handed one
      # Bun build's extracted packages to a different one under `canary`; on a
      # released pin it costs nothing and removes the way back to that bug.
      run: echo "bun=$(bun --revision)" >> "$GITHUB_OUTPUT"

    - name: Start cache policy summary
      shell: bash
      run: echo '### Cache policy' >> "$GITHUB_STEP_SUMMARY"

    - id: cache
      name: Restore Bun install cache
      uses: ./.github/actions/cache-scoped
      with:
        mode: restore
        family: bun
        path: ~/.bun/install/cache
        validity: ${{ steps.toolchain.outputs.bun }}-${{ hashFiles('bun.lock') }}
        cache-epoch: ${{ inputs.cache-epoch }}

    - name: Disable Turbo telemetry
      shell: bash
      run: echo "TURBO_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      run: |
        echo "::group::bun install"
        bun install --frozen-lockfile
        echo "::endgroup::"

    # Save inline: nested actions/cache post steps lose their path input.
    # Publish only trusted main entries after the frozen install succeeds.
    # A parallel caller may have completed this key since our initial restore.
    # Check before compressing; the advisory lookup must not prevent another
    # eligible writer from saving if it fails or the first writer never finishes.
    - id: bun-save-check
      name: Check whether another Bun writer completed this key
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: ./.github/actions/cache-scoped
      with:
        mode: restore
        family: bun
        path: ~/.bun/install/cache
        validity: ${{ steps.toolchain.outputs.bun }}-${{ hashFiles('bun.lock') }}
        cache-epoch: ${{ inputs.cache-epoch }}
        lookup-only: "true"
        exact-restore: "true"

    # Simultaneous lookup misses can still race at reserve. Keep the cache
    # action's normal collision/upload diagnostics and never serialize installs.
    - name: Save Bun install cache
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' && (steps.bun-save-check.outcome != 'success' || steps.bun-save-check.outputs.cache-hit != 'true')
      uses: ./.github/actions/cache-scoped
      with:
        mode: save
        family: bun
        path: ~/.bun/install/cache
        validity: ${{ steps.toolchain.outputs.bun }}-${{ hashFiles('bun.lock') }}
        cache-epoch: ${{ inputs.cache-epoch }}
