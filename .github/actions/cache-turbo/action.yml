name: Cache Turbo local artifacts
description: >
  Restore Turborepo task outputs for one CI lane. Run after setup-mango so the
  pinned Bun and Turbo versions are available.
inputs:
  scope:
    description: Task lane, such as check, test, build, or qa-metrics.
    required: true
  cache-epoch:
    description: Repository-wide cache epoch used for emergency invalidation.
    required: true
outputs:
  cache-hit:
    description: "'true' when the primary Turbo cache key matched"
    value: ${{ steps.cache.outputs.cache-hit }}
  primary-key:
    description: Primary cache key used by this run.
    value: ${{ steps.keys.outputs.primary-key }}
  restored-prefix:
    description: Trusted main-cache prefix considered during restore.
    value: ${{ steps.keys.outputs.restore-prefix }}
runs:
  using: composite
  steps:
    - id: toolchain
      name: Resolve Turbo toolchain
      shell: bash
      run: |
        echo "bun=$(bun --version)" >> "$GITHUB_OUTPUT"
        echo "turbo=$(bun run turbo:version | tail -n 1)" >> "$GITHUB_OUTPUT"

    - id: keys
      name: Resolve Turbo cache keys
      shell: bash
      env:
        BUN_VERSION: ${{ steps.toolchain.outputs.bun }}
        CACHE_EPOCH: ${{ inputs.cache-epoch }}
        CACHE_SCOPE: ${{ inputs.scope }}
        CONFIG_HASH: ${{ hashFiles('turbo.jsonc', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
        TURBO_VERSION: ${{ steps.toolchain.outputs.turbo }}
        WRITE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || format('run-{0}', github.run_id) }}
      run: |
        prefix="${RUNNER_OS}-${RUNNER_ARCH}-${CACHE_EPOCH}-turbo"
        validity="${CACHE_SCOPE}-bun-${BUN_VERSION}-turbo-${TURBO_VERSION}-${CONFIG_HASH}"
        echo "primary-key=${prefix}-${WRITE_SCOPE}-${validity}" >> "$GITHUB_OUTPUT"
        echo "restore-key=${prefix}-main-${validity}" >> "$GITHUB_OUTPUT"
        echo "restore-prefix=${prefix}-main-${CACHE_SCOPE}-" >> "$GITHUB_OUTPUT"

    - id: cache
      name: Restore Turbo cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: ${{ steps.keys.outputs.primary-key }}
        restore-keys: |
          ${{ steps.keys.outputs.restore-key }}
          ${{ steps.keys.outputs.restore-prefix }}

    - name: Summarize Turbo cache
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.scope }}
      run: >
        echo "- Turbo (${CACHE_SCOPE}): hit=\`${{ steps.cache.outputs.cache-hit }}\`, key=\`${{ steps.keys.outputs.primary-key }}\`, restore-prefix=\`${{ steps.keys.outputs.restore-prefix }}\`"
        >> "$GITHUB_STEP_SUMMARY"
