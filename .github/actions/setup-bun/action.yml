name: Setup Bun
description: >
  Install the Bun build named by a version file (default .bun-version) and retry the install twice,
  after 60 and then 180 seconds. The repository pins the `canary` channel, whose download fails transiently.
  This is the only place outside the release trust bootstrap that references oven-sh/setup-bun.
  Callers must run actions/checkout first.
inputs:
  bun-version-file:
    description: File that names the Bun build to install, relative to the workspace.
    default: .bun-version
runs:
  using: composite
  steps:
    # `!cancelled()` keeps these steps running when the caller opted into running after an earlier
    # job failure; the caller's own `if` still decides whether the action runs at all.
    - id: first-attempt
      name: Set up Bun
      if: ${{ !cancelled() }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      continue-on-error: true
      with:
        bun-version-file: ${{ inputs.bun-version-file }}

    # Bun republishes its canary assets in place about hourly, and a replaced
    # asset answers 404 well after its upload completes. Observed on 2026-11-13:
    # a retry 10 s later failed 7 s after the upload finished, and with a 45 s
    # wait bun-linux-x64.zip, uploaded at 23:00:36 to 23:00:39 UTC, still
    # answered 404 at 23:02:07. The second wait is sized to outlast that.
    - name: Wait before retrying Bun setup
      if: ${{ !cancelled() && steps.first-attempt.outcome == 'failure' }}
      shell: bash
      run: sleep 60

    - id: second-attempt
      name: Retry Bun setup
      if: ${{ !cancelled() && steps.first-attempt.outcome == 'failure' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      continue-on-error: true
      with:
        bun-version-file: ${{ inputs.bun-version-file }}

    - name: Wait before the last Bun setup retry
      if: ${{ !cancelled() && steps.second-attempt.outcome == 'failure' }}
      shell: bash
      run: sleep 180

    # No continue-on-error: a third failure fails the job with setup-bun's own error.
    - name: Retry Bun setup once more
      if: ${{ !cancelled() && steps.second-attempt.outcome == 'failure' }}
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ inputs.bun-version-file }}
