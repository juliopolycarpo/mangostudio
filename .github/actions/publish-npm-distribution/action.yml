name: Publish npm distribution
description: Validate and publish the staged npm distribution with provenance.

inputs:
  dist-tag:
    description: npm dist-tag to publish under. An empty value publishes as latest.
    required: false
    default: ""
  allow-legacy-token:
    description: >
      When true, a non-empty node-auth-token may be written to a temporary npmrc
      (workflow_dispatch escape hatch). When false, publish uses Trusted
      Publishing OIDC and must not receive a token.
    required: false
    default: "false"
  node-auth-token:
    description: >
      npm automation token for legacy publish only. Omit on the OIDC path. The
      value is never printed.
    required: false
    default: ""
  node-version:
    description: Minimum Node.js version required for npm provenance.
    required: false
    default: "22.14.0"

outputs:
  auth:
    description: Authentication method reported by the npm publish script.
    value: ${{ steps.publish.outputs.auth }}
  provenance:
    description: Provenance status reported by the npm publish script.
    value: ${{ steps.publish.outputs.provenance }}

runs:
  using: composite
  steps:
    - name: Restore executable bit on platform binaries
      # actions/upload-artifact zips files and drops Unix mode bits, so the
      # downloaded binaries arrive non-executable. npm only force-sets +x on
      # bin entries (the wrapper's mangostudio.js), not on these plain files,
      # so without this the published binary fails to spawn (EACCES) on
      # macOS/Linux. The .exe platforms need no +x.
      shell: bash
      run: find dist-npm -type f -name mangostudio -exec chmod +x {} +

    - name: Validate npm distribution
      shell: bash
      run: bun ./scripts/release/pack-npm.ts --validate dist-npm

    - name: Verify Node for provenance
      shell: bash
      env:
        MINIMUM_NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail
        node_version="$(node -p "process.versions.node")"
        if ! node -e '
          const [current, minimum] = process.argv
            .slice(1)
            .map((version) => version.split(".").map(Number));
          for (let index = 0; index < 3; index += 1) {
            if (current[index] > minimum[index]) process.exit(0);
            if (current[index] < minimum[index]) process.exit(1);
          }
        ' "$node_version" "$MINIMUM_NODE_VERSION"; then
          echo "Node v${node_version} is below the ${MINIMUM_NODE_VERSION} floor required for npm provenance."
          exit 1
        fi
        echo "Node v${node_version}; publish uses npx npm@11.5.1"

    - id: publish
      name: Publish to npm
      shell: bash
      env:
        ALLOW_LEGACY_TOKEN: ${{ inputs.allow-legacy-token }}
        DIST_TAG: ${{ inputs.dist-tag }}
        LEGACY_NODE_AUTH_TOKEN: ${{ inputs.node-auth-token }}
        NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/mangostudio-publish-npmrc
      run: |
        set -euo pipefail
        trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT

        oidc_available=0
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          oidc_available=1
        fi

        use_legacy=0
        if [ "$ALLOW_LEGACY_TOKEN" = "true" ]; then
          if [ -n "${LEGACY_NODE_AUTH_TOKEN:-}" ]; then
            use_legacy=1
          else
            # Deliberate fallback to OIDC rather than a hard failure, but say so:
            # a maintainer who set allow_legacy_npm_token did it because they
            # expect the token path, and a silent switch makes a later
            # registry auth error look unrelated.
            echo "::warning::allow-legacy-token is true but no npm token was supplied; falling back to Trusted Publishing (OIDC)."
          fi
        fi

        if [ "$use_legacy" = "1" ]; then
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "$LEGACY_NODE_AUTH_TOKEN" > "$NPM_CONFIG_USERCONFIG"
          export NODE_AUTH_TOKEN="$LEGACY_NODE_AUTH_TOKEN"
          export NPM_PUBLISH_ALLOW_LEGACY_TOKEN=true
        elif [ "$oidc_available" = "1" ]; then
          unset NODE_AUTH_TOKEN
          export NPM_PUBLISH_ALLOW_LEGACY_TOKEN=false
        else
          echo "npm publish authentication failed: neither Trusted Publishing (OIDC) nor an allowed legacy token is available."
          exit 1
        fi

        args=(dist-npm)
        if [ -n "$DIST_TAG" ]; then
          args+=(--tag "$DIST_TAG")
        fi
        args+=(--provenance-policy required)
        bun ./scripts/release/publish-npm.ts "${args[@]}"
