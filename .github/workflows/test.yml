name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_PATH: /tmp/mangostudio-test.sqlite
      CACHE_VERSION: v1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-mango

      - uses: ./.github/actions/cache-turbo
        with:
          scope: test
          cache-version: ${{ env.CACHE_VERSION }}

      - name: Restore Vite optimizer cache
        uses: ./.github/actions/cache-vite
        with:
          scope: test
          cache-version: ${{ env.CACHE_VERSION }}

      - name: Run database migrations
        run: bun run --filter @mangostudio/api migrate

      # `--coverage` is self-contained: it runs root scripts unit tests plus
      # every workspace's full suite with instrumentation. Running a separate
      # `--unit --integration` pass before this was duplicate work.
      - name: Run tests with coverage
        run: bun run test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            .mango/artifacts/coverage/
          retention-days: 7

      - name: Coverage summary
        if: always()
        run: bun ./scripts/qa-gate/render-coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"
