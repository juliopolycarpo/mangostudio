name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_PATH: /tmp/mangostudio-test.sqlite
    steps:
      - uses: ./.github/actions/setup-mango

      - name: Run database migrations
        run: bun run --filter @mangostudio/api migrate

      - name: Run tests
        run: bun run test --unit --integration
