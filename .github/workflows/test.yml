name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_PATH: /tmp/mangostudio-test.sqlite
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mango

      - name: Run database migrations
        run: bun run --filter @mangostudio/api migrate

      - name: Run tests
        run: bun run test --unit --integration

      - name: Run coverage
        if: always()
        run: bun run test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            apps/frontend/coverage/
            apps/api/coverage/
            apps/shared/coverage/
          retention-days: 7

      - name: Coverage summary
        if: always()
        run: bun ./scripts/qa-gate/render-coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"
