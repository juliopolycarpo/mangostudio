name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_PATH: /tmp/mangostudio-test.sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - id: toolchain
        name: Resolve test cache toolchains
        # An empty version silently poisons the cache key, so fail here rather
        # than inside cache-scoped's validity guard.
        run: |
          set -euo pipefail
          turbo="$(bun run turbo:version | tail -n 1)"
          if [ -z "${turbo}" ]; then
            echo "::error::turbo version probe returned an empty value"
            exit 1
          fi
          echo "turbo=${turbo}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/cache-scoped
        with:
          family: turbo
          path: .turbo/cache
          validity: test-bun-${{ steps.setup.outputs.bun-version }}-turbo-${{ steps.toolchain.outputs.turbo }}-${{ hashFiles('turbo.jsonc', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-prefix: test-
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Restore Vite optimizer cache
        uses: ./.github/actions/cache-scoped
        with:
          family: vite
          path: apps/frontend/node_modules/.vite
          validity: test-${{ hashFiles('bun.lock', 'apps/frontend/package.json', 'apps/frontend/vite.config.ts', 'apps/frontend/vitest.config.ts', 'apps/frontend/tsconfig*.json') }}
          restore-prefix: test-
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Run database migrations
        run: bun run --filter @mangostudio/api migrate

      # `--coverage` is self-contained: it runs root scripts unit tests plus
      # every workspace's full suite with instrumentation. Running a separate
      # `--unit --integration` pass before this was duplicate work. The tee'd
      # log plus exit code and duration feed the qa-metrics fragment below, so
      # this single pass is the authoritative test signal for the QA report.
      - name: Run tests with coverage
        id: coverage
        run: |
          set -o pipefail
          start="$(date +%s)"
          status=0
          bun run test --coverage 2>&1 | tee coverage-run.log || status=$?
          {
            echo "exit-code=${status}"
            echo "duration-seconds=$(( $(date +%s) - start ))"
          } >> "$GITHUB_OUTPUT"
          exit "${status}"

      # Emitted even when the suite fails so the QA report can show the
      # failing exit code instead of a missing-metrics placeholder.
      - name: Collect test metrics fragment
        if: ${{ !cancelled() }}
        env:
          EXIT_CODE: ${{ steps.coverage.outputs.exit-code }}
          DURATION_SECONDS: ${{ steps.coverage.outputs.duration-seconds }}
        run: >
          bun ./scripts/qa-gate/collect-test-metrics.ts coverage-run.log
          "$EXIT_CODE" "$DURATION_SECONDS" > test-metrics.json

      # Handoff to the qa-metrics job in the same run; nothing consumes it
      # afterwards, so the shortest retention GitHub allows is enough.
      - name: Upload test metrics fragment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-test-metrics
          path: test-metrics.json
          retention-days: 1

      # Raw coverage output is a failure-diagnostics artifact: green runs are
      # summarized in the step summary and the qa-metrics envelope instead.
      - name: Upload coverage
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            .mango/artifacts/coverage/
          retention-days: 7

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: bun ./scripts/qa-gate/render-coverage-summary.ts test-metrics.json >> "$GITHUB_STEP_SUMMARY"
