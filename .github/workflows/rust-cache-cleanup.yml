name: Rust Cache Cleanup

# rust-cache saves in its post-job hook. Only a completed producer run proves
# those saves finished. Execute trusted main tooling, never producer artifacts
# or its head checkout, including when another job in that run failed.
#
# Every main push starts CI, Cargo Shim and Protocol CI, and one cleanup run per
# completion was about 57 runs a day. A cleanup run prunes every family, whatever
# producer triggered it, and the writer audit still checks every producer in
# `RUST_CACHE_WRITERS`. So the push-triggered Cargo Shim and Protocol CI are not
# triggers. Usually CI finishes last, but not always (a cold cache, which a
# manifest rotation causes, can make Cargo Shim outlast it). Correctness does not
# rest on that order: a deferred sweep waits for the next CI completion on main
# or the daily Randomized Order Nightly, and a day without a sweep stays well
# under the cache limit. docs/reference/testing.md ("Cleanup triggers") has the bound.
#
# The same run also keeps the newest few entries of the main-scope turbo, timings and
# lint-tools families (docs/reference/testing.md, "Retention for other main caches").
on:
  workflow_run:
    workflows:
      - CI
      - Rust fresh dependencies
      - Protocol Fuzz
      - Randomized Order Nightly
      - Smoke — Browser
      - Smoke — Binary
      - Release
      - Release Dry Run
    types: [completed]
    branches: [main]

permissions: {}

# Serialize deletions only. Producers keep their existing independent groups;
# the script audits active main writers and revalidates each exact cache ID.
concurrency:
  group: rust-cache-cleanup-main
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep one committed Rust cache generation
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out trusted main cleanup tooling
      actions: write # delete only superseded committed main cache IDs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: $/.github/actions/setup-bun

      # No install, PR code or artifact download runs with this token.
      - name: Delete superseded Rust cache IDs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun ./scripts/ci/rust-cache-cleanup.ts --delete
