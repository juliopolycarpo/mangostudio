name: Rust Cache Cleanup

# rust-cache saves in its post-job hook. Only a completed producer run proves
# those saves finished. Execute trusted main tooling, never producer artifacts
# or its head checkout, including when another job in that run failed.
on:
  workflow_run:
    workflows:
      - CI
      - Cargo Shim
      - Protocol CI
      - Rust fresh dependencies
      - Randomized Order Nightly
      - Smoke — Browser
      - Smoke — Binary
      - Release
      - Release Dry Run
    types: [completed]
    branches: [main]

permissions: {}

# Serialize deletions only. Producers keep their existing independent groups;
# the script audits active main writers and revalidates each exact cache ID.
concurrency:
  group: rust-cache-cleanup-main
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep one committed Rust cache generation
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out trusted main cleanup tooling
      actions: write # delete only superseded committed main cache IDs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # No install, PR code or artifact download runs with this token.
      - name: Delete superseded Rust cache IDs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun ./scripts/ci/rust-cache-cleanup.ts --delete
