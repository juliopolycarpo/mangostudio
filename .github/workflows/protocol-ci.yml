name: Protocol CI

# Lints, tests and cross-checks the Mango Protocol: the normative spec under
# spec/, the TypeScript SDK under packages/protocol/, and the Rust crate under
# crates/mango-protocol/. The minimum-Rust check is not here: Cargo Shim runs it
# for every Rust path, the protocol crate's included. The heavy Rust matrix only
# runs when a protocol path changes — but the workflow itself triggers on every
# pull request, because path detection happens in the cheap `changes` job so the
# workflow's uniquely named Protocol Gate below always reports. A
# path-filtered workflow that never starts leaves a required check pending
# forever. Pushes to main keep the path filter;
# required checks only apply to pull requests.

on:
  pull_request:
    branches: [main, "stack/**"]
  push:
    branches: [main]
    paths:
      - "packages/protocol/**"
      - "crates/mango-protocol/**"
      - "spec/**"
      - "docs/protocol/**"
      - "scripts/protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - "scripts/lib/protocol.ts"
      - "scripts/ci/protocol-lanes.ts"
      - "scripts/lib/changed-paths.ts"
      - "scripts/ci/changed-paths.ts"
      - "scripts/lib/ci-lanes.ts"
      - ".github/workflows/protocol-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Incremental compilation keeps state for rebuilding one target directory. A CI
# job builds once, so that state only costs time and disk (measured and written
# up under "Cargo incremental compilation" in docs/reference/testing.md).
# Swatinem/rust-cache exports the same value for jobs that restore a cache but
# not for lanes without one, so it is set here and pinned by
# scripts/tests/cargo-incremental.unit.test.ts.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect protocol changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      protocol: ${{ steps.changed.outputs.protocol }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - id: changed
        name: Check protocol paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # The path set is `PROTOCOL_PATHS` + `PROTOCOL_TRIGGER_FILES` in
        # scripts/lib/protocol.ts; protocol-lanes.unit.test.ts holds the two in
        # step. That module lists itself, so an edit to the rules deciding this
        # skip cannot be judged by the rules it replaced. Known prose guides
        # keep root document validation but skip this compiled matrix on PRs
        # and ordinary main pushes; dispatch always qualifies every lane. `--no-renames` lists
        # both sides of a rename, so moving a protocol source under an unrelated
        # path cannot hide the deletion.
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "protocol=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bun ./scripts/ci/changed-paths.ts collect "$BASE_SHA" "$HEAD_SHA" "$RUNNER_TEMP/changed-files"
          bun ./scripts/ci/protocol-lanes.ts relevance "$RUNNER_TEMP/changed-files" >> "$GITHUB_OUTPUT"

  typescript:
    name: TypeScript
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: install
        run: bun install --frozen-lockfile
      # `--ts-only` so this job never picks up the Rust toolchain GitHub's Linux
      # images ship; the `rust` job below owns that half with a cache.
      # CI Check already runs this check for PRs and main pushes.
      - run: bun run protocol:check --ts-only
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'workflow_dispatch' }}
      - run: bun run protocol:test --ts-only
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # The workspace resolves this package from `src/`, so its published
      # `exports` (publishConfig.exports, pointing at dist/) and its `files` are
      # exercised nowhere else in the repository. Packing the tarball and
      # importing every subpath out of a clean install is the only proof.
      - run: bun ./scripts/protocol/verify-package.ts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

  rust:
    name: Rust (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      # Every rust-cache step keys on the root manifest and saves only from
      # main; scripts/tests/cache-policy.unit.test.ts explains and pins both.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Pinned: `--feature-powerset` decides which feature sets this lane checks,
      # so a release re-run (protocol-release.yml pins the same version) and this
      # lane must not drift apart as cargo-hack publishes.
      - id: tooling
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-hack@0.6.46
      # Cargo Shim runs `cargo fmt --all`, then clippy and the tests of the whole
      # workspace with `--all-features` (a superset of `-p mango-protocol
      # --all-features`), on these same three OSes, whenever a path this crate
      # compiles changes: the rust lane in scripts/lib/rust-lanes.ts, which
      # scripts/tests/rust-lanes.unit.test.ts keeps in step with every file the
      # crates include or read. Running them here too only paid twice. What
      # follows is what Cargo Shim does not run.
      - run: cargo hack clippy -p mango-protocol --feature-powerset --all-targets --locked -- -D warnings
      # Cargo Shim runs the workspace doctests and `cargo doc` on Ubuntu only. The
      # crate has `cfg`-gated transports (unix sockets, Windows named pipes) whose
      # doctests and intra-doc links exist on one platform, so macOS and Windows
      # keep their own copy. Run these independent diagnostics after Clippy
      # failure once setup succeeded; cancellation and failed setup stop them.
      - name: Run doctests
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' && matrix.os != 'ubuntu-latest' }}
        run: cargo test -p mango-protocol --doc --all-features --locked
      - name: Build API docs (deny warnings)
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' && matrix.os != 'ubuntu-latest' }}
        run: cargo doc -p mango-protocol --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  interop:
    name: Interop (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: install
        run: bun install --frozen-lockfile
      - id: toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: matrix.os != 'ubuntu-latest'
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Built here rather than inside the suite, so a compile failure is
      # reported as one instead of as every interop case timing out.
      - id: peer
        run: cargo build --locked --example conformance_peer --features testing,websocket,spawn
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.toolchain.outcome == 'success' }}
      # Independent TS transports retain macOS/Windows coverage even if the
      # Rust conformance peer fails to compile. Ubuntu runs them in typescript.
      - run: bun run protocol:test --ts-only
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os != 'ubuntu-latest' }}
      - run: bun test packages/protocol/tests/interop
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.peer.outcome == 'success' }}
        env:
          MANGO_INTEROP: "1"

  deny:
    name: cargo-deny
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny
      # Advisory auditing runs once through CI's mandatory dependency audit,
      # including PRs without protocol changes; keep the other policies here.
      - run: cargo deny check bans licenses sources

  # Informational, never gating: the crate is pre-1.0 and unreleased Rust API surface routinely
  # lands on the same pull request that would trip this. spec/versioning.md is explicit that
  # "0.x: the wire may still change in a minor package release", and this repository's own
  # package-version table treats a pre-1.0 SDK signature change as `minor`, not `major` — gating
  # here would fail pull requests on changes our own versioning policy calls non-breaking.
  #
  # Keep per-change diagnostics outside the mandatory critical path. Job-level
  # continue-on-error also makes setup failures advisory to the workflow result,
  # which Canary source qualification requires to be successful.
  semver-checks:
    name: cargo-semver-checks (informational)
    continue-on-error: true
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-semver-checks
      # Compares against the last version published to crates.io automatically; no baseline flag.
      - run: cargo semver-checks check-release --all-features
        continue-on-error: true

  schema-equality:
    name: Schema equality and round trip
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup show active-toolchain
      - id: dependencies
        run: bun install --frozen-lockfile
      - run: bun ./scripts/protocol/verify-schema-equality.ts
      # Roundtrip remains useful when schema equality fails. Setup failure and
      # cancellation still prevent running a diagnostic without its tools.
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: bun ./scripts/protocol/verify-roundtrip.ts

  gate-unique:
    # Authoritative uniquely named aggregate for repository enforcement.
    name: Protocol Gate
    needs: [changes, typescript, rust, interop, deny, schema-equality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Evaluate mandatory job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ needs.changes.outputs.protocol == 'false' && 'typescript rust interop deny schema-equality' || '' }}
        # Dependency-free script; runs without `bun install`.
        run: bun ./scripts/ci/evaluate-gate.ts
