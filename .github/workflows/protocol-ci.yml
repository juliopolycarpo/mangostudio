name: Protocol CI

# Lints, tests and cross-checks the Mango Protocol: the normative spec under
# spec/, the TypeScript SDK under packages/protocol/, and the Rust crate under
# crates/mango-protocol/. The minimum-Rust check is not here: Cargo Shim runs it
# for every Rust path, the protocol crate's included. The heavy Rust matrix only
# runs when a protocol path changes — but the workflow itself triggers on every
# pull request, because path detection happens in the cheap `changes` job so the
# "Protocol CI / Gate" check below always reports and is safe to require in
# branch protection (a path-filtered workflow that never starts leaves a
# required check pending forever). Pushes to main keep the path filter;
# required checks only apply to pull requests.

on:
  pull_request:
    branches: [main, feat/rust-runtime, feat/external-agents-sdk-adoption]
  push:
    branches: [main]
    paths:
      - "packages/protocol/**"
      - "crates/mango-protocol/**"
      - "spec/**"
      - "docs/protocol/**"
      - "scripts/protocol/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - "scripts/lib/protocol.ts"
      - ".github/workflows/protocol-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect protocol changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      protocol: ${{ steps.changed.outputs.protocol }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changed
        name: Check protocol paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The path set is `PROTOCOL_PATHS` + `PROTOCOL_TRIGGER_FILES` in
        # scripts/lib/protocol.ts; protocol-lanes.unit.test.ts holds the two in
        # step. That module lists itself, so an edit to the rules deciding this
        # skip cannot be judged by the rules it replaced. `--no-renames` lists
        # both sides of a rename, so moving a protocol source under an unrelated
        # path cannot hide the deletion.
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "protocol=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"

          if [ ! -s "$RUNNER_TEMP/changed-files" ]; then
            echo "changes job: empty diff between $BASE_SHA and $HEAD_SHA; refusing to skip the protocol lanes" >&2
            exit 1
          fi

          relevant='^(packages/protocol/|crates/mango-protocol/|spec/|docs/protocol/|scripts/protocol/|Cargo\.(toml|lock)$|deny\.toml$|rustfmt\.toml$|rust-toolchain\.toml$|scripts/lib/protocol\.ts$|\.github/workflows/protocol-ci\.yml$)'
          if grep -Eq "$relevant" "$RUNNER_TEMP/changed-files"; then
            echo "protocol=true" >> "$GITHUB_OUTPUT"
          else
            echo "protocol=false" >> "$GITHUB_OUTPUT"
          fi

  typescript:
    name: TypeScript
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # `--ts-only` so this job never picks up the Rust toolchain GitHub's Linux
      # images ship; the `rust` job below owns that half with a cache.
      - run: bun run protocol:check --ts-only
      - run: bun run protocol:test --ts-only

  package:
    name: Published package
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The workspace resolves this package from `src/`, so its published
      # `exports` (publishConfig.exports, pointing at dist/) and its `files` are
      # exercised nowhere else in the repository. Packing the tarball and
      # importing every subpath out of a clean install is the only proof.
      - run: bun ./scripts/protocol/verify-package.ts

  rust:
    name: Rust (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      # Every rust-cache step keys on the root manifest and saves only from
      # main; scripts/tests/cache-policy.unit.test.ts explains and pins both.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-hack
      # Cargo Shim runs `cargo fmt --all`, then clippy and the tests of the whole
      # workspace with `--all-features` (a superset of `-p mango-protocol
      # --all-features`), on these same three OSes, whenever a path this crate
      # compiles changes: the rust lane in scripts/lib/rust-lanes.ts, which
      # scripts/tests/rust-lanes.unit.test.ts keeps in step with every file the
      # crates include or read. Running them here too only paid twice. What
      # follows is what Cargo Shim does not run.
      - run: cargo hack clippy -p mango-protocol --feature-powerset --all-targets --locked -- -D warnings
      # Cargo Shim runs the workspace doctests and `cargo doc` on Ubuntu only. The
      # crate has `cfg`-gated transports (unix sockets, Windows named pipes) whose
      # doctests and intra-doc links exist on one platform, so macOS and Windows
      # keep their own copy.
      - name: Run doctests
        if: matrix.os != 'ubuntu-latest'
        run: cargo test -p mango-protocol --doc --all-features --locked
      - name: Build API docs (deny warnings)
        if: matrix.os != 'ubuntu-latest'
        run: cargo doc -p mango-protocol --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  transports:
    name: Transports (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run protocol:test --ts-only

  interop:
    name: Interop (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      # Built here rather than inside the suite, so a compile failure is
      # reported as one instead of as every interop case timing out.
      - run: cargo build --locked --example conformance_peer --features testing,websocket,spawn
      - run: bun test packages/protocol/tests/interop
        env:
          MANGO_INTEROP: "1"

  deny:
    name: cargo-deny
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny
      - run: cargo deny check

  # Informational, never gating: the crate is pre-1.0 and unreleased Rust API surface routinely
  # lands on the same pull request that would trip this. spec/versioning.md is explicit that
  # "0.x: the wire may still change in a minor package release", and this repository's own
  # package-version table treats a pre-1.0 SDK signature change as `minor`, not `major` — gating
  # here would fail pull requests on changes our own versioning policy calls non-breaking.
  #
  # `continue-on-error` on the check step rather than leaving the job out of the gate: every job in
  # a workflow belongs to its aggregate gate (ci-gate.unit.test.ts derives that set from the file,
  # so a job cannot bypass it by omission), and a failed step carrying that flag leaves the job's
  # conclusion `success` — so the job stays in the gate while being unable to fail it. Deliberately
  # on the step and not the job: `continue-on-error` at job level changes what `needs.<job>.result`
  # reports, which is the value evaluate-gate.ts reads, and the step form needs no such claim.
  # Drop the flag once the crate reaches 1.0.
  semver-checks:
    name: cargo-semver-checks (informational)
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-semver-checks
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Compares against the last version published to crates.io automatically; no baseline flag.
      - run: cargo semver-checks check-release --all-features
        continue-on-error: true

  schema-equality:
    name: Schema equality and round trip
    needs: [changes]
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      - run: bun ./scripts/protocol/verify-schema-equality.ts
      - run: bun ./scripts/protocol/verify-roundtrip.ts

  gate:
    # Single stable check ("Protocol CI / Gate") aggregating every mandatory
    # job, so branch protection depends on one name instead of tracking job
    # names and matrix shapes. Every lane skip is accepted only when the
    # `changes` job proved no protocol path changed.
    name: Gate
    needs: [
      changes,
      typescript,
      package,
      rust,
      transports,
      interop,
      deny,
      semver-checks,
      schema-equality,
    ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Evaluate mandatory job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ needs.changes.outputs.protocol == 'false' && 'typescript package rust transports interop deny semver-checks schema-equality' || '' }}
        # Dependency-free script; runs without `bun install`.
        run: bun ./scripts/ci/evaluate-gate.ts

  feature-measurement:
    name: Feature measurement (${{ matrix.repo }} / ${{ matrix.os }} / ${{ matrix.case }})
    needs: [gate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/measure/cargo-feature-partitions'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        repo: [protocol, sdk]
        os: [ubuntu-latest, macos-latest, windows-latest]
        case: [full, p1, p2]
    steps:
      - name: Check out measurement code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false

      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo == 'protocol' && 'juliopolycarpo/mangostudio' || 'juliopolycarpo/mango-external-agents' }}
          ref: ${{ matrix.repo == 'protocol' && '9a3d8ee5e5d329760accc840a5dcdf334083d3c4' || '24393ab644b93a3ffb194ffadb07429ca11278a0' }}
          path: source
          persist-credentials: false

      - name: Read the measurement Bun pin
        shell: bash
        # The measurement branch preserves the baseline toolchain files. Setup
        # reads the normal root filename; the harness also verifies Bun 1.4.2.
        run: cp harness/.bun-version .bun-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-hack@0.6.45
          checksum: true
          fallback: none

      - name: Measure fresh feature case
        shell: bash
        env:
          FEATURE_REPO: ${{ matrix.repo }}
          FEATURE_CASE: ${{ matrix.case }}
          FEATURE_OS: ${{ matrix.os }}
          FEATURE_SOURCE: source
          FEATURE_OUTPUT: receipts
        # Dependency-free script. Source fetch and enumeration are untimed setup;
        # each case starts with its own empty target and Cargo source directory.
        run: bun ./harness/scripts/bench/cargo-feature-measurement.ts measure

      - name: Upload measurement receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-${{ matrix.repo }}-${{ matrix.os }}-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  turbo-snapshot-prime:
    # This manual experiment never changes a production cache key or task.
    name: Turbo snapshot (prime / ${{ matrix.variant }})
    needs: [gate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/measure/turbo-snapshot-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: [baseline, candidate]
    env:
      SNAPSHOT_PHASE: prime
      SNAPSHOT_VARIANT: ${{ matrix.variant }}
      SNAPSHOT_SOURCE: source
      SNAPSHOT_OUTPUT: receipts
    steps:
      - name: Check out measurement code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9a3d8ee5e5d329760accc840a5dcdf334083d3c4
          path: source
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Prepare pinned source and frozen tools
        id: prepare
        run: bun scripts/bench/turbo-snapshot-measurement.ts prepare

      - name: Restore private snapshot
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source/.mango/turbo-snapshot
          key: ${{ steps.prepare.outputs.key }}
          restore-keys: ${{ steps.prepare.outputs.restore_prefix }}

      - name: Measure four real typechecks
        id: measure
        run: bun scripts/bench/turbo-snapshot-measurement.ts measure

      - name: Inspect and cap the private payload at 1 MiB
        id: cap
        run: bun scripts/bench/turbo-snapshot-measurement.ts cap

      - name: Save bounded private snapshot
        id: save
        # Baseline explicitly attempts K0 again: save success cannot prove that
        # an immutable existing key was updated. Replay inspects actual bytes.
        if: env.SNAPSHOT_PHASE != 'replay' && steps.cap.outputs.bounded == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source/.mango/turbo-snapshot
          key: ${{ steps.prepare.outputs.save_key }}

      - name: Stage local outcomes
        if: always()
        env:
          SNAPSHOT_PREPARE: ${{ steps.prepare.outcome }}
          SNAPSHOT_RESTORE: ${{ steps.restore.outcome }}
          SNAPSHOT_MEASURE: ${{ steps.measure.outcome }}
          SNAPSHOT_CAP: ${{ steps.cap.outcome }}
          SNAPSHOT_SAVE: ${{ steps.save.outcome }}
          SNAPSHOT_HIT: ${{ steps.restore.outputs.cache-hit }}
          SNAPSHOT_MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: bun scripts/bench/turbo-snapshot-measurement.ts finish

      - name: Upload snapshot receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-snapshot-prime-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts
          if-no-files-found: error
          retention-days: 14

  turbo-snapshot-change:
    # This manual experiment never changes a production cache key or task.
    name: Turbo snapshot (change / ${{ matrix.variant }})
    needs: [gate, turbo-snapshot-prime]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/measure/turbo-snapshot-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: [baseline, candidate]
    env:
      SNAPSHOT_PHASE: change
      SNAPSHOT_VARIANT: ${{ matrix.variant }}
      SNAPSHOT_SOURCE: source
      SNAPSHOT_OUTPUT: receipts
    steps:
      - name: Check out measurement code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9a3d8ee5e5d329760accc840a5dcdf334083d3c4
          path: source
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Prepare pinned source and frozen tools
        id: prepare
        run: bun scripts/bench/turbo-snapshot-measurement.ts prepare

      - name: Restore private snapshot
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source/.mango/turbo-snapshot
          key: ${{ steps.prepare.outputs.key }}
          restore-keys: ${{ steps.prepare.outputs.restore_prefix }}

      - name: Measure four real typechecks
        id: measure
        run: bun scripts/bench/turbo-snapshot-measurement.ts measure

      - name: Inspect and cap the private payload at 1 MiB
        id: cap
        run: bun scripts/bench/turbo-snapshot-measurement.ts cap

      - name: Save bounded private snapshot
        id: save
        # Baseline explicitly attempts K0 again: save success cannot prove that
        # an immutable existing key was updated. Replay inspects actual bytes.
        if: env.SNAPSHOT_PHASE != 'replay' && steps.cap.outputs.bounded == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source/.mango/turbo-snapshot
          key: ${{ steps.prepare.outputs.save_key }}

      - name: Stage local outcomes
        if: always()
        env:
          SNAPSHOT_PREPARE: ${{ steps.prepare.outcome }}
          SNAPSHOT_RESTORE: ${{ steps.restore.outcome }}
          SNAPSHOT_MEASURE: ${{ steps.measure.outcome }}
          SNAPSHOT_CAP: ${{ steps.cap.outcome }}
          SNAPSHOT_SAVE: ${{ steps.save.outcome }}
          SNAPSHOT_HIT: ${{ steps.restore.outputs.cache-hit }}
          SNAPSHOT_MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: bun scripts/bench/turbo-snapshot-measurement.ts finish

      - name: Upload snapshot receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-snapshot-change-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts
          if-no-files-found: error
          retention-days: 14

  turbo-snapshot-replay:
    # This manual experiment never changes a production cache key or task.
    name: Turbo snapshot (replay / ${{ matrix.variant }})
    needs: [gate, turbo-snapshot-change]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/measure/turbo-snapshot-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        variant: [baseline, candidate]
    env:
      SNAPSHOT_PHASE: replay
      SNAPSHOT_VARIANT: ${{ matrix.variant }}
      SNAPSHOT_SOURCE: source
      SNAPSHOT_OUTPUT: receipts
    steps:
      - name: Check out measurement code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9a3d8ee5e5d329760accc840a5dcdf334083d3c4
          path: source
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Prepare pinned source and frozen tools
        id: prepare
        run: bun scripts/bench/turbo-snapshot-measurement.ts prepare

      - name: Restore private snapshot
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source/.mango/turbo-snapshot
          key: ${{ steps.prepare.outputs.key }}
          restore-keys: ${{ steps.prepare.outputs.restore_prefix }}

      - name: Measure four real typechecks
        id: measure
        run: bun scripts/bench/turbo-snapshot-measurement.ts measure

      - name: Inspect and cap the private payload at 1 MiB
        id: cap
        run: bun scripts/bench/turbo-snapshot-measurement.ts cap

      - name: Save bounded private snapshot
        id: save
        # Baseline explicitly attempts K0 again: save success cannot prove that
        # an immutable existing key was updated. Replay inspects actual bytes.
        if: env.SNAPSHOT_PHASE != 'replay' && steps.cap.outputs.bounded == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source/.mango/turbo-snapshot
          key: ${{ steps.prepare.outputs.save_key }}

      - name: Stage local outcomes
        if: always()
        env:
          SNAPSHOT_PREPARE: ${{ steps.prepare.outcome }}
          SNAPSHOT_RESTORE: ${{ steps.restore.outcome }}
          SNAPSHOT_MEASURE: ${{ steps.measure.outcome }}
          SNAPSHOT_CAP: ${{ steps.cap.outcome }}
          SNAPSHOT_SAVE: ${{ steps.save.outcome }}
          SNAPSHOT_HIT: ${{ steps.restore.outputs.cache-hit }}
          SNAPSHOT_MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
        run: bun scripts/bench/turbo-snapshot-measurement.ts finish

      - name: Upload snapshot receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-snapshot-replay-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts
          if-no-files-found: error
          retention-days: 14

  turbo-snapshot-collect:
    name: Turbo snapshot persistence receipts
    needs: [gate, turbo-snapshot-prime, turbo-snapshot-change, turbo-snapshot-replay]
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/measure/turbo-snapshot-cache' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Read this run's job outcomes and private cache size metadata.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Download all available snapshot receipts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: turbo-snapshot-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: collected

      - name: Verify persistence and read hosted job/action wall times
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_INPUT: collected
          SNAPSHOT_OUTPUT: collected-summary
        run: bun scripts/bench/turbo-snapshot-measurement.ts collect

      - name: Upload comparison and raw hosted job outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-snapshot-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: collected-summary
          if-no-files-found: error
          retention-days: 14
