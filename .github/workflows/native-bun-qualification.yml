name: Retained Bun cache comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retained-bun-package-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Compare ${{ matrix.host.runner }} ${{ matrix.order.label }}
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        host:
          - runner: ubuntu-24.04-arm
            identity: Linux-ARM64
          - runner: macos-15-intel
            identity: macOS-X64
          - runner: windows-11-arm
            identity: Windows-ARM64
        order:
          - label: cold-cache-1
            modes: [cold, cache]
          - label: cache-cold-1
            modes: [cache, cold]
          - label: cold-cache-2
            modes: [cold, cache]
          - label: cache-cold-2
            modes: [cache, cold]
          - label: cold-cache-3
            modes: [cold, cache]
          - label: cache-cold-3
            modes: [cache, cold]
    steps:
      - name: Preserve tracked source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 56a628984db98c930da67c8df9c970dfceba747a
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Verify exact source, Bun, and runner
        env:
          EXPECTED_RUNNER: ${{ matrix.host.identity }}
          LOCK_SHA: ${{ hashFiles('bun.lock') }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 56a628984db98c930da67c8df9c970dfceba747a
          test "$(bun --revision)" = 1.4.4-canary.1+89452d2ac
          test "$RUNNER_OS-$RUNNER_ARCH" = "$EXPECTED_RUNNER"
          test "$LOCK_SHA" = 25189456589ff15dc83b28c413a2c2a8ce592d1b90f5d634afe5ec703aedaa69
          printf 'Runner image %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
      - name: Start trial 0 with empty install state
        run: |
          set -euo pipefail
          git clean -ffdX
          rm -rf -- "$HOME/.bun/install/cache"
          test ! -e "$HOME/.bun/install/cache"
          test ! -e node_modules
          bun -e 'console.log(Date.now())' > "$RUNNER_TEMP/trial-start"
      - id: restore-0
        name: Restore the trusted Bun archive for trial 0
        if: matrix.order.modes[0] == 'cache'
        uses: ./.github/actions/cache-scoped # zizmor: ignore[self-repository] benchmark the cache action from the selected source
        with:
          mode: restore
          family: bun
          path: ~/.bun/install/cache
          validity: 1.4.4-canary.1+89452d2ac-25189456589ff15dc83b28c413a2c2a8ce592d1b90f5d634afe5ec703aedaa69
          cache-epoch: v1
      - name: Measure the frozen install for trial 0
        env:
          MODE: ${{ matrix.order.modes[0] }}
          MATCHED_KEY: ${{ steps.restore-0.outputs.matched-key }}
          EXPECTED_KEY: ${{ matrix.host.identity }}-v1-bun-main-1.4.4-canary.1+89452d2ac-25189456589ff15dc83b28c413a2c2a8ce592d1b90f5d634afe5ec703aedaa69
        run: |
          set -euo pipefail
          if [[ "$MODE" == cache ]]; then
            if [[ "$MATCHED_KEY" != "$EXPECTED_KEY" ]]; then
              printf 'expected cache key %s | received %s\n' "$EXPECTED_KEY" "${MATCHED_KEY:-<empty>}" >&2
              exit 1
            fi
          fi
          start=$(cat "$RUNNER_TEMP/trial-start")
          before_install=$(bun -e 'console.log(Date.now())')
          bun install --frozen-lockfile
          end=$(bun -e 'console.log(Date.now())')
          git diff --exit-code
          printf 'BUN-CACHE-TRIAL mode=%s restore_ms=%d install_ms=%d total_ms=%d\n' \
            "$MODE" "$((before_install - start))" "$((end - before_install))" "$((end - start))"
      - name: Verify the installed native frontend dependencies for trial 0
        env:
          TURBO_FORCE: "true"
          TURBO_TELEMETRY_DISABLED: "1"
        run: bun run build --frontend
      - name: Start trial 1 with empty install state
        run: |
          set -euo pipefail
          git clean -ffdX
          rm -rf -- "$HOME/.bun/install/cache"
          test ! -e "$HOME/.bun/install/cache"
          test ! -e node_modules
          bun -e 'console.log(Date.now())' > "$RUNNER_TEMP/trial-start"
      - id: restore-1
        name: Restore the trusted Bun archive for trial 1
        if: matrix.order.modes[1] == 'cache'
        uses: ./.github/actions/cache-scoped # zizmor: ignore[self-repository] benchmark the cache action from the selected source
        with:
          mode: restore
          family: bun
          path: ~/.bun/install/cache
          validity: 1.4.4-canary.1+89452d2ac-25189456589ff15dc83b28c413a2c2a8ce592d1b90f5d634afe5ec703aedaa69
          cache-epoch: v1
      - name: Measure the frozen install for trial 1
        env:
          MODE: ${{ matrix.order.modes[1] }}
          MATCHED_KEY: ${{ steps.restore-1.outputs.matched-key }}
          EXPECTED_KEY: ${{ matrix.host.identity }}-v1-bun-main-1.4.4-canary.1+89452d2ac-25189456589ff15dc83b28c413a2c2a8ce592d1b90f5d634afe5ec703aedaa69
        run: |
          set -euo pipefail
          if [[ "$MODE" == cache ]]; then
            if [[ "$MATCHED_KEY" != "$EXPECTED_KEY" ]]; then
              printf 'expected cache key %s | received %s\n' "$EXPECTED_KEY" "${MATCHED_KEY:-<empty>}" >&2
              exit 1
            fi
          fi
          start=$(cat "$RUNNER_TEMP/trial-start")
          before_install=$(bun -e 'console.log(Date.now())')
          bun install --frozen-lockfile
          end=$(bun -e 'console.log(Date.now())')
          git diff --exit-code
          printf 'BUN-CACHE-TRIAL mode=%s restore_ms=%d install_ms=%d total_ms=%d\n' \
            "$MODE" "$((before_install - start))" "$((end - before_install))" "$((end - start))"
      - name: Verify the installed native frontend dependencies for trial 1
        env:
          TURBO_FORCE: "true"
          TURBO_TELEMETRY_DISABLED: "1"
        run: bun run build --frontend
