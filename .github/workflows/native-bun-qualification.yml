name: Distribution topology comparison

on:
  workflow_dispatch:
    inputs:
      topology:
        description: Distribution topology to measure
        type: choice
        options: [all-runtimes-first, overlap]
        required: true
      sample:
        description: Matched pair number
        type: string
        required: true

run-name: Distribution ${{ inputs.topology }} pair ${{ inputs.sample }}

permissions:
  contents: read

concurrency:
  group: distribution-topology-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: Resolve fixed distribution identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ab58f5bb05aaa5cde56869cdcb734cab419a5e35
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ab58f5bb05aaa5cde56869cdcb734cab419a5e35
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: identity
        name: Verify source and resolve distribution identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ab58f5bb05aaa5cde56869cdcb734cab419a5e35
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bun ./scripts/ci/distribution-identity.ts >> "$GITHUB_OUTPUT"
          bun --revision
          sha256sum bun.lock Cargo.lock rust-toolchain.toml

  frontend:
    name: Build
    needs: [identity]
    uses: $/.github/workflows/build.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}

  baseline:
    name: Distribution
    if: inputs.topology == 'all-runtimes-first'
    needs: [identity, frontend]
    permissions:
      contents: read
      id-token: write # same build provenance check as shipping CI
      attestations: write # store attestations for the scoped Actions bundles
    uses: $/.github/workflows/distribution-build-all-runtimes-first.yml
    with:
      version: ${{ needs.identity.outputs.version }}
      source_sha: ${{ needs.identity.outputs.source_sha }}
      channel: ${{ needs.identity.outputs.channel }}
      retention_days: 2
      publication_bundles: true
      runtime_profile: shipping
      cache: false
      frontend_artifact: ${{ needs.frontend.outputs.artifact }}
      frontend_bun_revision: ${{ needs.frontend.outputs.bun_revision }}

  candidate:
    name: Distribution
    if: inputs.topology == 'overlap'
    needs: [identity, frontend]
    permissions:
      contents: read
      id-token: write # same build provenance check as shipping CI
      attestations: write # store attestations for the scoped Actions bundles
    uses: $/.github/workflows/distribution-build.yml
    with:
      version: ${{ needs.identity.outputs.version }}
      source_sha: ${{ needs.identity.outputs.source_sha }}
      channel: ${{ needs.identity.outputs.channel }}
      retention_days: 2
      publication_bundles: true
      runtime_profile: shipping
      cache: false
      frontend_artifact: ${{ needs.frontend.outputs.artifact }}
      frontend_bun_revision: ${{ needs.frontend.outputs.bun_revision }}

  smoke-binary:
    name: Smoke — Binary
    needs: [identity, baseline, candidate]
    if: ${{ !cancelled() && (needs.baseline.result == 'success' || needs.candidate.result == 'success') }}
    uses: $/.github/workflows/smoke-binary.yml
    with:
      version: ${{ needs.identity.outputs.version }}
      source_sha: ${{ needs.identity.outputs.source_sha }}
      channel: ${{ needs.identity.outputs.channel }}
      target_artifacts: ${{ needs.baseline.outputs.target_artifacts || needs.candidate.outputs.target_artifacts }}

  smoke-container:
    name: Smoke — Container
    needs: [identity, baseline, candidate]
    if: ${{ !cancelled() && (needs.baseline.result == 'success' || needs.candidate.result == 'success') }}
    uses: $/.github/workflows/smoke-container.yml
    with:
      version: ${{ needs.identity.outputs.version }}
      source_sha: ${{ needs.identity.outputs.source_sha }}
      channel: ${{ needs.identity.outputs.channel }}
      target_artifacts: ${{ needs.baseline.outputs.target_artifacts || needs.candidate.outputs.target_artifacts }}
