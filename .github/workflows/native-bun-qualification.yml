name: Native Bun qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-repository-actions-preflight
  cancel-in-progress: false

jobs:
  linux:
    uses: $/.github/workflows/lint.yml

  native:
    name: Check self-repository steps on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Resolve an action before checkout
        uses: $/.github/actions/require-secret
        with:
          name: preflight sentinel
          value: present

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Run Check with the native analyzer archives
        run: bun run check
