name: Native Bun qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formatter-heartbeat-sharing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sharing:
    name: Probe Windows formatter heartbeat sharing
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Lock the existing heartbeat through the next atomic replacement
        run: bun scripts/tests/support/formatter-heartbeat-sharing-probe.ts
