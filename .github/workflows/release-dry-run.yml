name: Release Dry Run

# Disposable branch experiment. This workflow is never proposed for main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-descriptor-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-descriptors:
    name: Measure native macOS descriptor closure and original Git routes
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 63dc3d8f9f119f286954e4043d7f14a6f2f8d1da
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: source/.bun-version
      - name: Record native platform and immutable sources
        run: |
          mkdir -p evidence
          uname -a > evidence/host.log
          sw_vers >> evidence/host.log
          xcrun --show-sdk-version >> evidence/host.log
          git -C source rev-parse HEAD > evidence/source-sha.txt
          git -C source status --porcelain > evidence/source-before-status.txt
          git -C tooling rev-parse HEAD > evidence/tooling-sha.txt
          shasum -a 256 tooling/scripts/macos-descriptor-probe.c > evidence/probe-sha256.txt
          clang -Wall -Wextra -Werror tooling/scripts/macos-descriptor-probe.c -o evidence/macos-descriptor-probe
      - name: Measure unchanged close loop and post-fork complete census
        run: evidence/macos-descriptor-probe | tee evidence/descriptor-cost.jsonl
      - name: Build original default runtime with compiler messages
        working-directory: source
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/targets/default
        run: |
          cargo --version > ../evidence/cargo-version.txt
          rustc --version --verbose > ../evidence/rustc-version.txt
          cargo build -p mangostudio-runtime --bin mangostudio-runtime --locked --message-format=json > ../evidence/default-cargo.jsonl 2> ../evidence/default-cargo.stderr.log
          shasum -a 256 ../targets/default/debug/mangostudio-runtime > ../evidence/runtime-sha256.txt
      - name: Install immutable source dependencies
        working-directory: source
        run: bun install --frozen-lockfile > ../evidence/install.log 2>&1
      - name: Measure unchanged Git route regression
        working-directory: source
        env:
          MANGOSTUDIO_RUNTIME_BINARY: ${{ github.workspace }}/targets/default/debug/mangostudio-runtime
        run: |
          bun test --preload ./apps/api/tests/support/setup/preload.ts --timeout 15000 --reporter=junit --reporter-outfile=../evidence/git-write.xml apps/api/tests/integration/routes/git-write.integration.test.ts > ../evidence/git-write.log 2>&1
      - name: Verify source remained unchanged
        if: always()
        run: git -C source status --porcelain > evidence/source-after-status.txt
      - name: Upload every native measurement and failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-descriptor-probe-${{ github.sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
