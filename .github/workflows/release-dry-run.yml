name: Release Dry Run

# Disposable branch experiment. This workflow is never proposed for main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-descriptor-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-descriptors:
    name: Measure descriptor closure under shell and Bun inherited limits
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 63dc3d8f9f119f286954e4043d7f14a6f2f8d1da
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: source/.bun-version
      - name: Record native platform and immutable sources
        run: |
          mkdir -p evidence
          uname -a > evidence/host.log
          sw_vers >> evidence/host.log
          xcrun --show-sdk-version >> evidence/host.log
          git -C source rev-parse HEAD > evidence/source-sha.txt
          git -C source status --porcelain > evidence/source-before-status.txt
          git -C tooling rev-parse HEAD > evidence/tooling-sha.txt
          shasum -a 256 tooling/scripts/macos-descriptor-probe.c > evidence/probe-sha256.txt
          clang -Wall -Wextra -Werror tooling/scripts/macos-descriptor-probe.c -o evidence/macos-descriptor-probe
      - name: Measure unchanged close loop under the shell inherited limit
        run: evidence/macos-descriptor-probe > evidence/shell-descriptor-cost.jsonl 2> evidence/shell-descriptor-cost.stderr.log
      - name: Measure unchanged close loop under Bun inherited limits
        run: |
          bun --no-install - <<'BUN'
          const child = Bun.spawn(['./evidence/macos-descriptor-probe'], { stdout: 'pipe', stderr: 'pipe', timeout: 120000 });
          const [stdout, stderr, exitCode] = await Promise.all([new Response(child.stdout).text(), new Response(child.stderr).text(), child.exited]);
          await Bun.write('evidence/bun-descriptor-cost.jsonl', stdout);
          await Bun.write('evidence/bun-descriptor-cost.stderr.log', stderr);
          const receipt = { bunVersion: Bun.version, bunRevision: Bun.revision, pid: child.pid, exitCode, command: ['./evidence/macos-descriptor-probe'], rows: stdout.trim().split('\n').map((line) => JSON.parse(line)), stderr };
          await Bun.write('evidence/bun-launch-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          if (exitCode !== 0 || receipt.rows.length !== 12 || receipt.rows.some((row) => row.keepPreserved === false || row.highClosed === false)) throw new Error('Incomplete native Bun descriptor measurement; inspect raw output');
          console.log(JSON.stringify(receipt));
          BUN
      - name: Verify source remained unchanged
        if: always()
        run: git -C source status --porcelain > evidence/source-after-status.txt
      - name: Upload every native measurement and failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-descriptor-probe-${{ github.sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 14
