name: Release Dry Run

# Disposable branch experiment. This workflow is never proposed for main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msvc-policy-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  msvc-telemetry:
    name: MSVC telemetry (${{ matrix.control }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        control: [unchanged, devshell-env, optional-telemetry-policy]
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve tracked source bytes
        run: git config --global core.autocrlf false

      - name: Check out the immutable experiment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8bf7943eac9b92b815bf67dda1eab48f16f52b4c
          path: source
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: source/.bun-version

      - name: Bootstrap frozen source dependencies in a separate process
        working-directory: source
        timeout-minutes: 5
        env:
          PROBE_CONTROL: ${{ matrix.control }}
          PROBE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          bun --no-install - <<'BUN'
          import { appendFile, mkdir } from 'node:fs/promises';
          import { join, resolve } from 'node:path';
          const root = resolve('.');
          const out = resolve('..', 'evidence');
          await mkdir(out, { recursive: true });
          const receipt = { sourceSha: '8bf7943eac9b92b815bf67dda1eab48f16f52b4c', workflowSha: process.env.PROBE_WORKFLOW_SHA, control: process.env.PROBE_CONTROL, status: 'running', sourceBefore: null, sourceAfter: null, commands: [], errors: [] };
          await Bun.write(join(out, 'bootstrap-receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
          await Bun.write(join(out, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
          try {
            const { runNativeCommand, snapshotNativeProcesses } = await import(join(root, 'scripts/lib/native-bun-qualification-process.ts'));
            const { nativeSourceChanged, sealNativeSource } = await import(join(root, 'scripts/lib/native-bun-qualification-source.ts'));
            if (process.platform !== 'win32' || process.env.GITHUB_ACTIONS !== 'true' || process.env.RUNNER_OS !== 'Windows') throw new Error('Invalid bootstrap host; expected disposable GitHub Actions Windows');
            const before = await sealNativeSource(root);
            receipt.sourceBefore = { head: before.head, tree: before.tree, sha256: before.sha256, status: before.status };
            await Bun.write(join(out, 'source-before-bootstrap.json'), JSON.stringify(before, null, 2) + '\n');
            if (before.head !== receipt.sourceSha || before.status) throw new Error('Invalid bootstrap source; expected clean immutable checkout');
            await Bun.write(join(out, 'processes-before-bootstrap.json'), JSON.stringify(await snapshotNativeProcesses(), null, 2) + '\n');
            for (const [label, command, timeoutSeconds] of [
              ['install', ['bun', 'install', '--frozen-lockfile'], 240],
              ['dependency-import', ['bun', '--no-install', '-e', 'console.log(Bun.resolveSync("typebox", process.cwd())); await import("typebox"); console.log("fresh source dependency import passed");'], 30],
            ]) {
              const result = await runNativeCommand({ label, command, timeoutSeconds, root, out, env: { ...process.env }, snapshot: async () => {
                const rows = await snapshotNativeProcesses();
                await appendFile(join(out, 'raw-census-' + label + '.jsonl'), JSON.stringify({ at: new Date().toISOString(), processes: rows }) + '\n');
                return rows;
              } });
              receipt.commands.push(result);
              await Bun.write(join(out, 'command-' + label + '.json'), JSON.stringify(result, null, 2) + '\n');
              if (result.exitCode !== 0 || result.timedOut || result.errors.length || !result.settlement.empty) throw new Error(label + ': frozen dependency bootstrap failed; inspect full command and census logs');
            }
            const after = await sealNativeSource(root);
            receipt.sourceAfter = { head: after.head, tree: after.tree, sha256: after.sha256, status: after.status };
            await Bun.write(join(out, 'source-after-bootstrap.json'), JSON.stringify(after, null, 2) + '\n');
            if (nativeSourceChanged(before, after) || after.status) throw new Error('Bootstrap changed tracked source bytes or Git identity');
          } catch (error) {
            receipt.errors.push(String(error));
          } finally {
            receipt.status = receipt.errors.length ? 'dependency-setup-failed' : 'prepared';
            await Bun.write(join(out, 'bootstrap-receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
            await Bun.write(join(out, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
            console.log(JSON.stringify({ status: receipt.status, errors: receipt.errors }));
          }
          process.exitCode = receipt.errors.length ? 1 : 0;
          BUN

      - name: Build the default runtime and preserve process evidence
        working-directory: source
        env:
          PROBE_CONTROL: ${{ matrix.control }}
          PROBE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          bun --no-install - <<'BUN'
          import { appendFile, mkdir, readFile } from 'node:fs/promises';
          import { arch, release, type } from 'node:os';
          import { join, resolve } from 'node:path';

          const root = resolve('.');
          const out = resolve('..', 'evidence');
          const expectedSha = '8bf7943eac9b92b815bf67dda1eab48f16f52b4c';
          const control = process.env.PROBE_CONTROL;
          let sealNativeSource;
          let nativeSourceChanged;
          let snapshotNativeProcesses;
          await mkdir(out, { recursive: true });
          const receipt = {
            schemaVersion: 1,
            status: 'running',
            startedAt: new Date().toISOString(),
            finishedAt: null,
            sourceSha: expectedSha,
            workflowSha: process.env.PROBE_WORKFLOW_SHA,
            control,
            host: { platform: process.platform, arch: arch(), release: release(), type: type(), runnerOS: process.env.RUNNER_OS, imageOS: process.env.ImageOS, imageVersion: process.env.ImageVersion, bunVersion: Bun.version, bunRevision: Bun.revision },
            policy: { attempts: 1, dependencyBootstrapTimeoutSeconds: 240, buildTimeoutSeconds: 720, settleMs: 30000, fixedPostCommandObservationMs: 30000, acceptedSurvivorExclusions: [], explicitPostExitProcessKills: false, timeoutCleanup: 'unchanged qualification verified scope' },
            sourceBefore: null,
            sourceAfter: null,
            controls: null,
            environment: null,
            commands: [],
            compilerArtifacts: [],
            runtimeArtifact: null,
            observedTools: [],
            fixedPostCommandObservation: null,
            bootstrap: null,
            errors: [],
          };
          await Bun.write(join(out, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
          try {
            if (process.platform !== 'win32' || process.env.GITHUB_ACTIONS !== 'true' || process.env.RUNNER_OS !== 'Windows') {
              throw new Error('Invalid experiment host; expected a disposable GitHub Actions Windows runner');
            }
            if (!['unchanged', 'devshell-env', 'optional-telemetry-policy'].includes(control)) {
              throw new Error('Invalid control ' + JSON.stringify(control) + '; expected one of the three frozen experiment controls');
            }
            const processApi = await import(join(root, 'scripts/lib/native-bun-qualification-process.ts'));
            const sourceApi = await import(join(root, 'scripts/lib/native-bun-qualification-source.ts'));
            ({ snapshotNativeProcesses } = processApi);
            ({ sealNativeSource, nativeSourceChanged } = sourceApi);
            const { runNativeCommand, scopeNativeProcesses } = processApi;
            const { nativeCompilerArtifacts, sealNativeArtifact } = sourceApi;
            receipt.bootstrap = JSON.parse(await readFile(join(out, 'bootstrap-receipt.json'), 'utf8'));
            receipt.commands.push(...receipt.bootstrap.commands);
            if (receipt.bootstrap.status !== 'prepared') throw new Error('Invalid dependency bootstrap; expected prepared source');
            receipt.sourceBefore = await sealNativeSource(root);
            await Bun.write(join(out, 'source-before.json'), JSON.stringify(receipt.sourceBefore, null, 2) + '\n');
            if (receipt.sourceBefore.head !== expectedSha || receipt.sourceBefore.status) {
              throw new Error('Invalid source seal; expected clean immutable source ' + expectedSha);
            }
            if (receipt.sourceBefore.sha256 !== receipt.bootstrap.sourceBefore.sha256 || receipt.sourceBefore.tree !== receipt.bootstrap.sourceBefore.tree) throw new Error('Source bytes or tree changed across bootstrap processes');
            const before = await snapshotNativeProcesses();
            await Bun.write(join(out, 'processes-before.json'), JSON.stringify(before, null, 2) + '\n');
            const { nativeQualificationEnvironment } = await import(join(root, 'scripts/lib/native-bun-qualification.ts'));
            const shell = Bun.which('pwsh.exe') ?? Bun.which('powershell.exe');
            if (!shell) throw new Error('Missing native PowerShell; expected registry and file-version attestation');
            const policyScript = String.raw`
              $ErrorActionPreference = 'Stop'
              $policyPath = 'HKLM:\Software\Policies\Microsoft\VisualStudio\SQM'
              $before = $null
              if (Test-Path -LiteralPath $policyPath) {
                $beforeKey = Get-Item -LiteralPath $policyPath
                if ($beforeKey.GetValueNames() -contains 'OptIn') {
                  $before = [pscustomobject]@{ value = $beforeKey.GetValue('OptIn'); kind = $beforeKey.GetValueKind('OptIn').ToString() }
                }
              }
              if ($env:PROBE_CONTROL -eq 'optional-telemetry-policy') {
                New-Item -Path $policyPath -Force | Out-Null
                New-ItemProperty -LiteralPath $policyPath -Name 'OptIn' -PropertyType DWord -Value 0 -Force | Out-Null
              }
              $after = $null
              if (Test-Path -LiteralPath $policyPath) {
                $afterKey = Get-Item -LiteralPath $policyPath
                if ($afterKey.GetValueNames() -contains 'OptIn') {
                  $after = [pscustomobject]@{ value = $afterKey.GetValue('OptIn'); kind = $afterKey.GetValueKind('OptIn').ToString() }
                }
              }
              $vswhere = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Microsoft Visual Studio\Installer\vswhere.exe'
              $installations = @(& $vswhere -all -products '*' -format json -utf8 | ConvertFrom-Json)
              if ($LASTEXITCODE -ne 0) { throw "vswhere exited $LASTEXITCODE" }
              $tools = @(foreach ($installation in $installations) {
                $toolsetRoot = Join-Path $installation.installationPath 'VC\Tools\MSVC'
                if (-not (Test-Path -LiteralPath $toolsetRoot)) { continue }
                foreach ($toolset in Get-ChildItem -LiteralPath $toolsetRoot -Directory) {
                  foreach ($name in @('cl.exe', 'link.exe', 'vctip.exe')) {
                    $file = Join-Path $toolset.FullName "bin\Hostx64\x64\$name"
                    if (-not (Test-Path -LiteralPath $file)) { continue }
                    $item = Get-Item -LiteralPath $file
                    [pscustomobject]@{ path = $item.FullName; fileVersion = $item.VersionInfo.FileVersion; productVersion = $item.VersionInfo.ProductVersion; sha256 = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() }
                  }
                }
              })
              [pscustomobject]@{
                control = $env:PROBE_CONTROL
                os64Bit = [Environment]::Is64BitOperatingSystem
                process64Bit = [Environment]::Is64BitProcess
                registryView = if ([Environment]::Is64BitProcess) { 'Registry64' } else { 'Registry32' }
                policyPath = $policyPath
                requested = if ($env:PROBE_CONTROL -eq 'optional-telemetry-policy') { [pscustomobject]@{ value = 0; kind = 'DWord' } } else { $null }
                before = $before
                effective = $after
                inheritedVscmdSkipSendtelemetry = $env:VSCMD_SKIP_SENDTELEMETRY
                installations = $installations
                installedTools = $tools
              } | ConvertTo-Json -Depth 10
            `;
            const attest = Bun.spawn([shell, '-NoLogo', '-NoProfile', '-NonInteractive', '-Command', policyScript], { cwd: root, stdout: 'pipe', stderr: 'pipe', timeout: 30000 });
            const [attestation, attestationError, attestationExit] = await Promise.all([new Response(attest.stdout).text(), new Response(attest.stderr).text(), attest.exited]);
            await Bun.write(join(out, 'control-attestation.stdout.log'), attestation);
            await Bun.write(join(out, 'control-attestation.stderr.log'), attestationError);
            if (attestationExit !== 0) throw new Error('Control attestation exited ' + attestationExit + ': ' + attestationError);
            receipt.controls = JSON.parse(attestation.replace(/^\uFEFF/, ''));
            await Bun.write(join(out, 'control-attestation.json'), JSON.stringify(receipt.controls, null, 2) + '\n');
            if (control === 'optional-telemetry-policy' && (receipt.controls.effective?.value !== 0 || receipt.controls.effective?.kind !== 'DWord' || !receipt.controls.process64Bit)) {
              throw new Error('Invalid policy readback; expected OptIn DWORD 0 in the native 64-bit registry view');
            }
            const env = nativeQualificationEnvironment(process.env);
            if (control === 'devshell-env') env.VSCMD_SKIP_SENDTELEMETRY = '1';
            env.CARGO_TARGET_DIR = join(out, 'targets', 'runtime');
            receipt.environment = Object.fromEntries(['CI', 'CARGO_TARGET_DIR', 'RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'RUSTDOCFLAGS', 'CL', '_CL_', 'LINK', '_LINK_', 'VSCMD_SKIP_SENDTELEMETRY', 'PROCESSOR_ARCHITECTURE', 'PROCESSOR_ARCHITEW6432', 'VSINSTALLDIR', 'VCINSTALLDIR', 'VCToolsVersion', 'VCToolsInstallDir'].map((key) => [key, env[key] ?? null]));
            await Bun.write(join(out, 'effective-environment.json'), JSON.stringify(receipt.environment, null, 2) + '\n');
            for (const [label, command, timeoutSeconds] of [
              ['rustc-version', ['rustc', '-vV'], 180],
              ['build-runtime', ['cargo', 'build', '-p', 'mangostudio-runtime', '--bin', 'mangostudio-runtime', '--locked', '--message-format=json'], 720],
            ]) {
              const result = await runNativeCommand({ label, command, timeoutSeconds, root, out, env, settleMs: 30000, snapshot: async () => {
                const rows = await snapshotNativeProcesses();
                await appendFile(join(out, 'raw-census-' + label + '.jsonl'), JSON.stringify({ at: new Date().toISOString(), processes: rows }) + '\n');
                return rows;
              } });
              receipt.commands.push(result);
              await Bun.write(join(out, 'command-' + label + '.json'), JSON.stringify(result, null, 2) + '\n');
              receipt.errors.push(...result.errors.map((error) => label + ': ' + error));
              if (result.exitCode !== 0 || result.timedOut) receipt.errors.push(label + ': command failed with exit ' + result.exitCode + ', signal ' + result.signal + ', timedOut ' + result.timedOut);
              if (!result.settlement.empty) receipt.errors.push(label + ': terminal census failed with ' + result.settlement.survivors.length + ' survivors and ' + result.settlement.snapshotErrors.length + ' snapshot errors');
              if (label === 'rustc-version' && receipt.errors.length) break;
              if (label !== 'build-runtime') continue;
              if (!result.settlement.rootObserved) receipt.errors.push('build-runtime: command root was not observed');
              if (result.exitCode === 0) {
                receipt.compilerArtifacts = nativeCompilerArtifacts(await readFile(join(out, 'logs/build-runtime.stdout.log'), 'utf8'));
                await Bun.write(join(out, 'build-features.json'), JSON.stringify(receipt.compilerArtifacts, null, 2) + '\n');
                if (receipt.compilerArtifacts.some((artifact) => artifact.packageId.includes('mango-external-agents') && artifact.features.includes('testing'))) receipt.errors.push('build-runtime: unexpected SDK testing feature');
                const runtime = receipt.compilerArtifacts.find((artifact) => artifact.target === 'mangostudio-runtime' && artifact.executable);
                if (!runtime) receipt.errors.push('build-runtime: no runtime executable in compiler receipts');
                else receipt.runtimeArtifact = await sealNativeArtifact(runtime.executable);
              }
              receipt.observedTools = result.settlement.observed.flatMap((row) => {
                const path = /^"([^"\r\n]+\.exe)"/i.exec(row.command)?.[1] ?? /^([^\s]+\.exe)(?:\s|$)/i.exec(row.command)?.[1];
                if (!path || !/\\(?:cl|link|vctip)\.exe$/i.test(path)) return [];
                const installed = receipt.controls.installedTools.find((tool) => tool.path.toLowerCase() === path.toLowerCase());
                return [{ identity: row.identity, parentPid: row.parentPid, command: row.command, path, installedMetadata: installed ?? null }];
              });
              const observationStarted = Date.now();
              let observed = result.settlement.observed;
              let current = result.settlement.survivors;
              const rootIdentity = observed.find((row) => row.parentPid === process.pid && /^"?[^\r\n]*\\cargo\.exe"?\s+build\s/i.test(row.command))?.identity ?? null;
              const rootPid = rootIdentity ? Number(rootIdentity.split(':', 1)[0]) : -1;
              const observationErrors = [];
              const everSurvivors = new Map(current.map((row) => [row.identity, row]));
              do {
                try {
                  const rows = await snapshotNativeProcesses();
                  const scoped = scopeNativeProcesses(rows, { rootPid, rootAlive: false, rootIdentity, observed });
                  observed = scoped.observed;
                  current = scoped.current;
                  for (const row of current) everSurvivors.set(row.identity, row);
                  await appendFile(join(out, 'raw-census-post-command.jsonl'), JSON.stringify({ at: new Date().toISOString(), processes: rows, owned: current }) + '\n');
                } catch (error) {
                  observationErrors.push(String(error));
                }
                const remaining = 30000 - (Date.now() - observationStarted);
                if (remaining <= 0) break;
                await Bun.sleep(Math.min(500, remaining));
              } while (true);
              receipt.fixedPostCommandObservation = { startedAt: new Date(observationStarted).toISOString(), finishedAt: new Date().toISOString(), durationMs: Date.now() - observationStarted, rootIdentity, observed, everSurvivors: [...everSurvivors.values()], survivors: current, snapshotErrors: observationErrors, empty: current.length === 0 && observationErrors.length === 0 };
              if (everSurvivors.size || observationErrors.length) receipt.errors.push('fixed post-command observation: ' + everSurvivors.size + ' owned survivor identities and ' + observationErrors.length + ' snapshot errors');
              await Bun.write(join(out, 'post-command-observation.json'), JSON.stringify(receipt.fixedPostCommandObservation, null, 2) + '\n');
            }
          } catch (error) {
            receipt.errors.push(String(error));
          } finally {
            try {
              if (!sealNativeSource || !nativeSourceChanged || !snapshotNativeProcesses) throw new Error('Qualification standard-library imports unavailable; initial receipt retained');
              receipt.sourceAfter = await sealNativeSource(root);
              await Bun.write(join(out, 'source-after.json'), JSON.stringify(receipt.sourceAfter, null, 2) + '\n');
              if (!receipt.sourceBefore || nativeSourceChanged(receipt.sourceBefore, receipt.sourceAfter) || receipt.sourceAfter.status) receipt.errors.push('Source changed or seal unavailable');
              await Bun.write(join(out, 'processes-after.json'), JSON.stringify(await snapshotNativeProcesses(), null, 2) + '\n');
            } catch (error) {
              receipt.errors.push('Final attestation: ' + String(error));
            }
            receipt.finishedAt = new Date().toISOString();
            receipt.status = receipt.errors.length ? 'setup-failed' : 'qualified';
            await Bun.write(join(out, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
            console.log(JSON.stringify({ control, status: receipt.status, commands: receipt.commands.map((command) => ({ label: command.label, exitCode: command.exitCode, rootObserved: command.settlement.rootObserved, settlementEmpty: command.settlement.empty, survivors: command.settlement.survivors })), errors: receipt.errors }, null, 2));
          }
          process.exitCode = receipt.errors.length ? 1 : 0;
          BUN

      - name: Upload complete receipts after every outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msvc-telemetry-${{ matrix.control }}-${{ github.sha }}
          path: |
            evidence/
            !evidence/targets/
          if-no-files-found: error
          retention-days: 14
