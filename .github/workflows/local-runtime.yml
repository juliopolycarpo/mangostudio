name: Local Runtime

# Builds the Linux mangostudio-runtime the hub launches for Local, once per CI
# run, with the fake_cursor_agent stand-in the external-agent suites drive,
# and hands both to every lane that starts a hub — the test shards and the
# browser smoke — as an artifact. Building it in each of those jobs would pay
# the cargo build nine times for one binary. A debug build: nothing downstream
# measures its speed, and it compiles in a fraction of a release build's time.

on:
  workflow_call:
    outputs:
      artifact:
        description: Name of the artifact holding `mangostudio-runtime`.
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

jobs:
  build:
    name: Build (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: local-runtime-linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/local-runtime

      - name: Upload the Local runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-runtime-linux-x64
          path: |
            ${{ runner.temp }}/local-runtime/mangostudio-runtime
            ${{ runner.temp }}/local-runtime/fake_cursor_agent
          retention-days: 1
          if-no-files-found: error
