name: Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check (tooling + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - id: toolchain
        name: Resolve check cache toolchains
        # An empty version silently poisons the cache key, so fail here rather
        # than inside cache-scoped's validity guard.
        run: |
          set -euo pipefail
          turbo="$(bun run turbo:version | tail -n 1)"
          typescript="$(bunx --bun tsc --version | awk '{print $2}')"
          if [ -z "${turbo}" ] || [ -z "${typescript}" ]; then
            echo "::error::empty toolchain version (turbo='${turbo}', typescript='${typescript}')"
            exit 1
          fi
          {
            echo "turbo=${turbo}"
            echo "typescript=${typescript}"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/cache-scoped
        with:
          family: turbo
          path: .turbo/cache
          validity: check-bun-${{ steps.setup.outputs.bun-version }}-turbo-${{ steps.toolchain.outputs.turbo }}-${{ hashFiles('turbo.jsonc', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-prefix: check-
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Restore TypeScript build info
        uses: ./.github/actions/cache-scoped
        with:
          family: tsbuildinfo
          path: .mango/artifacts/tsbuildinfo/
          validity: typescript-${{ steps.toolchain.outputs.typescript }}-${{ hashFiles('tsconfig*.json', 'apps/**/tsconfig*.json', 'packages/**/tsconfig*.json') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'packages/**/*.ts', 'scripts/**/*.ts') }}
          restore-prefix: typescript-${{ steps.toolchain.outputs.typescript }}-
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Restore workflow lint tools
        uses: ./.github/actions/cache-scoped
        with:
          family: lint-tools
          path: .mango/artifacts/tools/
          validity: ${{ hashFiles('scripts/lib/actions-lint/manifest.ts') }}
          exact-restore: "true"
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Run check
        run: bun run check
