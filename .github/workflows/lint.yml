name: Check

on:
  workflow_call:
    outputs:
      invocation_id:
        description: Caller-generated identity of the canonical Check invocation.
        value: ${{ jobs.check.outputs.invocation_id }}
      producer_attempt:
        description: Attempt that produced the canonical Check evidence.
        value: ${{ jobs.check.outputs.producer_attempt }}

permissions:
  contents: read

jobs:
  check:
    name: Check (tooling + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      invocation_id: ${{ steps.identity.outputs.invocation_id }}
      producer_attempt: ${{ steps.identity.outputs.producer_attempt }}
    env:
      # Bounds the snapshot this job restores and saves back. Each save carries
      # everything restored plus the new outputs, so without a bound the chain
      # of snapshots only grows. At the start of the run Turbo deletes the
      # oldest entries (by mtime, which the cache archive preserves) until the
      # rest fit. The value is the same in every lane; see "CI Cache Policy" in
      # docs/reference/testing.md.
      TURBO_CACHE_MAX_SIZE: 16MB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: $/.github/actions/setup-mango

      - id: toolchain
        name: Resolve check cache toolchains
        # An empty version silently poisons the cache key, so fail here rather
        # than inside cache-scoped's validity guard.
        run: |
          set -euo pipefail
          turbo="$(bun run turbo:version | tail -n 1)"
          if [ -z "${turbo}" ]; then
            echo "::error::empty toolchain version (turbo='${turbo}')"
            exit 1
          fi
          {
            echo "turbo=${turbo}"
          } >> "$GITHUB_OUTPUT"

      # Restore here, save after the check: a combined restore-save would skip
      # its save on an exact hit and lose every output the check then computed.
      - id: turbo-cache
        uses: $/.github/actions/cache-scoped
        with:
          family: turbo
          path: .turbo/cache
          validity: check-bun-${{ steps.setup.outputs.bun-version }}-turbo-${{ steps.toolchain.outputs.turbo }}-${{ hashFiles('turbo.jsonc', 'bun.lock', 'package.json', 'apps/*/package.json', 'apps/*/turbo.json', 'packages/*/package.json', 'packages/*/turbo.json') }}
          restore-prefix: check-
          mode: restore
          rotate: "true"
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      # Only main saves. A pull request restores main's exact entry through
      # the restore key, which is not a primary-key hit, so `restore-save`
      # uploaded a copy of the same tools under every pull request scope.
      - name: Restore workflow lint tools
        uses: $/.github/actions/cache-scoped
        with:
          family: lint-tools
          path: .mango/artifacts/tools/
          validity: ${{ hashFiles('scripts/lib/actions-lint/manifest.ts') }}
          exact-restore: "true"
          mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'restore-save' || 'restore' }}
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - id: identity
        name: Allocate canonical Check invocation
        run: |
          echo "invocation_id=$(bun -e 'console.log(crypto.randomUUID())')" >> "$GITHUB_OUTPUT"
          echo "producer_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Run check
        env:
          CHECK_INVOCATION_ID: ${{ steps.identity.outputs.invocation_id }}
        run: bun run check --all --ci-report --report-file check-evidence.json --report-id "$CHECK_INVOCATION_ID"

      - name: Upload canonical Check evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-check-evidence-${{ steps.identity.outputs.invocation_id }}
          path: check-evidence.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false

      # Saves only when the check wrote cache entries the restored snapshot did
      # not hold, under a key that extends the stable restore prefix.
      - name: Save new Turbo outputs
        if: success()
        uses: $/.github/actions/cache-scoped
        with:
          family: turbo
          path: .turbo/cache
          validity: ${{ steps.turbo-cache.outputs.validity }}
          mode: save
          rotate: "true"
          payload-glob: "*.tar.zst"
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}
