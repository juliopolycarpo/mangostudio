name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check (lint + format + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run check
        run: bun run check
