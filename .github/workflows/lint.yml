name: Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check (tooling + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHE_VERSION: v1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-mango

      - uses: ./.github/actions/cache-turbo
        with:
          scope: check
          cache-version: ${{ env.CACHE_VERSION }}

      - name: Restore TS build info
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .mango/artifacts/tsbuildinfo/
          # Key covers every TS source file so a source change always misses.
          key: ${{ runner.os }}-${{ env.CACHE_VERSION }}-tsbuildinfo-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'apps/*/tsconfig.json', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_VERSION }}-tsbuildinfo-

      - name: Run check
        run: bun run check
