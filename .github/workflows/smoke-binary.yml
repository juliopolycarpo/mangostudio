name: Smoke — Binary

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      channel:
        type: string
        required: true
      target_artifacts:
        description: JSON map of target IDs to immutable artifact names.
        type: string
        required: true
      rebuild:
        description: Transitional manual fallback that rebuilds targets in each matrix job.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild each matrix target instead of consuming CI artifacts.
        type: boolean
        default: true
      target_artifacts:
        description: Internal artifact map; unused when rebuild is enabled.
        type: string
        default: "{}"

permissions:
  contents: read

# ci.yml's caller-level group already supersedes per-PR runs; this group covers
# direct workflow_dispatch runs. Mirrors ci.yml: main is never cancelled.
concurrency:
  group: smoke-binary-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  runtime:
    # Manual rebuild only: the cargo runtimes every leg below stages, built
    # the way distribution builds them (zig-linked at the glibc floor, musl
    # static, static MSVC CRT). A leg's own host build would link the runner's
    # glibc and could not produce the musl runtimes the Alpine legs need.
    name: Runtime
    if: ${{ inputs.rebuild }}
    uses: ./.github/workflows/runtime-build.yml
    with:
      version: ${{ inputs.version || '' }}
      source_sha: ${{ inputs.source_sha || github.sha }}
      artifact_prefix: smoke-rebuild-runtime

  binary:
    name: Binary ${{ matrix.platform }}
    needs: [runtime]
    # Runs when the runtime job succeeded (rebuild) or was skipped (the
    # default, consuming distribution artifacts); never after it failed.
    if: ${{ !cancelled() && (needs.runtime.result == 'success' || (needs.runtime.result == 'skipped' && !inputs.rebuild)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['linux-x64'] }}
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['linux-arm64'] }}
          - platform: darwin-arm64
            runner: macos-latest
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['darwin-arm64'] }}
          - platform: darwin-x64
            runner: macos-15-intel
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['darwin-x64'] }}
          - platform: windows-x64
            runner: windows-latest
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['windows-x64'] }}
          - platform: windows-arm64
            runner: windows-11-arm
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['windows-arm64'] }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install toolchain (manual rebuild)
        if: ${{ inputs.rebuild }}
        uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Download cargo runtime (manual rebuild)
        if: ${{ inputs.rebuild }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-rebuild-runtime-${{ matrix.platform }}
          path: .mango/runtime-prebuilt

      - name: Download prebuilt target
        if: ${{ !inputs.rebuild }}
        uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ matrix.artifact_name }}
          source-sha: ${{ inputs.source_sha }}
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
          target: ${{ matrix.platform }}

      - name: Run binary smoke test
        run: bun --no-install run scripts/test-build.ts
        env:
          # Read by the rebuild's `build:binary`; inert when SKIP_BUILD=1.
          RUNTIME_DIR: .mango/runtime-prebuilt
          PLATFORM: ${{ matrix.platform }}
          API_PORT: "13001"
          DISTRIBUTION_CHANNEL: ${{ inputs.channel }}
          SKIP_BUILD: ${{ inputs.rebuild && '0' || '1' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}

      # Manual runs only: the startup numbers docs/reference/tooling.md records
      # for each hosted runner, taken from the release-shaped runtime this leg
      # just staged. Informational — a slow runner must not fail the smoke.
      - name: Measure runtime startup (manual rebuild)
        if: ${{ inputs.rebuild }}
        continue-on-error: true
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          runtime=".mango/out/${PLATFORM}/mangostudio-runtime"
          [ -f "${runtime}.exe" ] && runtime="${runtime}.exe"
          bun run scripts/bench/runtime-handshake.ts "$runtime" --runs 20
          bun run scripts/bench/runtime-handshake.ts "$runtime" --runs 10 --fresh-copy

  docker:
    name: Docker ${{ matrix.variant }} ${{ matrix.docker_arch }}
    needs: [runtime]
    if: ${{ !cancelled() && (needs.runtime.result == 'success' || (needs.runtime.result == 'skipped' && !inputs.rebuild)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            variant: bookworm
            docker_arch: amd64
            binary_platform: linux-x64
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['linux-x64'] }}
            dockerfile: Dockerfile
          - runner: ubuntu-24.04-arm
            variant: bookworm
            docker_arch: arm64
            binary_platform: linux-arm64
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['linux-arm64'] }}
            dockerfile: Dockerfile
          - runner: ubuntu-latest
            variant: alpine
            docker_arch: amd64
            binary_platform: linux-x64-musl
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['linux-x64-musl'] }}
            dockerfile: Dockerfile.alpine
          - runner: ubuntu-24.04-arm
            variant: alpine
            docker_arch: arm64
            binary_platform: linux-arm64-musl
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['linux-arm64-musl'] }}
            dockerfile: Dockerfile.alpine

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install toolchain (manual rebuild)
        if: ${{ inputs.rebuild }}
        uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Download cargo runtime (manual rebuild)
        if: ${{ inputs.rebuild }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-rebuild-runtime-${{ matrix.binary_platform }}
          path: .mango/runtime-prebuilt

      - name: Download prebuilt Docker target
        if: ${{ !inputs.rebuild }}
        uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ matrix.artifact_name }}
          source-sha: ${{ inputs.source_sha }}
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
          target: ${{ matrix.binary_platform }}

      - name: Build Docker binary (manual fallback)
        if: ${{ inputs.rebuild }}
        env:
          BINARY_PLATFORM: ${{ matrix.binary_platform }}
        run: bun run build:binary --platform "$BINARY_PLATFORM" --runtime-dir .mango/runtime-prebuilt

      - name: Stage Docker context
        env:
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          VARIANT: ${{ matrix.variant }}
        run: bun --no-install ./scripts/release/stage-docker-ctx.ts --arch "$DOCKER_ARCH" --variant "$VARIANT"

      - name: Build Docker image
        # The Dockerfiles use `COPY --chmod`, a BuildKit-only directive. Force
        # BuildKit instead of relying on the runner's default builder.
        env:
          DOCKER_BUILDKIT: "1"
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          VARIANT: ${{ matrix.variant }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          docker build \
            --platform "linux/${DOCKER_ARCH}" \
            --build-arg VERSION=smoke \
            -f "$DOCKERFILE" \
            -t "mangostudio:smoke-${VARIANT}-${DOCKER_ARCH}" .

      - name: Run Docker smoke test
        env:
          BETTER_AUTH_SECRET: smoke-test-secret-at-least-32-characters-long
          GEMINI_API_KEY: dummy
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          VARIANT: ${{ matrix.variant }}
        run: scripts/release/smoke-docker-image.sh "mangostudio:smoke-${VARIANT}-${DOCKER_ARCH}" "linux/${DOCKER_ARCH}" 13002
