name: Smoke — Binary

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.platform }} / Docker ${{ matrix.variant }} ${{ matrix.docker_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            variant: bookworm
            docker_arch: amd64
            binary_platform: linux-x64
            dockerfile: Dockerfile
          - platform: linux-x64
            runner: ubuntu-latest
            variant: bookworm
            docker_arch: arm64
            binary_platform: linux-arm64
            dockerfile: Dockerfile
          - platform: linux-x64
            runner: ubuntu-latest
            variant: alpine
            docker_arch: amd64
            binary_platform: linux-x64-musl
            dockerfile: Dockerfile.alpine
          - platform: linux-x64
            runner: ubuntu-latest
            variant: alpine
            docker_arch: arm64
            binary_platform: linux-arm64-musl
            dockerfile: Dockerfile.alpine

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-mango

      - name: Set up QEMU for arm64 emulation
        if: matrix.docker_arch == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Run smoke test
        # Host binary smoke is identical across every matrix leg (PLATFORM is
        # always linux-x64), so run it once instead of once per Docker variant.
        if: matrix.variant == 'bookworm' && matrix.docker_arch == 'amd64'
        run: bun run scripts/test-build.ts
        env:
          PLATFORM: ${{ matrix.platform }}
          API_PORT: "13001"

      - name: Build Docker binary
        run: bun run build:binary --platform ${{ matrix.binary_platform }}

      - name: Stage Docker context
        run: bun ./scripts/release/stage-docker-ctx.ts --arch ${{ matrix.docker_arch }} --variant ${{ matrix.variant }}

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/${{ matrix.docker_arch }} \
            --build-arg VERSION=smoke \
            -f ${{ matrix.dockerfile }} \
            -t mangostudio:smoke-${{ matrix.variant }}-${{ matrix.docker_arch }} .

      - name: Run Docker smoke test
        env:
          BETTER_AUTH_SECRET: smoke-test-secret-at-least-32-characters-long
          GEMINI_API_KEY: dummy
        run: scripts/release/smoke-docker-image.sh mangostudio:smoke-${{ matrix.variant }}-${{ matrix.docker_arch }} linux/${{ matrix.docker_arch }} 13002
