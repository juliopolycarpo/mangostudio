name: Smoke — Binary

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary:
    name: Binary ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: windows-x64
            runner: windows-latest
          - platform: windows-arm64
            runner: windows-11-arm

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-mango

      - name: Run binary smoke test
        run: bun run scripts/test-build.ts
        env:
          PLATFORM: ${{ matrix.platform }}
          API_PORT: "13001"

  docker:
    name: Docker ${{ matrix.variant }} ${{ matrix.docker_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            variant: bookworm
            docker_arch: amd64
            binary_platform: linux-x64
            dockerfile: Dockerfile
          - runner: ubuntu-24.04-arm
            variant: bookworm
            docker_arch: arm64
            binary_platform: linux-arm64
            dockerfile: Dockerfile
          - runner: ubuntu-latest
            variant: alpine
            docker_arch: amd64
            binary_platform: linux-x64-musl
            dockerfile: Dockerfile.alpine
          - runner: ubuntu-24.04-arm
            variant: alpine
            docker_arch: arm64
            binary_platform: linux-arm64-musl
            dockerfile: Dockerfile.alpine

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-mango

      - name: Build Docker binary
        run: bun run build:binary --platform ${{ matrix.binary_platform }}

      - name: Stage Docker context
        run: bun ./scripts/release/stage-docker-ctx.ts --arch ${{ matrix.docker_arch }} --variant ${{ matrix.variant }}

      - name: Build Docker image
        # The Dockerfiles use `COPY --chmod`, a BuildKit-only directive. Force
        # BuildKit instead of relying on the runner's default builder.
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --platform linux/${{ matrix.docker_arch }} \
            --build-arg VERSION=smoke \
            -f ${{ matrix.dockerfile }} \
            -t mangostudio:smoke-${{ matrix.variant }}-${{ matrix.docker_arch }} .

      - name: Run Docker smoke test
        env:
          BETTER_AUTH_SECRET: smoke-test-secret-at-least-32-characters-long
          GEMINI_API_KEY: dummy
        run: scripts/release/smoke-docker-image.sh mangostudio:smoke-${{ matrix.variant }}-${{ matrix.docker_arch }} linux/${{ matrix.docker_arch }} 13002
