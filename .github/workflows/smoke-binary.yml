name: Smoke — Binary

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mango

      - name: Run smoke test
        run: bun run scripts/test-build.ts
        env:
          PLATFORM: ${{ matrix.platform }}
          API_PORT: '13001'
