name: Smoke — Binary

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mango

      - name: Run smoke test
        run: bun run scripts/test-build.ts
        env:
          PLATFORM: ${{ matrix.platform }}
          API_PORT: "13001"

      - name: Build Linux x64 binary for Docker
        run: bun run build:binary --platform linux-x64

      - name: Build Linux musl x64 binary for Docker
        run: bun run build:binary --platform linux-x64-musl

      - name: Stage Docker context
        run: bun ./scripts/release/stage-docker-ctx.ts --arch amd64

      - name: Build Bookworm Docker image
        run: docker build --platform linux/amd64 --build-arg VERSION=smoke -t mangostudio:smoke-bookworm .

      - name: Build Alpine Docker image
        run: docker build --platform linux/amd64 --build-arg VERSION=smoke -f Dockerfile.alpine -t mangostudio:smoke-alpine .

      - name: Run Bookworm Docker smoke test
        env:
          BETTER_AUTH_SECRET: smoke-test-secret-at-least-32-characters-long
        run: |
          docker run --rm -d \
            --name mangostudio-smoke \
            --platform linux/amd64 \
            -p 13002:3001 \
            -e BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
            -e GEMINI_API_KEY=dummy \
            mangostudio:smoke-bookworm
          trap 'docker rm -f mangostudio-smoke >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:13002/api/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            docker logs mangostudio-smoke
            exit 1
          fi

          curl -fsS http://localhost:13002/
          curl -fsS http://localhost:13002/ | grep -q '<html'

      - name: Run Alpine Docker smoke test
        env:
          BETTER_AUTH_SECRET: smoke-test-secret-at-least-32-characters-long
        run: |
          docker run --rm -d \
            --name mangostudio-smoke \
            --platform linux/amd64 \
            -p 13002:3001 \
            -e BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
            -e GEMINI_API_KEY=dummy \
            mangostudio:smoke-alpine
          trap 'docker rm -f mangostudio-smoke >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:13002/api/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            docker logs mangostudio-smoke
            exit 1
          fi

          curl -fsS http://localhost:13002/
          curl -fsS http://localhost:13002/ | grep -q '<html'
