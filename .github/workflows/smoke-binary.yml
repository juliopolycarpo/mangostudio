name: Smoke — Binary

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# ci.yml's caller-level group already supersedes per-PR runs; this group covers
# direct workflow_dispatch runs. Mirrors ci.yml: main is never cancelled.
concurrency:
  group: smoke-binary-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  binary:
    name: Binary ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: windows-x64
            runner: windows-latest
          - platform: windows-arm64
            runner: windows-11-arm

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Run binary smoke test
        run: bun run scripts/test-build.ts
        env:
          PLATFORM: ${{ matrix.platform }}
          API_PORT: "13001"

  docker:
    name: Docker ${{ matrix.variant }} ${{ matrix.docker_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            variant: bookworm
            docker_arch: amd64
            binary_platform: linux-x64
            dockerfile: Dockerfile
          - runner: ubuntu-24.04-arm
            variant: bookworm
            docker_arch: arm64
            binary_platform: linux-arm64
            dockerfile: Dockerfile
          - runner: ubuntu-latest
            variant: alpine
            docker_arch: amd64
            binary_platform: linux-x64-musl
            dockerfile: Dockerfile.alpine
          - runner: ubuntu-24.04-arm
            variant: alpine
            docker_arch: arm64
            binary_platform: linux-arm64-musl
            dockerfile: Dockerfile.alpine

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Build Docker binary
        env:
          BINARY_PLATFORM: ${{ matrix.binary_platform }}
        run: bun run build:binary --platform "$BINARY_PLATFORM"

      - name: Stage Docker context
        env:
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          VARIANT: ${{ matrix.variant }}
        run: bun ./scripts/release/stage-docker-ctx.ts --arch "$DOCKER_ARCH" --variant "$VARIANT"

      - name: Build Docker image
        # The Dockerfiles use `COPY --chmod`, a BuildKit-only directive. Force
        # BuildKit instead of relying on the runner's default builder.
        env:
          DOCKER_BUILDKIT: "1"
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          VARIANT: ${{ matrix.variant }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          docker build \
            --platform "linux/${DOCKER_ARCH}" \
            --build-arg VERSION=smoke \
            -f "$DOCKERFILE" \
            -t "mangostudio:smoke-${VARIANT}-${DOCKER_ARCH}" .

      - name: Run Docker smoke test
        env:
          BETTER_AUTH_SECRET: smoke-test-secret-at-least-32-characters-long
          GEMINI_API_KEY: dummy
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          VARIANT: ${{ matrix.variant }}
        run: scripts/release/smoke-docker-image.sh "mangostudio:smoke-${VARIANT}-${DOCKER_ARCH}" "linux/${DOCKER_ARCH}" 13002
