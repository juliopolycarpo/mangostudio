name: Smoke — Binary

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      channel:
        type: string
        required: true
      target_artifacts:
        description: JSON map of target IDs to immutable artifact names.
        type: string
        required: true
      rebuild:
        description: Transitional manual fallback that rebuilds targets in each matrix job.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild each matrix target instead of consuming CI artifacts.
        type: boolean
        default: true
      target_artifacts:
        description: Internal artifact map; unused when rebuild is enabled.
        type: string
        default: "{}"

permissions:
  contents: read

# ci.yml's caller-level group already supersedes per-PR runs; this group covers
# direct workflow_dispatch runs. Mirrors ci.yml: main is never cancelled.
concurrency:
  group: smoke-binary-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  runtime:
    # Manual rebuild only: the cargo runtimes every leg below stages, built
    # the way distribution builds them (zig-linked at the glibc floor, musl
    # static, static MSVC CRT). A leg's own host build would link the runner's
    # glibc and could not produce the musl runtimes the Alpine legs need.
    name: Runtime
    if: ${{ inputs.rebuild }}
    uses: ./.github/workflows/runtime-build.yml
    with:
      version: ${{ inputs.version || '' }}
      source_sha: ${{ inputs.source_sha || github.sha }}
      artifact_prefix: smoke-rebuild-runtime
      cache: true

  binary:
    name: Binary ${{ matrix.platform }}
    needs: [runtime]
    # Runs when the runtime job succeeded (rebuild) or was skipped (the
    # default, consuming distribution artifacts); never after it failed.
    if: ${{ !cancelled() && (needs.runtime.result == 'success' || (needs.runtime.result == 'skipped' && !inputs.rebuild)) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            docker_arch: amd64
            musl_platform: linux-x64-musl
            musl_artifact_name: ${{ fromJSON(inputs.target_artifacts)['linux-x64-musl'] }}
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['linux-x64'] }}
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            docker_arch: arm64
            musl_platform: linux-arm64-musl
            musl_artifact_name: ${{ fromJSON(inputs.target_artifacts)['linux-arm64-musl'] }}
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['linux-arm64'] }}
          - platform: darwin-arm64
            runner: macos-latest
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['darwin-arm64'] }}
          - platform: darwin-x64
            runner: macos-15-intel
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['darwin-x64'] }}
          - platform: windows-x64
            runner: windows-latest
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['windows-x64'] }}
          - platform: windows-arm64
            runner: windows-11-arm
            artifact_name: ${{ fromJSON(inputs.target_artifacts)['windows-arm64'] }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install toolchain (manual rebuild)
        if: ${{ inputs.rebuild }}
        uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Download cargo runtime (manual rebuild)
        if: ${{ inputs.rebuild }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-rebuild-runtime-${{ matrix.platform }}
          path: .mango/runtime-prebuilt

      - name: Download prebuilt target
        if: ${{ !inputs.rebuild }}
        uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ matrix.artifact_name }}
          source-sha: ${{ inputs.source_sha }}
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
          target: ${{ matrix.platform }}

      # Linux also proves both Docker variants on its native runner below.
      # The step deadline fails a hung smoke before the job deadline cancels
      # the job, which would skip the Docker assertions and teardown checks.
      - name: Run binary smoke test
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: bun --no-install run scripts/test-build.ts
        env:
          # Read by the rebuild's `build:binary`; inert when SKIP_BUILD=1.
          RUNTIME_DIR: .mango/runtime-prebuilt
          PLATFORM: ${{ matrix.platform }}
          API_PORT: "13001"
          DISTRIBUTION_CHANNEL: ${{ inputs.channel }}
          SKIP_BUILD: ${{ inputs.rebuild && '0' || '1' }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}

      - name: Assert native binary teardown
        if: ${{ !cancelled() && matrix.docker_arch }}
        run: |
          set -euo pipefail
          if [ -n "$(ss -H -ltn '( sport = :13001 )')" ]; then
            echo "::error::binary smoke left port 13001 listening"
            exit 1
          fi

      - name: Run Bookworm Docker smoke test
        if: ${{ !cancelled() && matrix.docker_arch }}
        timeout-minutes: 10
        env:
          REBUILD: ${{ inputs.rebuild }}
          BINARY_PLATFORM: ${{ matrix.platform }}
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          VARIANT: bookworm
          DOCKERFILE: Dockerfile
          DOCKER_BUILDKIT: "1"
          BETTER_AUTH_SECRET: smoke-test-secret-at-least-32-characters-long
          GEMINI_API_KEY: dummy
        run: |
          set -euo pipefail
          listeners="$(ss -H -ltn '( sport = :13001 or sport = :13002 )')"
          if [ -n "$listeners" ]; then
            echo "::error::expected smoke ports 13001 and 13002 released; listeners [$listeners]"
            exit 1
          fi
          if [ "$REBUILD" = "true" ]; then
            bun run build:binary --platform "$BINARY_PLATFORM" --runtime-dir .mango/runtime-prebuilt
          fi
          bun --no-install ./scripts/release/stage-docker-ctx.ts --arch "$DOCKER_ARCH" --variant "$VARIANT"
          docker build \
            --platform "linux/${DOCKER_ARCH}" \
            --build-arg VERSION=smoke \
            -f "$DOCKERFILE" \
            -t "mangostudio:smoke-${VARIANT}-${DOCKER_ARCH}" .
          scripts/release/smoke-docker-image.sh "mangostudio:smoke-${VARIANT}-${DOCKER_ARCH}" "linux/${DOCKER_ARCH}" 13002

      - name: Assert Bookworm Docker teardown
        if: ${{ !cancelled() && matrix.docker_arch }}
        env:
          DOCKER_ARCH: ${{ matrix.docker_arch }}
        run: |
          set -euo pipefail
          leftover=""
          listeners=""
          for _ in $(seq 1 20); do
            leftover="$(docker ps -a --format '{{.Names}}' --filter "name=mangostudio-smoke-linux-${DOCKER_ARCH}-13002")"
            listeners="$(ss -H -ltn '( sport = :13001 or sport = :13002 )')"
            if [ -z "$leftover$listeners" ]; then
              break
            fi
            sleep 1
          done
          if [ -n "$leftover$listeners" ]; then
            echo "::error::smoke teardown incomplete: containers [$leftover], listeners [$listeners]"
            exit 1
          fi

      - name: Download musl cargo runtime (manual rebuild)
        if: ${{ !cancelled() && matrix.docker_arch && inputs.rebuild }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-rebuild-runtime-${{ matrix.musl_platform }}
          path: .mango/runtime-prebuilt

      - name: Clear previous distribution download
        if: ${{ !cancelled() && matrix.docker_arch && !inputs.rebuild }}
        run: rm -rf "$RUNNER_TEMP/mango-distribution"

      - name: Download prebuilt musl Docker target
        if: ${{ !cancelled() && matrix.docker_arch && !inputs.rebuild }}
        uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ matrix.musl_artifact_name }}
          source-sha: ${{ inputs.source_sha }}
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
          target: ${{ matrix.musl_platform }}

      - name: Run Alpine Docker smoke test
        if: ${{ !cancelled() && matrix.docker_arch }}
        timeout-minutes: 10
        env:
          REBUILD: ${{ inputs.rebuild }}
          BINARY_PLATFORM: ${{ matrix.musl_platform }}
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          VARIANT: alpine
          DOCKERFILE: Dockerfile.alpine
          DOCKER_BUILDKIT: "1"
          BETTER_AUTH_SECRET: smoke-test-secret-at-least-32-characters-long
          GEMINI_API_KEY: dummy
        run: |
          set -euo pipefail
          listeners="$(ss -H -ltn '( sport = :13001 or sport = :13002 )')"
          if [ -n "$listeners" ]; then
            echo "::error::expected smoke ports 13001 and 13002 released; listeners [$listeners]"
            exit 1
          fi
          if [ "$REBUILD" = "true" ]; then
            bun run build:binary --platform "$BINARY_PLATFORM" --runtime-dir .mango/runtime-prebuilt
          fi
          bun --no-install ./scripts/release/stage-docker-ctx.ts --arch "$DOCKER_ARCH" --variant "$VARIANT"
          docker build \
            --platform "linux/${DOCKER_ARCH}" \
            --build-arg VERSION=smoke \
            -f "$DOCKERFILE" \
            -t "mangostudio:smoke-${VARIANT}-${DOCKER_ARCH}" .
          scripts/release/smoke-docker-image.sh "mangostudio:smoke-${VARIANT}-${DOCKER_ARCH}" "linux/${DOCKER_ARCH}" 13002

      - name: Assert Alpine Docker teardown
        if: ${{ !cancelled() && matrix.docker_arch }}
        env:
          DOCKER_ARCH: ${{ matrix.docker_arch }}
        run: |
          set -euo pipefail
          leftover=""
          listeners=""
          for _ in $(seq 1 20); do
            leftover="$(docker ps -a --format '{{.Names}}' --filter "name=mangostudio-smoke-linux-${DOCKER_ARCH}-13002")"
            listeners="$(ss -H -ltn '( sport = :13001 or sport = :13002 )')"
            if [ -z "$leftover$listeners" ]; then
              break
            fi
            sleep 1
          done
          if [ -n "$leftover$listeners" ]; then
            echo "::error::smoke teardown incomplete: containers [$leftover], listeners [$listeners]"
            exit 1
          fi
