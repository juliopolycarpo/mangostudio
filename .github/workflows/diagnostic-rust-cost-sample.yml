name: Rust cost sample recurrence diagnostic

on:
  push:
    branches: [diagnostic/rust-cost-sample-recurrence]

permissions:
  contents: read

concurrency:
  group: rust-cost-sample-recurrence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    name: Repeat the Rust cost fixture on hosted Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Run ordinary and constrained samples
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_dir="$RUNNER_TEMP/rust-cost-sample"
          mkdir -p "$diagnostic_dir"
          {
            git rev-parse HEAD
            bun --revision
            uname -a
            awk '/Cpus_allowed_list/ {print}' /proc/self/status
          } > "$diagnostic_dir/source.txt"
          cat "$diagnostic_dir/source.txt"

          available=$(awk '/Cpus_allowed_list/ {print $2}' /proc/self/status)
          first_cpu=${available%%[-,]*}
          export diagnostic_dir first_cpu
          cat > "$diagnostic_dir/sample-one.sh" <<'SAMPLE'
            set -u
            test_file=scripts/tests/rust-cost-driver-cancellation.unit.test.ts
            log="$diagnostic_dir/attempt-$1.log"
            status=0
            if test "$1" -le 24; then
              bun test "$test_file" --test-name-pattern "post-build input validation rejects" > "$log" 2>&1 || status=$?
            else
              taskset -c "$first_cpu" bun test "$test_file" --test-name-pattern "post-build input validation rejects" > "$log" 2>&1 || status=$?
            fi
            printf "%s %s\n" "$1" "$status"
            if test "$status" != 0; then
              cat "$log" >&2
            fi
          SAMPLE
          seq 1 48 | xargs -P 8 -I '{}' bash "$diagnostic_dir/sample-one.sh" '{}' | tee "$diagnostic_dir/status.tsv"
          awk '$2 != 0 { failed++ } END { print NR " attempts, " (failed+0) " failed"; exit !(NR==48 && failed==0) }' "$diagnostic_dir/status.tsv"

      - name: Upload sample logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-cost-sample-diagnostic
          path: ${{ runner.temp }}/rust-cost-sample/
          if-no-files-found: error
          retention-days: 3
