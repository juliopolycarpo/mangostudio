name: Runtime Probe

# Runs the version probe of one native host against the runtimes that
# `runtime-build.yml` uploaded for it. The runtime producers cross-link some
# targets; this executes `--version` on a matching host and binds the result to
# the same runtime bytes. A caller needs only the runtime call that builds this
# host's targets, so the probe starts when those legs finish instead of after
# the slowest leg of the whole set. One call per host: both Linux ARM64 targets
# run on one ARM64 runner, so one call probes the gnu and the musl runtime.

on:
  workflow_call:
    inputs:
      host:
        description: >-
          Native host id. A prefix of exactly the platforms probed: `linux-arm64*`
          selects the gnu and musl runtimes, the other hosts one each.
        type: string
        required: true
      platforms:
        description: Space-separated release platform ids probed on this host.
        type: string
        required: true
      runner:
        description: Runner label of the native host.
        type: string
        required: true
      version:
        description: Release version stamped into every runtime binary.
        type: string
        required: true
      source_sha:
        description: Exact source commit the runtimes were built from.
        type: string
        required: true
      profile:
        description: Runtime artifact profile recorded in the receipts.
        type: string
        required: true

permissions:
  contents: read

jobs:
  probe:
    name: Probe
    runs-on: ${{ inputs.runner }}
    # Bun setup can wait four minutes; the checkout, download and probe follow it.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/distribution-source # zizmor: ignore[self-repository] load the action from the selected source checkout
        timeout-minutes: 1
      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] load the action from the selected source checkout
      - name: Download the matching Rust runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-${{ inputs.source_sha }}-${{ inputs.host }}*
          merge-multiple: true
          path: .mango/runtime-prebuilt
      - name: Verify each runtime version on the target host
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          RUNTIME_PROFILE: ${{ inputs.profile }}
        # Every platform is probed even after one fails, so a single run names
        # each broken runtime.
        run: |
          set -uo pipefail
          failed=0
          for platform in $PLATFORMS; do
            PLATFORM="$platform" bun --no-install ./scripts/release/verify-native-runtime.ts || failed=1
          done
          exit "$failed"
      - name: Upload the native runtime version receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The distribution build downloads `runtime-version-<sha>-*`.
          name: runtime-version-${{ inputs.source_sha }}-${{ inputs.host }}
          # One `<platform>.json` per probed platform at the artifact root.
          path: .mango/runtime-versions/*.json
          include-hidden-files: true
          retention-days: 1
          # A retried probe may already have uploaded this source and host receipts.
          overwrite: true
          if-no-files-found: error
