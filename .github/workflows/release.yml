name: Release

# Cut a release: cross-compile standalone binaries for every platform, assemble
# the npm distribution, publish a GitHub Release with the binaries + git-cliff
# notes, publish the GHCR image, publish the npm packages, update the Homebrew tap
# formula and the Scoop bucket manifest, publish the crates.io launcher crate,
# and update CHANGELOG.md on main.
#
# Trigger by pushing a semver tag (git tag -s v0.1.0 && git push origin v0.1.0)
# or via workflow_dispatch with an explicit version.
#
# Prerequisites: an NPM_TOKEN repo secret with publish rights to @mangostudio/*,
# a single DIST_REPOS_TOKEN fine-grained PAT with contents read/write on both
# dist repos (juliopolycarpo/homebrew-tap and juliopolycarpo/scoop-bucket), and
# a CARGO_REGISTRY_TOKEN crates.io API token with publish-new + publish-update
# scope for the mangostudio crate. GHCR uses the workflow GITHUB_TOKEN.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build binaries & npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-mango

      - name: Resolve version
        id: resolve
        # Read the dispatch input via env, never interpolated into the shell, so
        # a crafted version string cannot inject commands.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version}"

      - name: Verify versions are in lockstep
        # Fail before producing artifacts if the root and workspace package.json
        # versions disagree, or if they do not match the tag being released.
        # Pass the version via env (not shell interpolation) so a crafted tag
        # cannot inject commands, matching the resolve step above.
        env:
          EXPECTED_VERSION: ${{ steps.resolve.outputs.version }}
        run: bun run check:versions --expect "$EXPECTED_VERSION"

      - name: Build standalone binaries (all platforms)
        run: VERSION="${{ steps.resolve.outputs.version }}" bun run build --binary

      - name: Assemble npm distribution
        run: VERSION="${{ steps.resolve.outputs.version }}" bun ./scripts/release/pack-npm.ts

      - name: Archive release assets
        run: VERSION="${{ steps.resolve.outputs.version }}" bun ./scripts/release/archive-assets.ts

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: npm-dist
          path: dist-npm/
          retention-days: 7

  verify-build:
    name: Verify built Linux binary
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Run Linux x64 binary smoke test
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          archive="release-assets/mangostudio-${VERSION}-linux-x64.tar.gz"
          mkdir -p verify-assets/extract
          tar -xzf "$archive" -C verify-assets/extract
          binary_path="verify-assets/extract/mangostudio"
          chmod +x "$binary_path" 2>/dev/null || true
          scripts/release/smoke-binary.sh "$binary_path" "$VERSION" 13003

  github-release:
    name: Publish GitHub Release
    needs: [build, verify-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-mango

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Generate release notes
        run: bunx git-cliff --tag "v${{ needs.build.outputs.version }}" --latest --strip all > RELEASE_NOTES.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          tag="v${VERSION}"
          update_release() {
            retry_command 3 30 gh release edit "$tag" --title "$tag" --notes-file RELEASE_NOTES.md
            retry_command 3 30 gh release upload "$tag" release-assets/* --clobber
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            update_release
          else
            for attempt in 1 2 3; do
              if gh release create "$tag" release-assets/* --title "$tag" --notes-file RELEASE_NOTES.md; then
                exit 0
              fi
              if gh release view "$tag" >/dev/null 2>&1; then
                update_release
                exit 0
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep 30
            done
          fi

  docker:
    # Publishes container images from the Linux binaries already produced by
    # the build job. Nothing depends on this job, so a registry failure never
    # blocks the GitHub Release, npm, Homebrew, Scoop, or crates.io channels.
    name: Publish Docker images
    needs: [build, verify-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mango

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Stage Docker build context
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: bun ./scripts/release/stage-docker-ctx.ts --release-assets release-assets

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish default Bookworm image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.build.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}-bookworm
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:bookworm

      - name: Build and publish Alpine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.alpine
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.build.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}-alpine
            ghcr.io/${{ github.repository }}:alpine

  npm-publish:
    name: Publish npm packages
    needs: [build, verify-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mango

      - uses: actions/download-artifact@v8
        with:
          name: npm-dist
          path: dist-npm

      - name: Restore executable bit on platform binaries
        # actions/upload-artifact zips files and drops Unix mode bits, so the
        # downloaded binaries arrive non-executable. npm only force-sets +x on
        # bin entries (the wrapper's mangostudio.js), not on these plain files,
        # so without this the published binary fails to spawn (EACCES) on
        # macOS/Linux. The .exe platforms need no +x.
        run: find dist-npm -type f -name mangostudio -exec chmod +x {} +

      - name: Validate npm distribution
        run: bun ./scripts/release/pack-npm.ts --validate dist-npm

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          bun ./scripts/release/publish-npm.ts dist-npm

  homebrew:
    # Renders Formula/mangostudio.rb from the released SHA256SUMS and pushes it
    # to the shared tap. Nothing depends on this job, so a tap failure never
    # blocks the GitHub Release or npm publication.
    name: Update Homebrew tap
    needs: [build, verify-build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mango

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Render formula and push to juliopolycarpo/homebrew-tap
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_REPOS_TOKEN: ${{ secrets.DIST_REPOS_TOKEN }}
        run: |
          bun ./scripts/release/update-homebrew.ts \
            --version "$VERSION" \
            --sums release-assets/SHA256SUMS \
            --out tap/Formula/mangostudio.rb
          bun ./scripts/release/push-dist-repo.ts \
            --repo juliopolycarpo/homebrew-tap \
            --token-env DIST_REPOS_TOKEN \
            --message "mangostudio ${VERSION}" \
            --file tap/Formula/mangostudio.rb:Formula/mangostudio.rb

  scoop:
    # Renders bucket/mangostudio.json from the released SHA256SUMS and pushes it
    # to the shared Scoop bucket. Nothing depends on this job, so a bucket
    # failure never blocks the GitHub Release or npm publication.
    name: Update Scoop bucket
    needs: [build, verify-build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mango

      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Render manifest and push to juliopolycarpo/scoop-bucket
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_REPOS_TOKEN: ${{ secrets.DIST_REPOS_TOKEN }}
        run: |
          bun ./scripts/release/update-scoop.ts \
            --version "$VERSION" \
            --sums release-assets/SHA256SUMS \
            --out bucket/mangostudio.json
          bun ./scripts/release/push-dist-repo.ts \
            --repo juliopolycarpo/scoop-bucket \
            --token-env DIST_REPOS_TOKEN \
            --message "mangostudio ${VERSION}" \
            --file bucket/mangostudio.json:bucket/mangostudio.json

  cargo-publish:
    # Publishes the thin launcher crate (packages/cargo-shim) so `cargo
    # install mangostudio` resolves this release. Nothing depends on this job,
    # so a crates.io failure never blocks the GitHub Release, npm, or Homebrew
    # channels. Already-published versions are skipped, and an upload that
    # lands despite a reported error is detected between retries, so re-runs
    # converge.
    name: Publish to crates.io
    needs: [build, verify-build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish launcher crate (idempotent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          published() {
            curl -fsSL --retry 3 "https://crates.io/api/v1/crates/mangostudio/${VERSION}" | grep -q '"num"'
          }
          if published; then
            echo "mangostudio ${VERSION} is already on crates.io; skipping."
            exit 0
          fi
          for attempt in 1 2 3; do
            if (cd packages/cargo-shim && cargo publish --locked); then
              exit 0
            fi
            if published; then
              echo "Version became visible after attempt ${attempt}; treating as published."
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 30
          done

  verify-release:
    name: Verify release install (${{ matrix.os }})
    needs: [build, npm-publish, github-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: mangostudio
          - os: macos-latest
            platform: darwin-arm64
            binary: mangostudio
          - os: windows-latest
            platform: windows-x64
            binary: mangostudio.exe
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mango

      - name: Install CLI from npm
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          retry_command 5 60 npm install -g "@mangostudio/cli@${VERSION}"
          actual="$(mangostudio --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "Expected npm CLI version ${VERSION}, got ${actual}"
            exit 1
          fi

      - name: Verify GitHub Release archive
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          if [[ "$PLATFORM" == windows* ]]; then
            archive="mangostudio-${VERSION}-${PLATFORM}.zip"
          else
            archive="mangostudio-${VERSION}-${PLATFORM}.tar.gz"
          fi
          mkdir -p verify-assets/extract
          retry_command 5 60 gh release download "v${VERSION}" --pattern "$archive" --dir verify-assets --clobber
          retry_command 5 60 gh release download "v${VERSION}" --pattern SHA256SUMS --dir verify-assets --clobber
          bun ./scripts/release/verify-checksum.ts verify-assets/SHA256SUMS "verify-assets/${archive}"
          if [[ "$archive" == *.zip ]]; then
            # unzip is not guaranteed on the Windows runner's bash PATH; fall
            # back to PowerShell's Expand-Archive, which always ships with it.
            if command -v unzip >/dev/null 2>&1; then
              unzip -q "verify-assets/${archive}" -d verify-assets/extract
            else
              powershell -NoProfile -Command "Expand-Archive -Path 'verify-assets/${archive}' -DestinationPath 'verify-assets/extract' -Force"
            fi
          else
            tar -xzf "verify-assets/${archive}" -C verify-assets/extract
          fi
          binary_path="verify-assets/extract/${BINARY}"
          chmod +x "$binary_path" 2>/dev/null || true
          actual="$("$binary_path" --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "Expected release archive version ${VERSION}, got ${actual}"
            exit 1
          fi

  update-changelog:
    name: Update CHANGELOG on main
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-mango

      - name: Regenerate CHANGELOG.md
        run: bun run changelog --release "${{ needs.build.outputs.version }}"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date."
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "docs(changelog): update for v${{ needs.build.outputs.version }} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            git pull --rebase origin main
          done
          # If branch protection later blocks bot pushes, replace the direct push
          # with a small github-actions[bot] PR via `gh pr create`.
