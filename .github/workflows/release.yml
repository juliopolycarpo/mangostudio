name: Release

# Cut a release: cross-compile standalone binaries for every platform, assemble
# the npm distribution, publish a GitHub Release with the binaries + git-cliff
# notes, publish the GHCR image, publish the npm packages, update the Homebrew tap
# formula and the Scoop bucket manifest, and publish the crates.io launcher crate.
#
# Trigger by pushing a semver tag (git tag -s v0.1.0 && git push origin v0.1.0)
# or via workflow_dispatch with an explicit version. A dispatch must target a
# v*.*.* tag ref (gh workflow run release.yml --ref v0.2.0), never a branch:
# the publish jobs run in the `release` environment, whose deployment rule only
# admits those tags, so a branch dispatch is rejected before they start. The
# tagged commit must already carry the release's CHANGELOG.md section (staged
# by `bun run release:prepare`); the preparation job's lockstep check gates on
# it. The same job also requires the tagged commit to be an ancestor of
# origin/main with a successful CI / Gate check run (API name "Gate"). Tag
# pushes cannot skip that provenance gate; workflow_dispatch may set
# allow_unverified_source=true as a recorded break-glass bypass only.
#
# Prerequisites: channel secrets live on the `release` GitHub Environment and
# are validated in the jobs that need them —
# NPM_TOKEN for npm-publish, DIST_REPOS_TOKEN for homebrew/scoop. crates.io
# uses Trusted Publishing via OIDC by default; CARGO_REGISTRY_TOKEN is only
# accepted when workflow_dispatch sets allow_legacy_cargo_token=true. GHCR uses
# the workflow GITHUB_TOKEN.

on:
  push:
    tags:
      # Stable + real prerelease tags (v0.1.0, v0.2.0-rc.1). Keep canary-like
      # tags excluded so legacy or manual v<version>-canary.<sha> tags never fire
      # a full release.
      - "v*.*.*"
      - "!v*-canary*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without the leading v (e.g. 0.1.0)"
        required: true
      allow_unverified_source:
        description: "Release a commit that is not a green ancestor of main (break-glass)"
        type: boolean
        default: false
      allow_legacy_cargo_token:
        description: "Allow CARGO_REGISTRY_TOKEN when crates.io OIDC mint fails (migration only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read # read CI / Gate check runs for the tagged commit
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Resolve version
        id: resolve
        # Read the dispatch input via env, never interpolated into the shell, so
        # a crafted version string cannot inject commands.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version}"

      - name: Verify versions are in lockstep
        # Fail before producing artifacts if the root and workspace package.json
        # versions disagree, if they do not match the tag being released, or if
        # CHANGELOG.md lacks this release's section (the changelog lands on main
        # in the release-prep commit, before the tag — bun run release:prepare).
        # Pass the version via env (not shell interpolation) so a crafted tag
        # cannot inject commands, matching the resolve step above.
        env:
          EXPECTED_VERSION: ${{ steps.resolve.outputs.version }}
        run: bun run check:versions --expect "$EXPECTED_VERSION"

      - id: source
        name: Resolve release source SHA
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the tag is a green commit on main
        env:
          ALLOW_UNVERIFIED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unverified_source || 'false' }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$ALLOW_UNVERIFIED" = "true" ]; then
            echo "::warning::Source verification bypassed via allow_unverified_source."
            exit 0
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "Refusing to release ${SOURCE_SHA}: it is not an ancestor of origin/main." >&2
            exit 1
          fi

          # API check-run name is "Gate"; GitHub UI / docs label it "CI / Gate".
          gate="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "Gate")] | first | .conclusion // "missing"')"
          if [ "$gate" != "success" ]; then
            echo "Refusing to release ${SOURCE_SHA}: CI / Gate is '${gate}', not 'success'." >&2
            exit 1
          fi
          echo "Source verified: ${SOURCE_SHA} is on main and CI / Gate passed."

  build:
    name: Build immutable release distribution
    needs: prepare
    permissions:
      contents: read
      id-token: write # mint provenance for the stable release distribution
      attestations: write # persist provenance for stable release bundles
    uses: ./.github/workflows/distribution-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      channel: release
      retention_days: 30

  verify-build:
    name: Verify built Linux binary
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ needs.build.outputs.packaged_artifact }}
          source-sha: ${{ needs.build.outputs.source_sha }}
          version: ${{ needs.build.outputs.version }}
          channel: release

      - name: Run Linux x64 binary smoke test
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          archive="release-assets/mangostudio-${VERSION}-linux-x64.tar.gz"
          mkdir -p verify-assets/extract
          tar -xzf "$archive" -C verify-assets/extract
          binary_path="verify-assets/extract/mangostudio"
          chmod +x "$binary_path" 2>/dev/null || true
          scripts/release/smoke-binary.sh "$binary_path" "$VERSION" 13003

  github-release:
    name: Publish GitHub Release
    needs: [build, verify-build]
    runs-on: ubuntu-latest
    # Publish credentials live only in this environment, restricted to v*.*.*
    # tags. No required reviewer, so a tag push still releases unattended.
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write # create the tagged GitHub Release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ needs.build.outputs.packaged_artifact }}
          source-sha: ${{ needs.build.outputs.source_sha }}
          version: ${{ needs.build.outputs.version }}
          channel: release

      - name: Generate release notes
        run: bunx git-cliff --tag "v${{ needs.build.outputs.version }}" --latest --strip all > RELEASE_NOTES.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/create-or-update-release.sh
          tag="v${VERSION}"
          create_or_update_release "$tag" release-assets/* -- \
            --title "$tag" \
            --notes-file RELEASE_NOTES.md

  docker:
    # Publishes container images from the Linux binaries already produced by
    # the build job. Nothing depends on this job, so a registry failure never
    # blocks the GitHub Release, npm, Homebrew, Scoop, or crates.io channels.
    name: Publish Docker images
    needs: [build, verify-build]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read # checkout of Dockerfiles and staging scripts
      packages: write # push release images to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ needs.build.outputs.packaged_artifact }}
          source-sha: ${{ needs.build.outputs.source_sha }}
          version: ${{ needs.build.outputs.version }}
          channel: release

      - name: Stage Docker build context
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: bun ./scripts/release/stage-docker-ctx.ts --release-assets release-assets

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish images (retrying transient registry failures)
        # Scripted buildx (not build-push-action) so retry_command can wrap each
        # multi-arch push; GHCR pushes occasionally fail transiently and a single
        # retry avoids a full re-run. Tag sets are unchanged.
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          source scripts/release/retry.sh
          retry_command 3 30 docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${VERSION}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${VERSION}-bookworm" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:bookworm" \
            --push \
            .
          retry_command 3 30 docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile.alpine \
            --build-arg "VERSION=${VERSION}" \
            --tag "${IMAGE}:${VERSION}-alpine" \
            --tag "${IMAGE}:alpine" \
            --push \
            .

  verify-image:
    name: Verify published Docker image (${{ matrix.variant }}, ${{ matrix.arch }})
    needs: [build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout of the smoke-test scripts
      packages: read # pull the just-published GHCR image for the smoke test
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: bookworm
            arch: amd64
            tag_suffix: ""
          - variant: bookworm
            arch: arm64
            tag_suffix: ""
          - variant: alpine
            arch: amd64
            tag_suffix: "-alpine"
          - variant: alpine
            arch: arm64
            tag_suffix: "-alpine"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU for arm64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Pull and smoke published image
        env:
          BETTER_AUTH_SECRET: smoke-test-secret-at-least-32-characters-long
          GEMINI_API_KEY: dummy
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}${{ matrix.tag_suffix }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker pull --platform "$PLATFORM" "$IMAGE"
          scripts/release/smoke-docker-image.sh "$IMAGE" "$PLATFORM" 13002

  npm-publish:
    name: Publish npm packages
    needs: [build, verify-build]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    outputs:
      auth: ${{ steps.publish.outputs.auth }}
      provenance: ${{ steps.publish.outputs.provenance }}
    permissions:
      contents: read # checkout only; publish goes to npm, not the repo
      id-token: write # npm provenance attestation
    steps:
      - name: Preflight npm publish secret
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "Missing required release secret: NPM_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ needs.build.outputs.packaged_artifact }}
          source-sha: ${{ needs.build.outputs.source_sha }}
          version: ${{ needs.build.outputs.version }}
          channel: release

      - name: Restore executable bit on platform binaries
        # actions/upload-artifact zips files and drops Unix mode bits, so the
        # downloaded binaries arrive non-executable. npm only force-sets +x on
        # bin entries (the wrapper's mangostudio.js), not on these plain files,
        # so without this the published binary fails to spawn (EACCES) on
        # macOS/Linux. The .exe platforms need no +x.
        run: find dist-npm -type f -name mangostudio -exec chmod +x {} +

      - name: Validate npm distribution
        run: bun ./scripts/release/pack-npm.ts --validate dist-npm

      - name: Verify Node for provenance
        run: |
          node_major="$(node -p "process.versions.node.split('.')[0]")"
          node_minor="$(node -p "process.versions.node.split('.')[1]")"
          if [ "$node_major" -lt 22 ] || { [ "$node_major" -eq 22 ] && [ "$node_minor" -lt 14 ]; }; then
            echo "Node $(node --version) is below the 22.14.0 floor required for npm provenance."
            exit 1
          fi
          echo "Node $(node --version); publish uses npx npm@11.5.1"

      - id: publish
        name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          bun ./scripts/release/publish-npm.ts dist-npm --provenance-policy required

  homebrew:
    # Renders Formula/mangostudio.rb from the released SHA256SUMS and pushes it
    # to the shared tap. Only the post-publish verify-homebrew check depends on
    # this job, so a tap failure never blocks the GitHub Release or npm
    # publication.
    name: Update Homebrew tap
    needs: [build, verify-build, github-release]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Preflight Homebrew dist-repos secret
        env:
          DIST_REPOS_TOKEN: ${{ secrets.DIST_REPOS_TOKEN }}
        run: |
          if [ -z "$DIST_REPOS_TOKEN" ]; then
            echo "Missing required release secret: DIST_REPOS_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ needs.build.outputs.packaged_artifact }}
          source-sha: ${{ needs.build.outputs.source_sha }}
          version: ${{ needs.build.outputs.version }}
          channel: release

      - name: Render formula and push to juliopolycarpo/homebrew-tap
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_REPOS_TOKEN: ${{ secrets.DIST_REPOS_TOKEN }}
        run: |
          bun ./scripts/release/update-homebrew.ts \
            --version "$VERSION" \
            --sums release-assets/SHA256SUMS \
            --out tap/Formula/mangostudio.rb
          bun ./scripts/release/push-dist-repo.ts \
            --repo juliopolycarpo/homebrew-tap \
            --token-env DIST_REPOS_TOKEN \
            --message "mangostudio ${VERSION}" \
            --file tap/Formula/mangostudio.rb:Formula/mangostudio.rb

  scoop:
    # Renders bucket/mangostudio.json from the released SHA256SUMS and pushes it
    # to the shared Scoop bucket. Nothing depends on this job, so a bucket
    # failure never blocks the GitHub Release or npm publication.
    name: Update Scoop bucket
    needs: [build, verify-build, github-release]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Preflight Scoop dist-repos secret
        env:
          DIST_REPOS_TOKEN: ${{ secrets.DIST_REPOS_TOKEN }}
        run: |
          if [ -z "$DIST_REPOS_TOKEN" ]; then
            echo "Missing required release secret: DIST_REPOS_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ needs.build.outputs.packaged_artifact }}
          source-sha: ${{ needs.build.outputs.source_sha }}
          version: ${{ needs.build.outputs.version }}
          channel: release

      - name: Render manifest and push to juliopolycarpo/scoop-bucket
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_REPOS_TOKEN: ${{ secrets.DIST_REPOS_TOKEN }}
        run: |
          bun ./scripts/release/update-scoop.ts \
            --version "$VERSION" \
            --sums release-assets/SHA256SUMS \
            --out bucket/mangostudio.json
          bun ./scripts/release/push-dist-repo.ts \
            --repo juliopolycarpo/scoop-bucket \
            --token-env DIST_REPOS_TOKEN \
            --message "mangostudio ${VERSION}" \
            --file bucket/mangostudio.json:bucket/mangostudio.json

  cargo-publish:
    # Publishes the thin launcher crate (packages/cargo-shim) so `cargo
    # install mangostudio` resolves this release. Only the post-publish
    # verify-cargo check depends on this job, so a crates.io failure never
    # blocks the GitHub Release, npm, or Homebrew channels. Already-published
    # versions are skipped before minting credentials. New publishes require
    # Trusted Publishing OIDC unless workflow_dispatch explicitly allows the
    # legacy CARGO_REGISTRY_TOKEN fallback.
    name: Publish to crates.io
    needs: [build, verify-build, github-release]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    outputs:
      auth: ${{ steps.auth-mode.outputs.auth }}
    permissions:
      contents: read # checkout only; publish goes to crates.io, not the repo
      id-token: write # crates.io Trusted Publishing token exchange
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0

      - id: already-published
        name: Check whether the crate version is already on crates.io
        env:
          CRATES_IO_INDEX_URL: https://index.crates.io/ma/ng/mangostudio
          CRATES_IO_USER_AGENT: "mangostudio-release (https://github.com/juliopolycarpo/mangostudio)"
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/crates-published.sh
          if published "$VERSION"; then
            echo "mangostudio ${VERSION} is already on crates.io; skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - id: crates-auth
        name: Mint crates.io Trusted Publishing token
        if: steps.already-published.outputs.published != 'true'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - id: auth-mode
        name: Resolve crates.io auth mode
        if: always() && steps.already-published.outcome == 'success'
        env:
          ALREADY_PUBLISHED: ${{ steps.already-published.outputs.published }}
          CRATES_AUTH_OUTCOME: ${{ steps.crates-auth.outcome }}
          CRATES_IO_TRUSTED_PUBLISHING_TOKEN: ${{ steps.crates-auth.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ALLOW_LEGACY: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_legacy_cargo_token }}
        run: |
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            echo "auth=not-published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CRATES_AUTH_OUTCOME" = "success" ] && [ -n "$CRATES_IO_TRUSTED_PUBLISHING_TOKEN" ]; then
            echo "auth=oidc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ALLOW_LEGACY" = "true" ]; then
            if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
              echo "allow_legacy_cargo_token was set but CARGO_REGISTRY_TOKEN is missing."
              echo "auth=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "Trusted Publishing unavailable; using explicit CARGO_REGISTRY_TOKEN fallback."
            echo "auth=legacy-explicit" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "crates.io Trusted Publishing token mint failed and legacy fallback is disabled."
          echo "auth=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Publish launcher crate (idempotent)
        if: steps.already-published.outputs.published != 'true'
        env:
          AUTH_MODE: ${{ steps.auth-mode.outputs.auth }}
          CRATES_IO_TRUSTED_PUBLISHING_TOKEN: ${{ steps.crates-auth.outputs.token }}
          CARGO_REGISTRY_TOKEN_SECRET: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES_IO_INDEX_URL: https://index.crates.io/ma/ng/mangostudio
          CRATES_IO_USER_AGENT: "mangostudio-release (https://github.com/juliopolycarpo/mangostudio)"
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Stateful retry: scripts/release/retry.sh only repeats one command,
          # while cargo publish can fail after crates.io accepts the upload, so
          # keep the published() visibility probe between attempts.
          source scripts/release/crates-published.sh
          case "$AUTH_MODE" in
            oidc)
              export CARGO_REGISTRY_TOKEN="$CRATES_IO_TRUSTED_PUBLISHING_TOKEN"
              ;;
            legacy-explicit)
              export CARGO_REGISTRY_TOKEN="$CARGO_REGISTRY_TOKEN_SECRET"
              ;;
            *)
              echo "Unexpected crates.io auth mode: ${AUTH_MODE}"
              exit 1
              ;;
          esac
          for attempt in 1 2 3; do
            if (cd packages/cargo-shim && cargo publish --locked); then
              exit 0
            fi
            # Probe in a subshell so a transient or unreachable-index failure
            # inside published() (its hard `exit 1`) is contained here and
            # treated as "not visible yet, keep retrying" instead of aborting
            # the whole step. The pre-publish check above calls published()
            # directly, so an ambiguous index still hard-fails there.
            if (published "$VERSION"); then
              echo "Version became visible after attempt ${attempt}; treating as published."
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 30
          done

  verify-release:
    name: Verify release install (${{ matrix.platform }})
    needs: [build, npm-publish, github-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: mangostudio
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            binary: mangostudio
          - os: macos-latest
            platform: darwin-arm64
            binary: mangostudio
          - os: macos-15-intel
            platform: darwin-x64
            binary: mangostudio
          - os: windows-latest
            platform: windows-x64
            binary: mangostudio.exe
          - os: windows-11-arm
            platform: windows-arm64
            binary: mangostudio.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Install CLI from npm
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          retry_command 5 60 npm install -g "mangostudio@${VERSION}"
          actual="$(mangostudio --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "Expected npm CLI version ${VERSION}, got ${actual}"
            exit 1
          fi

      - name: Verify npm wrapper platform resolution
        # A same-named binary answering --version is not enough: assert the
        # wrapper resolved this runner's platform package at this exact
        # version, so a wrong-arch optional dependency cannot pass silently.
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          expected_package="@mangostudio/cli-${PLATFORM/windows/win32}"
          info="$(MANGOSTUDIO_WRAPPER_INFO=1 mangostudio)"
          printf '%s\n' "$info"
          resolved_package="$(printf '%s\n' "$info" | sed -n 's/^package=//p')"
          resolved_version="$(printf '%s\n' "$info" | sed -n 's/^packageVersion=//p')"
          if [ "$resolved_package" != "$expected_package" ]; then
            echo "Expected wrapper to resolve ${expected_package}, got ${resolved_package}"
            exit 1
          fi
          if [ "$resolved_version" != "$VERSION" ]; then
            echo "Expected platform package version ${VERSION}, got ${resolved_version}"
            exit 1
          fi

      - name: Verify GitHub Release archive
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          if [[ "$PLATFORM" == windows* ]]; then
            archive="mangostudio-${VERSION}-${PLATFORM}.zip"
          else
            archive="mangostudio-${VERSION}-${PLATFORM}.tar.gz"
          fi
          mkdir -p verify-assets/extract
          retry_command 5 60 gh release download "v${VERSION}" --pattern "$archive" --dir verify-assets --clobber
          retry_command 5 60 gh release download "v${VERSION}" --pattern SHA256SUMS --dir verify-assets --clobber
          bun ./scripts/release/verify-checksum.ts verify-assets/SHA256SUMS "verify-assets/${archive}"
          if [[ "$archive" == *.zip ]]; then
            # unzip is not guaranteed on the Windows runner's bash PATH; fall
            # back to PowerShell's Expand-Archive, which always ships with it.
            if command -v unzip >/dev/null 2>&1; then
              unzip -q "verify-assets/${archive}" -d verify-assets/extract
            else
              powershell -NoProfile -Command "Expand-Archive -Path 'verify-assets/${archive}' -DestinationPath 'verify-assets/extract' -Force"
            fi
          else
            tar -xzf "verify-assets/${archive}" -C verify-assets/extract
          fi
          binary_path="verify-assets/extract/${BINARY}"
          chmod +x "$binary_path" 2>/dev/null || true
          actual="$("$binary_path" --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "Expected release archive version ${VERSION}, got ${actual}"
            exit 1
          fi

  verify-cargo:
    name: Verify crates.io install
    needs: [build, cargo-publish, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0

      - name: Install launcher from crates.io
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          retry_command 5 60 cargo install mangostudio --version "$VERSION" --locked --root "$RUNNER_TEMP/cargo-install"

      - name: Run launcher against GitHub Release assets
        shell: bash
        env:
          MANGOSTUDIO_DIST_URL: https://github.com/${{ github.repository }}/releases/download/v${{ needs.build.outputs.version }}
          MANGOSTUDIO_INSTALL_DIR: ${{ runner.temp }}/mango-cargo-dist
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          actual="$("$RUNNER_TEMP/cargo-install/bin/mangostudio" --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "Expected cargo launcher version ${VERSION}, got ${actual}"
            exit 1
          fi

  verify-homebrew:
    name: Verify Homebrew install
    needs: [build, homebrew]
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install formula from tap
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          retry_command 5 60 brew tap juliopolycarpo/tap https://github.com/juliopolycarpo/homebrew-tap
          retry_command 5 60 brew install juliopolycarpo/tap/mangostudio
          actual="$(mangostudio --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "Expected Homebrew CLI version ${VERSION}, got ${actual}"
            exit 1
          fi

  release-summary:
    # Always runs, even when a publish channel fails, and writes a per-channel
    # ✅/❌ table to the run summary naming the exact job to re-run. The fan-out
    # above already isolates failures (a docker failure never blocks npm/crates),
    # so a partial release is recoverable by re-running only the failed job(s).
    name: Release publish summary
    needs:
      - build
      - github-release
      - docker
      - npm-publish
      - homebrew
      - scoop
      - cargo-publish
      - verify-image
      - verify-release
      - verify-cargo
      - verify-homebrew
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write release publish summary
        env:
          TITLE: Release ${{ needs.build.outputs.version }}
          BUILD_RESULT: ${{ needs.build.result }}
          GITHUB_RELEASE_RESULT: ${{ needs.github-release.result }}
          NPM_PUBLISH_RESULT: ${{ needs.npm-publish.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          CARGO_PUBLISH_RESULT: ${{ needs.cargo-publish.result }}
          HOMEBREW_RESULT: ${{ needs.homebrew.result }}
          SCOOP_RESULT: ${{ needs.scoop.result }}
          VERIFY_IMAGE_RESULT: ${{ needs.verify-image.result }}
          VERIFY_RELEASE_RESULT: ${{ needs.verify-release.result }}
          VERIFY_CARGO_RESULT: ${{ needs.verify-cargo.result }}
          VERIFY_HOMEBREW_RESULT: ${{ needs.verify-homebrew.result }}
          NPM_PUBLISH_AUTH: ${{ needs.npm-publish.outputs.auth }}
          NPM_PUBLISH_PROVENANCE: ${{ needs.npm-publish.outputs.provenance }}
          NPM_CHANNEL_NAME: npm-publish
          CARGO_PUBLISH_AUTH: ${{ needs.cargo-publish.outputs.auth }}
        run: |
          bash scripts/release/publish-summary.sh \
            "build=${BUILD_RESULT}" \
            "github-release=${GITHUB_RELEASE_RESULT}" \
            "npm-publish=${NPM_PUBLISH_RESULT}" \
            "docker=${DOCKER_RESULT}" \
            "cargo-publish=${CARGO_PUBLISH_RESULT}" \
            "homebrew=${HOMEBREW_RESULT}" \
            "scoop=${SCOOP_RESULT}" \
            "verify-image=${VERIFY_IMAGE_RESULT}" \
            "verify-release=${VERIFY_RELEASE_RESULT}" \
            "verify-cargo=${VERIFY_CARGO_RESULT}" \
            "verify-homebrew=${VERIFY_HOMEBREW_RESULT}"
