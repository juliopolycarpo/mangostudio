name: Release

# Cut a release: cross-compile standalone binaries for every platform, assemble
# the npm distribution, publish a GitHub Release with the binaries + git-cliff
# notes, publish the GHCR image, publish the npm packages, update the Homebrew tap
# formula and the Scoop bucket manifest, publish the crates.io launcher crate,
# and update CHANGELOG.md on main.
#
# Trigger by pushing a semver tag (git tag -s v0.1.0 && git push origin v0.1.0)
# or via workflow_dispatch with an explicit version.
#
# Prerequisites: an NPM_TOKEN repo secret with publish rights to @mangostudio/*,
# a single DIST_REPOS_TOKEN fine-grained PAT with contents read/write on both
# dist repos (juliopolycarpo/homebrew-tap and juliopolycarpo/scoop-bucket).
# crates.io publishing prefers Trusted Publishing via OIDC and temporarily falls
# back to CARGO_REGISTRY_TOKEN until the trusted publisher is registered and
# proven. GHCR uses the workflow GITHUB_TOKEN.

on:
  push:
    tags:
      # Stable + real prerelease tags (v0.1.0, v0.2.0-rc.1). Keep canary-like
      # tags excluded so legacy or manual v<version>-canary.<sha> tags never fire
      # a full release.
      - "v*.*.*"
      - "!v*-canary*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build binaries & npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-mango

      - name: Resolve version
        id: resolve
        # Read the dispatch input via env, never interpolated into the shell, so
        # a crafted version string cannot inject commands.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version}"

      - name: Verify versions are in lockstep
        # Fail before producing artifacts if the root and workspace package.json
        # versions disagree, or if they do not match the tag being released.
        # Pass the version via env (not shell interpolation) so a crafted tag
        # cannot inject commands, matching the resolve step above.
        env:
          EXPECTED_VERSION: ${{ steps.resolve.outputs.version }}
        run: bun run check:versions --expect "$EXPECTED_VERSION"

      - name: Build standalone binaries (all platforms)
        run: VERSION="${{ steps.resolve.outputs.version }}" bun run build --binary

      - name: Assemble npm distribution
        run: VERSION="${{ steps.resolve.outputs.version }}" bun ./scripts/release/pack-npm.ts

      - name: Archive release assets
        run: VERSION="${{ steps.resolve.outputs.version }}" bun ./scripts/release/archive-assets.ts

      # 30-day retention widens the window for re-running a single failed publish
      # job (e.g. docker) off the original build artifacts before they expire.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-dist
          path: dist-npm/
          retention-days: 30

  verify-build:
    name: Verify built Linux binary
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Run Linux x64 binary smoke test
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          archive="release-assets/mangostudio-${VERSION}-linux-x64.tar.gz"
          mkdir -p verify-assets/extract
          tar -xzf "$archive" -C verify-assets/extract
          binary_path="verify-assets/extract/mangostudio"
          chmod +x "$binary_path" 2>/dev/null || true
          scripts/release/smoke-binary.sh "$binary_path" "$VERSION" 13003

  github-release:
    name: Publish GitHub Release
    needs: [build, verify-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-mango

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Generate release notes
        run: bunx git-cliff --tag "v${{ needs.build.outputs.version }}" --latest --strip all > RELEASE_NOTES.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          tag="v${VERSION}"
          update_release() {
            retry_command 3 30 gh release edit "$tag" --title "$tag" --notes-file RELEASE_NOTES.md
            retry_command 3 30 gh release upload "$tag" release-assets/* --clobber
          }
          if gh release view "$tag" >/dev/null 2>&1; then
            update_release
          else
            # Stateful retry: scripts/release/retry.sh cannot model the
            # post-failure release lookup that recovers from a partially
            # created tag, so keep the idempotency probe between attempts.
            for attempt in 1 2 3; do
              if gh release create "$tag" release-assets/* --title "$tag" --notes-file RELEASE_NOTES.md; then
                exit 0
              fi
              if gh release view "$tag" >/dev/null 2>&1; then
                update_release
                exit 0
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep 30
            done
          fi

  docker:
    # Publishes container images from the Linux binaries already produced by
    # the build job. Nothing depends on this job, so a registry failure never
    # blocks the GitHub Release, npm, Homebrew, Scoop, or crates.io channels.
    name: Publish Docker images
    needs: [build, verify-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-mango

      - id: assets
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Fetch release assets if the build artifact expired
        # Re-running this job alone (e.g. after a transient registry failure) long
        # after the run still works: fall back to the published GitHub Release,
        # which stage-docker-ctx --release-assets can stage from too.
        if: steps.assets.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          mkdir -p release-assets
          retry_command 3 30 gh release download "v${VERSION}" --dir release-assets --clobber

      - name: Stage Docker build context
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: bun ./scripts/release/stage-docker-ctx.ts --release-assets release-assets

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish images (retrying transient registry failures)
        # Scripted buildx (not build-push-action) so retry_command can wrap each
        # multi-arch push; GHCR pushes occasionally fail transiently and a single
        # retry avoids a full re-run. Tag sets are unchanged.
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          source scripts/release/retry.sh
          retry_command 3 30 docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${VERSION}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:${VERSION}-bookworm" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:bookworm" \
            --push \
            .
          retry_command 3 30 docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile.alpine \
            --build-arg "VERSION=${VERSION}" \
            --tag "${IMAGE}:${VERSION}-alpine" \
            --tag "${IMAGE}:alpine" \
            --push \
            .

  verify-image:
    name: Verify published Docker image (${{ matrix.variant }}, ${{ matrix.arch }})
    needs: [build, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: bookworm
            arch: amd64
            tag_suffix: ""
          - variant: bookworm
            arch: arm64
            tag_suffix: ""
          - variant: alpine
            arch: amd64
            tag_suffix: "-alpine"
          - variant: alpine
            arch: arm64
            tag_suffix: "-alpine"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up QEMU for arm64 emulation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and smoke published image
        env:
          BETTER_AUTH_SECRET: smoke-test-secret-at-least-32-characters-long
          GEMINI_API_KEY: dummy
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}${{ matrix.tag_suffix }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker pull --platform "$PLATFORM" "$IMAGE"
          scripts/release/smoke-docker-image.sh "$IMAGE" "$PLATFORM" 13002

  npm-publish:
    name: Publish npm packages
    needs: [build, verify-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-mango

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dist
          path: dist-npm

      - name: Restore executable bit on platform binaries
        # actions/upload-artifact zips files and drops Unix mode bits, so the
        # downloaded binaries arrive non-executable. npm only force-sets +x on
        # bin entries (the wrapper's mangostudio.js), not on these plain files,
        # so without this the published binary fails to spawn (EACCES) on
        # macOS/Linux. The .exe platforms need no +x.
        run: find dist-npm -type f -name mangostudio -exec chmod +x {} +

      - name: Validate npm distribution
        run: bun ./scripts/release/pack-npm.ts --validate dist-npm

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          bun ./scripts/release/publish-npm.ts dist-npm

  homebrew:
    # Renders Formula/mangostudio.rb from the released SHA256SUMS and pushes it
    # to the shared tap. Only the post-publish verify-homebrew check depends on
    # this job, so a tap failure never blocks the GitHub Release or npm
    # publication.
    name: Update Homebrew tap
    needs: [build, verify-build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-mango

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Render formula and push to juliopolycarpo/homebrew-tap
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_REPOS_TOKEN: ${{ secrets.DIST_REPOS_TOKEN }}
        run: |
          bun ./scripts/release/update-homebrew.ts \
            --version "$VERSION" \
            --sums release-assets/SHA256SUMS \
            --out tap/Formula/mangostudio.rb
          bun ./scripts/release/push-dist-repo.ts \
            --repo juliopolycarpo/homebrew-tap \
            --token-env DIST_REPOS_TOKEN \
            --message "mangostudio ${VERSION}" \
            --file tap/Formula/mangostudio.rb:Formula/mangostudio.rb

  scoop:
    # Renders bucket/mangostudio.json from the released SHA256SUMS and pushes it
    # to the shared Scoop bucket. Nothing depends on this job, so a bucket
    # failure never blocks the GitHub Release or npm publication.
    name: Update Scoop bucket
    needs: [build, verify-build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-mango

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Render manifest and push to juliopolycarpo/scoop-bucket
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_REPOS_TOKEN: ${{ secrets.DIST_REPOS_TOKEN }}
        run: |
          bun ./scripts/release/update-scoop.ts \
            --version "$VERSION" \
            --sums release-assets/SHA256SUMS \
            --out bucket/mangostudio.json
          bun ./scripts/release/push-dist-repo.ts \
            --repo juliopolycarpo/scoop-bucket \
            --token-env DIST_REPOS_TOKEN \
            --message "mangostudio ${VERSION}" \
            --file bucket/mangostudio.json:bucket/mangostudio.json

  cargo-publish:
    # Publishes the thin launcher crate (packages/cargo-shim) so `cargo
    # install mangostudio` resolves this release. Only the post-publish
    # verify-cargo check depends on this job, so a crates.io failure never
    # blocks the GitHub Release, npm, or Homebrew channels. Already-published
    # versions are skipped, and an upload that
    # lands despite a reported error is detected between retries, so re-runs
    # converge.
    name: Publish to crates.io
    needs: [build, verify-build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0

      - id: crates-auth
        name: Mint crates.io Trusted Publishing token
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Report crates.io token fallback
        if: steps.crates-auth.outcome != 'success'
        run: echo "Trusted Publishing token unavailable; falling back to CARGO_REGISTRY_TOKEN during migration."

      - name: Publish launcher crate (idempotent)
        env:
          CRATES_IO_TRUSTED_PUBLISHING_TOKEN: ${{ steps.crates-auth.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          published() {
            curl -fsSL --retry 3 "https://crates.io/api/v1/crates/mangostudio/${VERSION}" | grep -q '"num"'
          }
          if published; then
            echo "mangostudio ${VERSION} is already on crates.io; skipping."
            exit 0
          fi
          # A token is only required to actually publish; the idempotency check
          # above already short-circuits already-published versions so re-runs
          # converge even after CARGO_REGISTRY_TOKEN is removed.
          publish_token="${CRATES_IO_TRUSTED_PUBLISHING_TOKEN:-$CARGO_REGISTRY_TOKEN}"
          if [ -z "$publish_token" ]; then
            echo "No crates.io publish token available. Configure Trusted Publishing for .github/workflows/release.yml or restore CARGO_REGISTRY_TOKEN."
            exit 1
          fi
          # Stateful retry: scripts/release/retry.sh only repeats one command,
          # while cargo publish can fail after crates.io accepts the upload, so
          # keep the published() visibility probe between attempts.
          for attempt in 1 2 3; do
            if (cd packages/cargo-shim && CARGO_REGISTRY_TOKEN="$publish_token" cargo publish --locked); then
              exit 0
            fi
            if published; then
              echo "Version became visible after attempt ${attempt}; treating as published."
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 30
          done

  verify-release:
    name: Verify release install (${{ matrix.os }})
    needs: [build, npm-publish, github-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: mangostudio
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            binary: mangostudio
          - os: macos-latest
            platform: darwin-arm64
            binary: mangostudio
          - os: macos-15-intel
            platform: darwin-x64
            binary: mangostudio
          - os: windows-latest
            platform: windows-x64
            binary: mangostudio.exe
          # windows-arm64 remains uncovered; the npm wrapper smoke already
          # exercises the Windows install path on x64.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-mango

      - name: Install CLI from npm
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          retry_command 5 60 npm install -g "@mangostudio/cli@${VERSION}"
          actual="$(mangostudio --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "Expected npm CLI version ${VERSION}, got ${actual}"
            exit 1
          fi

      - name: Verify GitHub Release archive
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          if [[ "$PLATFORM" == windows* ]]; then
            archive="mangostudio-${VERSION}-${PLATFORM}.zip"
          else
            archive="mangostudio-${VERSION}-${PLATFORM}.tar.gz"
          fi
          mkdir -p verify-assets/extract
          retry_command 5 60 gh release download "v${VERSION}" --pattern "$archive" --dir verify-assets --clobber
          retry_command 5 60 gh release download "v${VERSION}" --pattern SHA256SUMS --dir verify-assets --clobber
          bun ./scripts/release/verify-checksum.ts verify-assets/SHA256SUMS "verify-assets/${archive}"
          if [[ "$archive" == *.zip ]]; then
            # unzip is not guaranteed on the Windows runner's bash PATH; fall
            # back to PowerShell's Expand-Archive, which always ships with it.
            if command -v unzip >/dev/null 2>&1; then
              unzip -q "verify-assets/${archive}" -d verify-assets/extract
            else
              powershell -NoProfile -Command "Expand-Archive -Path 'verify-assets/${archive}' -DestinationPath 'verify-assets/extract' -Force"
            fi
          else
            tar -xzf "verify-assets/${archive}" -C verify-assets/extract
          fi
          binary_path="verify-assets/extract/${BINARY}"
          chmod +x "$binary_path" 2>/dev/null || true
          actual="$("$binary_path" --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "Expected release archive version ${VERSION}, got ${actual}"
            exit 1
          fi

  verify-cargo:
    name: Verify crates.io install
    needs: [build, cargo-publish, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0

      - name: Install launcher from crates.io
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          retry_command 5 60 cargo install mangostudio --version "$VERSION" --locked --root "$RUNNER_TEMP/cargo-install"

      - name: Run launcher against GitHub Release assets
        shell: bash
        env:
          MANGOSTUDIO_DIST_URL: https://github.com/${{ github.repository }}/releases/download/v${{ needs.build.outputs.version }}
          MANGOSTUDIO_INSTALL_DIR: ${{ runner.temp }}/mango-cargo-dist
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          actual="$("$RUNNER_TEMP/cargo-install/bin/mangostudio" --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "Expected cargo launcher version ${VERSION}, got ${actual}"
            exit 1
          fi

  verify-homebrew:
    name: Verify Homebrew install
    needs: [build, homebrew]
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install formula from tap
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          source scripts/release/retry.sh
          retry_command 5 60 brew tap juliopolycarpo/tap https://github.com/juliopolycarpo/homebrew-tap
          retry_command 5 60 brew install juliopolycarpo/tap/mangostudio
          actual="$(mangostudio --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "Expected Homebrew CLI version ${VERSION}, got ${actual}"
            exit 1
          fi

  update-changelog:
    name: Update CHANGELOG on main
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: write for the direct push; pull-requests: write for the
      # protected-branch fallback that opens a github-actions[bot] PR.
      contents: write
      pull-requests: write
    # Serialize the changelog landing across concurrent tag releases (the
    # workflow's top-level group is per-ref, so two tags can release at once).
    # Keyed on the workflow, not the ref, so their CHANGELOG.md writes never race;
    # cancel-in-progress: false lets an in-flight update finish before the next.
    concurrency:
      group: update-changelog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-mango

      - name: Regenerate CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: bun run changelog --release "$VERSION"

      # Lands the regenerated changelog on main: direct push on the fast path,
      # falling back to a github-actions[bot] PR (with squash auto-merge where the
      # repo allows it) when branch protection rejects the push. No-ops when the
      # changelog is already current.
      - name: Land CHANGELOG.md on main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bun ./scripts/release/push-changelog.ts --version "$VERSION" --branch main

  release-summary:
    # Always runs, even when a publish channel fails, and writes a per-channel
    # ✅/❌ table to the run summary naming the exact job to re-run. The fan-out
    # above already isolates failures (a docker failure never blocks npm/crates),
    # so a partial release is recoverable by re-running only the failed job(s).
    name: Release publish summary
    needs:
      - build
      - github-release
      - docker
      - npm-publish
      - homebrew
      - scoop
      - cargo-publish
      - verify-image
      - verify-release
      - verify-cargo
      - verify-homebrew
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Write release publish summary
        env:
          TITLE: Release ${{ needs.build.outputs.version }}
        run: |
          bash scripts/release/publish-summary.sh \
            "github-release=${{ needs.github-release.result }}" \
            "npm-publish=${{ needs.npm-publish.result }}" \
            "docker=${{ needs.docker.result }}" \
            "cargo-publish=${{ needs.cargo-publish.result }}" \
            "homebrew=${{ needs.homebrew.result }}" \
            "scoop=${{ needs.scoop.result }}" \
            "verify-image=${{ needs.verify-image.result }}" \
            "verify-release=${{ needs.verify-release.result }}" \
            "verify-cargo=${{ needs.verify-cargo.result }}" \
            "verify-homebrew=${{ needs.verify-homebrew.result }}"
