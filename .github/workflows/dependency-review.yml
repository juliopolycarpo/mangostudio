name: Dependency Review

# Pull-request supply-chain gate. This complements CodeQL: CodeQL looks for code
# vulnerabilities, while dependency review blocks vulnerable packages newly
# introduced through manifest or lockfile changes.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block new moderate-or-worse vulnerabilities without adding a license
          # policy gate in the same change.
          fail-on-severity: moderate
          license-check: false
