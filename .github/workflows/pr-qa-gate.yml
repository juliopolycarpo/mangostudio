name: PR QA Gate

# Owns the automation-managed comments on every PR: a commit summary, a
# changelog preview, and a QA metrics comparison (coverage, lines of code,
# bundle size, dependencies, duplication, tests, repo tooling) between the PR
# base and head. Report-only — never fails the PR.
#
# Comment lifecycle (scripts/qa-gate/publish/managed-comments.mjs):
# - publish-pending posts the commit summary + changelog preview and a
#   temporary "QA Gate — Running" placeholder while metrics collect.
# - every publish recreates the managed comments at the bottom of the PR
#   timeline (create new set first, then delete the previous one), so they
#   always sit below the latest pushed commits instead of going stale
#   mid-thread.
# - both publishes re-check the PR head via the API and skip when a newer
#   commit landed, so a stale run can never report on an outdated HEAD
#   (cancel-in-progress concurrency stops most stale runs even earlier).
# See scripts/qa-gate/{collect,render}.ts for the metrics themselves.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-qa-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DATABASE_PATH: /tmp/mangostudio-qa-gate.sqlite
  CACHE_VERSION: v1

jobs:
  publish-pending:
    name: Publish Pending Comments
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history: the commit summary and git-cliff both walk base..head.
          fetch-depth: 0

      - uses: ./.github/actions/setup-mango

      - name: Render commit summary
        continue-on-error: true
        run: bun ./scripts/qa-gate/render-commits.ts "$BASE_SHA" "$HEAD_SHA" > commits.md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Render changelog preview
        continue-on-error: true
        run: bun run changelog --preview --base "$BASE_SHA" > changelog.md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Publish comments (QA pending)
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const publish = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/qa-gate/publish/managed-comments.mjs`
            );
            const pullRequest = context.payload.pull_request;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await publish.publishManagedComments(
              { github, context, core },
              {
                pullNumber: pullRequest.number,
                expectedHeadSha: pullRequest.head.sha,
                comments: [
                  {
                    marker: publish.COMMITS_MARKER,
                    body: await publish.readCommentBody('commits.md', publish.COMMITS_MARKER),
                  },
                  {
                    marker: publish.CHANGELOG_PREVIEW_MARKER,
                    body: await publish.readCommentBody('changelog.md', publish.CHANGELOG_PREVIEW_MARKER),
                  },
                  {
                    marker: publish.QA_GATE_MARKER,
                    body: publish.renderQaPendingBody({ headSha: pullRequest.head.sha, runUrl }),
                  },
                ],
              }
            );

  metrics-head:
    name: Metrics — Head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-mango

      # The head metrics job runs vitest three times (unit, integration,
      # coverage), so warming the optimizer cache pays back quickly. The qa-head
      # scope keeps head and base from contending on the same key.
      - name: Restore Vite optimizer cache
        uses: ./.github/actions/cache-vite
        with:
          scope: qa-head
          cache-version: ${{ env.CACHE_VERSION }}

      - name: Run database migrations
        run: bun run --filter @mangostudio/api migrate

      - name: Collect test lane counts
        run: |
          set +e
          mkdir -p .mango/artifacts/qa-gate
          for lane in unit integration; do
            db="/tmp/mangostudio-qa-gate-${lane}.sqlite"
            rm -f "$db" "$db-shm" "$db-wal"
            DATABASE_PATH="$db" bun run test "--${lane}" > ".mango/artifacts/qa-gate/test-${lane}.log" 2>&1
            echo "$?" > ".mango/artifacts/qa-gate/test-${lane}.exit-code"
          done
          exit 0

      - name: Collect coverage
        run: bun run test --coverage
        continue-on-error: true

      - name: Collect QA metrics
        run: bun ./scripts/qa-gate/collect.ts > metrics.json

      - uses: actions/upload-artifact@v7
        with:
          name: qa-metrics-head
          path: metrics.json
          retention-days: 7
          # Reruns of this job must be able to replace their own artifact.
          overwrite: true

  metrics-base:
    name: Metrics — Base
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Overlay QA-gate tooling from PR head
        # Base may predate the qa-gate scripts, jscpd devDep, and workspace
        # test/coverage config. Overlay them from the PR head so the same
        # collector runs on both sides without requiring a backport. Keep the
        # base lockfile for dependency delta measurement before overlaying the
        # head dependency graph for installation.
        run: |
          set -euo pipefail
          mkdir -p .mango/artifacts/qa-gate
          cp bun.lock .mango/artifacts/qa-gate/base-bun.lock
          git fetch --depth=1 origin ${{ github.event.pull_request.head.sha }}
          git checkout FETCH_HEAD -- \
            scripts/qa-gate \
            apps/api/bunfig.toml \
            apps/api/package.json \
            apps/frontend/bunfig.toml \
            apps/frontend/package.json \
            apps/frontend/vitest.config.ts \
            apps/shared/bunfig.toml \
            apps/shared/package.json \
            package.json \
            bun.lock \
            .github/actions/setup-mango \
            .github/actions/cache-vite

      - uses: ./.github/actions/setup-mango
        with:
          # The overlay above intentionally keeps base source while pulling head's
          # bun.lock, so the lock can reference workspaces the base tree lacks
          # (e.g. a packages/* package added on the PR). A frozen install would
          # reject that drift; non-frozen lets Bun reconcile against the present
          # manifests. Dependency deltas still measure base via base-bun.lock.
          frozen-lockfile: false

      # Mirror the head job's optimizer cache, scoped to the base side so the
      # two jobs do not race on cache writes for the same key.
      - name: Restore Vite optimizer cache
        uses: ./.github/actions/cache-vite
        with:
          scope: qa-base
          cache-version: ${{ env.CACHE_VERSION }}

      - name: Run database migrations
        run: bun run --filter @mangostudio/api migrate

      - name: Collect test lane counts
        run: |
          set +e
          mkdir -p .mango/artifacts/qa-gate
          for lane in unit integration; do
            db="/tmp/mangostudio-qa-gate-${lane}.sqlite"
            rm -f "$db" "$db-shm" "$db-wal"
            DATABASE_PATH="$db" bun run test "--${lane}" > ".mango/artifacts/qa-gate/test-${lane}.log" 2>&1
            echo "$?" > ".mango/artifacts/qa-gate/test-${lane}.exit-code"
          done
          exit 0

      - name: Collect coverage
        run: bun run test --coverage
        continue-on-error: true

      - name: Collect QA metrics
        run: bun ./scripts/qa-gate/collect.ts > metrics.json

      - uses: actions/upload-artifact@v7
        with:
          name: qa-metrics-base
          path: metrics.json
          retention-days: 7
          # Reruns of this job must be able to replace their own artifact.
          overwrite: true

  comment:
    name: Publish Final Comments
    needs: [publish-pending, metrics-base, metrics-head]
    # Publish even when a metrics side failed: the renderer degrades to n/a
    # columns plus collector-error notes instead of stranding the placeholder.
    # !cancelled() rather than always(): a run cancelled by a newer push must
    # stop here instead of racing the newer run's publishes.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history: the commit summary and git-cliff both walk base..head.
          fetch-depth: 0

      - uses: ./.github/actions/setup-mango

      - name: Download head metrics
        uses: actions/download-artifact@v8
        with:
          name: qa-metrics-head
          path: ./qa-head
        continue-on-error: true

      - name: Download base metrics
        uses: actions/download-artifact@v8
        with:
          name: qa-metrics-base
          path: ./qa-base
        continue-on-error: true

      - name: Render QA gate comment
        # continue-on-error so a renderer crash still reaches the publish step,
        # which substitutes the QA fallback body instead of stranding the
        # "QA Gate — Running" placeholder.
        continue-on-error: true
        run: |
          base="./qa-base/metrics.json"
          head="./qa-head/metrics.json"
          mkdir -p "$(dirname "$base")" "$(dirname "$head")"
          [ -f "$base" ] || echo '{}' > "$base"
          [ -f "$head" ] || echo '{}' > "$head"
          bun ./scripts/qa-gate/render.ts "$base" "$head" > comment.md
          echo "## Rendered comment preview" >> "$GITHUB_STEP_SUMMARY"
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Render commit summary
        continue-on-error: true
        run: bun ./scripts/qa-gate/render-commits.ts "$BASE_SHA" "$HEAD_SHA" > commits.md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Render changelog preview
        continue-on-error: true
        run: bun run changelog --preview --base "$BASE_SHA" > changelog.md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Publish comments (final)
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const publish = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/qa-gate/publish/managed-comments.mjs`
            );
            const pullRequest = context.payload.pull_request;
            await publish.publishManagedComments(
              { github, context, core },
              {
                pullNumber: pullRequest.number,
                expectedHeadSha: pullRequest.head.sha,
                comments: [
                  {
                    marker: publish.COMMITS_MARKER,
                    body: await publish.readCommentBody('commits.md', publish.COMMITS_MARKER),
                  },
                  {
                    marker: publish.CHANGELOG_PREVIEW_MARKER,
                    body: await publish.readCommentBody('changelog.md', publish.CHANGELOG_PREVIEW_MARKER),
                  },
                  {
                    marker: publish.QA_GATE_MARKER,
                    body: await publish.readCommentBody('comment.md', publish.QA_GATE_MARKER),
                  },
                ],
              }
            );
