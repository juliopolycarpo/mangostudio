name: Canary

# Publish a canary build from the latest green commit on main. ci.yml calls this
# reusable workflow as a job gated on every CI job passing + a push to main, so
# the commit that just went green is the canary source — no SHA re-resolution.
#
# Channels are independent fan-out jobs off a single build. Each is idempotent and
# individually re-runnable, so one failing never blocks the others and a maintainer
# can re-run just the failed job (see the canary-summary job):
#   - npm: mangostudio@<root>-canary.<sha7> under the `canary` dist-tag, so
#     `latest` never moves. Install with `npm i -g mangostudio@canary`.
#   - GitHub Releases: one `v<version>` pre-release per green main commit, with
#     platform archives and checksums. Never a rolling tag: this repository has
#     immutable releases enabled, so a published release's assets can never be
#     replaced and a tag that carried one can never be reused.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      channel:
        type: string
        required: true
      assets_artifact:
        type: string
        required: true
      npm_artifact:
        type: string
        required: true
    secrets:
      NPM_TOKEN:
        description: npm token used to publish under the canary dist-tag.
        required: true

permissions:
  contents: read

# Only the newest green commit should own the npm `canary` dist-tag, so supersede
# in-flight canary publishes. Per-commit versions are unique, so a cancelled run
# never leaves a conflicting half-publish.
concurrency:
  group: canary-publish
  cancel-in-progress: true

jobs:
  npm-canary:
    name: Publish npm (canary dist-tag)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      auth: ${{ steps.publish.outputs.auth }}
      provenance: ${{ steps.publish.outputs.provenance }}
    permissions:
      attestations: read # fetch build provenance for gh attestation verify
      contents: read # checkout only; publish goes to npm, not the repo
      id-token: write # npm provenance attestation for the canary publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight npm canary secret
        uses: ./.github/actions/require-secret
        with:
          name: NPM_TOKEN
          value: "${{ secrets.NPM_TOKEN }}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ inputs.npm_artifact }}
          source-sha: ${{ inputs.source_sha }}
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
          scope: npm
          verify-attestation: "true"

      - id: publish
        name: Publish to npm under the canary dist-tag
        uses: ./.github/actions/publish-npm-distribution
        with:
          allow-legacy-token: "true"
          dist-tag: canary
          node-auth-token: ${{ secrets.NPM_TOKEN }}
          node-version: "22.14.0"

  github-release-canary:
    name: Publish GitHub pre-release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write # verify build provenance, then attest this build's checksums
      contents: write # create the canary pre-release and its tag
      id-token: write # sign the SHA256SUMS and install-script attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ inputs.assets_artifact }}
          source-sha: ${{ inputs.source_sha }}
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
          scope: assets
          verify-attestation: "true"

      - name: Stage canary release assets
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        # Named selection, not a glob. `release-assets/mangostudio-<version>-*`
        # absorbed the eight raw hub binaries the moment raw assets shipped while
        # never matching a raw runtime binary, so canary paid ~760 MB per green
        # commit for assets nothing could use. The script publishes every platform
        # archive (the Cargo launcher resolves one for its own host) plus raw
        # hub+runtime pairs for the curated canary platforms, and writes
        # canary-manifest.json, which is what names the source commit.
        run: bun ./scripts/release/stage-canary-assets.ts

      # Same subjects as the stable release: SHA256SUMS covers every staged
      # archive and pair transitively, and the install scripts stand on their
      # own. The subject digest changes on every green commit, so each canary
      # build leaves its own record.
      - name: Attest canary checksums and install scripts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            github-canary-assets/SHA256SUMS
            github-canary-assets/install.sh
            github-canary-assets/install.ps1

      - name: Publish this commit's pre-release
        # One tag per green commit, named for the sha-stamped version the assets
        # themselves carry, so the tag, the file names and canary-manifest.json
        # all name the same build. `--target` pins the tag to the commit that
        # went green rather than whatever `main` points at by the time this runs.
        #
        # Consumers resolve the newest `-canary` pre-release from the release
        # list (install.sh, install.ps1 and the hub's own upgrade check); none of
        # them reconstructs a tag from a version, because there is no longer one
        # rolling tag to reconstruct.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          source scripts/release/publish-release.sh
          tag="v${VERSION}"
          notes="Canary build from ${SOURCE_SHA}."
          publish_release "$tag" github-canary-assets/* -- \
            --prerelease \
            --latest=false \
            --target "$SOURCE_SHA" \
            --title "$tag" \
            --notes "$notes"

      - name: Prune superseded canary releases
        # Non-fatal: the build above is published either way, and a transient
        # listing failure must not redden `main`. Storage grows until the next
        # green commit prunes again.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/release/prune-canary-releases.ts

  canary-summary:
    name: Canary publish summary
    needs: [npm-canary, github-release-canary]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write canary publish summary
        env:
          TITLE: Canary ${{ inputs.version }}
          NPM_RESULT: ${{ needs.npm-canary.result }}
          RELEASE_RESULT: ${{ needs.github-release-canary.result }}
          NPM_PUBLISH_AUTH: ${{ needs.npm-canary.outputs.auth }}
          NPM_PUBLISH_PROVENANCE: ${{ needs.npm-canary.outputs.provenance }}
          NPM_CHANNEL_NAME: npm-canary
        run: |
          bash scripts/release/publish-summary.sh \
            "npm-canary=${NPM_RESULT}" \
            "github-release-canary=${RELEASE_RESULT}"
