name: Canary

# Publish a canary build from the latest green commit on main. ci.yml calls this
# reusable workflow as a job gated on every CI job passing + a push to main, so
# the commit that just went green is the canary source — no SHA re-resolution.
#
# Channels are independent fan-out jobs off a single build. Each is idempotent and
# individually re-runnable, so one failing never blocks the others and a maintainer
# can re-run just the failed job (see the canary-summary job):
#   - npm: mangostudio@<root>-canary.<sha7> under the `canary` dist-tag, so
#     `latest` never moves. Install with `npm i -g mangostudio@canary`.
#   - GitHub Releases: rolling `v<root>-canary` pre-release with platform archives
#     and checksums refreshed on every green main commit.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      cargo_version:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      channel:
        type: string
        required: true
      packaged_artifact:
        type: string
        required: true
    secrets:
      NPM_TOKEN:
        description: npm token used to publish under the canary dist-tag.
        required: true

permissions:
  contents: read

# Only the newest green commit should own the rolling GitHub pre-release and npm
# `canary` dist-tag, so supersede in-flight canary publishes. Per-commit versions
# are unique, so a cancelled run never leaves a conflicting half-publish.
concurrency:
  group: canary-publish
  cancel-in-progress: true

jobs:
  verify:
    name: Verify tested canary distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ inputs.packaged_artifact }}
          source-sha: ${{ inputs.source_sha }}
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}

  npm-canary:
    name: Publish npm (canary dist-tag)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout only; publish goes to npm, not the repo
      id-token: write # npm provenance attestation for the canary publish
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ inputs.packaged_artifact }}
          source-sha: ${{ inputs.source_sha }}
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}

      - name: Restore executable bit on platform binaries
        # actions/upload-artifact drops Unix mode bits, so restore +x before
        # publishing (matches the release npm-publish job).
        run: find dist-npm -type f -name mangostudio -exec chmod +x {} +

      - name: Validate npm distribution
        run: bun ./scripts/release/pack-npm.ts --validate dist-npm

      - name: Publish to npm under the canary dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          bun ./scripts/release/publish-npm.ts dist-npm --tag canary

  github-release-canary:
    name: Publish GitHub pre-release assets
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # edit/upload assets on the rolling canary pre-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ inputs.packaged_artifact }}
          source-sha: ${{ inputs.source_sha }}
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}

      - name: Stage rolling canary release assets
        env:
          VERSION: ${{ inputs.version }}
          CARGO_VERSION: ${{ inputs.cargo_version }}
        run: |
          mkdir -p github-canary-assets
          for asset in release-assets/mangostudio-"${VERSION}"-*; do
            target="$(basename "$asset")"
            cp "$asset" "github-canary-assets/${target/${VERSION}/${CARGO_VERSION}}"
          done
          (cd github-canary-assets && sha256sum mangostudio-"${CARGO_VERSION}"-* > SHA256SUMS)

      - name: Publish rolling pre-release assets for the launcher
        # The cargo shim resolves .../releases/download/v<version>/, so existing
        # fixed-version canary launchers keep working as these assets are clobbered.
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_VERSION: ${{ inputs.cargo_version }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          source scripts/release/retry.sh
          tag="v${CARGO_VERSION}"
          notes="Rolling canary build from ${SOURCE_SHA}. Canary version: ${VERSION}. Assets use ${CARGO_VERSION} names for launcher compatibility."
          if gh release view "$tag" >/dev/null 2>&1; then
            retry_command 3 30 gh release edit "$tag" --prerelease --title "$tag" --notes "$notes"
            retry_command 3 30 gh release upload "$tag" github-canary-assets/* --clobber
          else
            retry_command 3 30 gh release create "$tag" github-canary-assets/* \
              --prerelease \
              --title "$tag" \
              --notes "$notes"
          fi

  canary-summary:
    name: Canary publish summary
    needs: [verify, npm-canary, github-release-canary]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Write canary publish summary
        env:
          TITLE: Canary ${{ inputs.version }}
          BUILD_RESULT: ${{ needs.verify.result }}
          NPM_RESULT: ${{ needs.npm-canary.result }}
          RELEASE_RESULT: ${{ needs.github-release-canary.result }}
        run: |
          bash scripts/release/publish-summary.sh \
            "build=${BUILD_RESULT}" \
            "npm-canary=${NPM_RESULT}" \
            "github-release-canary=${RELEASE_RESULT}"
