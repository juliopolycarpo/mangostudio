name: Canary

# Promote one frozen successful main CI run. Each channel can recover original
# approved bytes independently; cancellation never rolls back external writes.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      recover_source_run_id:
        description: "Existing approved source CI run ID (requires attempt and approval hash)"
        required: false
        type: string
      recover_source_attempt:
        description: "Exact successful source CI attempt"
        required: false
        type: string
      recover_approval_sha256:
        description: "Original authenticated approval payload SHA256"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: canary-publish
  cancel-in-progress: false

jobs:
  source:
    name: Resolve latest green main commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # recover immutable source and approval artifacts
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.source.outputs.run_id }}
      run_attempt: ${{ steps.source.outputs.run_attempt }}
      run_number: ${{ steps.source.outputs.run_number }}
      run_url: ${{ steps.source.outputs.run_url }}
      workflow_id: ${{ steps.source.outputs.workflow_id }}
      repository: ${{ steps.source.outputs.repository }}
      workflow_path: ${{ steps.source.outputs.workflow_path }}
      source_restored: ${{ steps.source.outputs.source_restored }}
      expected_approval_sha256: ${{ steps.source.outputs.expected_approval_sha256 }}
      version: ${{ steps.snapshot.outputs.version }}
      channel: ${{ steps.snapshot.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - id: source
        name: Freeze or restore successful main push CI run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RECOVER_SOURCE_RUN_ID: ${{ inputs.recover_source_run_id }}
          RECOVER_SOURCE_ATTEMPT: ${{ inputs.recover_source_attempt }}
          RECOVER_APPROVAL_SHA256: ${{ inputs.recover_approval_sha256 }}
          SELECTION_PATH: ${{ runner.temp }}/canary-selection.json
          SNAPSHOT_PATH: ${{ runner.temp }}/canary-source/source.json
        run: bun ./scripts/ci/freeze-canary-source.ts resolve

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - id: identity
        name: Read canary identity from frozen application source
        env:
          EVENT_NAME: push
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bun ./scripts/ci/distribution-identity.ts >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - id: snapshot
        name: Write original source snapshot using trusted execution code
        env:
          SELECTION_PATH: ${{ runner.temp }}/canary-selection.json
          SNAPSHOT_PATH: ${{ runner.temp }}/canary-source/source.json
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.identity.outputs.version }}
          CHANNEL: ${{ steps.identity.outputs.channel }}
        run: bun ./scripts/ci/freeze-canary-source.ts write

      - name: Retain source selection for full workflow reruns
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canary-source/source.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  approve:
    name: "Approve canary ${{ needs.source.outputs.version }} from ${{ needs.source.outputs.source_sha }}"
    needs: [source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # recover immutable source and approval artifacts
      contents: write # include push-capable visibility of unfinished release drafts
      attestations: write # verify prior provenance and attest frozen publication evidence
      id-token: write # mint provenance and npm Trusted Publishing tokens
    env:
      REPO: ${{ github.repository }}
      SOURCE_OUTPUTS_JSON: ${{ toJSON(needs.source.outputs) }}
      OUTPUT_DIR: .canary-approval
      VERSION: ${{ needs.source.outputs.version }}
    outputs:
      approval_sha256: ${{ steps.approved.outputs.approval_payload_sha256 }}
      expected_release_sha256: ${{ steps.approved.outputs.expected_release_sha256 }}
      npm_needed: ${{ steps.audit.outputs.npm_needed }}
      github_needed: ${{ steps.audit.outputs.github_needed }}
      reason: ${{ steps.audit.outputs.reason }}
      approval_origin: ${{ steps.approved.outputs.approval_origin }}
      approval_execution_revision: ${{ steps.approved.outputs.approval_execution_revision }}
      manifest_sha256: ${{ steps.approved.outputs.manifest_sha256 }}
      approved_run_id: ${{ steps.approved.outputs.approved_run_id }}
      approved_run_attempt: ${{ steps.approved.outputs.approved_run_attempt }}
      approved_run_number: ${{ steps.approved.outputs.approved_run_number }}
      approved_run_url: ${{ steps.approved.outputs.approved_run_url }}
      approved_workflow_id: ${{ steps.approved.outputs.approved_workflow_id }}
      approved_workflow_path: ${{ steps.approved.outputs.approved_workflow_path }}
      builder_attempt: ${{ steps.approved.outputs.builder_attempt }}
      built_at: ${{ steps.approved.outputs.built_at }}
      checksums_id: ${{ steps.approved.outputs.checksums_id }}
      checksums_name: ${{ steps.approved.outputs.checksums_name }}
      checksums_digest: ${{ steps.approved.outputs.checksums_digest }}
      assets_id: ${{ steps.approved.outputs.assets_id }}
      assets_name: ${{ steps.approved.outputs.assets_name }}
      assets_digest: ${{ steps.approved.outputs.assets_digest }}
      npm_id: ${{ steps.approved.outputs.npm_id }}
      npm_name: ${{ steps.approved.outputs.npm_name }}
      npm_digest: ${{ steps.approved.outputs.npm_digest }}
      qualification_json: ${{ steps.approved.outputs.qualification_json }}
      artifact_id: ${{ steps.reservation.outputs.artifact-id }}
      artifact_digest: ${{ steps.reservation.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - id: approved
        name: Recover original approval or qualify retained CI distribution
        env:
          EXPECTED_APPROVAL_SHA256: ${{ needs.source.outputs.expected_approval_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/ci/prepare-canary-approval.ts

      - id: audit
        name: Verify both published channels before deciding completion
        env:
          MANIFEST_PATH: .canary-approval/distribution-manifest.json
          EXPECTED_RELEASE: .canary-approval/expected-release.json
          AUDIT_PATH: .canary-approval/audit.json
          APPROVAL_ORIGIN: ${{ steps.approved.outputs.approval_origin }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.approved.outputs.manifest_sha256 }}
          EXPECTED_RELEASE_SHA256: ${{ steps.approved.outputs.expected_release_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/release/audit-canary-publication.ts .canary-approval/distribution-manifest.json .canary-approval/expected-release.json .canary-approval/audit.json

      - name: Attest frozen approval and expected release checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .canary-approval/approval.tar.gz
            .canary-approval/assets/SHA256SUMS

      # Keep this last, including verified no-ops: a successful approval job is
      # the durable per-version reservation index used after a partial publish.
      - id: reservation
        name: Reserve original approved bytes for this version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.approved.outputs.approval_artifact_name }}
          path: .canary-approval/approval.tar.gz
          if-no-files-found: error
          overwrite: false
          retention-days: 30
          compression-level: 0

  npm-canary:
    name: Publish npm canary
    needs: [source, approve]
    if: needs.approve.outputs.npm_needed == 'true'
    environment: canary
    outputs:
      auth: ${{ steps.publish.outputs.auth }}
      provenance: ${{ steps.publish.outputs.provenance }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # recover immutable source and approval artifacts
      contents: write # include push-capable visibility of unfinished release drafts
      attestations: read # verify original builder and approval provenance
      id-token: write # mint provenance and npm Trusted Publishing tokens
    env:
      REPO: ${{ github.repository }}
      SOURCE_OUTPUTS_JSON: ${{ toJSON(needs.source.outputs) }}
      OUTPUT_DIR: .canary-approval
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - id: approved
        name: Recover and pin the original successful approval
        env:
          EXPECTED_APPROVAL_SHA256: ${{ needs.approve.outputs.approval_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/ci/prepare-canary-approval.ts

      # Failed-job reruns reuse successful dependency outputs. This read must
      # stay inside each publisher, before package/tag/release mutations.
      - id: guard
        name: Recheck external bytes and current channel ordering before writes
        env:
          MANIFEST_PATH: .canary-approval/distribution-manifest.json
          EXPECTED_RELEASE: .canary-approval/expected-release.json
          AUDIT_PATH: .canary-approval/audit.json
          APPROVAL_ORIGIN: ${{ steps.approved.outputs.approval_origin }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.approved.outputs.manifest_sha256 }}
          EXPECTED_RELEASE_SHA256: ${{ steps.approved.outputs.expected_release_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/release/audit-canary-publication.ts .canary-approval/distribution-manifest.json .canary-approval/expected-release.json .canary-approval/audit.json

      - name: Download original approved npm distribution
        if: steps.guard.outputs.packages_needed == 'true'
        uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ steps.approved.outputs.npm_name }}
          artifact-id: ${{ steps.approved.outputs.npm_id }}
          artifact-digest: ${{ steps.approved.outputs.npm_digest }}
          run-id: ${{ steps.approved.outputs.approved_run_id }}
          run-attempt: ${{ steps.approved.outputs.approved_run_attempt }}
          producer-attempt: ${{ steps.approved.outputs.builder_attempt }}
          source-sha: ${{ needs.source.outputs.source_sha }}
          version: ${{ needs.source.outputs.version }}
          channel: ${{ needs.source.outputs.channel }}
          scope: npm
          runtime-profile: shipping
          verify-attestation: "true"

      - name: Verify downloaded manifest against frozen approval
        if: steps.guard.outputs.packages_needed == 'true'
        run: cmp distribution-manifest.json .canary-approval/distribution-manifest.json

      - id: publish
        name: Fill only missing platform packages, then wrapper
        if: steps.guard.outputs.packages_needed == 'true'
        uses: ./.github/actions/publish-npm-distribution
        with:
          allow-legacy-token: "false"
          dist-tag: canary
          node-version: "22.14.0"

      - name: Verify all package bytes and recover canary dist-tags
        if: steps.guard.outputs.npm_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: .canary-approval/distribution-manifest.json
        run: bun ./scripts/release/promote-canary-tags.ts .canary-approval/distribution-manifest.json

  github-release-canary:
    name: Publish immutable GitHub canary
    needs: [source, approve]
    if: needs.approve.outputs.github_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # recover immutable source and approval artifacts
      contents: write # resume the approved canary draft and prune old prereleases
      attestations: write # verify prior provenance and attest frozen publication evidence
      id-token: write # mint provenance and npm Trusted Publishing tokens
    env:
      REPO: ${{ github.repository }}
      SOURCE_OUTPUTS_JSON: ${{ toJSON(needs.source.outputs) }}
      OUTPUT_DIR: .canary-approval
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - id: approved
        name: Recover and pin the original successful approval
        env:
          EXPECTED_APPROVAL_SHA256: ${{ needs.approve.outputs.approval_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/ci/prepare-canary-approval.ts

      # Failed-job reruns reuse successful dependency outputs. This read must
      # stay inside each publisher, before package/tag/release mutations.
      - id: guard
        name: Recheck external bytes and current channel ordering before writes
        env:
          MANIFEST_PATH: .canary-approval/distribution-manifest.json
          EXPECTED_RELEASE: .canary-approval/expected-release.json
          AUDIT_PATH: .canary-approval/audit.json
          APPROVAL_ORIGIN: ${{ steps.approved.outputs.approval_origin }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.approved.outputs.manifest_sha256 }}
          EXPECTED_RELEASE_SHA256: ${{ steps.approved.outputs.expected_release_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/release/audit-canary-publication.ts .canary-approval/distribution-manifest.json .canary-approval/expected-release.json .canary-approval/audit.json

      - name: Download original approved assets distribution
        if: steps.guard.outputs.github_needed == 'true'
        uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ steps.approved.outputs.assets_name }}
          artifact-id: ${{ steps.approved.outputs.assets_id }}
          artifact-digest: ${{ steps.approved.outputs.assets_digest }}
          run-id: ${{ steps.approved.outputs.approved_run_id }}
          run-attempt: ${{ steps.approved.outputs.approved_run_attempt }}
          producer-attempt: ${{ steps.approved.outputs.builder_attempt }}
          source-sha: ${{ needs.source.outputs.source_sha }}
          version: ${{ needs.source.outputs.version }}
          channel: ${{ needs.source.outputs.channel }}
          scope: assets
          runtime-profile: shipping
          verify-attestation: "true"

      - name: Stage original approved assets and frozen publication evidence
        if: steps.guard.outputs.github_needed == 'true'
        env:
          APPROVAL_DIR: .canary-approval
          MANIFEST_PATH: distribution-manifest.json
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
          EXPECTED_APPROVAL_SHA256: ${{ needs.approve.outputs.approval_sha256 }}
          EXPECTED_RELEASE_SHA256: ${{ needs.approve.outputs.expected_release_sha256 }}
        run: bun ./scripts/ci/stage-approved-canary.ts

      - name: Attest canary checksums and install scripts
        if: steps.guard.outputs.github_needed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            github-canary-assets/SHA256SUMS
            github-canary-assets/install.sh
            github-canary-assets/install.ps1

      - id: publish
        name: Resume missing assets in matching draft and publish complete release
        if: steps.guard.outputs.github_needed == 'true'
        env:
          EXPECTED_RELEASE: .canary-approval/expected-release.json
          EXPECTED_RELEASE_SHA256: ${{ needs.approve.outputs.expected_release_sha256 }}
          ASSET_DIR: github-canary-assets
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/release/publish-canary.ts

      - name: Prune superseded canary releases
        if: steps.guard.outputs.github_needed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun ./scripts/release/prune-canary-releases.ts

  canary-summary:
    name: Canary publish summary
    needs: [source, approve, npm-canary, github-release-canary]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Record frozen selection, approval and independent channel outcomes
        env:
          CANARY_NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_REVISION: ${{ github.sha }}
          CANARY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun ./scripts/ci/summarize-canary-promotion.ts
