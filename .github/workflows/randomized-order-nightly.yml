name: Randomized Order Nightly

# Runs the Bun suites in a different order every night, to surface the one
# class of bug the merge-gating run cannot see: a test that only passes because
# of what the file before it left behind.
#
# This repository has a standing hazard of exactly that shape — `mock.module`
# registrations and in-memory databases outlive the file that made them, and
# `bun test` shares one module graph across files by default (see
# docs/reference/testing.md, "Parallelism"). `--randomize` shuffles file order
# as well as the tests inside each file, verified: seed 3 runs three probe files
# as c, b, a where seeds 1 and 2 keep a, b, c.
#
# **The isolation setting decides which half of that hazard a lane can see**,
# which is why the matrix carries it per entry rather than passing
# `--parallel=1` to everything:
#
#   - `--parallel=1` means "one worker, *isolated*" (Bun implies `--isolate`),
#     so each file gets a fresh global. Shuffling file order under it can only
#     surface order dependence *inside* a file.
#   - The `api-integration` lane is the one the merge gate runs with no
#     `--parallel` at all (scripts/lib/test-lanes.ts), sharing one module graph
#     across all 101 files. Cross-file leakage is only reachable in that mode,
#     so it gets its own entry that reproduces it — without one, the class this
#     workflow exists for had no detector anywhere in CI.
#
# Deliberately **not** merge-gating. A suite that fails weekly on a different
# seed is a bug report; making it block merges teaches everyone to re-run CI,
# and that habit outlasts the fix. Failures rely on the standard
# failed-scheduled-run notification.
#
# The seed is the run number, so every night is a new order, and each job logs
# the exact command to reproduce its own lane.
#
# Every lane runs under scripts/ci/run-tests-watchdog.ts with `--retry-on-crash`:
# a hang (oven-sh/bun#39709) dies at the watchdog's bound instead of burning
# this job's `timeout-minutes`, and an isolate-runner crash
# (`panic(main thread): abort()`, the same #889 class) gets one same-seed
# retry so the rest of the lane's file list still runs, instead of the whole
# night's findings for that lane scrolling away with a job that looks like
# "infra". Both outcomes are labeled `::warning`/infra in the job log rather
# than left to look like an ordering finding — but neither may hide one: a
# crashed attempt that already logged failures (inline `(fail)` lines or a
# ` N fail` summary) still reports non-zero, because the retry proves the
# isolate runner recovered, not that those failures didn't happen.
#
# `--parallel=1` stays on the `api`/`shared`/`runtime` lanes rather than
# sharding it away: it is the only detector for *within-file* order
# dependence under the merge gate's own unit-lane mode, and dropping it on
# `api` would duplicate the `api-integration` entry instead of adding
# coverage. Revisit only when a Bun release verifiably contains
# oven-sh/bun#38008 (check the patch, not the version — tracked in #889).

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Seed to reproduce a specific failing order.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: randomized-order-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  randomized:
    name: Randomized order (${{ matrix.lane }})
    runs-on: ubuntu-latest
    # Sized with the step and per-attempt bounds below — see the budget comment
    # on the "Run in a randomized order" step before changing this.
    timeout-minutes: 22
    strategy:
      # One lane's ordering bug says nothing about another's, and finding all of
      # them in one night beats finding the first one four nights running. Kept
      # `false` now that a lane is red on a known, separately tracked defect:
      # otherwise that one failure would cancel every other lane's evidence.
      fail-fast: false
      matrix:
        # `include`-only, so each lane carries its own isolation setting and
        # path. `isolation` is the empty string for the lane the merge gate runs
        # unisolated; every other lane keeps `--parallel=1` (= one worker,
        # isolated). `path` empty means the whole workspace suite.
        include:
          - lane: api
            workspace: api
            isolation: "--parallel=1"
            path: ""
          # The same files the `api` entry above already runs, deliberately
          # run a second time without isolation. That is the entire point: at
          # `--parallel=1` a fresh global per file hides exactly the leakage
          # the merge gate's unisolated lane is exposed to.
          - lane: api-integration
            workspace: api
            isolation: ""
            path: tests/integration
          - lane: shared
            workspace: shared
            isolation: "--parallel=1"
            path: ""
          - lane: runtime
            workspace: runtime
            isolation: "--parallel=1"
            path: ""
    env:
      DATABASE_PATH: /tmp/mangostudio-test.sqlite
      SEED: ${{ inputs.seed || github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Run database migrations
        run: bun run --filter @mangostudio/api migrate

      # The lane script's own flags plus randomization, invoked directly rather
      # than through `bun run test`: this is a diagnostic, not the merge gate,
      # and it must not write JUnit reports or coverage that anything else
      # reads.
      #
      # The three timeouts here are one budget; changing any of them alone
      # breaks it:
      #
      #   --timeout-seconds=420  One attempt. Healthy lanes run 160-235s, so
      #                          this is ~80% headroom. 300s left only ~28%,
      #                          and a GitHub runner under noisy-neighbour load
      #                          routinely costs 30-50% — a green night would
      #                          be SIGTERM'd, reported as an
      #                          oven-sh/bun#39709 hang that never happened,
      #                          and burn a second full attempt proving it. A
      #                          fabricated infra report is worse than a slow
      #                          one: the step bound below already caps the
      #                          true pathology, a run that never ends.
      #   timeout-minutes: 16    This step. Two full attempts (14m) plus the
      #                          kill grace, group reap and log flush between
      #                          them.
      #   timeout-minutes: 22    The job. The above plus checkout, setup,
      #                          migrations and the artifact upload.
      #
      # The step bound stays tighter than the job's so even a double hang dies
      # here and still leaves time for the log upload. A job-level timeout
      # cancels the job before that step can run, and the log is the finding.
      - name: Run in a randomized order
        id: randomized
        timeout-minutes: 16
        working-directory: apps/${{ matrix.workspace }}
        env:
          MANGOSTUDIO_DIAGNOSTIC_LOGS: "0"
          WORKSPACE: ${{ matrix.workspace }}
          ISOLATION: ${{ matrix.isolation }}
          LANE_PATH: ${{ matrix.path }}
          LANE: ${{ matrix.lane }}
        run: |
          # An array, not a string: `isolation` and `path` are empty for at
          # least one lane each, and a quoted empty string would reach
          # `bun test` as an argument it reads as a path filter matching
          # nothing. Appended with `if` rather than `&&` so an empty value does
          # not make the list return 1 and trip `bash -e`.
          args=(--timeout 15000 --randomize "--seed=${SEED}")
          if [ -n "${ISOLATION}" ]; then args+=("${ISOLATION}"); fi
          if [ -n "${LANE_PATH}" ]; then args+=("${LANE_PATH}"); fi
          # Carries the env the job sets, not just the flags: a paste that
          # leaves `MANGOSTUDIO_DIAGNOSTIC_LOGS` or `DATABASE_PATH` behind runs
          # a different suite than the one that went red.
          echo "::notice::Reproduce with: (cd apps/${WORKSPACE} && DATABASE_PATH=${DATABASE_PATH} MANGOSTUDIO_DIAGNOSTIC_LOGS=${MANGOSTUDIO_DIAGNOSTIC_LOGS} bun test ${args[*]})"
          # The watchdog owns run.log, mirrors the child's output to this
          # step's own log, and bounds+retries a hang or a crash exactly like
          # the merge gate's shards (scripts/ci/run-tests-watchdog.ts).
          bun ../../scripts/ci/run-tests-watchdog.ts --label="${LANE}" \
            --timeout-seconds=420 --retry-on-crash \
            --log-file=run.log --meta-file=run-meta.json \
            -- bun test "${args[@]}"

      # The order is the finding. Without it a red run names a failing test and
      # nothing about what ran before it, which is the half that matters.
      # `outcome != success` covers a failed run and a step timeout;
      # `outputs.crashed == 'true'` also uploads a crash-then-clean-retry
      # night, and `outputs.log-preserved == 'true'` does the same for a
      # hang-then-clean-retry. A crash that already logged failures reports
      # non-zero on its own and is covered by `outcome`; these two outputs are
      # for the case where the step *succeeds* and the preserved attempt-1 log
      # is the only record that anything went wrong at all.
      # `!cancelled()` skips a user-cancelled job, where there is nothing
      # useful to keep. The glob picks up both `run.log` and, when a hang or
      # crash preserved it, `run.log.attempt-1`; `run-meta.json` is not
      # uploaded because nothing here consumes it.
      - name: Upload run log
        if: ${{ !cancelled() && (steps.randomized.outcome != 'success' || steps.randomized.outputs.crashed == 'true' || steps.randomized.outputs.log-preserved == 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: randomized-order-${{ matrix.lane }}-seed-${{ env.SEED }}
          path: apps/${{ matrix.workspace }}/run.log*
          retention-days: 14
