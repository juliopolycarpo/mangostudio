name: Smoke — Browser

on:
  workflow_call:
    inputs:
      frontend_bun_revision:
        description: Exact Bun commit from the frontend producing job.
        type: string
        default: ""
      frontend_artifact:
        description: Verified production frontend from this run; empty builds it locally.
        type: string
        default: ""
      runtime_artifact:
        description: >
          Artifact holding the mangostudio-runtime binary the hub launches for
          Local; empty builds it in this job instead.
        type: string
        required: false
        default: ""
      always_upload_report:
        description: Upload the Playwright HTML report even when the suite passes.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      always_upload_report:
        description: Upload the Playwright HTML report even when the suite passes.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# ci.yml's caller-level group already supersedes per-PR runs; this group covers
# direct workflow_dispatch runs. Mirrors ci.yml: main is never cancelled.
concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lab-runtime:
    uses: $/.github/workflows/local-runtime.yml

  lab-frontend:
    uses: $/.github/workflows/build.yml
    with:
      source_sha: ${{ github.sha }}

  browser-smoke:
    needs: [lab-runtime, lab-frontend]
    name: ${{ matrix.mode == 'production' && 'Production frontend regressions' || 'Chromium smoke suite' }}
    strategy:
      fail-fast: false
      matrix:
        mode: [development, production]
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:4d70b558dbaff71611b2f3e7a32aa2b4d42cfc892078ad368cb7ea229c2ffd1f
      # setup-bun extracts its archive with the matching Ubuntu runner's unzip.
      volumes:
        - /usr/bin/unzip:/usr/local/bin/unzip:ro
    defaults:
      run:
        shell: bash
    # Bound installation separately from the existing ten-minute smoke allowance;
    # leave job headroom for the remaining setup and failure artifacts.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Verify the Playwright image version and Chromium paths
        run: |
          set -euo pipefail
          playwright="$(bunx --bun playwright --version | awk '{print $2}')"
          if [ "$playwright" != '1.65.0' ]; then
            printf 'expected Playwright version: 1.65.0 | received: %s\n' "$playwright" >&2
            exit 1
          fi
          bunx --bun playwright install --dry-run chromium

      # The smoke hub spawns Local as the Rust runtime. With the binary in
      # MANGOSTUDIO_RUNTIME_BINARY, `bun run dev` skips its own cargo build,
      # which would otherwise start cold inside the web server's timeout. A
      # manual dispatch has no artifact to download, so it builds here.
      - uses: $/.github/actions/local-runtime
        with:
          artifact: ${{ needs.lab-runtime.outputs.artifact }}

      - name: Run browser smoke suite
        if: matrix.mode == 'development'
        timeout-minutes: 10
        run: |
          set -o pipefail
          bun run test --e2e 2>&1 | tee smoke-run.log
        env:
          CI: true

      - uses: $/.github/actions/download-frontend
        if: matrix.mode == 'production' && needs.lab-frontend.outputs.artifact != ''
        with:
          artifact: ${{ needs.lab-frontend.outputs.artifact }}
          bun-revision: ${{ needs.lab-frontend.outputs.bun_revision }}

      - name: Run production frontend regressions
        if: matrix.mode == 'production'
        timeout-minutes: 10
        # Build and browser share the same deadline and supervised step tree.
        run: |
          set -o pipefail
          args=()
          [ -n "$FRONTEND_ARTIFACT" ] && args+=(--reuse-frontend --frontend-bun-revision "$PRODUCER_BUN_REVISION")
          bun run test:e2e:production "${args[@]}" 2>&1 | tee smoke-run.log
        env:
          CI: true
          FRONTEND_ARTIFACT: ${{ needs.lab-frontend.outputs.artifact }}
          PRODUCER_BUN_REVISION: ${{ needs.lab-frontend.outputs.bun_revision }}

      # Green runs leave their outcome in the step summary instead of an
      # artifact nobody downloads; failures get the full diagnostics below.
      - name: Smoke summary
        run: |
          summary="$(grep -Eo '[0-9]+ passed \([^)]+\)' smoke-run.log | tail -n 1)"
          {
            echo '### Browser smoke'
            echo "- ${summary:-run log did not include a pass summary}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.mode == 'production' && 'playwright-results-production' || 'playwright-results' }}
          path: |
            .mango/artifacts/playwright/test-results/
          retention-days: 7

      # Failure diagnostics by default; the always_upload_report dispatch
      # input keeps a manual escape hatch for inspecting a green run.
      - name: Upload Playwright HTML report
        if: ${{ failure() || inputs.always_upload_report }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.mode == 'production' && 'playwright-report-production' || 'playwright-report' }}
          path: .mango/artifacts/playwright/html-report/
          retention-days: 7
