name: Smoke — Browser

on:
  workflow_call:
    inputs:
      always_upload_report:
        description: Upload the Playwright HTML report even when the suite passes.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      always_upload_report:
        description: Upload the Playwright HTML report even when the suite passes.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# ci.yml's caller-level group already supersedes per-PR runs; this group covers
# direct workflow_dispatch runs. Mirrors ci.yml: main is never cancelled.
concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser-smoke:
    name: Chromium smoke suite
    # ubuntu-24.04: Playwright 1.60 cannot install Chromium system deps on 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - id: toolchain
        name: Resolve Playwright version
        # An empty version silently poisons the cache key, so fail here rather
        # than inside cache-scoped's validity guard.
        run: |
          set -euo pipefail
          playwright="$(bunx --bun playwright --version | awk '{print $2}')"
          if [ -z "${playwright}" ]; then
            echo "::error::playwright version probe returned an empty value"
            exit 1
          fi
          echo "playwright=${playwright}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: pw-cache
        uses: ./.github/actions/cache-scoped
        with:
          family: playwright
          path: ~/.cache/ms-playwright
          validity: ${{ steps.toolchain.outputs.playwright }}
          exact-restore: "true"
          mode: restore
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-restored != 'true'
        run: bun run test:e2e:setup

      - name: Install OS deps for Chromium (cache hit path)
        if: steps.pw-cache.outputs.cache-restored == 'true'
        run: bunx playwright install-deps chromium

      - name: Save Playwright browser cache
        if: steps.pw-cache.outputs.cache-restored != 'true'
        uses: ./.github/actions/cache-scoped
        with:
          family: playwright
          path: ~/.cache/ms-playwright
          validity: ${{ steps.toolchain.outputs.playwright }}
          exact-restore: "true"
          mode: save
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Run browser smoke suite
        run: |
          set -o pipefail
          bun run test --e2e 2>&1 | tee smoke-run.log
        env:
          CI: true

      # Green runs leave their outcome in the step summary instead of an
      # artifact nobody downloads; failures get the full diagnostics below.
      - name: Smoke summary
        run: |
          summary="$(grep -Eo '[0-9]+ passed \([^)]+\)' smoke-run.log | tail -n 1)"
          {
            echo '### Browser smoke'
            echo "- ${summary:-run log did not include a pass summary}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: |
            .mango/artifacts/playwright/test-results/
          retention-days: 7

      # Failure diagnostics by default; the always_upload_report dispatch
      # input keeps a manual escape hatch for inspecting a green run.
      - name: Upload Playwright HTML report
        if: ${{ failure() || inputs.always_upload_report }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: .mango/artifacts/playwright/html-report/
          retention-days: 7
