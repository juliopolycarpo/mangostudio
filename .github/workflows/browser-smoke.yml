name: Smoke — Browser

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Chromium auth flow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CACHE_VERSION: v1

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-mango

      - name: Resolve Playwright version
        id: pw
        shell: bash
        run: |
          version=$(bunx --bun playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Key is tied to the exact Playwright version so a browser update
          # always triggers a fresh download. CACHE_VERSION provides a manual
          # rollback lever in case of cache poisoning.
          key: ${{ runner.os }}-${{ env.CACHE_VERSION }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_VERSION }}-playwright-

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bun run test:e2e:setup

      - name: Install OS deps for Chromium (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run browser smoke suite
        run: bun run test --e2e
        env:
          CI: true

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: |
            .mango/artifacts/playwright/test-results/
          retention-days: 7

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: .mango/artifacts/playwright/html-report/
          retention-days: 7
