name: Smoke — Browser

on:
  workflow_call:
    inputs:
      frontend_bun_revision:
        description: Exact Bun commit from the frontend producing job.
        type: string
        default: ""
      frontend_artifact:
        description: Verified production frontend from this run; empty builds it locally.
        type: string
        default: ""
      runtime_artifact:
        description: >
          Artifact holding the mangostudio-runtime binary the hub launches for
          Local; empty builds one binary for both browser jobs.
        type: string
        required: false
        default: ""
      always_upload_report:
        description: Upload the Playwright HTML report even when the suite passes.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      always_upload_report:
        description: Upload the Playwright HTML report even when the suite passes.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# ci.yml's caller-level group already supersedes per-PR runs; this group covers
# direct workflow_dispatch runs. Mirrors ci.yml: a newer run on the same ref cancels this one.
concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime:
    name: Build the Local runtime for standalone browser smoke
    if: ${{ !inputs.runtime_artifact }}
    uses: $/.github/workflows/local-runtime.yml

  browser-smoke:
    needs: [build-runtime]
    if: ${{ !cancelled() && (needs.build-runtime.result == 'success' || (needs.build-runtime.result == 'skipped' && inputs.runtime_artifact)) }}
    name: ${{ matrix.mode == 'production' && 'Production frontend regressions' || 'Chromium smoke suite' }}
    strategy:
      fail-fast: false
      matrix:
        mode: [development, production]
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:4d70b558dbaff71611b2f3e7a32aa2b4d42cfc892078ad368cb7ea229c2ffd1f
      # setup-bun extracts its archive with the Ubuntu runner's unzip.
      volumes:
        - /usr/bin/unzip:/usr/local/bin/unzip:ro
    defaults:
      run:
        shell: bash
    # Leave room for the image pull, artifact setup and failure diagnostics.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the checked-out workspace in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: $/.github/actions/setup-mango

      - name: Verify the Playwright image
        run: |
          set -euo pipefail
          playwright="$(bunx --bun playwright --version | awk '{print $2}')"
          image="$(bun -e 'console.log((await Bun.file("/ms-playwright/.docker-info").json()).driverVersion)')"
          if [ -z "$playwright" ] || [ "$playwright" != "$image" ]; then
            printf 'expected Playwright image version: %s | received: %s\n' "${playwright:-<empty>}" "${image:-<empty>}" >&2
            exit 1
          fi
          printf 'Playwright %s from the pinned image\n' "$image"

      - uses: $/.github/actions/local-runtime
        with:
          artifact: ${{ inputs.runtime_artifact || needs.build-runtime.outputs.artifact }}

      - name: Run browser smoke suite
        if: matrix.mode == 'development'
        timeout-minutes: 10
        run: |
          set -o pipefail
          bun run test --e2e 2>&1 | tee smoke-run.log
        env:
          CI: true

      - uses: $/.github/actions/download-frontend
        if: matrix.mode == 'production' && inputs.frontend_artifact != ''
        with:
          artifact: ${{ inputs.frontend_artifact }}
          bun-revision: ${{ inputs.frontend_bun_revision }}

      - name: Run production frontend regressions
        if: matrix.mode == 'production'
        timeout-minutes: 10
        # Build and browser share the same deadline and supervised step tree.
        run: |
          set -o pipefail
          args=()
          [ -n "$FRONTEND_ARTIFACT" ] && args+=(--reuse-frontend --frontend-bun-revision "$PRODUCER_BUN_REVISION")
          bun run test:e2e:production "${args[@]}" 2>&1 | tee smoke-run.log
        env:
          CI: true
          FRONTEND_ARTIFACT: ${{ inputs.frontend_artifact || '' }}
          PRODUCER_BUN_REVISION: ${{ inputs.frontend_bun_revision || '' }}

      # Green runs leave their outcome in the step summary instead of an
      # artifact nobody downloads; failures get the full diagnostics below.
      - name: Smoke summary
        run: |
          summary="$(grep -Eo '[0-9]+ passed \([^)]+\)' smoke-run.log | tail -n 1)"
          {
            echo '### Browser smoke'
            echo "- ${summary:-run log did not include a pass summary}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.mode == 'production' && 'playwright-results-production' || 'playwright-results' }}
          path: |
            .mango/artifacts/playwright/test-results/
          retention-days: 7

      # Failure diagnostics by default; the always_upload_report dispatch
      # input keeps a manual escape hatch for inspecting a green run.
      - name: Upload Playwright HTML report
        if: ${{ failure() || inputs.always_upload_report }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.mode == 'production' && 'playwright-report-production' || 'playwright-report' }}
          path: .mango/artifacts/playwright/html-report/
          retention-days: 7
