name: Smoke — Browser

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Chromium auth flow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHE_VERSION: v1

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mango

      - name: Resolve Playwright version
        id: pw
        shell: bash
        run: |
          version=$(bunx --bun playwright --version | awk '{print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Key is tied to the exact Playwright version so a browser update
          # always triggers a fresh download. CACHE_VERSION provides a manual
          # rollback lever in case of cache poisoning.
          key: ${{ runner.os }}-${{ env.CACHE_VERSION }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_VERSION }}-playwright-

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --with-deps

      - name: Install OS deps for Chromium (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run browser smoke suite
        run: bun run test --e2e
        env:
          CI: true

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
          retention-days: 7

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
