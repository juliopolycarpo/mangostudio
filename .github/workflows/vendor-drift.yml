name: Vendor drift

# Three vendor surfaces are pinned and committed, so a version bump shows up as
# a reviewable diff instead of a silent behaviour change: the Codex
# `app-server` contract emitted by the vendor's own generator, the Cursor ACP
# handshake, and the Claude Code CLI surface.
#
# This job regenerates each one and compares. A vendor *removing or changing*
# something a capture recorded fails — that is the case where an adapter is
# reading a field that is gone. A vendor *adding* something is reported and
# nothing more, because every one of these CLIs ships constantly and a job that
# failed on all of it would be red most weeks.
#
# Only the Codex set can run here. Its generator is a pinned npm package, so it
# reproduces on a runner with nothing installed; Cursor and Claude need a
# signed-in CLI and are skipped loudly, which the summary reports rather than
# passing over in silence.
#
# Path-filtered on purpose: the check downloads the pinned vendor package, and
# every other PR has no reason to pay for that.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/runtime/src/services/external-agents/*/contract/**"
      - "apps/runtime/src/services/external-agents/codex/protocol/**"
      - "apps/runtime/src/services/external-agents/*/pinned.ts"
      - "scripts/vendor/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contracts:
    name: Committed vendor contracts are reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Recapture and diff the committed contracts
        run: bun run vendor-contracts:check
