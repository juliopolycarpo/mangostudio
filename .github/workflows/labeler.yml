name: Labeler

# pull_request_target so PRs from forks can be labeled: the fork GITHUB_TOKEN on
# `pull_request` is read-only. actions/labeler only reads the list of changed
# file paths — it never checks out or executes PR code — so this trigger is safe.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# Coalesce rapid synchronize pushes so overlapping runs on the same PR are
# cancelled instead of wastefully racing. Labeling is idempotent, so this is
# purely an efficiency guard.
concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: Apply path-based labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
      - name: Verify classification labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const labelNames = labels.map((label) => label.name);
            const hasClassificationLabel = labelNames.some(
              (name) => name.startsWith('area: ') || name.startsWith('type: ')
            );

            if (!hasClassificationLabel) {
              core.setFailed(
                `No area: or type: label was applied to PR #${issue_number}. Update .github/labeler.yml for the changed paths.`
              );
            }
