name: Labeler

# Classification only (area:/type: labels from .github/labeler.yml). Assignee and
# reviewer routing lives in .github/workflows/auto-assign.yml — do not duplicate
# ownership logic here.

# pull_request_target so PRs from forks can be labeled: the fork GITHUB_TOKEN on
# `pull_request` is read-only. actions/labeler only reads the list of changed
# file paths — it never checks out or executes PR code — so this trigger is safe.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# Coalesce rapid synchronize pushes so overlapping runs on the same PR are
# cancelled instead of wastefully racing. Labeling is idempotent, so this is
# purely an efficiency guard.
concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: Apply path-based labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # labeler reads .github/labeler.yml from the base branch
      pull-requests: write # apply area:/type: labels to the PR
    steps:
      - id: label
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      - name: Verify classification labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # all-labels is a comma-separated list of every label on the PR after
          # labeling. Consuming it avoids a second labels API round-trip and the
          # extra read token scope that a separate labels lookup would require.
          ALL_LABELS: ${{ steps.label.outputs.all-labels }}
        with:
          script: |
            const labelNames = (process.env.ALL_LABELS ?? '')
              .split(',')
              .map((name) => name.trim())
              .filter(Boolean);
            const hasClassificationLabel = labelNames.some(
              (name) => name.startsWith('area: ') || name.startsWith('type: ')
            );

            if (!hasClassificationLabel) {
              core.setFailed(
                `No area: or type: label was applied to PR #${context.issue.number}. Update .github/labeler.yml for the changed paths.`
              );
            }
