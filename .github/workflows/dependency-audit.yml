name: Dependency Audit

# Audits Bun and Cargo lockfiles using the existing advisory policies.
# This complements dependency-review.yml, which only sees vulnerabilities a PR
# *introduces*: an advisory published later against a version already locked
# on main surfaces here, on the daily schedule.
#
# CI calls this once on every PR, even without dependency changes, and requires
# its result in both aggregate gates. Keep the daily scan for new advisories
# when there are no PRs. No standalone PR trigger: that would duplicate CI.
on:
  workflow_call:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Separate caller/event groups so a standalone scan cannot cancel a CI audit.
# CI owns supersession of PR runs; audits never cancel each other mid-verdict.
concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-bun

      # `bun audit` reads bun.lock directly, so there is no install step and
      # no dependency code runs. `--audit-level` gates the exit status as well
      # as the report; moderate matches dependency-review.yml's threshold.
      - name: Audit bun.lock
        run: bun audit --audit-level=moderate

  cargo-audit:
    # Separate from Bun so both ecosystems report even when one audit fails.
    # Reuse deny.toml's RustSec policy; the protocol lane owns the other checks.
    name: Cargo Advisory Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny

      - name: Audit Cargo.lock
        run: cargo deny check advisories
