name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (frontend + API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHE_VERSION: v1
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mango

      - name: Restore Vite cache
        uses: actions/cache@v5
        with:
          path: apps/frontend/node_modules/.vite
          key: ${{ runner.os }}-${{ env.CACHE_VERSION }}-vite-${{ hashFiles('bun.lock', 'apps/frontend/vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_VERSION }}-vite-

      - name: Build frontend and API
        run: bun run build --all
