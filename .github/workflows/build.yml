name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (frontend + API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHE_VERSION: v1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-mango

      - uses: ./.github/actions/cache-turbo
        with:
          scope: build
          cache-version: ${{ env.CACHE_VERSION }}

      - name: Restore Vite cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: apps/frontend/node_modules/.vite
          key: ${{ runner.os }}-${{ env.CACHE_VERSION }}-vite-${{ hashFiles('bun.lock', 'apps/frontend/vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_VERSION }}-vite-

      - name: Build frontend and API
        run: bun run build --all
