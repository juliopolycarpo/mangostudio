name: Build

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source shared with distribution and browser consumers.
        type: string
        required: true
    outputs:
      artifact:
        description: Verified production frontend from the existing build job.
        value: ${{ jobs.build.outputs.artifact }}
      bun_revision:
        description: Exact Bun commit that produced the frontend.
        value: ${{ jobs.build.outputs.bun_revision }}

permissions:
  contents: read

jobs:
  build:
    name: Build (frontend + API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id && format('frontend-{0}-{1}', inputs.source_sha, github.run_attempt) || '' }}
      bun_revision: ${{ steps.identity.outputs.bun_revision }}
    env:
      # Bounds the snapshot this job restores and saves back. Each save carries
      # everything restored plus the new outputs, so without a bound the chain
      # of snapshots only grows. At the start of the run Turbo deletes the
      # oldest entries (by mtime, which the cache archive preserves) until the
      # rest fit. The value is the same in every lane; see "CI Cache Policy" in
      # docs/reference/testing.md.
      TURBO_CACHE_MAX_SIZE: 16MB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - id: setup
        uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - id: toolchain
        name: Resolve build cache toolchains
        # An empty version silently poisons the cache key, so fail here rather
        # than inside cache-scoped's validity guard.
        run: |
          set -euo pipefail
          turbo="$(bun run turbo:version | tail -n 1)"
          if [ -z "${turbo}" ]; then
            echo "::error::turbo version probe returned an empty value"
            exit 1
          fi
          echo "turbo=${turbo}" >> "$GITHUB_OUTPUT"

      # Restore here, save after the build: a combined restore-save would skip
      # its save on an exact hit and lose every output the build then computed.
      - id: turbo-cache
        uses: ./.github/actions/cache-scoped
        with:
          family: turbo
          path: .turbo/cache
          validity: build-bun-${{ steps.setup.outputs.bun-version }}-turbo-${{ steps.toolchain.outputs.turbo }}-${{ hashFiles('turbo.jsonc', 'bun.lock', 'package.json', 'apps/*/package.json', 'apps/*/turbo.json', 'packages/*/package.json', 'packages/*/turbo.json') }}
          restore-prefix: build-
          mode: restore
          rotate: "true"
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      # Clear before Turbo restores outputs: cache hits must not retain stale chunks.
      - id: frontend
        name: Build clean production frontend
        run: |
          bun ./scripts/ci/frontend-artifact.ts clean
          bun run build --frontend
          bun ./scripts/ci/frontend-artifact.ts record

      - id: identity
        name: Record producer Bun revision
        run: bun -e 'console.log("bun_revision=" + Bun.revision)' >> "$GITHUB_OUTPUT"

      # Publish before the independent API build so its failure retains these
      # bytes for diagnostics. Consumers require successful Build, rather than
      # assuming a failed reusable workflow delivers usable outputs.
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            apps/frontend/dist
            apps/frontend/dist-metafile.json
            .mango/frontend-artifact.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 7

      - name: Build API ESM bundle
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run build --api

      # Saves only when the build wrote cache entries the restored snapshot did
      # not hold, under a key that extends the stable restore prefix.
      - name: Save new Turbo outputs
        if: success()
        uses: ./.github/actions/cache-scoped
        with:
          family: turbo
          path: .turbo/cache
          validity: ${{ steps.turbo-cache.outputs.validity }}
          mode: save
          rotate: "true"
          payload-glob: "*.tar.zst"
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}
