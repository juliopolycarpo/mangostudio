name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (frontend + API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - id: toolchain
        name: Resolve build cache toolchains
        # An empty version silently poisons the cache key, so fail here rather
        # than inside cache-scoped's validity guard.
        run: |
          set -euo pipefail
          turbo="$(bun run turbo:version | tail -n 1)"
          if [ -z "${turbo}" ]; then
            echo "::error::turbo version probe returned an empty value"
            exit 1
          fi
          echo "turbo=${turbo}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/cache-scoped
        with:
          family: turbo
          path: .turbo/cache
          validity: build-bun-${{ steps.setup.outputs.bun-version }}-turbo-${{ steps.toolchain.outputs.turbo }}-${{ hashFiles('turbo.jsonc', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-prefix: build-
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Build frontend and API
        run: bun run build --all

      # Handoff to the qa-metrics job in the same run; nothing consumes it
      # afterwards, so the shortest retention GitHub allows is enough.
      - name: Upload frontend dist for QA metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: apps/frontend/dist
          retention-days: 1
