name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (frontend + API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/cache-turbo
        with:
          scope: build
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Restore Vite optimizer cache
        uses: ./.github/actions/cache-vite
        with:
          scope: build
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Build frontend and API
        run: bun run build --all

      # Handoff to the qa-metrics job in the same run; nothing consumes it
      # afterwards, so the shortest retention GitHub allows is enough.
      - name: Upload frontend dist for QA metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: apps/frontend/dist
          retention-days: 1
