name: Cargo Shim

# The workflow name stays stable because repository rules require its Gate
# check. The implementation now owns the complete root Cargo workspace: all
# workspace members build and test on the three supported runner OSes, while
# the published launcher keeps its explicit MSRV lane. The fuzz crate remains
# excluded from stable workspace builds and is resolved through its own lock.
#
# Pull requests always start the workflow so the Gate check reports even when
# the Rust lanes are irrelevant. Pushes to main keep a path filter.

on:
  pull_request:
    branches: [main, feat/rust-runtime]
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/shared/src/runtime-contract/**"
      - "apps/shared/src/runtime-home/**"
      - "apps/shared/src/external-agents/**"
      - "apps/shared/src/schema-helpers.ts"
      - "apps/shared/src/environments/toolchain-schemas.ts"
      - "apps/runtime/src/**"
      - "apps/runtime/scripts/generate-home-fixtures.ts"
      - "apps/runtime/scripts/generate-library-fixtures.ts"
      - "apps/runtime/scripts/library-backup-fixtures.ts"
      - "apps/shared/src/library/**"
      - "apps/shared/src/markdown/**"
      - "apps/runtime/package.json"
      - "apps/api/tests/integration/services/rust-runtime-qualification.integration.test.ts"
      - "apps/api/tests/integration/services/rust-runtime-external-agents-qualification.integration.test.ts"
      - "apps/api/src/modules/external-agents/application/external-identity-isolation.ts"
      - "apps/api/tests/integration/services/rust-filesystem-search-compat.integration.test.ts"
      - "apps/api/tests/integration/services/rust-snapshot-compat.integration.test.ts"
      - "apps/api/tests/integration/services/rust-command-compat.integration.test.ts"
      - "apps/api/tests/integration/services/rust-runtime-mcp-qualification.integration.test.ts"
      - "apps/api/tests/integration/services/rust-runtime-library-qualification.integration.test.ts"
      - "apps/api/tests/integration/services/rust-runtime-library-propagation.integration.test.ts"
      - "apps/api/tests/integration/services/rust-runtime-library-removal.integration.test.ts"
      - "apps/api/src/modules/library/**"
      - "apps/api/tests/support/fixtures/mcp/qualification-mcp-server.ts"
      - "apps/api/src/services/mcp/**"
      - "apps/api/tests/integration/routes/rust-runtime-qualification-connect.integration.test.ts"
      - "apps/api/tests/support/rust-runtime-binary.ts"
      - "apps/api/tests/support/rust-runtime-assertions.ts"
      - "apps/api/tests/support/rust-runtime-install-fixture.ts"
      - "apps/api/tests/support/rust-runtime-client.ts"
      - "apps/api/tests/support/rust-stdio-runtime.ts"
      - "apps/api/tests/support/rust-serve-runtime.ts"
      - "apps/api/tests/support/fixtures/rust-filesystem-search-recorded.ts"
      - "apps/api/tests/integration/routes/terminal-socket.integration.test.ts"
      - "apps/api/tests/integration/routes/environment-entities.integration.test.ts"
      - "apps/api/tests/integration/services/hub-isolation-claim.integration.test.ts"
      - "apps/api/tests/integration/services/connect-http-runtime.integration.test.ts"
      - "apps/api/tests/integration/services/environment-install-execution.integration.test.ts"
      - "apps/api/tests/integration/modules/library/library-undo-missing-backup.integration.test.ts"
      - "apps/api/tests/unit/services/tools/support/target-home.ts"
      - "apps/api/tests/unit/services/tools/read-file-tool.test.ts"
      - "apps/api/tests/unit/services/tools/write-file-tool.test.ts"
      - "apps/api/tests/unit/services/tools/list-directory-tool.test.ts"
      - "apps/api/tests/unit/services/tools/glob-tool.test.ts"
      - "apps/api/tests/support/rust-library-boxes.ts"
      - "apps/api/src/services/runtime-client/**"
      - "apps/api/src/lib/runtime-paths.ts"
      - "apps/api/src/modules/environments/http/runtime-socket-routes.ts"
      - "apps/api/src/modules/environments/application/runtime-pairing-service.ts"
      - "apps/api/src/modules/environments/infrastructure/runtime-pairing-repository.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/cargo-shim.yml"
      - ".github/actions/setup-zigbuild/**"
      - ".cargo/config.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-shim-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changed.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changed
        name: Check Rust workspace paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          if [ ! -s "$RUNNER_TEMP/changed-files" ]; then
            echo "changes job: empty diff between $BASE_SHA and $HEAD_SHA; refusing to skip the Rust lanes" >&2
            exit 1
          fi

          # The TypeScript-side paths this feeds — runtime-home.ts, the
          # runtime host's own config parser, the fixture generator,
          # apps/shared/src/runtime-home, and the whole chain its schemas
          # import from (external-agents, schema-helpers,
          # environments/toolchain-schemas), plus the package.json that
          # names the generator's script — feed the ts-home half of
          # `runtime-home-fixture-freshness`: a TypeScript-only PR touching
          # only those must still run this workflow, or that job's own
          # regenerate-and-diff step never runs and ts-home goes stale
          # silently — the same gap the job itself exists to close. The
          # qualification suite's own test and support files feed
          # `real-binary-qualification` the identical way. So does the hub
          # code that job's own tests actually exercise
          # (apps/api/src/services/runtime-client/, the local-launch path
          # in runtime-paths.ts, the paired-connect accept route, and the
          # pairing service/repository it depends on) -- without these, a
          # change that broke spawnRuntimeChild's cancellation path, say,
          # touches none of the paths above, rust evaluates false, the job
          # is skipped and allowed to be, and Gate reports green having
          # exercised none of it. The library readers' TypeScript baseline
          # (apps/shared/src/library/, apps/shared/src/markdown/) and its
          # corpus generator feed the ts-library half of the same freshness
          # job, so a TypeScript-only change to them reruns the parity check.
          relevant='^(crates/|apps/shared/src/runtime-contract/|apps/shared/src/runtime-home/|apps/shared/src/external-agents/|apps/shared/src/schema-helpers\.ts$|apps/shared/src/environments/toolchain-schemas\.ts$|apps/runtime/src/|apps/runtime/scripts/generate-home-fixtures\.ts$|apps/runtime/scripts/(generate-library-fixtures|library-backup-fixtures)\.ts$|apps/shared/src/library/|apps/shared/src/markdown/|apps/runtime/package\.json$|apps/api/tests/integration/services/(rust-runtime-qualification|rust-runtime-external-agents-qualification|rust-filesystem-search-compat|rust-snapshot-compat|rust-command-compat|rust-runtime-mcp-qualification|rust-runtime-library-qualification|rust-runtime-library-propagation|rust-runtime-library-removal)\.integration\.test\.ts$|apps/api/tests/support/fixtures/mcp/qualification-mcp-server\.ts$|apps/api/src/services/mcp/|apps/api/src/modules/external-agents/application/external-identity-isolation\.ts$|apps/api/src/modules/library/|apps/api/tests/integration/routes/rust-runtime-qualification-connect\.integration\.test\.ts$|apps/api/tests/support/rust-runtime-binary\.ts$|apps/api/tests/support/rust-runtime-assertions\.ts$|apps/api/tests/support/rust-runtime-install-fixture\.ts$|apps/api/tests/support/(rust-runtime-client|rust-stdio-runtime|rust-serve-runtime)\.ts$|apps/api/tests/support/fixtures/rust-filesystem-search-recorded\.ts$|apps/api/tests/integration/routes/(terminal-socket|environment-entities)\.integration\.test\.ts$|apps/api/tests/integration/services/(hub-isolation-claim|connect-http-runtime|environment-install-execution)\.integration\.test\.ts$|apps/api/tests/integration/modules/library/library-undo-missing-backup\.integration\.test\.ts$|apps/api/tests/unit/services/tools/(support/target-home|read-file-tool|write-file-tool|list-directory-tool|glob-tool)\.(ts|test\.ts)$|apps/api/tests/support/rust-library-boxes\.ts$|apps/api/src/services/runtime-client/|apps/api/src/lib/runtime-paths\.ts$|apps/api/src/modules/environments/http/runtime-socket-routes\.ts$|apps/api/src/modules/environments/application/runtime-pairing-service\.ts$|apps/api/src/modules/environments/infrastructure/runtime-pairing-repository\.ts$|Cargo\.(toml|lock)$|deny\.toml$|rustfmt\.toml$|rust-toolchain\.toml$|\.github/workflows/cargo-shim\.yml$|\.github/actions/setup-zigbuild/|\.cargo/config\.toml$)'
          if grep -Eq "$relevant" "$RUNNER_TEMP/changed-files"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  workspace:
    name: Workspace (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The runtime's MCP tests launch a small stdio MCP server fixture with Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: cargo test --workspace --all-targets --all-features --locked

      # `--all-targets` above excludes doctests by definition, and the doc
      # comments across this workspace (`mangostudio-runtime`,
      # `mangostudio-runtime-contract`) carry runnable examples of their
      # own. `protocol-ci.yml` runs both of these for the protocol crate,
      # but only when its own path filter fires, so a runtime-only PR needs
      # its own copy of the gate. Ubuntu-only: this checks the doc
      # comments compile and run, not a platform-specific behaviour.
      - name: Run doctests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --doc --workspace --all-features --locked

      - name: Build API docs (deny warnings)
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --no-deps --workspace --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - run: cargo build --workspace --locked

  launcher-msrv:
    name: Launcher MSRV
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # This outranks the root rust-toolchain.toml, so the launcher cannot
      # silently drift from the floor declared in its Cargo.toml.
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo check -p mangostudio --all-targets --locked

      - run: cargo clippy -p mangostudio --all-targets --locked -- -D warnings

      - run: cargo test -p mangostudio --all-targets --locked

  musl-clippy:
    # The shipped Alpine runtimes compile against musl's libc bindings, whose
    # types differ from glibc's (c_int ioctl requests, a deprecated time_t),
    # and no other lane compiles for musl. Clippy through cargo-zigbuild gives
    # the C dependencies a musl toolchain and fails on any musl-only warning.
    name: Runtime clippy (musl)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - uses: ./.github/actions/setup-zigbuild

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo-zigbuild clippy --locked -p mangostudio-runtime --all-targets --target x86_64-unknown-linux-musl -- -D warnings

      - run: cargo-zigbuild clippy --locked -p mangostudio-runtime --all-targets --target aarch64-unknown-linux-musl -- -D warnings

  fuzz-workspace:
    name: Fuzz workspace metadata
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: cargo metadata --manifest-path crates/mango-protocol/fuzz/Cargo.toml --locked --no-deps --format-version 1

  runtime-home-fixture-freshness:
    # Both `tests/fixtures/rust-home` and `tests/fixtures/ts-home` are
    # committed output, not built at test time: `ts_compat.rs` reads
    # `ts-home` directly, and `generate_rust_fixture.rs`'s own
    # `#[ignore]`d regenerator (plus
    # `apps/runtime/tests/unit/runtime-home-rust-compat.test.ts`) reads
    # `rust-home`. Nothing else regenerates either one, so if either
    # language's write shape ever changes, both keep passing against a
    # stale fixture and silently stop proving anything about the direction
    # they cover. This job is the freshness check that gap needs for both
    # directions: it is the only place either regenerator actually runs.
    #
    # Each freshness check stages the fixture directory before diffing the
    # index against `HEAD`, not a plain `git diff --exit-code` against the
    # worktree: staging is what makes a brand-new file the regenerator
    # starts emitting show up as a failure too, not only a changed byte in
    # a file that already existed.
    name: Runtime-home fixture freshness
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo test -p mangostudio-runtime --test generate_rust_fixture --locked -- --ignored

      - name: Fail if regenerating changed the committed rust-home fixture
        run: |
          git add -A -- crates/mangostudio-runtime/tests/fixtures/rust-home
          git diff --cached --exit-code -- crates/mangostudio-runtime/tests/fixtures/rust-home

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run --filter @mangostudio/runtime fixtures:home

      - name: Fail if regenerating changed the committed ts-home fixture
        run: |
          git add -A -- crates/mangostudio-runtime/tests/fixtures/ts-home
          git diff --cached --exit-code -- crates/mangostudio-runtime/tests/fixtures/ts-home

      # `src/library/ts_compat_tests.rs` replays this corpus; regenerating it
      # from the real TypeScript readers is the only thing that notices a
      # baseline change the committed file no longer describes.
      - run: bun run --filter @mangostudio/runtime fixtures:library

      - name: Fail if regenerating changed the committed ts-library corpus
        run: |
          git add -A -- crates/mangostudio-runtime/tests/fixtures/ts-library
          git diff --cached --exit-code -- crates/mangostudio-runtime/tests/fixtures/ts-library

  real-binary-qualification:
    # Proves the hub's own real code actually talks to the real compiled
    # mangostudio-runtime binary over its three transports (stdio, direct-URL
    # serve, paired connect) — every other apps/api integration test spawns
    # or dials the TypeScript in-process runtime instead. Targets the `rust-*`
    # qualification and compat files directly rather than the whole apps/api
    # suite, which does not need a Rust binary at all.
    name: Real-binary qualification (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runtime-binary: target/debug/mangostudio-runtime
            fake-cursor-agent: target/debug/examples/fake_cursor_agent
          - os: macos-latest
            runtime-binary: target/debug/mangostudio-runtime
            fake-cursor-agent: target/debug/examples/fake_cursor_agent
          - os: windows-latest
            runtime-binary: target/debug/mangostudio-runtime.exe
            fake-cursor-agent: target/debug/examples/fake_cursor_agent.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo build -p mangostudio-runtime --locked

      # A separate invocation on purpose: the stand-in vendor needs the SDK's
      # `testing` feature, and building it with the runtime binary would
      # unify that feature into the binary under qualification.
      - run: cargo build -p mangostudio-runtime --example fake_cursor_agent --locked

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Qualify the real binary over stdio, serve, and connect
        working-directory: apps/api
        env:
          MANGOSTUDIO_RUNTIME_BINARY: ${{ github.workspace }}/${{ matrix.runtime-binary }}
          MANGOSTUDIO_FAKE_CURSOR_AGENT: ${{ github.workspace }}/${{ matrix.fake-cursor-agent }}
          MANGOSTUDIO_DIAGNOSTIC_LOGS: "0"
        run: >
          bun test --timeout 15000
          tests/integration/services/rust-runtime-qualification.integration.test.ts
          tests/integration/services/rust-runtime-external-agents-qualification.integration.test.ts
          tests/integration/services/rust-filesystem-search-compat.integration.test.ts
          tests/integration/services/rust-snapshot-compat.integration.test.ts
          tests/integration/services/rust-command-compat.integration.test.ts
          tests/integration/services/rust-runtime-mcp-qualification.integration.test.ts
          tests/integration/services/rust-runtime-library-qualification.integration.test.ts
          tests/integration/services/rust-runtime-library-propagation.integration.test.ts
          tests/integration/services/rust-runtime-library-removal.integration.test.ts
          tests/integration/routes/rust-runtime-qualification-connect.integration.test.ts
          tests/integration/routes/terminal-socket.integration.test.ts
          tests/integration/routes/environment-entities.integration.test.ts
          tests/integration/services/hub-isolation-claim.integration.test.ts
          tests/integration/services/connect-http-runtime.integration.test.ts
          tests/integration/services/environment-install-execution.integration.test.ts
          tests/integration/modules/library/library-undo-missing-backup.integration.test.ts

      # The `~` cases of the file tools, which spawn the binary as Local. Unit
      # files, so they keep the unit lane's one isolated worker.
      - name: Qualify ~ expansion against the real binary
        working-directory: apps/api
        env:
          MANGOSTUDIO_RUNTIME_BINARY: ${{ github.workspace }}/${{ matrix.runtime-binary }}
          MANGOSTUDIO_DIAGNOSTIC_LOGS: "0"
        run: >
          bun test --timeout 15000 --parallel=1
          tests/unit/services/tools/read-file-tool.test.ts
          tests/unit/services/tools/write-file-tool.test.ts
          tests/unit/services/tools/list-directory-tool.test.ts
          tests/unit/services/tools/glob-tool.test.ts

  gate:
    # Stable required check ("Cargo Shim / Gate"): all Rust lanes may skip only
    # after the changes job proves the pull request has no Rust workspace diff.
    name: Gate
    needs: [
      changes,
      workspace,
      launcher-msrv,
      musl-clippy,
      fuzz-workspace,
      runtime-home-fixture-freshness,
      real-binary-qualification,
    ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Evaluate mandatory job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ needs.changes.outputs.rust == 'false' && 'workspace launcher-msrv musl-clippy fuzz-workspace runtime-home-fixture-freshness real-binary-qualification' || '' }}
        # Dependency-free script; runs without `bun install`.
        run: bun ./scripts/ci/evaluate-gate.ts
