name: Cargo Shim

# The workflow name stays stable because repository rules require its Gate
# check. The implementation now owns the complete root Cargo workspace: all
# workspace members build and test on the three supported runner OSes, while
# the published launcher keeps its explicit MSRV lane. The fuzz crate remains
# excluded from stable workspace builds and is resolved through its own lock.
#
# Pull requests always start the workflow so the Gate check reports even when
# the Rust lanes are irrelevant. Pushes to main keep a path filter.

on:
  pull_request:
    branches: [main, feat/rust-runtime]
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/shared/src/runtime-contract/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/cargo-shim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-shim-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changed.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changed
        name: Check Rust workspace paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          if [ ! -s "$RUNNER_TEMP/changed-files" ]; then
            echo "changes job: empty diff between $BASE_SHA and $HEAD_SHA; refusing to skip the Rust lanes" >&2
            exit 1
          fi

          relevant='^(crates/|apps/shared/src/runtime-contract/|Cargo\.(toml|lock)$|deny\.toml$|rustfmt\.toml$|rust-toolchain\.toml$|\.github/workflows/cargo-shim\.yml$)'
          if grep -Eq "$relevant" "$RUNNER_TEMP/changed-files"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  workspace:
    name: Workspace (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - run: cargo test --workspace --all-targets --all-features --locked

      - run: cargo build --workspace --locked

  launcher-msrv:
    name: Launcher MSRV
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # This outranks the root rust-toolchain.toml, so the launcher cannot
      # silently drift from the floor declared in its Cargo.toml.
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo check -p mangostudio --all-targets --locked

      - run: cargo clippy -p mangostudio --all-targets --locked -- -D warnings

      - run: cargo test -p mangostudio --all-targets --locked

  fuzz-workspace:
    name: Fuzz workspace metadata
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: cargo metadata --manifest-path crates/mango-protocol/fuzz/Cargo.toml --locked --no-deps --format-version 1

  runtime-home-fixture-freshness:
    # `tests/fixtures/rust-home` is committed output, not built at test time:
    # `ts_compat.rs` reads a TypeScript-written fixture directly, and
    # `apps/runtime/tests/unit/runtime-home-rust-compat.test.ts` reads this
    # one. Neither test regenerates it, so if `write_runtime_slot_config`'s
    # output shape ever changes, both keep passing against a stale fixture
    # and silently stop proving anything about the direction it covers. This
    # job is the freshness check that gap needs: it is the only place
    # `generate_rust_fixture.rs`'s `#[ignore]`d regenerator actually runs.
    name: Runtime-home fixture freshness
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo test -p mangostudio-runtime --test generate_rust_fixture --locked -- --ignored

      - name: Fail if regenerating changed the committed fixture
        run: git diff --exit-code -- crates/mangostudio-runtime/tests/fixtures/rust-home

  gate:
    # Stable required check ("Cargo Shim / Gate"): all Rust lanes may skip only
    # after the changes job proves the pull request has no Rust workspace diff.
    name: Gate
    needs: [changes, workspace, launcher-msrv, fuzz-workspace, runtime-home-fixture-freshness]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Evaluate mandatory job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ needs.changes.outputs.rust == 'false' && 'workspace launcher-msrv fuzz-workspace runtime-home-fixture-freshness' || '' }}
        # Dependency-free script; runs without `bun install`.
        run: bun ./scripts/ci/evaluate-gate.ts
