name: Cargo Shim

# Lints, tests, and builds the crates.io launcher crate. This is the only Rust
# in the repository, so the heavy lane only runs when Rust paths change — but
# the workflow itself triggers on every PR: path detection happens in the
# cheap `changes` job so the `Cargo Shim / Gate` check below always reports
# and is safe to require in branch protection (a path-filtered workflow that
# never starts leaves a required check pending forever). Pushes to main keep
# the path filter; required checks only apply to PRs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "packages/cargo-shim/**"
      - ".github/workflows/cargo-shim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-shim-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cargo_shim: ${{ steps.changed.outputs.cargo_shim }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: changed
        name: Check cargo shim paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "cargo_shim=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          if grep -Eq '^(packages/cargo-shim/|\.github/workflows/cargo-shim\.yml$)' "$RUNNER_TEMP/changed-files"; then
            echo "cargo_shim=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_shim=false" >> "$GITHUB_OUTPUT"
          fi

  cargo-shim:
    name: fmt, clippy, test, build
    needs: [changes]
    if: needs.changes.outputs.cargo_shim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/cargo-shim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - run: cargo fmt --check

      - run: cargo clippy --all-targets --locked -- -D warnings

      - run: cargo test --locked

      - run: cargo build --locked

  gate:
    # Always-reporting aggregate ("Cargo Shim / Gate"): accepts the Rust lane
    # as skipped only when the `changes` job proved no Rust path changed.
    name: Gate
    needs: [changes, cargo-shim]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Evaluate mandatory job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ needs.changes.outputs.cargo_shim == 'false' && 'cargo-shim' || '' }}
        # Dependency-free script; runs without `bun install`.
        run: bun ./scripts/ci/evaluate-gate.ts
