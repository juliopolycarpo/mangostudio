name: Cargo Shim

# The workflow name stays stable because repository rules require its Gate
# check. The implementation now owns the complete root Cargo workspace: all
# workspace members build and test on the three supported runner OSes, and the
# minimum supported Rust is enforced here for every Rust path: the workspace
# floor (`workspace-msrv`, plus `target-msrv` for the Windows and macOS code
# Linux never compiles) and the published launcher's lower, explicit floor
# (`launcher-msrv`). The fuzz crate remains excluded from stable workspace
# builds and is resolved through its own lock.
#
# Pull requests always start the workflow so the Gate check reports even when
# the Rust lanes are irrelevant. Pushes to main keep a path filter.
#
# Which paths make which lane relevant, and which api tests the real-binary
# lane runs, live in one manifest: scripts/lib/rust-lanes.ts. The push filter
# below, the `changes` job, and the qualification steps all derive from it.

on:
  pull_request:
    branches: [main, feat/rust-runtime, feat/external-agents-sdk-adoption]
  push:
    branches: [main]
    paths:
      # Generated from scripts/lib/rust-lanes.ts QUALIFICATION_PATHS; the
      # rust-lanes unit test fails if the two differ.
      - "crates/**"
      - "apps/shared/src/runtime-contract/**"
      - "apps/shared/src/runtime-home/**"
      - "apps/shared/src/external-agents/**"
      - "apps/shared/src/schema-helpers.ts"
      - "apps/shared/src/environments/toolchain-schemas.ts"
      - "apps/shared/src/library/**"
      - "apps/shared/src/markdown/**"
      - "spec/**"
      - "scripts/tests/support/SHA256SUMS.sample"
      - "packages/protocol/src/testing/conformance.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/workflows/cargo-shim.yml"
      - ".github/workflows/rust-coverage.yml"
      - ".github/actions/setup-zigbuild/**"
      - "apps/api/**"
      - "apps/shared/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - "patches/**"
      - "packages/protocol/**"
      - "scripts/lib/rust-lanes.ts"
      - "scripts/ci/rust-lanes.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-shim-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changed.outputs.rust }}
      qualification: ${{ steps.changed.outputs.qualification }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - id: changed
        name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # RUST_WORKSPACE_PATHS decides the Rust workspace lanes and
        # QUALIFICATION_PATHS (a superset: the whole hub and shared tree)
        # decides real-binary-qualification; both in scripts/lib/rust-lanes.ts.
        # The script refuses an empty diff instead of skipping every lane.
        # Dependency-free script; runs without `bun install`.
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "qualification=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          bun ./scripts/ci/rust-lanes.ts relevance "$RUNNER_TEMP/changed-files" > "$RUNNER_TEMP/lanes"
          cat "$RUNNER_TEMP/lanes" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/lanes"

  workspace:
    name: Workspace (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show active-toolchain

      # Every rust-cache step keys on the root manifest and saves only from
      # main; scripts/tests/cache-policy.unit.test.ts explains and pins both.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The runtime's MCP tests launch a small stdio MCP server fixture with Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Ubuntu's copy of this run is `cargo llvm-cov` in rust-coverage.yml,
      # called from ci.yml: same flags, same libtest runner, same test set,
      # instrumented so the QA report can show per-crate coverage. It lives in
      # the CI run because that is where the QA collector reads artifacts, and
      # CI / Gate requires it there. macOS and Windows keep the plain run here.
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --workspace --all-targets --all-features --locked

      # `--all-targets` above excludes doctests by definition, and the doc
      # comments across this workspace (`mangostudio-runtime`,
      # `mangostudio-runtime-contract`) carry runnable examples of their
      # own. This is the one Ubuntu run for every crate, the protocol crate
      # included: `protocol-ci.yml` no longer repeats it there, and only adds
      # macOS and Windows, where that crate's `cfg`-gated transports have
      # doctests and intra-doc links of their own.
      - name: Run doctests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --doc --workspace --all-features --locked

      - name: Build API docs (deny warnings)
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --no-deps --workspace --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - run: cargo build --workspace --locked

  workspace-windows-arm64:
    # Nothing else runs `cargo test` on Windows ARM64: distribution only
    # cross-compiles that target from an x64 runner and smoke-binary only boots
    # the built binary. The runtime holds the Windows-specific I/O, named-pipe
    # and process code, so its own tests run natively on the ARM64 runner, with
    # the same flags as the x64 `workspace` job. Scoped to the runtime package:
    # the protocol crate's and the contract's tests are architecture-neutral
    # and already run on x64. Behind the same Rust signal as every lane here,
    # which `crates/**` selects, and part of this workflow's one `Gate`.
    name: Workspace (windows-11-arm)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: windows-arm64

      # The runtime's MCP tests launch a small stdio MCP server fixture with Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: cargo test -p mangostudio-runtime --all-targets --all-features --locked

  workspace-msrv:
    # The workspace floor is `rust-version` in the root Cargo.toml (stable minus
    # two minors), which every member but the launcher inherits. It lives here,
    # on the shared Rust signal, rather than in Protocol CI: that workflow's
    # signal is protocol paths only, so a runtime-only change skipped the floor
    # entirely. Every path that can change what this compiles is already in
    # RUST_WORKSPACE_PATHS, so a protocol-crate edit still reaches this lane.
    #
    # `RUSTUP_TOOLCHAIN` outranks the root rust-toolchain.toml (1.99.0) for every
    # step, including rust-cache's compiler fingerprint and the build scripts'
    # `rustc`, so no later command can silently be checked against 1.99.0.
    # cargo-shim.yml's test pins this value to the manifest's rust-version.
    #
    # Two commands, because the shipped artefacts and the test tree differ:
    # the first is what `cargo build --workspace` ships (default features, lib
    # and bin targets); the second adds tests, examples and benches with every
    # feature on, so a floor-breaking API used only there fails too.
    name: Workspace MSRV (1.97.0)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup toolchain install 1.97.0 --profile minimal

      # Keyed apart from the 1.99.0 lanes' entries; the toolchain is part of
      # rust-cache's own key, and `key` names this lane in the cache list.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: msrv

      - run: cargo check --workspace --locked

      - run: cargo check --workspace --all-targets --all-features --locked

  target-msrv:
    # `cfg(windows)` and `cfg(target_os = "macos")` code (named pipes, handle
    # based file I/O, the guardian and probing backends) is not compiled by the
    # Linux lane above, and the native 1.99.0 tests in `workspace` prove nothing
    # about the floor. A native `cargo check` on the floor toolchain closes
    # that, one runner per target: macOS arm64 (the runner's own architecture),
    # and both shipped Windows architectures, ARM64 cross-checked from the x64
    # runner, whose image carries the ARM64 MSVC tools (runtime-build.yml
    # builds the same target there). Check only: it compiles every target kind
    # without linking or running, which is all a minimum-version claim needs.
    # musl keeps its own 1.99.0 clippy lane and is not repeated here.
    name: Target MSRV (${{ matrix.target }})
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
      # Through the environment, never interpolated into a script (zizmor's
      # template-injection rule); bash on every runner so `$TARGET` expands.
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup toolchain install 1.97.0 --profile minimal --target "$TARGET"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: msrv-${{ matrix.target }}

      - run: cargo check --workspace --all-targets --all-features --locked --target "$TARGET"

  launcher-msrv:
    name: Launcher MSRV
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # This outranks the root rust-toolchain.toml, so the launcher cannot
      # silently drift from the floor declared in its Cargo.toml.
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo check -p mangostudio --all-targets --locked

      - run: cargo clippy -p mangostudio --all-targets --locked -- -D warnings

      - run: cargo test -p mangostudio --all-targets --locked

  musl-clippy:
    # The shipped Alpine runtimes compile against musl's libc bindings, whose
    # types differ from glibc's (c_int ioctl requests, a deprecated time_t),
    # and no other lane compiles for musl. Clippy through cargo-zigbuild gives
    # the C dependencies a musl toolchain and fails on any musl-only warning.
    name: Runtime clippy (musl)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - uses: ./.github/actions/setup-zigbuild

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo-zigbuild clippy --locked -p mangostudio-runtime --all-targets --target x86_64-unknown-linux-musl -- -D warnings

      - run: cargo-zigbuild clippy --locked -p mangostudio-runtime --all-targets --target aarch64-unknown-linux-musl -- -D warnings

  fuzz-workspace:
    name: Fuzz workspace metadata
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Resolving is the point: `--no-deps` skips the resolve, so a lock left
      # stale by a shared-dependency bump in the main workspace still passed.
      # `--locked` makes a stale lock a failure instead of a rewrite;
      # `--all-features` also names the optional `tokio` feature set.
      - run: cargo metadata --manifest-path crates/mango-protocol/fuzz/Cargo.toml --locked --all-features --format-version 1 > /dev/null

  runtime-home-fixture-freshness:
    # `tests/fixtures/rust-home` is committed output, not built at test time:
    # `generate_rust_fixture.rs`'s own `#[ignore]`d regenerator writes it and
    # the hub's slot probe test
    # (`apps/api/tests/unit/cli/runtime-slot-probe-rust-home.test.ts`) reads
    # it. Nothing else regenerates it, so if the Rust write shape ever
    # changes, both keep passing against a stale fixture. This job is the
    # only place the regenerator actually runs. It stages the fixture
    # directory before diffing the index against `HEAD`, not a plain
    # `git diff --exit-code` against the worktree: staging is what makes a
    # brand-new file the regenerator starts emitting show up as a failure
    # too, not only a changed byte in a file that already existed.
    #
    # `tests/fixtures/ts-home` and `tests/fixtures/ts-library` are frozen.
    # They record what the TypeScript runtime wrote and answered before it was
    # deleted, and `ts_compat.rs` / `src/library/ts_compat_tests.rs` replay
    # them so a Rust runtime keeps reading homes and backup sets that runtime
    # left on operators' machines. Their generators went with it, so there is
    # nothing to regenerate; instead the job pins each directory's git tree,
    # and a change to either has to update the pin here on purpose.
    name: Runtime-home fixture freshness
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo test -p mangostudio-runtime --test generate_rust_fixture --locked -- --ignored

      - name: Fail if regenerating changed the committed rust-home fixture
        run: |
          git add -A -- crates/mangostudio-runtime/tests/fixtures/rust-home
          git diff --cached --exit-code -- crates/mangostudio-runtime/tests/fixtures/rust-home

      - name: Fail if a frozen TypeScript-runtime fixture changed
        env:
          TS_HOME_TREE: 814a421cef442f2dd6c24b13a70fcea00e45576b
          TS_LIBRARY_TREE: 5ecbf15d46a87ac2c2e8c24dc9d14a47a76b209e
        run: |
          status=0
          for pinned in "ts-home:$TS_HOME_TREE" "ts-library:$TS_LIBRARY_TREE"; do
            name="${pinned%%:*}"
            expected="${pinned#*:}"
            actual="$(git rev-parse "HEAD:crates/mangostudio-runtime/tests/fixtures/$name")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::frozen fixture $name changed: expected tree $expected | received $actual" >&2
              status=1
            fi
          done
          exit "$status"

  real-binary-qualification:
    # Proves the hub's own real code actually talks to the real compiled
    # mangostudio-runtime binary over its three transports (stdio, direct-URL
    # serve, paired connect), on every OS. Runs every api test file that
    # reaches tests/support/rust-runtime-binary.ts, discovered by
    # scripts/lib/rust-lanes.ts, rather than the whole apps/api suite.
    name: Real-binary qualification (${{ matrix.os }})
    needs: [changes]
    if: needs.changes.outputs.qualification == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runtime-binary: target/debug/mangostudio-runtime
            fake-cursor-agent: target/debug/examples/fake_cursor_agent
          - os: macos-latest
            runtime-binary: target/debug/mangostudio-runtime
            fake-cursor-agent: target/debug/examples/fake_cursor_agent
          - os: windows-latest
            runtime-binary: target/debug/mangostudio-runtime.exe
            fake-cursor-agent: target/debug/examples/fake_cursor_agent.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show active-toolchain

      # The same two builds as the local-runtime action CI runs, so both jobs
      # share one entry per OS instead of storing the same build twice.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: local-runtime

      - run: cargo build -p mangostudio-runtime --locked

      # A separate invocation on purpose: the stand-in vendor needs the SDK's
      # `testing` feature, and building it with the runtime binary would
      # unify that feature into the binary under qualification.
      - run: cargo build -p mangostudio-runtime --example fake_cursor_agent --locked

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Qualify the real binary over stdio, serve, and connect
        env:
          MANGOSTUDIO_RUNTIME_BINARY: ${{ github.workspace }}/${{ matrix.runtime-binary }}
          MANGOSTUDIO_FAKE_CURSOR_AGENT: ${{ github.workspace }}/${{ matrix.fake-cursor-agent }}
          MANGOSTUDIO_DIAGNOSTIC_LOGS: "0"
        run: bun ./scripts/ci/rust-lanes.ts qualify --suite integration

      # The Rust-backed unit files (the `~` cases of the file tools, which
      # spawn the binary as Local) keep the unit lane's one isolated worker.
      - name: Qualify ~ expansion against the real binary
        env:
          MANGOSTUDIO_RUNTIME_BINARY: ${{ github.workspace }}/${{ matrix.runtime-binary }}
          MANGOSTUDIO_DIAGNOSTIC_LOGS: "0"
        run: bun ./scripts/ci/rust-lanes.ts qualify --suite unit

  gate:
    # Stable required check ("Cargo Shim / Gate"): each Rust lane may skip only
    # after the changes job proves its relevance predicate false for this run.
    name: Gate
    needs: [
      changes,
      workspace,
      workspace-windows-arm64,
      workspace-msrv,
      target-msrv,
      launcher-msrv,
      musl-clippy,
      fuzz-workspace,
      runtime-home-fixture-freshness,
      real-binary-qualification,
    ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Evaluate mandatory job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ format('{0} {1}', needs.changes.outputs.rust == 'false' && 'workspace workspace-windows-arm64 workspace-msrv target-msrv launcher-msrv musl-clippy fuzz-workspace runtime-home-fixture-freshness' || '', needs.changes.outputs.qualification == 'false' && 'real-binary-qualification' || '') }}
        # Dependency-free script; runs without `bun install`.
        run: bun ./scripts/ci/evaluate-gate.ts
