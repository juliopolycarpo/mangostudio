name: Runtime Build

# Builds the cargo `mangostudio-runtime` once per release platform and hands
# each binary to the caller as an artifact laid out for
# `bun run build --binary --runtime-dir <dir>`:
# `<dir>/<platform-id>/mangostudio-runtime[.exe]`. The hub stays Bun-compiled
# in the caller's packaging job; only this sibling comes from here.
#
# Toolchains: every Linux target links through cargo-zigbuild on one Ubuntu
# image (gnu at the GLIBC_2.17 floor, musl static), darwin targets build with
# Xcode on macOS, and both Windows targets build with MSVC on a Windows x64
# runner (arm64 cross-compiled, since the image carries the ARM64 MSVC tools
# and LLVM that ring's aarch64 assembly needs). `scripts/build-runtime.ts`
# checks every binary's header, and asks each one this runner can execute for
# its version.

on:
  workflow_call:
    inputs:
      version:
        description: Release version stamped into every runtime binary.
        type: string
        required: true
      source_sha:
        description: Exact source commit to build.
        type: string
        required: true
      platforms:
        description: JSON array of release platform ids to build.
        type: string
        default: '["linux-x64","linux-arm64","linux-x64-musl","linux-arm64-musl","darwin-x64","darwin-arm64","windows-x64","windows-arm64"]'
      artifact_prefix:
        description: Artifact name prefix; each platform uploads `<prefix>-<platform-id>`.
        type: string
        required: true
      profile:
        description: Artifact profile, shipping (fat LTO/1 unit) or light (thin LTO/16 units, PR only).
        type: string
        default: shipping
      cache:
        description: >-
          Restore matching-profile dependency state from the cargo cache main
          writes. Release builds leave it off, and main only looks the entry
          up, so a published binary never starts from restored state. Light
          caches have no seed writer until measured cache admission is proven.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime ${{ matrix.platform }}
    runs-on: ${{ startsWith(matrix.platform, 'linux-') && 'ubuntu-latest' || startsWith(matrix.platform, 'darwin-') && 'macos-latest' || 'windows-latest' }}
    timeout-minutes: 30
    # Job-level CARGO overrides isolate rust-cache's environment hash before
    # restore and build. A light miss cannot fall back to the shipping key.
    # Shipping has no overrides, preserving its existing cache environment.
    env: ${{ inputs.profile == 'light' && fromJSON('{"CARGO_PROFILE_RELEASE_LTO":"thin","CARGO_PROFILE_RELEASE_CODEGEN_UNITS":"16"}') || fromJSON('{}') }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - name: Validate runtime artifact profile
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_PROFILE: ${{ inputs.profile }}
        # Before checkout, Cargo setup, or cache access. Every non-PR artifact
        # remains shipping; future cache-only seeds need a separate path.
        run: |
          case "$BUILD_PROFILE" in
            shipping)
              if [ -n "${CARGO_PROFILE_RELEASE_LTO:-}" ] || [ -n "${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-}" ]; then
                printf 'expected shipping profile: no lto/codegen-units overrides | received: lto=%s, codegen-units=%s\n' \
                  "${CARGO_PROFILE_RELEASE_LTO:-<unset>}" "${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-<unset>}" >&2
                exit 1
              fi
              ;;
            light)
              if [ "$EVENT_NAME" != "pull_request" ]; then
                echo 'expected profile: shipping | received: light' >&2
                exit 1
              fi
              if [ "${CARGO_PROFILE_RELEASE_LTO:-}" != "thin" ] || [ "${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-}" != "16" ]; then
                printf 'expected light profile: lto=thin, codegen-units=16 | received: lto=%s, codegen-units=%s\n' \
                  "${CARGO_PROFILE_RELEASE_LTO:-<unset>}" "${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-<unset>}" >&2
                exit 1
              fi
              ;;
            *)
              printf 'expected profile: shipping or light | received: %s\n' "$BUILD_PROFILE" >&2
              exit 1
              ;;
          esac
          printf 'runtime profile: %s (lto=%s, codegen-units=%s)\n' \
            "$BUILD_PROFILE" "${CARGO_PROFILE_RELEASE_LTO:-fat}" "${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-1}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Installs the toolchain rust-toolchain.toml pins.
      - run: rustup show active-toolchain

      - name: Install zig and cargo-zigbuild
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-zigbuild

      # One cache per platform and profile, shared by callers that opt in.
      # Pull requests restore only their profile but never save one. Light
      # starts cold until its separate cache-only seeds are admitted.
      # Main never restores because canary publishes its distribution:
      # `lookup-only` checks for the entry, and a miss may save this clean
      # shipping generation. Light PRs never restore that shipping entry.
      # prefix-key hashes the root manifest because rust-cache's own key
      # ignores [profile.*].
      - name: Restore the cargo cache
        if: inputs.cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: runtime-build-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          lookup-only: ${{ github.ref == 'refs/heads/main' }}

      - name: Build runtime
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.version }}
        # `--zig` only changes how Linux targets link; it is inert elsewhere.
        # Dependency-free script; runs without `bun install`.
        run: bun --no-install ./scripts/build-runtime.ts --platform "$PLATFORM" --zig --rustup --out "${RUNNER_TEMP}/runtime"

      - name: Upload runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtime
          retention-days: 1
          if-no-files-found: error
          # A re-run of the consuming job re-runs this one too; the name is
          # per source commit, so the newer upload is the same build input.
          overwrite: true
