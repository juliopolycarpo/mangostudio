name: Runtime Build

# Builds the cargo `mangostudio-runtime` once per release platform and hands
# each binary to the caller as an artifact laid out for
# `bun run build --binary --runtime-dir <dir>`:
# `<dir>/<platform-id>/mangostudio-runtime[.exe]`. The hub stays Bun-compiled
# in the caller's packaging job; only this sibling comes from here.
#
# Toolchains: every Linux target links through cargo-zigbuild on one Ubuntu
# image (gnu at the GLIBC_2.17 floor, musl static), darwin targets build with
# Xcode on macOS, and both Windows targets build with MSVC on a Windows x64
# runner (arm64 cross-compiled, since the image carries the ARM64 MSVC tools
# and LLVM that ring's aarch64 assembly needs). `scripts/build-runtime.ts`
# checks every binary's header, and asks each one this runner can execute for
# its version.
#
# On a push to main the shipping job also publishes the unstamped cargo output
# under a digest of its inputs (`runtime-unstamped-<platform>-<digest>`, seven
# days), and that part cannot fail the build.
#
# Reuse (stage 4 of #2698) reads that artifact back. It is off unless the
# repository variable RUNTIME_REUSE is `true`, and runs only for a caller that
# passes `reuse: true` on a main push of the shipping profile. A verified base
# replaces the cargo compile and nothing else: `build-runtime.ts` still stages,
# stamps and verifies it. Any refusal or failure before that builds from source.
# Release builds never reuse (release.yml does not pass `reuse`). The base is
# not re-uploaded: the run that built it keeps its artifact, and the reusing run
# uploads only a small record naming that producer (`runtime-reuse-...`), which
# Canary checks before it publishes from this run.

on:
  workflow_call:
    inputs:
      version:
        description: Release version stamped into every runtime binary.
        type: string
        required: true
      source_sha:
        description: Exact source commit to build.
        type: string
        required: true
      platforms:
        description: JSON array of release platform ids to build.
        type: string
        default: '["linux-x64","linux-arm64","linux-x64-musl","linux-arm64-musl","darwin-x64","darwin-arm64","windows-x64","windows-arm64"]'
      artifact_prefix:
        description: >-
          Artifact name prefix; each platform uploads `<prefix>-<platform-id>`.
          Required in artifact mode and refused in cache-seed mode.
        type: string
        default: ""
      profile:
        description: >-
          Build profile, shipping (fat LTO/1 unit) or light (no LTO/16 units).
          Light artifacts are PR only; light is also what cache-seed mode builds.
        type: string
        default: shipping
      record_receipts:
        description: Include source, profile and executable identity for distribution pairing.
        type: boolean
        default: false
      mode:
        description: >-
          artifact builds and uploads the runtime. cache-seed builds the light
          profile on a push to main only to save its cargo cache entry, and
          uploads nothing.
        type: string
        default: artifact
      cache:
        description: >-
          Restore matching-profile dependency state from the cargo cache main
          writes. Release builds leave it off, and main only looks the entry
          up, so a published binary never starts from restored state. The
          light entry is written only by cache-seed mode.
        type: boolean
        default: false
      reuse:
        description: >-
          Let a main push of the shipping profile reuse an unstamped runtime
          built by an earlier main run with the same input digest, when the
          repository variable RUNTIME_REUSE is `true`. Only CI's distribution
          passes it; release builds never do.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime ${{ matrix.platform }}
    runs-on: ${{ startsWith(matrix.platform, 'linux-') && 'ubuntu-latest' || startsWith(matrix.platform, 'darwin-') && 'macos-latest' || 'windows-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # reuse only: list main push runs and download a base artifact with gh
    # Job-level CARGO overrides isolate rust-cache's environment hash before
    # restore and build. A light miss cannot fall back to the shipping key.
    # Shipping has no overrides, preserving its existing cache environment.
    env: ${{ inputs.profile == 'light' && fromJSON('{"CARGO_PROFILE_RELEASE_LTO":"off","CARGO_PROFILE_RELEASE_CODEGEN_UNITS":"16"}') || fromJSON('{}') }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - name: Validate runtime artifact profile
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_PROFILE: ${{ inputs.profile }}
          BUILD_MODE: ${{ inputs.mode }}
          BUILD_REF: ${{ github.ref }}
          ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
          CACHE_ENABLED: ${{ inputs.cache }}
        # Before checkout, Cargo setup, or cache access. Every non-PR artifact
        # remains shipping. The only non-PR light build is cache-seed mode: a
        # push to main with the cargo cache on and no artifact name to upload.
        run: |
          case "$BUILD_MODE" in
            artifact)
              if [ -z "$ARTIFACT_PREFIX" ]; then
                echo 'expected artifact mode artifact_prefix: non-empty | received: <empty>' >&2
                exit 1
              fi
              ;;
            cache-seed)
              if [ "$EVENT_NAME" != "push" ] || [ "$BUILD_REF" != "refs/heads/main" ]; then
                printf 'expected cache-seed context: event=push, ref=refs/heads/main | received: event=%s, ref=%s\n' \
                  "$EVENT_NAME" "$BUILD_REF" >&2
                exit 1
              fi
              if [ "$BUILD_PROFILE" != "light" ]; then
                printf 'expected cache-seed profile: light | received: %s\n' "$BUILD_PROFILE" >&2
                exit 1
              fi
              if [ -n "$ARTIFACT_PREFIX" ]; then
                printf 'expected cache-seed artifact_prefix: empty | received: %s\n' "$ARTIFACT_PREFIX" >&2
                exit 1
              fi
              if [ "$CACHE_ENABLED" != "true" ]; then
                printf 'expected cache-seed cache: true | received: %s\n' "${CACHE_ENABLED:-<empty>}" >&2
                exit 1
              fi
              ;;
            *)
              printf 'expected mode: artifact or cache-seed | received: %s\n' "$BUILD_MODE" >&2
              exit 1
              ;;
          esac
          case "$BUILD_PROFILE" in
            shipping)
              if [ -n "${CARGO_PROFILE_RELEASE_LTO:-}" ] || [ -n "${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-}" ]; then
                printf 'expected shipping profile: no lto/codegen-units overrides | received: lto=%s, codegen-units=%s\n' \
                  "${CARGO_PROFILE_RELEASE_LTO:-<unset>}" "${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-<unset>}" >&2
                exit 1
              fi
              ;;
            light)
              if [ "$BUILD_MODE" = "artifact" ] && [ "$EVENT_NAME" != "pull_request" ]; then
                echo 'expected profile: shipping | received: light' >&2
                exit 1
              fi
              if [ "${CARGO_PROFILE_RELEASE_LTO:-}" != "off" ] || [ "${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-}" != "16" ]; then
                printf 'expected light profile: lto=off, codegen-units=16 | received: lto=%s, codegen-units=%s\n' \
                  "${CARGO_PROFILE_RELEASE_LTO:-<unset>}" "${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-<unset>}" >&2
                exit 1
              fi
              ;;
            *)
              printf 'expected profile: shipping or light | received: %s\n' "$BUILD_PROFILE" >&2
              exit 1
              ;;
          esac
          printf 'runtime profile: %s (lto=%s, codegen-units=%s)\n' \
            "$BUILD_PROFILE" "${CARGO_PROFILE_RELEASE_LTO:-fat}" "${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-1}"
          printf 'runtime mode: %s\n' "$BUILD_MODE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - uses: ./.github/actions/distribution-source # zizmor: ignore[self-repository] load the action from the selected source checkout

      # Installs the toolchain rust-toolchain.toml pins.
      - run: rustup show active-toolchain

      # A warm seed needs only the key. A miss still installs tools before
      # the saving action so it excludes those binaries from the cache.
      - name: Check light runtime cache
        id: seed-cache
        if: inputs.mode == 'cache-seed'
        uses: ./.github/actions/rust-cache # zizmor: ignore[self-repository] load the action from the selected source checkout
        with:
          shared-key: runtime-build-${{ matrix.platform }}
          read-only: true
          lookup-only: true

      - uses: ./.github/actions/setup-bun # zizmor: ignore[self-repository] load the action from the selected source checkout
        if: steps.seed-cache.outputs.cache-hit != 'true'

      - name: Install zig and cargo-zigbuild
        if: runner.os == 'Linux' && steps.seed-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-zigbuild # zizmor: ignore[self-repository] load the action from the selected source checkout

      # One cache per platform and profile, shared by callers that opt in.
      # Pull requests restore only their profile but never save one.
      # Main never restores because canary publishes its distribution:
      # `lookup-only` checks for the entry, and a miss may save this clean
      # generation. Light PRs never restore the shipping entry. The light
      # entry is written by cache-seed mode through this same step, so its
      # key is the one a PR light build restores. The read-only lookup uses
      # the same toolchain, profile environment, and key inputs.
      # The action keys the generation on the root `[profile.*]` tables and
      # saves only from main.
      - name: Restore the cargo cache
        id: rust-cache
        if: inputs.cache && steps.seed-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/rust-cache # zizmor: ignore[self-repository] load the action from the selected source checkout
        with:
          shared-key: runtime-build-${{ matrix.platform }}
          lookup-only: ${{ github.ref == 'refs/heads/main' }}

      # Stage 2 of #2698: key the unstamped binary by everything that
      # determines it (scripts/lib/runtime-input-digest.ts). Main pushes of the
      # shipping profile only; a pull request build is light and publishes
      # nothing reusable. Nothing consumes the digest yet, so this step, the
      # two after the build and their warning cannot fail the job.
      - name: Compute runtime input digest
        id: digest
        if: inputs.mode == 'artifact' && inputs.profile == 'shipping' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_PROFILE: ${{ inputs.profile }}
        # Same flags as the build below; `--zig` is inert off Linux. Writes
        # `digest=` to the step output.
        run: bun --no-install ./scripts/ci/runtime-input-digest.ts digest --platform "$PLATFORM" --profile "$BUILD_PROFILE" --zig

      # Stage 4 of #2698: reuse a base an earlier main run published, or build.
      # Every reuse step repeats the whole gate (caller opt-in, artifact mode,
      # shipping profile, main push, the variable, a computed digest) so no
      # step can run on another path, and every one is `continue-on-error`: a
      # refusal or failure leaves `Build runtime` to compile as usual. The
      # digest step sits after the cargo cache restore on purpose: the
      # restore exports CARGO_INCREMENTAL, one of the digest's facts.
      #
      # With the cargo cache on, a reuse needs an exact cache hit. rust-cache
      # saves `target/` in its post step on a miss, and a skipped compile would
      # save an empty one under the key every later build restores.
      - name: Skip runtime base reuse on a cargo cache miss
        if: inputs.reuse && inputs.mode == 'artifact' && inputs.profile == 'shipping' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUNTIME_REUSE == 'true' && steps.digest.outcome == 'success' && inputs.cache && steps.rust-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          {
            printf '### Runtime base %s: built from source\n\n' "$PLATFORM"
            echo 'The cargo cache has no exact entry, so a skipped compile would save an empty one.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Read-only. Lists main push runs of ci.yml and verifies the newest one
      # that holds this digest; it exits 0 on every refusal and says why.
      - name: Find reusable runtime base
        id: reuse-find
        if: inputs.reuse && inputs.mode == 'artifact' && inputs.profile == 'shipping' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUNTIME_REUSE == 'true' && steps.digest.outcome == 'success' && (!inputs.cache || steps.rust-cache.outputs.cache-hit == 'true')
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_PROFILE: ${{ inputs.profile }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: bun --no-install ./scripts/ci/runtime-base-reuse.ts resolve --platform "$PLATFORM" --profile "$BUILD_PROFILE" --digest "$DIGEST"

      # The repository's own bounded `gh` download (see download-run-artifact),
      # pointed at the producer run: exactly one unexpired artifact, and its
      # ZIP is checked against the digest the API recorded at upload.
      - name: Download reusable runtime base
        id: reuse-download
        if: inputs.reuse && inputs.mode == 'artifact' && inputs.profile == 'shipping' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUNTIME_REUSE == 'true' && steps.digest.outcome == 'success' && steps.reuse-find.outputs.reuse == 'true'
        continue-on-error: true
        # Two attempts at the client's worst case: see run-artifact.unit.test.ts.
        timeout-minutes: 3
        uses: ./.github/actions/download-run-artifact # zizmor: ignore[self-repository] load the action from the selected source checkout
        with:
          name: ${{ steps.reuse-find.outputs.artifact-name }}
          path: ${{ runner.temp }}/runtime-base
          run-id: ${{ steps.reuse-find.outputs.run-id }}

      # Checks the downloaded files against the producer run read again from
      # the API, and writes the record and the summary the next steps publish.
      - name: Verify reusable runtime base
        id: reuse-verify
        if: inputs.reuse && inputs.mode == 'artifact' && inputs.profile == 'shipping' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUNTIME_REUSE == 'true' && steps.digest.outcome == 'success' && steps.reuse-download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_PROFILE: ${{ inputs.profile }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          PRODUCER_RUN_ID: ${{ steps.reuse-find.outputs.run-id }}
          ARTIFACT_ID: ${{ steps.reuse-find.outputs.artifact-id }}
        run: |
          bun --no-install ./scripts/ci/runtime-base-reuse.ts verify \
            --platform "$PLATFORM" --profile "$BUILD_PROFILE" --digest "$DIGEST" --zig \
            --run-id "$PRODUCER_RUN_ID" --artifact-id "$ARTIFACT_ID" \
            --dir "${RUNNER_TEMP}/runtime-base" \
            --record-out "${RUNNER_TEMP}/runtime-reuse-record" \
            --summary-out "${RUNNER_TEMP}/runtime-reuse-summary.md"

      # The step that cannot fail for a reason of its own: Canary reads its
      # conclusion from the jobs API to learn that this job reused a base (a
      # `continue-on-error` step that failed still reports success there), and
      # `Build runtime` below takes the base only when it succeeded.
      - name: Use reused runtime base
        id: reuse
        if: inputs.reuse && inputs.mode == 'artifact' && inputs.profile == 'shipping' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUNTIME_REUSE == 'true' && steps.digest.outcome == 'success' && steps.reuse-verify.outcome == 'success'
        shell: bash
        run: cat "${RUNNER_TEMP}/runtime-reuse-summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Not the base itself, which stays with the run that built it for its
      # seven days: re-uploading would restart that clock on every push and
      # blur which run compiled the bytes. This record names that run, and its
      # name carries platform, producer run, digest and the binary's SHA-256
      # for Canary to read.
      - name: Upload runtime reuse record
        id: reuse-record
        if: inputs.reuse && inputs.mode == 'artifact' && inputs.profile == 'shipping' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUNTIME_REUSE == 'true' && steps.digest.outcome == 'success' && steps.reuse.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.reuse-verify.outputs.record-name }}
          path: ${{ runner.temp }}/runtime-reuse-record
          # As long as the distribution bundles a canary may publish from this run.
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      # A seed has nothing to do on an exact hit: the entry it would save
      # exists. A miss builds exactly what a PR light build does, then
      # rust-cache's post-job step saves the new entry.
      - name: Build runtime
        if: steps.seed-cache.outputs.cache-hit != 'true' && (inputs.mode == 'artifact' || steps.rust-cache.outputs.cache-hit != 'true')
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ARTIFACT_PROFILE: ${{ inputs.mode == 'artifact' && inputs.record_receipts && inputs.profile || '' }}
          # Empty unless `Use reused runtime base` succeeded: the verified,
          # still unstamped base that replaces the cargo compile.
          PREBUILT_UNSTAMPED: ${{ steps.reuse.outcome == 'success' && steps.reuse-verify.outputs.path || '' }}
        # `--zig` only changes how Linux targets link; it is inert elsewhere.
        # Dependency-free script; runs without `bun install`.
        run: |
          set -euo pipefail
          args=(--platform "$PLATFORM" --zig --rustup --out "${RUNNER_TEMP}/runtime")
          if [ -n "$ARTIFACT_PROFILE" ]; then
            args+=(--artifact-profile "$ARTIFACT_PROFILE")
          fi
          # Staging, stamping and verification still run on a reused base.
          if [ -n "$PREBUILT_UNSTAMPED" ]; then
            args+=(--prebuilt-unstamped "$PREBUILT_UNSTAMPED")
          fi
          bun --no-install ./scripts/build-runtime.ts "${args[@]}"

      # The artifact route every consumer reads. Cache-seed mode never reaches it.
      - name: Upload runtime
        if: inputs.mode == 'artifact'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/runtime
          retention-days: 1
          if-no-files-found: error
          # A re-run of the consuming job re-runs this one too; the name is
          # per source commit, so the newer upload is the same build input.
          overwrite: true

      # cargo's output is never touched by stamping: `build-runtime.ts` stamps
      # a staged copy. This stages the cargo bytes (refusing any that carry a
      # stamp) with a receipt, and prints the digest beside the binary's
      # SHA-256 in the step summary: two main runs with the same digest should
      # show the same hash. Evidence for a maintainer, not a gate.
      # A reused base has no cargo output here, and the run that compiled it
      # already published it.
      - name: Stage unstamped runtime
        id: unstamped
        if: steps.digest.outcome == 'success' && steps.reuse.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_PROFILE: ${{ inputs.profile }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          bun --no-install ./scripts/ci/runtime-input-digest.ts stage \
            --platform "$PLATFORM" --profile "$BUILD_PROFILE" --zig \
            --digest "$DIGEST" --out "${RUNNER_TEMP}/runtime-unstamped"

      # A reusable base: kept seven days, named from target and digest, and
      # under a prefix no distribution download pattern matches.
      - name: Upload unstamped runtime
        id: unstamped-upload
        if: steps.unstamped.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.unstamped.outputs.name }}
          path: ${{ runner.temp }}/runtime-unstamped
          retention-days: 7
          if-no-files-found: error
          # A re-run of this job recomputes the same digest and rebuilds the
          # same inputs.
          overwrite: true

      # `continue-on-error` alone leaves no trace on a green job.
      - name: Warn that the unstamped runtime was not published
        if: steps.digest.outcome == 'failure' || steps.unstamped.outcome == 'failure' || steps.unstamped-upload.outcome == 'failure'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "::warning title=Unstamped runtime not published::${PLATFORM}: the input digest, receipt or upload failed; the build is unaffected."

      # A refusal is an ordinary outcome the find step already wrote to the
      # summary. These are the failures: a search that crashed, or a nominated
      # base that did not download or did not verify. The base is not used.
      - name: Warn that the runtime base was not reused
        if: inputs.reuse && inputs.mode == 'artifact' && inputs.profile == 'shipping' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUNTIME_REUSE == 'true' && steps.digest.outcome == 'success' && (steps.reuse-find.outcome == 'failure' || steps.reuse-download.outcome == 'failure' || steps.reuse-verify.outcome == 'failure')
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          FIND_OUTCOME: ${{ steps.reuse-find.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.reuse-download.outcome }}
          VERIFY_OUTCOME: ${{ steps.reuse-verify.outcome }}
        run: |
          detail="search ${FIND_OUTCOME}, download ${DOWNLOAD_OUTCOME}, verification ${VERIFY_OUTCOME}"
          echo "::warning title=Runtime base not reused::${PLATFORM}: ${detail}; built from source."
          printf '### Runtime base %s: built from source\n\nA base was found or sought but not used (%s).\n' \
            "$PLATFORM" "$detail" >> "$GITHUB_STEP_SUMMARY"

      # Without the record Canary refuses this run, so say so on the run.
      - name: Warn that the runtime reuse record was not published
        if: inputs.reuse && inputs.mode == 'artifact' && inputs.profile == 'shipping' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUNTIME_REUSE == 'true' && steps.digest.outcome == 'success' && steps.reuse-record.outcome == 'failure'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "::warning title=Runtime reuse record not published::${PLATFORM}: Canary will not publish from this run; the build is unaffected."
