name: QA Metrics

# Unprivileged metrics collector, called from ci.yml after the Test job. It
# merges the test fragment from the single coverage pass with the static
# metrics (LoC, bundle, dependencies, duplication, tooling) and uploads the
# versioned qa-metrics envelope. It runs PR code, so it must never hold more
# than `contents: read`; the privileged side lives in pr-qa-report.yml, which
# consumes this artifact without executing anything from it.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  collect:
    name: Collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - uses: ./.github/actions/cache-turbo
        with:
          scope: qa-metrics
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Download test metrics fragment
        # continue-on-error: without the fragment the collector still emits an
        # envelope whose tests entry is an explicit collector error.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qa-test-metrics
          path: ./qa-test-metrics

      - name: Collect QA metrics envelope
        env:
          QA_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          QA_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          fragment="./qa-test-metrics/test-metrics.json"
          args=()
          [ -f "$fragment" ] && args=(--test-metrics "$fragment")
          bun ./scripts/qa-gate/collect.ts "${args[@]}" > metrics.json

      - name: Upload qa-metrics envelope
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-metrics
          path: metrics.json
          # Main-push envelopes are long-lived baselines for future PRs keyed
          # by base SHA; PR envelopes only need to outlive their report run.
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}
