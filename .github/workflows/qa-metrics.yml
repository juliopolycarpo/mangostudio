name: QA Metrics

# Unprivileged metrics collector, called from ci.yml after the Test job. It
# merges the test fragment the Test workflow's merge job emits from the sharded
# coverage run, and the llvm-cov export of the Rust Coverage job, with the
# static metrics (LoC, bundle, dependencies, duplication, tooling) and uploads
# the versioned qa-metrics envelope. It runs PR code, so it
# must never hold more than `contents: read`; the privileged side lives in
# pr-qa-report.yml, which consumes this artifact without executing anything from
# it.

on:
  workflow_call:
    inputs:
      test_result:
        description: Result of the Test job (success, failure, cancelled, skipped) that produced the test fragment.
        type: string
        required: false
        default: ""
      rust_relevant:
        description: Whether the changes job saw a Rust-relevant path (true or false); false makes a skipped Rust Coverage job "not run on purpose".
        type: string
        required: false
        default: ""
      rust_result:
        description: Result of the Rust Coverage job (success, failure, cancelled, skipped) that produced the llvm-cov export.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  collect:
    name: Collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_CACHE_MAX_SIZE: 16MB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - id: toolchain
        name: Resolve check cache toolchains
        run: |
          set -euo pipefail
          turbo="$(bun run turbo:version | tail -n 1)"
          if [ -z "${turbo}" ]; then
            echo "::error::empty toolchain version (turbo='${turbo}')"
            exit 1
          fi
          {
            echo "turbo=${turbo}"
          } >> "$GITHUB_OUTPUT"

      # Reuse a prior Check snapshot without waiting for or saving this run's
      # cache. A miss leaves the collector's normal check execution intact.
      - name: Restore check cache
        uses: ./.github/actions/cache-scoped
        with:
          family: turbo
          path: .turbo/cache
          validity: check-bun-${{ steps.setup.outputs.bun-version }}-turbo-${{ steps.toolchain.outputs.turbo }}-${{ hashFiles('turbo.jsonc', 'bun.lock', 'package.json', 'apps/*/package.json', 'apps/*/turbo.json', 'packages/*/package.json', 'packages/*/turbo.json') }}
          restore-prefix: check-
          mode: restore
          rotate: "true"
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Download test metrics fragment
        # continue-on-error: without the fragment the collector still emits an
        # envelope whose tests and coverage are `unavailable`, with the Test
        # job's result (QA_TEST_RESULT) as the reason.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qa-test-metrics
          path: ./qa-test-metrics

      - name: Download Rust coverage
        # continue-on-error: without the artifact the collector still emits an
        # envelope whose crate coverage is `unavailable` (or `unsupported` when
        # no Rust path changed), with the job's result as the reason.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qa-rust-coverage
          path: ./qa-rust-coverage

      - name: Download frontend dist
        # continue-on-error: without the dist the collector still emits an
        # envelope whose bundle entry is `unavailable`.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: ./frontend-dist

      - name: Collect QA metrics envelope
        env:
          QA_FRONTEND_DIST: ./frontend-dist
          QA_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          QA_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_TEST_RESULT: ${{ inputs.test_result }}
          QA_RUST_RELEVANT: ${{ inputs.rust_relevant }}
          QA_RUST_RESULT: ${{ inputs.rust_result }}
        run: |
          set -euo pipefail
          fragment="./qa-test-metrics/test-metrics.json"
          args=()
          [ -f "$fragment" ] && args+=(--test-metrics "$fragment")
          [ -d ./qa-rust-coverage ] && args+=(--rust-coverage ./qa-rust-coverage)
          bun ./scripts/qa-gate/collect.ts "${args[@]}" --timings .mango/artifacts/qa-collector-timings.json > metrics.json

      # Advisory serial baseline only. The privileged report consumer continues
      # to read qa-metrics; timing data never changes the QA verdict.
      - name: Upload collector timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-collector-timings
          overwrite: true
          path: .mango/artifacts/qa-collector-timings.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload qa-metrics envelope
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-metrics
          overwrite: true
          path: metrics.json
          # Main-push envelopes are long-lived baselines for future PRs keyed
          # by base SHA; PR envelopes only need to outlive their report run.
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}
