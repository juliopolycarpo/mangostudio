name: Rust Coverage

# The Ubuntu Rust test run, instrumented. It replaces the plain
# `cargo test --workspace --all-targets` step cargo-shim.yml used to run on
# Ubuntu (macOS and Windows keep theirs there), so the suite still runs once
# per platform: the same libtest runner and the same test set, only built with
# LLVM coverage instrumentation. Doctests, the `--ignored` fixture run and the
# real-binary qualification stay in cargo-shim.yml, uninstrumented.
#
# It lives in the CI run, not in Cargo Shim, because the QA collector
# (qa-metrics.yml, called from ci.yml) can only download artifacts of its own
# run, and the privileged publisher (pr-qa-report.yml) reads only that run's
# qa-metrics envelope. An artifact from a sibling workflow run would need
# either a polling wait inside the unprivileged collector or a second
# privileged reader of PR-produced bytes; here the numbers reach the publisher
# only inside the envelope it already bounds and validates.
#
# Runs PR code, so it holds `contents: read` and nothing else. It never uses
# any privileged PR trigger and has no secrets.
#
# The job uploads two files and no verdict: `llvm-cov.json` (per-file line,
# function and region counts) and `receipt.json` (the commit measured and the
# test run's exit code). scripts/qa-gate/rust-coverage/ turns them into one
# coverage measurement per crate. When tests fail after writing profile data,
# the receipt lets the collector report partial coverage.

on:
  workflow_call:
    outputs:
      artifact_id:
        description: ID of the coverage artifact produced by this job.
        value: ${{ jobs.coverage.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  coverage:
    name: Rust tests with coverage (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    # Incremental state only pays off when one target directory is rebuilt; this
    # job builds once. Job level, not workflow level, because qa-workflows pins
    # the file's `permissions` block to sit directly above `jobs:`.
    # scripts/tests/cargo-incremental.unit.test.ts requires the setting.
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup show active-toolchain

      # Added here, not to rust-toolchain.toml: every other lane and every
      # contributor checkout would download the component for nothing.
      - run: rustup component add llvm-tools-preview

      # Instrumented builds land in `target/llvm-cov-target`, so this is its
      # own cache entry rather than a reuse of the plain lanes'.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: rust-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The runtime's MCP tests launch a small stdio MCP server fixture with Bun.
      - uses: $/.github/actions/setup-bun

      # Version-pinned here and hash-pinned through the action, which verifies
      # the release checksum from its own manifest.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov@0.9.1

      # Defer the report so the export can use profile data from a failed test
      # command. Publish its exit code for the receipt before failing the step.
      - id: tests
        name: Run tests with coverage
        run: |
          status=0
          cargo llvm-cov --no-report --workspace --all-targets --all-features --locked || status=$?
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      # Setup failures and interrupted test commands leave no exit-code output.
      - id: export_coverage
        name: Export coverage and receipt
        if: ${{ !cancelled() && steps.tests.outputs.exit_code != '' }}
        env:
          TESTS_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: |
          mkdir -p qa-rust-coverage
          cargo llvm-cov report --json --summary-only --output-path qa-rust-coverage/llvm-cov.json
          printf '{"sourceSha":"%s","testsExitCode":%s}\n' "$GITHUB_SHA" "$TESTS_EXIT_CODE" > qa-rust-coverage/receipt.json

      - id: upload
        name: Upload Rust coverage
        if: ${{ !cancelled() && steps.export_coverage.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-rust-coverage
          overwrite: true
          path: qa-rust-coverage/
          if-no-files-found: error
          retention-days: 1
