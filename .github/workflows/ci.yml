name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "ci/**"
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "test/**"
      - "docs/**"
      - "refactor/**"
      - "migration/**"
      - "perf/**"
      - "security/**"
      - "release/**"
      - "hotfix/**"
      - "bugfix/**"
      - "build/**"
      - "style/**"
      - "copilot/**"
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  browser-smoke:
    name: Smoke — Browser
    uses: ./.github/workflows/browser-smoke.yml

  smoke:
    name: Smoke — Binary
    uses: ./.github/workflows/smoke-binary.yml
