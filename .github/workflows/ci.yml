name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "ci/**"
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "test/**"
      - "docs/**"
      - "refactor/**"
      - "migration/**"
      - "perf/**"
      - "security/**"
      - "release/**"
      - "hotfix/**"
      - "bugfix/**"
      - "build/**"
      - "style/**"
      - "copilot/**"
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check
    uses: ./.github/workflows/lint.yml

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  browser-smoke:
    name: Smoke — Browser
    uses: ./.github/workflows/browser-smoke.yml

  qa-metrics:
    # Report-only metrics envelope for the PR QA comment: PR runs produce the
    # head side, main pushes produce the exact-SHA baselines. Runs after Test
    # to consume its metrics fragment, and still runs when Test fails so the
    # report can show the failing suite. Publishing happens in the separate
    # privileged pr-qa-report.yml (workflow_run), never here.
    name: QA Metrics
    needs: [test]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    uses: ./.github/workflows/qa-metrics.yml

  smoke:
    # Builds and boots native host binaries across the supported OS/arch runners,
    # then builds both Dockerfiles (Bookworm + Alpine, amd64 + arm64) from the
    # local build output. release-dry-run.yml does not repeat the Docker smoke;
    # it instead exercises the release-asset staging path
    # (stage-docker-ctx.ts --release-assets) that this job does not cover.
    name: Smoke — Binary
    uses: ./.github/workflows/smoke-binary.yml

  canary:
    # Publish a canary build from the latest green commit on main. Gating on every
    # other CI job means this only runs once the commit is fully green, so that
    # commit is the canary source. The job-level permissions here are the ceiling
    # for the called workflow (ci.yml's top-level grant is read-only); canary.yml's
    # own jobs scope down further.
    name: Canary
    needs: [check, test, build, browser-smoke, smoke]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/canary.yml
    secrets: inherit
