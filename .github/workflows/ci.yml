name: CI

# The pull_request event is the authoritative CI signal for development
# branches: one commit on an open PR produces exactly one run, and that run
# produces the PR's checks and artifacts. Pushes to main gate Canary. Pre-PR
# validation is local (`bun run check && bun run test`) or a manual
# workflow_dispatch of this workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One authoritative run per PR — keyed by PR number so a new push supersedes
# (cancels) the previous run even across branch renames or forks, and never by
# SHA, which would let stale runs survive. Runs on main are never cancelled so
# every green push reaches Canary.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect distribution-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      distribution: ${{ steps.changed.outputs.distribution }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changed
        name: Check for changes outside the documentation surface
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Allowlist, not denylist: a path is irrelevant only if it provably
        # cannot reach a binary. Anything unrecognised triggers the lane.
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "distribution=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"

          if [ ! -s "$RUNNER_TEMP/changed-files" ]; then
            echo "changes job: empty diff between $BASE_SHA and $HEAD_SHA; refusing to skip distribution" >&2
            exit 1
          fi

          irrelevant='^(docs/|\.github/ISSUE_TEMPLATE/|\.github/(CODE_OF_CONDUCT|CONTRIBUTING|SECURITY|pull_request_template)\.md$|[^/]*\.md$|LICENSE$)'
          if grep -Ev "$irrelevant" "$RUNNER_TEMP/changed-files" | grep -q .; then
            echo "distribution=true" >> "$GITHUB_OUTPUT"
          else
            echo "distribution=false" >> "$GITHUB_OUTPUT"
          fi

  distribution-identity:
    name: Resolve distribution identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
      cargo_version: ${{ steps.identity.outputs.cargo_version }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - id: source
        name: Resolve checked out source SHA
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: identity
        name: Resolve distribution version and channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: bun ./scripts/ci/distribution-identity.ts >> "$GITHUB_OUTPUT"

  distribution:
    name: Distribution
    needs: [distribution-identity, changes]
    if: ${{ needs.changes.outputs.distribution == 'true' }}
    permissions:
      contents: read
      id-token: write # mint the reusable builder's provenance attestation token
      attestations: write # persist provenance for main-push distribution bundles
    uses: ./.github/workflows/distribution-build.yml
    with:
      version: ${{ needs.distribution-identity.outputs.version }}
      source_sha: ${{ needs.distribution-identity.outputs.source_sha }}
      channel: ${{ needs.distribution-identity.outputs.channel }}
      retention_days: 7

  check:
    name: Check
    uses: ./.github/workflows/lint.yml

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  browser-smoke:
    name: Smoke — Browser
    uses: ./.github/workflows/browser-smoke.yml

  qa-metrics:
    # Report-only metrics envelope for the PR QA comment: PR runs produce the
    # head side, main pushes produce the exact-SHA baselines. Runs after Test
    # to consume its metrics fragment, and still runs when Test fails so the
    # report can show the failing suite. Publishing happens in the separate
    # privileged pr-qa-report.yml (workflow_run), never here.
    name: QA Metrics
    needs: [test]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    uses: ./.github/workflows/qa-metrics.yml

  smoke:
    # Boots the exact target artifacts produced once by distribution, then
    # stages those same Linux bytes into both Docker variants. The reusable
    # smoke workflow retains a manual rebuild fallback for one transition cycle.
    name: Smoke — Binary
    needs: [distribution-identity, distribution, changes]
    if: ${{ needs.changes.outputs.distribution == 'true' }}
    uses: ./.github/workflows/smoke-binary.yml
    with:
      version: ${{ needs.distribution-identity.outputs.version }}
      source_sha: ${{ needs.distribution-identity.outputs.source_sha }}
      channel: ${{ needs.distribution-identity.outputs.channel }}
      target_artifacts: ${{ needs.distribution.outputs.target_artifacts }}

  gate:
    # Single stable check ("CI / Gate") aggregating every mandatory job, so
    # branch protection and Canary depend on one name instead of tracking
    # internal job names and matrix shapes. Every job except this one and jobs
    # that already need this gate must be in `needs`; the ci-gate unit tests
    # derive that set dynamically so a new mandatory lane cannot bypass it.
    # qa-metrics only runs for PRs and main pushes, so its skip is accepted
    # solely on workflow_dispatch; distribution and smoke skips are accepted
    # only when the changes job proved no distribution-relevant path changed.
    name: Gate
    needs: [
      distribution-identity,
      changes,
      distribution,
      check,
      test,
      build,
      browser-smoke,
      qa-metrics,
      smoke,
    ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Evaluate mandatory job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ format('{0} {1} {2}',
            github.event_name == 'workflow_dispatch' && 'qa-metrics' || '',
            needs.changes.outputs.distribution == 'false' && 'distribution' || '',
            needs.changes.outputs.distribution == 'false' && 'smoke' || '') }}
        # Dependency-free script; runs without `bun install`.
        run: bun ./scripts/ci/evaluate-gate.ts

  canary:
    # Publish a canary build from the latest green commit on main. The
    # aggregate gate is the single definition of "green": if any mandatory job
    # failed, was cancelled, or skipped unexpectedly, the gate fails and this
    # job never runs. The job-level permissions here are the ceiling for the
    # called workflow (ci.yml's top-level grant is read-only); canary.yml's
    # own jobs scope down further.
    name: Canary
    needs: [gate, distribution-identity, distribution]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      attestations: read # canary jobs verify distribution build provenance
      contents: write # canary.yml updates the rolling GitHub pre-release
      id-token: write # npm provenance for the canary dist-tag publish
    uses: ./.github/workflows/canary.yml
    with:
      version: ${{ needs.distribution-identity.outputs.version }}
      cargo_version: ${{ needs.distribution-identity.outputs.cargo_version }}
      source_sha: ${{ needs.distribution-identity.outputs.source_sha }}
      channel: ${{ needs.distribution-identity.outputs.channel }}
      packaged_artifact: ${{ needs.distribution.outputs.packaged_artifact }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
