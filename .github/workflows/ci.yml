name: CI output transport probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-output-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ordinary:
    name: Ordinary failed job
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      invocation_id: ${{ steps.identity.outputs.invocation_id }}
      producer_attempt: ${{ steps.identity.outputs.producer_attempt }}
    steps:
      - id: identity
        run: |
          echo 'invocation_id=check-output-probe' >> "$GITHUB_OUTPUT"
          echo "producer_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - run: exit 7

  failed_one:
    uses: ./.github/workflows/probe-check-output-one.yml
    with:
      fail: true

  failed_two:
    uses: ./.github/workflows/probe-check-output-two.yml

  successful:
    uses: ./.github/workflows/probe-check-output-one.yml
    with:
      fail: false

  inspect:
    name: Inspect caller-visible outputs
    if: always()
    needs: [ordinary, failed_one, failed_two, successful]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record caller-visible results
        env:
          PROBE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PROBE'
          import json, os
          data = json.loads(os.environ['PROBE_RESULTS'])
          print(json.dumps(data, indent=2, sort_keys=True))
          assert data['successful']['result'] == 'success', data
          assert data['successful']['outputs']['invocation_id'] == 'check-output-probe', data
          for case in ['ordinary', 'failed_one', 'failed_two']:
              assert data[case]['result'] == 'failure', (case, data)
          PROBE
