name: Extended

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-smoke:
    name: Smoke — windows-x64
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mango

      - name: Run smoke test
        run: bun run scripts/test-build.ts
        env:
          PLATFORM: windows-x64
          API_PORT: "13001"
