name: Cross Runtime Nightly

on:
  workflow_dispatch:

concurrency:
  group: bun-metadata-token-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify public Bun release metadata authentication
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const url = 'https://api.github.com/repos/oven-sh/bun/releases/tags/canary';
            let response;
            try {
              response = await fetch(url, {
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                },
                redirect: 'error',
                signal: AbortSignal.timeout(30000),
              });
            } catch {
              throw new Error('Public Bun release metadata request did not return a response within the probe');
            }
            core.info(`Public Bun release metadata HTTP status: ${response.status}`);
            for (const name of ['x-ratelimit-limit', 'x-ratelimit-remaining']) {
              const value = response.headers.get(name);
              if (value && /^\d{1,12}$/.test(value)) core.info(`${name}: ${value}`);
            }
            try {
              await response.body?.cancel();
            } catch {
              throw new Error('Public Bun release metadata response did not settle');
            }
            if (response.status !== 200) {
              core.setFailed(`Expected public Bun release metadata HTTP 200; received ${response.status}`);
            }
