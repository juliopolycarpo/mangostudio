name: Smoke — Container

# Proves the container transport against a real engine and a real image.
#
# It runs here rather than in the Test lane because the one thing it exists to
# check needs bytes that lane does not have: a compiled Linux runtime binary
# matching the image's libc. Those already exist as distribution artifacts, so
# this consumes them instead of compiling a second copy — which also means the
# suite runs against the bytes a release would actually ship.
#
# The pairing is what matters: `uname -m` cannot tell glibc from
# musl, so both are exercised with the base image an ordinary user would pick.
# Docker and Podman are exercised too — the connector builds an argv for
# whichever engine a config names, and GitHub's ubuntu-latest runner ships
# both. Run all four pairings here after one checkout and dependency setup.

on:
  workflow_call:
    inputs:
      version:
        description: Version of the distribution bundle to consume.
        required: true
        type: string
      source_sha:
        description: Commit the distribution bundle was built from.
        required: true
        type: string
      channel:
        description: Distribution channel of the bundle.
        required: true
        type: string
      target_artifacts:
        description: JSON map of target IDs to immutable artifact names.
        required: true
        type: string

permissions:
  contents: read

jobs:
  container:
    name: Container transport
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PATH: /tmp/mangostudio-container-smoke.sqlite
      MANGOSTUDIO_DIAGNOSTIC_LOGS: "0"
      # The mounted runtime and source-checkout hub must report the same release.
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-mango
        with:
          cache-epoch: ${{ vars.CI_CACHE_EPOCH || 'v1' }}

      - name: Download glibc runtime target
        uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ fromJSON(inputs.target_artifacts)['linux-x64'] }}
          source-sha: ${{ inputs.source_sha }}
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
          target: linux-x64

      # The download action expects one bundle in its scratch directory.
      # Materialized target directories stay available under .mango/out.
      - name: Clear previous distribution download
        if: ${{ !cancelled() }}
        run: rm -rf "$RUNNER_TEMP/mango-distribution"

      - name: Download musl runtime target
        if: ${{ !cancelled() }}
        uses: ./.github/actions/download-distribution
        with:
          artifact-name: ${{ fromJSON(inputs.target_artifacts)['linux-x64-musl'] }}
          source-sha: ${{ inputs.source_sha }}
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
          target: linux-x64-musl

      - name: Run docker glibc container transport smoke
        if: ${{ !cancelled() }}
        working-directory: apps/api
        env:
          CONTAINER_CLI: docker
          BASE_IMAGE: debian:bookworm-slim
          PACKAGES: ""
          MANGO_CONTAINER_E2E_IMAGE: mango-container-smoke:glibc
          MANGO_CONTAINER_E2E_RUNTIME: ${{ github.workspace }}/.mango/out/linux-x64/mangostudio-runtime
          MANGO_CONTAINER_E2E_ENGINE: docker
        # Build before the suite, so registry failures cannot look like skipped
        # transport coverage. Bookworm already provides the required shell.
        run: |
          set -euo pipefail
          if [ -z "$PACKAGES" ]; then
            "$CONTAINER_CLI" pull "$BASE_IMAGE"
            "$CONTAINER_CLI" tag "$BASE_IMAGE" "$MANGO_CONTAINER_E2E_IMAGE"
          else
            printf 'FROM %s\nRUN apk add --no-cache %s\n' "$BASE_IMAGE" "$PACKAGES" \
              | "$CONTAINER_CLI" build -t "$MANGO_CONTAINER_E2E_IMAGE" -
          fi
          if [ ! -x "$MANGO_CONTAINER_E2E_RUNTIME" ]; then
            echo "::error::no runtime binary at $MANGO_CONTAINER_E2E_RUNTIME"
            exit 1
          fi
          "$CONTAINER_CLI" image inspect "$MANGO_CONTAINER_E2E_IMAGE" >/dev/null
          bun test tests/integration/services/connect-container-runtime.integration.test.ts

      - name: Run docker musl container transport smoke
        if: ${{ !cancelled() }}
        working-directory: apps/api
        env:
          CONTAINER_CLI: docker
          BASE_IMAGE: alpine:3
          PACKAGES: "bash libstdc++"
          MANGO_CONTAINER_E2E_IMAGE: mango-container-smoke:musl
          MANGO_CONTAINER_E2E_RUNTIME: ${{ github.workspace }}/.mango/out/linux-x64-musl/mangostudio-runtime
          MANGO_CONTAINER_E2E_ENGINE: docker
        # Build before the suite, so registry failures cannot look like skipped
        # transport coverage. Alpine needs bash and libstdc++ for this pairing.
        run: |
          set -euo pipefail
          if [ -z "$PACKAGES" ]; then
            "$CONTAINER_CLI" pull "$BASE_IMAGE"
            "$CONTAINER_CLI" tag "$BASE_IMAGE" "$MANGO_CONTAINER_E2E_IMAGE"
          else
            printf 'FROM %s\nRUN apk add --no-cache %s\n' "$BASE_IMAGE" "$PACKAGES" \
              | "$CONTAINER_CLI" build -t "$MANGO_CONTAINER_E2E_IMAGE" -
          fi
          if [ ! -x "$MANGO_CONTAINER_E2E_RUNTIME" ]; then
            echo "::error::no runtime binary at $MANGO_CONTAINER_E2E_RUNTIME"
            exit 1
          fi
          "$CONTAINER_CLI" image inspect "$MANGO_CONTAINER_E2E_IMAGE" >/dev/null
          bun test tests/integration/services/connect-container-runtime.integration.test.ts

      - name: Assert no docker container outlived the suite
        if: ${{ !cancelled() }}
        env:
          CONTAINER_CLI: docker
        # --rm reaping is asynchronous. Poll the engine once after both libc
        # assertions, including when an earlier assertion failed.
        run: |
          set -euo pipefail
          leftover=""
          for _ in $(seq 1 20); do
            leftover="$("$CONTAINER_CLI" ps -a --format '{{.Names}}' --filter 'name=mango-rt-')"
            if [ -z "$leftover" ]; then
              break
            fi
            sleep 1
          done
          if [ -n "$leftover" ]; then
            echo "::error::containers left behind: $leftover"
            exit 1
          fi

      - name: Run podman glibc container transport smoke
        if: ${{ !cancelled() }}
        working-directory: apps/api
        env:
          CONTAINER_CLI: podman
          BASE_IMAGE: debian:bookworm-slim
          PACKAGES: ""
          MANGO_CONTAINER_E2E_IMAGE: mango-container-smoke:glibc
          MANGO_CONTAINER_E2E_RUNTIME: ${{ github.workspace }}/.mango/out/linux-x64/mangostudio-runtime
          MANGO_CONTAINER_E2E_ENGINE: podman
        # Build before the suite, so registry failures cannot look like skipped
        # transport coverage. Bookworm already provides the required shell.
        run: |
          set -euo pipefail
          if [ -z "$PACKAGES" ]; then
            "$CONTAINER_CLI" pull "$BASE_IMAGE"
            "$CONTAINER_CLI" tag "$BASE_IMAGE" "$MANGO_CONTAINER_E2E_IMAGE"
          else
            printf 'FROM %s\nRUN apk add --no-cache %s\n' "$BASE_IMAGE" "$PACKAGES" \
              | "$CONTAINER_CLI" build -t "$MANGO_CONTAINER_E2E_IMAGE" -
          fi
          if [ ! -x "$MANGO_CONTAINER_E2E_RUNTIME" ]; then
            echo "::error::no runtime binary at $MANGO_CONTAINER_E2E_RUNTIME"
            exit 1
          fi
          "$CONTAINER_CLI" image inspect "$MANGO_CONTAINER_E2E_IMAGE" >/dev/null
          bun test tests/integration/services/connect-container-runtime.integration.test.ts

      - name: Run podman musl container transport smoke
        if: ${{ !cancelled() }}
        working-directory: apps/api
        env:
          CONTAINER_CLI: podman
          BASE_IMAGE: alpine:3
          PACKAGES: "bash libstdc++"
          MANGO_CONTAINER_E2E_IMAGE: mango-container-smoke:musl
          MANGO_CONTAINER_E2E_RUNTIME: ${{ github.workspace }}/.mango/out/linux-x64-musl/mangostudio-runtime
          MANGO_CONTAINER_E2E_ENGINE: podman
        # Build before the suite, so registry failures cannot look like skipped
        # transport coverage. Alpine needs bash and libstdc++ for this pairing.
        run: |
          set -euo pipefail
          if [ -z "$PACKAGES" ]; then
            "$CONTAINER_CLI" pull "$BASE_IMAGE"
            "$CONTAINER_CLI" tag "$BASE_IMAGE" "$MANGO_CONTAINER_E2E_IMAGE"
          else
            printf 'FROM %s\nRUN apk add --no-cache %s\n' "$BASE_IMAGE" "$PACKAGES" \
              | "$CONTAINER_CLI" build -t "$MANGO_CONTAINER_E2E_IMAGE" -
          fi
          if [ ! -x "$MANGO_CONTAINER_E2E_RUNTIME" ]; then
            echo "::error::no runtime binary at $MANGO_CONTAINER_E2E_RUNTIME"
            exit 1
          fi
          "$CONTAINER_CLI" image inspect "$MANGO_CONTAINER_E2E_IMAGE" >/dev/null
          bun test tests/integration/services/connect-container-runtime.integration.test.ts

      - name: Assert no podman container outlived the suite
        if: ${{ !cancelled() }}
        env:
          CONTAINER_CLI: podman
        # --rm reaping is asynchronous. Poll the engine once after both libc
        # assertions, including when an earlier assertion failed.
        run: |
          set -euo pipefail
          leftover=""
          for _ in $(seq 1 20); do
            leftover="$("$CONTAINER_CLI" ps -a --format '{{.Names}}' --filter 'name=mango-rt-')"
            if [ -z "$leftover" ]; then
              break
            fi
            sleep 1
          done
          if [ -n "$leftover" ]; then
            echo "::error::containers left behind: $leftover"
            exit 1
          fi
