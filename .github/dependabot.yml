version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: UTC
    # Let new action releases settle before adoption so a compromised release
    # is likely caught upstream before a bump PR appears here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)
    labels:
      - "type: dependencies"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
      time: "06:15"
      timezone: UTC
    commit-message:
      prefix: chore(deps)
    # Give every npm release a few days of upstream exposure (supply-chain
    # malware window) and majors a full week before a bump PR appears.
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "type: dependencies"
    groups:
      typescript:
        patterns:
          - typescript
          - "@types/*"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      playwright:
        patterns:
          - "@playwright/*"
