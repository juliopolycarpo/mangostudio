version: 2
updates:
  # `/` only covers .github/workflows and a root action.yml; the repo-local
  # composite actions each pin their own third-party SHAs and need an
  # explicit directory glob or they never get bumped.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
      time: "06:00"
      timezone: UTC
    # Let new action releases settle before adoption so a compromised release
    # is likely caught upstream before a bump PR appears here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)
    labels:
      - "type: dependencies"
    groups:
      # `init` and `analyze` are two directories of one released action pinned
      # to the same SHA. Ungrouped, they arrive as two PRs and whichever lands
      # first leaves the workflow on a mismatched pair of CodeQL bundles.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: bun
    directory: /
    # Weekly, grouped: a daily ungrouped bump costs a full CI run for a
    # patch-level devDependency.
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: UTC
    commit-message:
      prefix: chore(deps)
    # Give every npm release a few days of upstream exposure (supply-chain
    # malware window) and majors a full week before a bump PR appears.
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "type: dependencies"
    # Five grouped PRs are possible in one week; keep headroom so ungrouped
    # major bumps are not starved out by the limit.
    open-pull-requests-limit: 10
    # Elysia 2.0.0-beta.4 needs typebox 1.3.13. Remove this when Elysia can
    # compile validation schemas with newer TypeBox releases.
    ignore:
      - dependency-name: typebox
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
      # Elysia publishes an experimental `2.0.0-exp.*` channel beside the
      # `2.0.0-beta.*` line tracked here (npm tag `next`). Semver sorts `exp`
      # above `beta`, so Dependabot offers these older experimental builds as
      # upgrades. Remove both rules once Elysia 2.0.0 is stable; the unit test
      # in scripts/tests/security-workflows.unit.test.ts fails as a reminder
      # when the pinned elysia is no longer a 2.0.0 prerelease.
      - dependency-name: elysia
        versions:
          - ">=2.0.0-exp.0 <2.0.0-rc.0"
      - dependency-name: "@elysia/*"
        versions:
          - ">=2.0.0-exp.0 <2.0.0-rc.0"
    groups:
      # Keep the three existing coordinated-release groups: these packages must
      # move together or the workspace breaks.
      typescript:
        patterns:
          - typescript
          - "@types/*"
      playwright:
        patterns:
          - "@playwright/*"
      # Everything else: one PR per update type per week.
      # Majors stay ungrouped: each needs its own review and its own revert.
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  # The root Cargo workspace owns the protocol crate and crates.io launcher.
  # `crates/mango-protocol/fuzz` remains a workspace of its own with its own
  # Cargo.lock, so Dependabot must visit it explicitly. Every published or CI
  # build uses `--locked`.
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/mango-protocol/fuzz
    schedule:
      interval: weekly
      day: monday
      time: "06:35"
      timezone: UTC
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels:
      - "type: dependencies"
      - "area: runtime"
    # rmcp requires sse-stream ^0.2 and exposes its `Sse` type in the
    # streamable-HTTP client trait the runtime implements, so a lone 0.3 bump
    # compiles two copies and fails. Remove this once rmcp moves to sse-stream
    # 0.3; the unit test in scripts/tests/security-workflows.unit.test.ts
    # fails as a reminder when Cargo.lock resolves an sse-stream 0.3.
    ignore:
      - dependency-name: sse-stream
        versions:
          - ">=0.3.0"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # Both Dockerfile and Dockerfile.alpine live at the repo root; Dependabot
  # matches filenames containing "dockerfile".
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: UTC
    commit-message:
      prefix: chore(ci)
    cooldown:
      default-days: 7
    labels:
      - "type: dependencies"
