version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: UTC
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
      time: "06:15"
      timezone: UTC
    commit-message:
      prefix: chore(deps)
    cooldown:
      semver-major-days: 7
    groups:
      typescript:
        patterns:
          - typescript
          - "@types/*"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      playwright:
        patterns:
          - "@playwright/*"
