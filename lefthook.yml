pre-commit:
  parallel: false
  commands:
    bun-lint:
      glob: "*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"
      run: bun lint --staged --fix --no-script --no-warn-ignored
      stage_fixed: true
    bun-fmt:
      glob: "*.{ts,tsx,js,jsx,mts,cts,mjs,cjs,json,jsonc,css,html,md,mdc,mdx,toml,yml,yaml}"
      run: bun fmt --staged
      stage_fixed: true
    check-affected:
      run: bun run check --staged --skip-format
      skip:
        - merge
        - rebase
