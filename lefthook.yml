pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    dprint:
      glob: "*.{md,mdx,toml,yml,yaml}"
      run: bunx dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
    dprint-dockerfile:
      glob: "{Dockerfile,Dockerfile.*}"
      run: bunx dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
    check-affected:
      run: bun run check --staged --skip-format
      skip:
        - merge
        - rebase
