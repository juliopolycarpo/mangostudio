name: Release

# Cut a release from a signed v* tag: verify the manifests agree with the tag,
# run both test lanes, publish @mangostudio/protocol to npm through trusted
# publishing (OIDC, no stored token), publish mango-protocol to crates.io
# through crates.io trusted publishing, and attach the schema files to a
# GitHub release with git-cliff notes. Publish jobs run in the `release`
# environment, whose deployment rule admits only v* tags.

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-canary*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without the leading v (e.g. 0.1.0); the ref must be its tag"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: resolve
        name: Resolve the version from the tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then version="$INPUT_VERSION"; else version="${REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: bun install --frozen-lockfile
      - name: Manifests match the tag
        run: bun ./scripts/check-versions.ts "${{ steps.resolve.outputs.version }}"
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - name: Package contents
        working-directory: packages/protocol
        run: npm pack --dry-run

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      # npm trusted publishing needs the npm CLI (>= 11.5.1 on Node >= 22.14);
      # this is the one place the repository runs npm instead of bun.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm --version
      - name: Publish
        working-directory: packages/protocol
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "@mangostudio/protocol@$VERSION" version >/dev/null 2>&1; then
            echo "@mangostudio/protocol@$VERSION is already on npm; skipping"
            exit 0
          fi
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"

  crate:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: published
        name: Already on crates.io?
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'mango-protocol release workflow (github.com/juliopolycarpo/mango-protocol)' \
            "https://crates.io/api/v1/crates/mango-protocol/$VERSION")
          if [ "$status" = "200" ]; then
            echo "mango-protocol $VERSION is already on crates.io; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # The token exchange fails outright while the crate has no trusted-publishing
      # config, which is exactly the state of a first version published by hand
      # (crates.io accepts the config only once the crate exists). Ask for a token
      # only when there is something left to publish.
      - id: auth
        if: steps.published.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        if: steps.published.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p mango-protocol --locked

  github-release:
    name: GitHub release with schema assets
    needs: [verify, npm, crate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Release notes for this tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bunx git-cliff --config cliff.toml --current --strip header --output release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cp spec/schema/1/protocol.json mango-protocol-schema-1-protocol.json
          cp spec/schema/1/catalog.json mango-protocol-schema-1-catalog.json
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            mango-protocol-schema-1-protocol.json \
            mango-protocol-schema-1-catalog.json
