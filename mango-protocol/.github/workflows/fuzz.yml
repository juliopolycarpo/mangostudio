name: Fuzz

on:
  schedule:
    # 03:17 UTC daily: off the hour, so it does not compete with every other
    # project's midnight cron for shared runner capacity.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # A cold cache builds tokio, jsonschema and regex under sanitizer
    # instrumentation before the 300s run even starts; 10 was too tight for a
    # first scheduled run.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: decode_line
            # The ceiling under test starts at the codec's own floor of 4096,
            # which the default -max_len (~4096) can only just reach; a line
            # over the limit needs room past it.
            features: ""
            extra_args: "-max_len=16384"
          - target: line_decoder_push
            # Same reason as decode_line: the too-large refusal is the path
            # where the whole-push and split-push decoders once disagreed.
            features: ""
            extra_args: "-max_len=16384"
          - target: chunk_reassembler_push
            # The default libFuzzer -max_len (~4096) never reaches a
            # multi-chunk message; the chunk framing's own floor is 2048.
            features: ""
            extra_args: "-max_len=65536"
          - target: validate
            features: ""
            extra_args: ""
          - target: catalog_parse
            features: ""
            extra_args: ""
          - target: session_frames
            # Needs the session and the port seam; see fuzz/Cargo.toml.
            features: "tokio"
            extra_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The root rust-toolchain.toml pins a stable channel for the rest of the
      # repo, and that file applies here too (rustup resolves it by
      # directory, not by cargo workspace); fuzz/ has no toolchain file of
      # its own, so every invocation below selects nightly explicitly with
      # `+nightly` instead. libFuzzer instrumentation needs `-Z` flags only
      # nightly accepts.
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-fuzz
      - name: Run ${{ matrix.target }} for 5 minutes
        working-directory: fuzz
        run: |
          set -euo pipefail
          features=()
          if [ -n "${{ matrix.features }}" ]; then
            features=(--features "${{ matrix.features }}")
          fi
          cargo +nightly fuzz run "${features[@]}" ${{ matrix.target }} -- \
            -max_total_time=300 -timeout=30 ${{ matrix.extra_args }}
      - name: Upload the corpus and any crashing input
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/corpus/${{ matrix.target }}
            fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
