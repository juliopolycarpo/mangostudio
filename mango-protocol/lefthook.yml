pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,js,json}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    dprint:
      glob: "*.{md,mdc,mdx,toml,yml,yaml}"
      run: bunx dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true
    check-affected:
      run: bun run check --staged --skip-format
      skip:
        - merge
        - rebase

output:
  - failure
  - summary
