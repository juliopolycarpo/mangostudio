[workspace]
resolver = "3"
members = [
  "crates/mango-protocol",
  "crates/mangostudio-launcher",
  "crates/mangostudio-runtime",
  "crates/mangostudio-runtime-contract",
]
# `crates/mango-protocol/fuzz` is its own workspace (see its Cargo.toml): a
# cargo-fuzz crate needs nightly and libFuzzer, so it must never be pulled into
# a stable build. Without this, `cargo clippy --all-targets --all-features` and
# `cargo hack clippy --feature-powerset` would try to build it on stable and fail.
exclude = ["crates/mango-protocol/fuzz"]

[workspace.package]
version = "0.2.0"
authors = ["Julio Polycarpo"]
edition = "2024"
license = "MIT"
repository = "https://github.com/juliopolycarpo/mangostudio"
# One source-build minimum for every stable crate, including the published launcher.
# Policy tests require the development pin in `rust-toolchain.toml` to match.
rust-version = "1.99.0"

[workspace.lints.rust]
# `deny`, not `forbid`: one module - the Windows named pipe's security
# descriptor - has no safe binding to reach for, and `forbid` cannot be lifted
# even for a single documented call. Every `unsafe` block carries a SAFETY note.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# Pinned with a version alongside the path so `cargo deny`'s wildcard check
# (deny.toml's `bans.wildcards = "deny"`) has something to check: a bare
# `path` dependency between workspace members is a wildcard requirement as
# far as that lint is concerned. This duplicates `[workspace.package].version`
# above; `scripts/protocol/versions.ts` (`bun ./scripts/protocol/check-versions.ts`)
# checks the two agree, so a forgotten bump here fails the build loudly rather
# than silently pinning a stale minor.
mango-protocol = { path = "crates/mango-protocol", version = "0.2.0" }
mangostudio-runtime-contract = { path = "crates/mangostudio-runtime-contract", version = "0.2.0" }

# Third-party dependencies declared by two or more members. Each entry holds
# the version and shared features. Cargo adds each member's features to this
# list. A member inherits `default-features` when it omits the key. Setting
# `default-features = true` on a member enables defaults for that dependency.
futures-util = { version = "0.3", default-features = false }
jsonschema = { version = "0.61", default-features = false }
# `signal` is the one feature both users need; the runtime adds its own.
nix = { version = "0.31", default-features = false, features = ["signal"] }
# Select `ring` to keep the `aws-lc-rs` backend and its build dependencies out
# of the graph.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.219", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }
sha2 = "0.11"
tokio-util = { version = "0.7", default-features = false }
webpki-roots = "1"
# The Win32 bindings both Windows-only users need; the runtime adds the rest.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
] }

# The shipped `mangostudio-runtime` is the only release artifact this
# workspace builds (the published launcher is built by `cargo install`, which
# never reads this root profile). Measured on linux-x64 (see
# docs/reference/runtime-metrics.md): fat LTO with one codegen unit is about a
# quarter smaller than cargo's default release profile, and thin LTO lands
# between the two for roughly two thirds of fat's build time.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Never "abort": handler panic isolation (`crates/mangostudio-runtime/src/panic.rs`)
# recovers a panic by catching its unwind. The runtime refuses to compile with
# an aborting panic strategy, `crates/mangostudio-runtime/tests/it/panic_isolation.rs`
# (`the_release_profile_unwinds`) requires this exact setting, and
# `scripts/tests/protocol-lanes.unit.test.ts` rejects an abort in any manifest.
panic = "unwind"

# Reduce the code size of the JSON Schema validator, pattern engine and
# reference resolver. See docs/reference/runtime-metrics.md for the profile.
[profile.release.package.jsonschema]
opt-level = "s"
[profile.release.package.jsonschema-regex]
opt-level = "s"
[profile.release.package.jsonschema-value]
opt-level = "s"
[profile.release.package.referencing]
opt-level = "s"
[profile.release.package.fancy-regex]
opt-level = "s"

# Line tables keep file:line in panics and backtraces, which is all the debug
# info the workspace needs; dependencies drop theirs. Measured on linux-x64 (30
# cores, `cargo build --workspace --all-targets`): the cold build falls from
# 155 s to 123 s, a rebuild after touching the runtime from ~20 s to ~15 s,
# `target/` from 15 GB to 5.6 GB, and the debug runtime from 509 MB to 161 MB.
# `profile.test` inherits all of this. For a stepping debugger, override
# locally with `CARGO_PROFILE_DEV_DEBUG=full`, which reaches only the workspace
# crates: the package override below outranks it, so dependencies also need
# `--config 'profile.dev.package."*".debug="full"'`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
