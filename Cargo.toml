[workspace]
resolver = "3"
members = ["crates/mango-protocol"]
# Neither excluded directory is a member, and both must say so explicitly: a
# package nested under a workspace root that is neither listed nor excluded
# makes cargo refuse to build it ("current package believes it's in a
# workspace when it's not").
#
# `crates/mango-protocol/fuzz` is its own workspace (see its Cargo.toml): a
# cargo-fuzz crate needs nightly and libFuzzer, so it must never be pulled into
# a stable build. Without this, `cargo clippy --all-targets --all-features` and
# `cargo hack clippy --feature-powerset` would try to build it on stable and fail.
#
# `packages/cargo-shim` is the crates.io launcher for the application, on its
# own version line, its own edition and its own lockfile. Folding it in is
# plan 042's job, not this workspace's.
exclude = ["crates/mango-protocol/fuzz", "packages/cargo-shim"]

[workspace.package]
version = "0.2.0"
authors = ["Julio Polycarpo"]
edition = "2024"
license = "MIT"
repository = "https://github.com/juliopolycarpo/mangostudio"
# Policy: current stable minus two minors (currently 1.96) is the floor we'd allow, but we hold
# at 1.97 because dropping to the floor buys nothing today - no dependency, feature or fix needs
# it. The `msrv` CI job installs this version explicitly and runs `cargo +1.97.0 check
# --all-features --locked` against it, independent of whatever `rust-toolchain.toml` pins.
rust-version = "1.97.0"

[workspace.lints.rust]
# `deny`, not `forbid`: one module - the Windows named pipe's security
# descriptor - has no safe binding to reach for, and `forbid` cannot be lifted
# even for a single documented call. Every `unsafe` block carries a SAFETY note.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
