[workspace]
resolver = "3"
members = [
  "crates/mango-protocol",
  "crates/mangostudio-launcher",
  "crates/mangostudio-runtime",
  "crates/mangostudio-runtime-contract",
]
# `crates/mango-protocol/fuzz` is its own workspace (see its Cargo.toml): a
# cargo-fuzz crate needs nightly and libFuzzer, so it must never be pulled into
# a stable build. Without this, `cargo clippy --all-targets --all-features` and
# `cargo hack clippy --feature-powerset` would try to build it on stable and fail.
exclude = ["crates/mango-protocol/fuzz"]

[workspace.package]
version = "0.2.0"
authors = ["Julio Polycarpo"]
edition = "2024"
license = "MIT"
repository = "https://github.com/juliopolycarpo/mangostudio"
# One source-build minimum for every stable crate, including the published launcher.
# Policy tests require the development pin in `rust-toolchain.toml` to match.
rust-version = "1.100.0"

[workspace.lints.rust]
# `deny`, not `forbid`: one module - the Windows named pipe's security
# descriptor - has no safe binding to reach for, and `forbid` cannot be lifted
# even for a single documented call. Every `unsafe` block carries a SAFETY note.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Cargo's own lints (stable since 1.100, the workspace minimum). An unused
# dependency still costs every build its download and compile, and Cargo
# only warns about it by default, which no `-D warnings` lane turns into a
# failure: that flag reaches rustc and clippy, not Cargo. Dev-dependencies
# are not checked, the lint only fires when every target that could use a
# dependency is built, as `--workspace --all-targets` does, and a direct
# dependency that another dependency also pulls in is not reported.
[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.dependencies]
# Pinned with a version alongside the path so `cargo deny`'s wildcard check
# (deny.toml's `bans.wildcards = "deny"`) has something to check: a bare
# `path` dependency between workspace members is a wildcard requirement as
# far as that lint is concerned. This duplicates `[workspace.package].version`
# above; `scripts/protocol/versions.ts` (`bun ./scripts/protocol/check-versions.ts`)
# checks the two agree, so a forgotten bump here fails the build loudly rather
# than silently pinning a stale minor.
mango-protocol = { path = "crates/mango-protocol", version = "0.2.0" }
mangostudio-runtime-contract = { path = "crates/mangostudio-runtime-contract", version = "0.2.0" }

# Third-party dependencies declared by two or more members. Each entry holds
# the version and shared features. Cargo adds each member's features to this
# list. A member inherits `default-features` when it omits the key. Setting
# `default-features = true` on a member enables defaults for that dependency.
futures-util = { version = "0.3", default-features = false }
jsonschema = { version = "0.61", default-features = false }
# `signal` is the one feature both users need; the runtime adds its own.
nix = { version = "0.31", default-features = false, features = ["signal"] }
# Select `ring` to keep the `aws-lc-rs` backend and its build dependencies out
# of the graph.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.219", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }
sha2 = "0.11"
tokio-util = { version = "0.7", default-features = false }
webpki-roots = "1"
# The Win32 bindings both Windows-only users need; the runtime adds the rest.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
] }

# The shipped `mangostudio-runtime` is the only release artifact this
# workspace builds (the published launcher is built by `cargo install`, which
# never reads this root profile). Measured on linux-x64 (see
# docs/reference/runtime-metrics.md): fat LTO with one codegen unit is about a
# quarter smaller than cargo's default release profile, and thin LTO lands
# between the two for roughly two thirds of fat's build time.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Never "abort": handler panic isolation (`crates/mangostudio-runtime/src/panic.rs`)
# recovers a panic by catching its unwind. The runtime refuses to compile with
# an aborting panic strategy, `crates/mangostudio-runtime/tests/it/panic_isolation.rs`
# (`the_release_profile_unwinds`) requires this exact setting, and
# `scripts/tests/protocol-lanes.unit.test.ts` rejects an abort in any manifest.
panic = "unwind"

# Reduce the code size of the JSON Schema validator, pattern engine and
# reference resolver. See docs/reference/runtime-metrics.md for the profile.
[profile.release.package.jsonschema]
opt-level = "s"
[profile.release.package.jsonschema-regex]
opt-level = "s"
[profile.release.package.jsonschema-value]
opt-level = "s"
[profile.release.package.referencing]
opt-level = "s"
[profile.release.package.fancy-regex]
opt-level = "s"

# Size over speed for the code a runtime call runs rarely or spends waiting on
# I/O: MCP, HTTP and TLS clients, WebSocket framing, URL and TOML parsing,
# collation, the external-agent adapters and the protocol and contract crates.
# Measured on linux-x64 (docs/reference/runtime-metrics.md): the stripped runtime
# shrinks 15% with `fs.grep`, `hello` and `fs.list-directory` within noise.
# The packages that run per line or per byte stay at 3 (`mangostudio-runtime`,
# `mango-external-agents`, `memchr`, `serde_json`, `tokio`) and so does QuickJS
# (`rquickjs-sys`): cc-rs takes its C optimisation level from the package
# profile, so `s` there would build the regex engine with `-Os`. The
# `release_profile` integration test pins both lists.
[profile.release.package.rmcp]
opt-level = "s"
[profile.release.package.reqwest]
opt-level = "s"
[profile.release.package.hyper]
opt-level = "s"
[profile.release.package.hyper-util]
opt-level = "s"
[profile.release.package.rustls]
opt-level = "s"
[profile.release.package.rustls-webpki]
opt-level = "s"
[profile.release.package.tungstenite]
opt-level = "s"
[profile.release.package.tokio-tungstenite]
opt-level = "s"
[profile.release.package.sse-stream]
opt-level = "s"
[profile.release.package.url]
opt-level = "s"
[profile.release.package.idna]
opt-level = "s"
[profile.release.package.toml]
opt-level = "s"
[profile.release.package.toml_parser]
opt-level = "s"
[profile.release.package.icu_collator]
opt-level = "s"
[profile.release.package.icu_normalizer]
opt-level = "s"
[profile.release.package.chrono]
opt-level = "s"
[profile.release.package.globset]
opt-level = "s"
[profile.release.package.aho-corasick]
opt-level = "s"
[profile.release.package.regex-automata]
opt-level = "s"
[profile.release.package.regex-syntax]
opt-level = "s"
[profile.release.package.cap-primitives]
opt-level = "s"
[profile.release.package.cap-std]
opt-level = "s"
[profile.release.package.serde_with]
opt-level = "s"
[profile.release.package.agent-client-protocol-schema]
opt-level = "s"
[profile.release.package.mango-agent-acp]
opt-level = "s"
[profile.release.package.mango-agent-claude]
opt-level = "s"
[profile.release.package.mango-agent-codex]
opt-level = "s"
[profile.release.package.mango-protocol]
opt-level = "s"
[profile.release.package.mangostudio-runtime-contract]
opt-level = "s"

# For local release builds and benchmarks, never for a binary that ships:
# `cargo build --profile release-fast -p mangostudio-runtime` writes to
# `target/release-fast/`. Thin LTO with 16 codegen units cuts the runtime build
# from ~450 s to ~140 s of wall time on linux-x64 (28 cores; CPU time rises from
# ~910 s to ~1360 s, so a small machine gains little) and keeps the per-package
# overrides above. The binary is ~31% larger than the shipping one (37.0 against
# 28.2 MB) and benchmarks a few percent slower, so nothing that packages,
# publishes or stages a runtime may use it: `scripts/build-runtime.ts` and the
# release workflows build `--release`, and
# `scripts/tests/release-fast-profile.unit.test.ts` fails if a release file names
# this profile. CI's `light` runtime build is separate: it sets
# `CARGO_PROFILE_RELEASE_LTO=off` through the environment so its cache key
# differs from the shipping one.
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

# Line tables keep file:line in panics and backtraces, which is all the debug
# info the workspace needs; dependencies drop theirs. Measured on linux-x64 (30
# cores, `cargo build --workspace --all-targets`): the cold build falls from
# 155 s to 123 s, a rebuild after touching the runtime from ~20 s to ~15 s,
# `target/` from 15 GB to 5.6 GB, and the debug runtime from 509 MB to 161 MB.
# `profile.test` inherits all of this. For a stepping debugger, override
# locally with `CARGO_PROFILE_DEV_DEBUG=full`, which reaches only the workspace
# crates: the package override below outranks it, so dependencies also need
# `--config 'profile.dev.package."*".debug="full"'`. The seven crates raised to
# opt-level 1 below show variables as optimized out; to step through one, add
# `--config 'profile.dev.package.<name>.opt-level=0'`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# API tests and the CI test shards spawn a debug `mangostudio-runtime`. Its
# `hello` compiles the contract's JSON Schemas and parses the catalog, which at
# opt-level 0 takes ~190 ms per spawn (release: ~40 ms). These dependencies run
# the work, so they build at opt-level 1: `hello` falls to ~66 ms, and the three
# runtime-spawning API integration files (`rust-runtime-qualification`,
# `spawn-runtime-child`, `rust-runtime-library-propagation`) take ~48 s instead
# of ~54 s.
# Leaving one out costs `hello` 33-64 ms (jsonschema, referencing,
# jsonschema-value, fancy-regex, serde_json) or 5-8 ms (regex-automata,
# regex-syntax); jsonschema-regex and regex are within noise, so they stay at 0.
# Re-run the leave-one-out when startup changes.
#
# Measured on linux-x64 (28 cores) against the unchanged profile, as CPU
# seconds (user + sys), because other work shared the host:
# - `cargo nextest run --workspace --all-targets --all-features`, cold: ~750 s
#   to ~930 s. `cargo clippy` is unchanged (~230 s): crates only get checked.
# - `target/` stays at ~3.4 GB; the debug runtime goes from 137 to 131 MB.
#
# Two alternatives were measured and rejected:
# - opt-level 2 gives the same `hello` for ~1400 s of cold test-build CPU.
# - `package."*"` at opt-level 1 is ~16 ms faster per spawn but also compiles
#   every proc macro and build script at opt-level 1 (a package glob outranks
#   `profile.dev.build-override`), taking cold CPU to ~1450 s for the test build
#   and ~560 s for clippy.
#
# Workspace crates stay at opt-level 0 so editing them keeps the fast rebuild:
# at opt-level 2, `mango-protocol` and `mangostudio-runtime-contract` took ~19 s
# each to compile instead of 3 s and 1 s, and they add only 2-4 ms to `hello`.
[profile.dev.package.jsonschema]
opt-level = 1
[profile.dev.package.jsonschema-value]
opt-level = 1
[profile.dev.package.referencing]
opt-level = 1
[profile.dev.package.fancy-regex]
opt-level = 1
[profile.dev.package.serde_json]
opt-level = 1
[profile.dev.package.regex-automata]
opt-level = 1
[profile.dev.package.regex-syntax]
opt-level = 1
