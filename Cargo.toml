[workspace]
resolver = "3"
members = ["crates/mango-protocol", "crates/mangostudio-launcher"]
# `crates/mango-protocol/fuzz` is its own workspace (see its Cargo.toml): a
# cargo-fuzz crate needs nightly and libFuzzer, so it must never be pulled into
# a stable build. Without this, `cargo clippy --all-targets --all-features` and
# `cargo hack clippy --feature-powerset` would try to build it on stable and fail.
exclude = ["crates/mango-protocol/fuzz"]

[workspace.package]
version = "0.2.0"
authors = ["Julio Polycarpo"]
edition = "2024"
license = "MIT"
repository = "https://github.com/juliopolycarpo/mangostudio"
# Protocol policy: current stable minus two minors (currently 1.96) is the floor we'd allow, but
# the protocol holds at 1.97 because dropping to the floor buys nothing today. The launcher's
# published MSRV stays explicit in its manifest so it cannot inherit this protocol decision.
# Both MSRV lanes run independently of the development toolchain in `rust-toolchain.toml`.
rust-version = "1.97.0"

[workspace.lints.rust]
# `deny`, not `forbid`: one module - the Windows named pipe's security
# descriptor - has no safe binding to reach for, and `forbid` cannot be lifted
# even for a single documented call. Every `unsafe` block carries a SAFETY note.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
