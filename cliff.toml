# git-cliff configuration — https://git-cliff.org
# Generates CHANGELOG.md from Conventional Commits. Driven by `bun run changelog`
# (see scripts/changelog.ts); never edit CHANGELOG.md by hand.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com), and this
project adheres to [Semantic Versioning](https://semver.org).

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**({{ commit.scope }})** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
<!-- seam -->
"""
footer = ""
trim = true
# Group headers carry a sortable HTML comment for ordering; strip it from output.
# The seam marker is what `trim` would otherwise eat: git-cliff trims each
# release body and joins them with one newline, so the last bullet of a version
# and the next `## [x.y.z]` heading land on consecutive lines. Ending the body
# with a non-whitespace marker keeps the newline before it, and removing only
# the marker here leaves the blank line behind.
postprocessors = [
  { pattern = '<!-- [0-9]+ -->', replace = "" },
  { pattern = '<!-- seam -->', replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "<!-- 8 -->⬆️ Dependencies" },
  { message = "^build\\(deps\\)", group = "<!-- 8 -->⬆️ Dependencies" },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refactor" },
  { message = "^security", group = "<!-- 4 -->🔒 Security" },
  { message = "^migration", group = "<!-- 5 -->🛢️ Migrations" },
  { message = "^docs", group = "<!-- 6 -->📚 Documentation" },
  { message = "^test", group = "<!-- 7 -->🧪 Testing" },
  { message = "^ci", group = "<!-- 9 -->👷 CI" },
  { message = "^build", group = "<!-- 10 -->🏗️ Build" },
  { message = "^style", group = "<!-- 11 -->🎨 Styling" },
  { message = "^chore", group = "<!-- 12 -->🧹 Miscellaneous" },
  { message = "^revert", group = "<!-- 13 -->◀️ Revert" },
  { body = ".*", group = "<!-- 14 -->Other" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "^v[0-9]"
# Canary cuts one tag per green commit (`v0.1.1-canary.<sha7>`), and every one of
# them matches `tag_pattern` — left alone, each would open its own release
# section and swallow "Unreleased". `ignore_tags` drops the tag while keeping its
# commits, so they land under the next real release. Measured on git-cliff 2.13.1
# with a scratch `v9.9.9-canary.abc1234` tag.
#
# The pattern requires the dot: the pre-2026-09-16 rolling `v<root>-canary` tags
# share a commit with their stable release, and ignoring one of those drops the
# stable section with it.
ignore_tags = "-canary\\."
sort_commits = "newest"
# The Mango Protocol lives in this repository but releases on its own
# `protocol-v*` train, with its own changelog under packages/protocol. Excluding
# its directories here does two jobs at once: it drops the 87 commits the
# history import brought in — which carry the *upstream* tree's root-relative
# paths (`packages/protocol/**`, `crates/**`, `spec/**`, …), so no rule matching
# the import prefix could ever have reached them — and it keeps every future
# protocol-only commit out of this file. git-cliff 2.13.1 has no first-parent
# traversal, so a path rule is the only lever. A commit touching both trees
# still lands in both changelogs: git-cliff keeps a commit whose file set is not
# entirely excluded, which is the right answer for one.
#
# The same list is `PROTOCOL_CHANGELOG_GLOBS` in scripts/lib/protocol.ts;
# protocol-changelog.unit.test.ts holds the two in step.
exclude_paths = [
  "packages/protocol/**",
  "crates/**",
  "spec/**",
  "docs/protocol/**",
  "scripts/protocol/**",
  ".github/workflows/protocol-*.yml",
]
