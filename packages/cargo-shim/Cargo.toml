[package]
name = "mangostudio"
# Lockstep with the root package.json — `bun run check:versions` enforces it.
version = "0.1.1"
categories = ["command-line-utilities"]
edition = "2021"
homepage = "https://mangostudio.dev"
keywords = ["ai", "image-generation", "chat", "cli"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/juliopolycarpo/mangostudio"
description = "AI-powered image generation and chat studio (launcher; downloads the prebuilt binary on first run)"

# Keep dependencies minimal: blocking HTTP with rustls (std has no TLS), no
# async runtime. Archive handling is cfg-gated to match the release asset
# formats: tar.gz on Unix, zip on Windows.
[dependencies]
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }

[package.metadata.binstall]
# Release archives have a flat root: mangostudio(.exe), mangostudio-runtime(.exe)
# and README.md. binstall installs only the binary named below. See README.md.
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-linux-x64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-linux-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-linux-x64-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-linux-arm64-musl.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-darwin-x64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-darwin-arm64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-windows-x64.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-windows-arm64.zip"
pkg-fmt = "zip"
